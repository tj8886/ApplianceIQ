<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Build — Commercial Project Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f8fb;--card:#fff;--border:#e3e8ee;--navy:#0f1f3d;--green:#1a9e56;--blue:#2f6fed;
  --red:#e53e3e;--orange:#dd6b20;--yellow:#ecc94b;--purple:#805ad5;--cyan:#0ea5e9;
  --text:#334155;--text-light:#64748b;--text-muted:#94a3b8;
  --radius:10px;--shadow:0 1px 3px rgba(15,31,61,0.08);
}
html{font-size:15px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Sora',sans-serif;color:var(--navy);font-weight:600}
a{color:var(--blue);text-decoration:none}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:var(--radius);font-size:.875rem;font-weight:500;padding:.5rem 1rem;transition:all .15s}
input,select,textarea{font-family:'Inter',sans-serif;font-size:.875rem;border:1px solid var(--border);border-radius:var(--radius);padding:.5rem .75rem;background:#fff;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,0.12)}
textarea{resize:vertical;min-height:80px}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:#158a4a}
.btn-secondary{background:var(--blue);color:#fff}.btn-secondary:hover{background:#2558c4}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{background:var(--bg)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#c53030}
.btn-sm{padding:.35rem .7rem;font-size:.8rem}
.btn-icon{padding:.4rem;background:none;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px}
.btn-icon:hover{background:var(--bg)}

/* Layout */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--navy);color:#fff;padding:1.25rem 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-logo{padding:0 1.25rem .75rem;font-family:'Sora',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:.5rem;padding-bottom:1rem}
.sidebar-logo span{color:var(--green)}
.sidebar nav{flex:1;padding:.5rem 0}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.25rem;color:rgba(255,255,255,0.65);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.05)}
.nav-item.active{color:#fff;background:rgba(26,158,86,0.15);border-left-color:var(--green)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-user{padding:.75rem 1.25rem;border-top:1px solid rgba(255,255,255,0.1);font-size:.8rem;color:rgba(255,255,255,0.5)}
.sidebar-user strong{color:#fff;display:block;font-size:.85rem}
.main{margin-left:240px;flex:1;padding:1.5rem 2rem;max-width:1200px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
.page-header h1{font-size:1.5rem}
.breadcrumb{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-light);margin-bottom:.75rem}
.breadcrumb span{cursor:pointer}.breadcrumb span:hover{color:var(--blue)}
.breadcrumb .sep{color:var(--text-muted)}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.card-header h3{font-size:1rem}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;box-shadow:var(--shadow)}
.stat-card .label{font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-family:'Sora',sans-serif;font-size:1.75rem;font-weight:700;color:var(--navy);margin:.25rem 0}
.stat-card .sub{font-size:.8rem;color:var(--text-muted)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);font-weight:600;padding:.6rem .75rem;border-bottom:2px solid var(--border)}
td{padding:.65rem .75rem;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
tr:hover td{background:rgba(47,111,237,0.02)}
tr{cursor:pointer}

/* Badges */
.badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-green{background:#dcfce7;color:#166534}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-cyan{background:#cffafe;color:#155e75}
.badge-orange{background:#ffedd5;color:#9a3412}

/* Status pipeline */
.pipeline{display:flex;gap:2px;margin:.5rem 0}
.pipeline-step{flex:1;height:6px;border-radius:3px;background:var(--border)}
.pipeline-step.done{background:var(--green)}
.pipeline-step.active{background:var(--blue)}
.pipeline-step.blocked{background:var(--red)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,31,61,0.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,31,61,0.2)}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:1.1rem}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-light);margin-bottom:.35rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}

/* Floor/Unit visual */
.floor-strip{display:flex;align-items:center;gap:.5rem;padding:.65rem 1rem;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.5rem;background:#fff;transition:all .15s;cursor:pointer}
.floor-strip:hover{border-color:var(--blue);background:rgba(47,111,237,0.02)}
.floor-label{font-family:'Sora',sans-serif;font-weight:600;font-size:.85rem;color:var(--navy);min-width:80px}
.floor-units{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.unit-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;color:#fff;cursor:pointer;transition:transform .1s}
.unit-dot:hover{transform:scale(1.15)}
.unit-dot.not_started{background:var(--text-muted)}
.unit-dot.rough_in{background:var(--orange)}
.unit-dot.ordered{background:var(--purple)}
.unit-dot.delivered{background:var(--cyan)}
.unit-dot.installed{background:var(--blue)}
.unit-dot.inspected{background:var(--yellow);color:var(--navy)}
.unit-dot.complete{background:var(--green)}
.unit-dot.on_hold{background:var(--red)}

/* Milestone checklist */
.milestone-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.4rem;background:#fff;font-size:.85rem}
.milestone-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.milestone-icon.passed{background:#dcfce7;color:#166534}
.milestone-icon.failed{background:#fee2e2;color:#991b1b}
.milestone-icon.pending{background:#f1f5f9;color:#94a3b8}
.milestone-icon.in_progress{background:#dbeafe;color:#1e40af}
.milestone-name{flex:1;font-weight:500}
.milestone-meta{font-size:.75rem;color:var(--text-muted)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1.25rem}
.tab{padding:.6rem 1.1rem;font-size:.85rem;font-weight:500;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-card{background:#fff;border-radius:12px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(15,31,61,0.1);text-align:center}
.login-card h1{font-size:1.5rem;margin-bottom:.25rem}
.login-card p{color:var(--text-light);font-size:.85rem;margin-bottom:1.5rem}
.login-card .form-group{text-align:left}
.login-card button{width:100%;padding:.7rem;font-size:.9rem;margin-top:.5rem}
.login-error{color:var(--red);font-size:.8rem;margin-top:.5rem}

/* Empty states */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:1rem;opacity:.4}
.empty-state p{font-size:.9rem;margin-bottom:1rem}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:60px;overflow:hidden}
  .sidebar-logo span,.nav-item span,.sidebar-user{display:none}
  .nav-item{justify-content:center;padding:.6rem}
  .main{margin-left:60px;padding:1rem}
  .form-row{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
}

/* Toast */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:#fff;padding:.75rem 1.25rem;border-radius:var(--radius);font-size:.85rem;z-index:300;box-shadow:0 8px 20px rgba(0,0,0,0.2);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>

// ========== HELPERS ==========
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function statusBadge(status) {
  const map = {
    planning: 'badge-gray', pre_construction: 'badge-yellow', active: 'badge-green',
    on_hold: 'badge-red', completing: 'badge-blue', completed: 'badge-green', cancelled: 'badge-gray',
    not_started: 'badge-gray', rough_in: 'badge-orange', ordered: 'badge-purple',
    delivered: 'badge-cyan', installed: 'badge-blue', inspected: 'badge-yellow', complete: 'badge-green',
    pending: 'badge-gray', in_progress: 'badge-blue', passed: 'badge-green', failed: 'badge-red', waived: 'badge-yellow',
    scheduled: 'badge-blue', in_transit: 'badge-yellow', partial: 'badge-orange', damaged: 'badge-red',
  };
  return `<span class="badge ${map[status] || 'badge-gray'}">${(status || '').replace(/_/g, ' ')}</span>`;
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatCurrency(n) {
  if (!n && n !== 0) return '—';
  return '$' + Number(n).toLocaleString('en-CA', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

const projectStatuses = ['planning', 'pre_construction', 'active', 'on_hold', 'completing', 'completed', 'cancelled'];

// ========== AUTH ==========
async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadMilestoneTemplates();
    render();
  } else {
    renderLogin();
  }
}

async function handleLogin(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) return error.message;
  currentUser = data.user;
  await loadMilestoneTemplates();
  render();
  return null;

async function handleLogout() {
  await supabase.auth.signOut();
  currentUser = null;
  renderLogin();

// ========== DATA LOADING ==========
async function loadProjects() {
  const { data } = await supabase.from('iqbuild_projects').select('*').order('created_at', { ascending: false });
  projects = data || [];
}

async function loadMilestoneTemplates() {
  const { data } = await supabase.from('iqbuild_milestone_templates').select('*').order('sort_order');
  milestoneTemplates = data || [];
}

async function loadProjectDetail(projectId) {
  const { data: proj } = await supabase.from('iqbuild_projects').select('*').eq('id', projectId).single();
  if (!proj) return null;

  const { data: buildings } = await supabase.from('iqbuild_buildings').select('*').eq('project_id', projectId).order('sort_order');
  proj.buildings = buildings || [];

  for (const bld of proj.buildings) {
    const { data: floors } = await supabase.from('iqbuild_floors').select('*').eq('building_id', bld.id).order('floor_number');
    bld.floors = floors || [];
    for (const fl of bld.floors) {
      const { data: units } = await supabase.from('iqbuild_units').select('*').eq('floor_id', fl.id).order('unit_number');
      fl.units = units || [];
    }
  }

  const { data: deliveries } = await supabase.from('iqbuild_deliveries').select('*').eq('project_id', projectId).order('delivery_date');
  proj.deliveries = deliveries || [];

  const { data: teamMembers } = await supabase.from('iqbuild_team_members').select('*').eq('project_id', projectId).order('created_at');
  proj.team = teamMembers || [];

  const { data: packages } = await supabase.from('iqbuild_packages').select('*, iqbuild_package_items(*)').eq('project_id', projectId).order('created_at');
  proj.packages = packages || [];

  const { data: contacts } = await supabase.from('iqbuild_project_contacts').select('*').eq('project_id', projectId).eq('active', true).order('role, name');
  proj.contacts = contacts || [];

  const { data: signoffs } = await supabase.from('iqbuild_signoffs').select('*').eq('project_id', projectId).order('signed_at', { ascending: false }).limit(50);
  proj.signoffs = signoffs || [];

  const { data: installations } = await supabase.from('iqbuild_installations').select('labour_cost, parts_cost, total_cost, status').eq('project_id', projectId);
  proj.installations_summary = {
    count: (installations || []).length,
    total: (installations || []).reduce((a, i) => a + Number(i.total_cost || 0), 0),
    labour: (installations || []).reduce((a, i) => a + Number(i.labour_cost || 0), 0),
    parts: (installations || []).reduce((a, i) => a + Number(i.parts_cost || 0), 0),
    pending: (installations || []).filter(i => i.status !== 'complete' && i.status !== 'cancelled').length,
  };

  return proj;
}

async function loadUnitDetail(unitId) {
  const { data: unit } = await supabase.from('iqbuild_units').select('*').eq('id', unitId).single();
  if (!unit) return null;

  const { data: appliances } = await supabase.from('iqbuild_unit_appliances').select('*').eq('unit_id', unitId).order('appliance_type');
  unit.appliances = appliances || [];

  const { data: milestones } = await supabase.from('iqbuild_unit_milestones').select('*, iqbuild_milestone_templates(*)').eq('unit_id', unitId).order('created_at');
  unit.milestones = milestones || [];

  const { data: installations } = await supabase.from('iqbuild_installations').select('*, iqbuild_installation_parts(*)').eq('unit_id', unitId).order('scheduled_date');
  unit.installations = installations || [];

  return unit;
}

  const app = document.getElementById('app');

      <div class="main" id="main-content"></div>

function renderSidebar() {
  const navItems = [
    { id: 'dashboard', icon: icons.dashboard, label: 'Dashboard' },
    { id: 'crm-import', icon: icons.import, label: 'CRM Import' },
    { id: 'projects', icon: icons.projects, label: 'Projects' },
    { id: 'packages', icon: icons.packages, label: 'Packages' },
    { id: 'deliveries', icon: icons.deliveries, label: 'Deliveries' },
    { id: 'milestones', icon: icons.milestones, label: 'Milestones' },
  ];
  return `
    <div class="sidebar">
      <div class="sidebar-logo">${icons.projects} IQ <span>Build</span></div>
      <nav>
        ${navItems.map(n => `
          <div class="nav-item ${currentView === n.id ? 'active' : ''}" data-view="${n.id}">
            ${n.icon}<span>${n.label}</span>
          </div>
        `).join('')}
      </nav>

      </div>
    </div>

}

function bindNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => {
      currentView = el.dataset.view;
      currentProject = null;
      currentBuilding = null;
      currentUnit = null;
      render();
    };
  });
  document.getElementById('logout-link').onclick = (e) => { e.preventDefault(); handleLogout(); };
}

async function renderView() {
  const main = document.getElementById('main-content');
  switch (currentView) {
    case 'dashboard': await renderDashboard(main); break;
    case 'crm-import': await renderCRMImport(main); break;
    case 'projects': await renderProjects(main); break;
    case 'project-detail': await renderProjectDetail(main); break;
    case 'unit-detail': await renderUnitDetail(main); break;
    case 'packages': await renderPackages(main); break;
    case 'deliveries': await renderDeliveries(main); break;
    case 'milestones': await renderMilestoneTemplatesView(main); break;
    default: await renderDashboard(main);
  }
}

async function executeImport(deal, speciqPackages, speciqProject) {
  const contact = deal.contacts;
  const company = deal.companies;

  // 1. Create the IQ Build project
  const projectRecord = {
    name: document.getElementById('m-imp-name').value.trim() || deal.title,
    project_type: document.getElementById('m-imp-type').value,
    status: document.getElementById('m-imp-status').value,
    developer_name: document.getElementById('m-imp-dev').value.trim() || null,
    developer_contact_email: document.getElementById('m-imp-devemail').value.trim() || null,
    developer_contact_phone: company?.main_phone || contact?.phone || null,
    address_street: document.getElementById('m-imp-address').value.trim() || null,
    address_city: document.getElementById('m-imp-city').value.trim() || null,
    address_province: document.getElementById('m-imp-prov').value.trim() || null,
    estimated_completion: document.getElementById('m-imp-delivery').value || null,
    budget_total: parseFloat(document.getElementById('m-imp-budget').value) || null,
    crm_deal_id: deal.id,
    crm_contact_id: deal.contact_id || null,
    crm_company_id: deal.company_id || null,
    speciq_project_id: speciqProject?.id || null,
    imported_from_crm: true,
    import_summary: {
      deal_title: deal.title,
      deal_value: deal.value_amount,
      contact_name: contact ? `${contact.first_name || ''} ${contact.last_name || ''}`.trim() : null,
      contact_email: contact?.email,
      company_name: company?.name,
      speciq_packages_count: speciqPackages.length,
      speciq_products_count: speciqPackages.reduce((a, p) => a + (p.speciq_package_products?.length || 0), 0),
      imported_at: new Date().toISOString(),
    },
    total_buildings: 1,
    created_by: currentUser.id,
  };

  const { data: newProject, error: projError } = await supabase.from('iqbuild_projects').insert(projectRecord).select().single();
  if (projError) { toast('Error creating project: ' + projError.message); return false; }

  // 2. Import Spec IQ packages → iqbuild_packages + iqbuild_package_items
  let totalPackages = 0;
  let totalItems = 0;

  for (const pkg of speciqPackages) {
    const pkgRecord = {
      organization_id: newProject.organization_id,
      project_id: newProject.id,
      name: pkg.package_name || `Package from Spec IQ`,
      description: `Imported from Spec IQ — ${pkg.unit_type || ''} ${pkg.project_type || ''} — Quote #${pkg.quote_number || 'N/A'}`.trim(),
      is_builder_grade: true,
      unit_type: pkg.unit_type || null,
      base_cost: Number(pkg.total_final || pkg.total_negotiated || pkg.total_msrp || 0),
      upgrade_cost: 0,
      speciq_package_id: pkg.id,
    };

    const { data: newPkg, error: pkgError } = await supabase.from('iqbuild_packages').insert(pkgRecord).select().single();
    if (pkgError) { console.error('Package import error:', pkgError); continue; }
    totalPackages++;

    // Import products as package items
    const products = pkg.speciq_package_products || [];
    if (products.length) {
      const items = products.map((pr, idx) => ({
        package_id: newPkg.id,
        appliance_type: mapCategory(pr.category || pr.subcategory || 'other'),
        brand: pr.brand || null,
        model: pr.model_number || null,
        product_id: pr.aiq_product_id || null,
        unit_cost: Number(pr.negotiated_price || pr.promo_price || pr.msrp || 0),
        sort_order: pr.sort_order || idx,
        notes: [pr.short_description, pr.key_benefits].filter(Boolean).join(' — ') || null,
        speciq_product_id: pr.id,
        aiq_product_id: pr.aiq_product_id || null,
        category: pr.category || null,
        finish: pr.finish || null,
        electrical_requirements: pr.electrical_requirements || null,
        gas_requirements: pr.gas_requirements || null,
        water_requirements: pr.water_requirements || null,
        ventilation_requirements: pr.ventilation_requirements || null,
        installation_type: pr.installation_type || null,
        msrp: pr.msrp ? Number(pr.msrp) : null,
        negotiated_price: pr.negotiated_price ? Number(pr.negotiated_price) : null,
        image_url: pr.image_url || null,
        width_inches: pr.width_inches ? Number(pr.width_inches) : null,
        height_inches: pr.height_inches ? Number(pr.height_inches) : null,
        depth_inches: pr.depth_inches ? Number(pr.depth_inches) : null,
      }));

      const { error: itemsError } = await supabase.from('iqbuild_package_items').insert(items);
      if (itemsError) console.error('Items import error:', itemsError);
      else totalItems += items.length;
    }
  }

  // 3. Log the import activity
  await logActivity(newProject.id, 'project', newProject.id, 'imported_from_crm', null, deal.id,
    `Project imported from CRM deal "${deal.title}" — ${totalPackages} packages, ${totalItems} products from Spec IQ`
  );

  toast(`Imported! ${totalPackages} packages, ${totalItems} products`);
  
  // Navigate to the new project
  currentProject = await loadProjectDetail(newProject.id);
  currentView = 'project-detail';
  render();
  return true;
}

function mapCategory(category) {
  if (!category) return 'other';
  const cat = category.toLowerCase();
  if (cat.includes('refrig') || cat.includes('fridge')) return 'refrigerator';
  if (cat.includes('range') || cat.includes('stove')) return 'range';
  if (cat.includes('cooktop')) return 'cooktop';
  if (cat.includes('wall oven') || cat.includes('walloven')) return 'wall_oven';
  if (cat.includes('dishwash')) return 'dishwasher';
  if (cat.includes('hood') || cat.includes('vent')) return 'hood';
  if (cat.includes('micro')) return 'microwave';
  if (cat.includes('wash') && !cat.includes('dish')) return 'washer';
  if (cat.includes('dryer')) return 'dryer';
  if (cat.includes('freez')) return 'freezer';
  if (cat.includes('wine')) return 'wine_cooler';
  if (cat.includes('ice')) return 'ice_maker';
  if (cat.includes('dispos')) return 'garbage_disposal';
  if (cat.includes('compact')) return 'compactor';
  return category;
}

      ` : '<div class="empty-state" style="padding:1.5rem"><p>No site contacts added yet. Add superintendents, inspectors, contractors, and building access contacts before deployment.</p></div>'}
    </div>

    <!-- Your Team (internal CRM users) -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Your Team (${p.team.length})</h3><button class="btn-outline btn-sm" id="add-team-btn">${icons.plus} Member</button></div>
      ${p.team.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Phone</th></tr></thead>
          <tbody>${p.team.map(t => `
            <tr><td><strong>${t.name}</strong></td><td>${statusBadge(t.role)}</td><td>${t.email || '—'}</td><td>${t.phone || '—'}</td></tr>
          `).join('')}</tbody>
        </table></div>
      ` : '<p style="font-size:.85rem;color:var(--text-muted);padding:.5rem 0">No team members assigned.</p>'}
    </div>

    <!-- Unit Sign-Off Summary -->
    ${allUnits.length ? `
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Unit Completion Tracking</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Unit</th><th>Floor</th><th>Status</th><th>Signed Off</th><th>Signed By</th><th>Date</th></tr></thead>
        <tbody>${allUnits.map(u => `
          <tr class="unit-signoff-row" data-unit="${u.id}" style="cursor:pointer">
            <td><strong>${u.unit_number}</strong></td>
            <td>${u.unit_type || '—'}</td>
            <td>${statusBadge(u.status)}</td>
            <td>${u.signed_off ? '<span class="badge badge-green">✅ Yes</span>' : '<span class="badge badge-gray">Pending</span>'}</td>
            <td>${u.signoff_name || '—'}</td>
            <td>${u.signed_off ? formatDate(u.signoff_date) : '—'}</td>
          </tr>
        `).join('')}</tbody>
      </table></div>
    </div>
    ` : ''}

    <!-- Project Sign-Off -->
    <div class="card" style="${p.signed_off ? 'border-color:var(--green);border-width:2px' : ''}">
      <div class="card-header"><h3>${p.signed_off ? '✅ Project Signed Off' : 'Project Sign-Off'}</h3>
        ${!p.signed_off ? `<button class="btn-primary btn-sm" id="signoff-proj-btn">Sign Off Project</button>` : ''}
      </div>
      ${p.signed_off ? `
        <div style="font-size:.85rem;padding:.25rem 0">
          <p><strong>Signed by:</strong> ${p.signoff_name}</p>
          <p><strong>Date:</strong> ${formatDate(p.signoff_date)}</p>
          ${p.signoff_notes ? `<p><strong>Notes:</strong> ${p.signoff_notes}</p>` : ''}
        </div>
      ` : `
        <p style="font-size:.85rem;color:var(--text-muted)">
          ${allUnits.length ? `${allUnits.filter(u => u.signed_off).length} of ${allUnits.length} units signed off.` : 'Add units and complete them before signing off the project.'}
          ${allUnits.length && allUnits.every(u => u.signed_off) ? '<br><strong style="color:var(--green)">All units complete — ready for project sign-off.</strong>' : ''}
        </p>
      `}
    </div>

    <!-- Digital Sign-Off Audit Trail -->
    ${p.signoffs.length ? `
    <div class="card" style="margin-top:1rem">
      <div class="card-header"><h3>Digital Sign-Off Log (${p.signoffs.length})</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date/Time</th><th>Type</th><th>Entity</th><th>Signed By</th><th>Role</th><th>Company</th><th>Acknowledgment</th></tr></thead>
        <tbody>${p.signoffs.map(s => `
          <tr>
            <td style="font-size:.8rem;white-space:nowrap">${s.signed_at ? new Date(s.signed_at).toLocaleString('en-CA') : '—'}</td>
            <td>${statusBadge(s.signoff_type)}</td>
            <td><span class="badge badge-gray">${s.entity_type}</span></td>
            <td><strong>${s.signed_by}</strong>${s.signer_email ? '<br><span style="font-size:.75rem;color:var(--text-muted)">' + s.signer_email + '</span>' : ''}</td>
            <td>${s.signed_role || '—'}</td>
            <td>${s.signer_company || '—'}</td>
            <td style="font-size:.8rem;max-width:200px;overflow:hidden;text-overflow:ellipsis">${s.notes || s.acknowledgment || '—'}</td>
          </tr>
        `).join('')}</tbody>
      </table></div>
    </div>
    ` : ''}
  `;

  // Bind events
  document.getElementById('edit-proj-btn').onclick = () => showProjectModal(p);
  document.getElementById('add-building-btn').onclick = () => showBuildingModal(p.id);
  document.getElementById('add-delivery-btn').onclick = () => showDeliveryModal(p.id);
  document.getElementById('add-team-btn').onclick = () => showTeamModal(p.id);
  document.getElementById('add-contact-btn').onclick = () => showSiteContactModal(p.id);

  el.querySelectorAll('.edit-contact-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); const c = p.contacts.find(x => x.id === b.dataset.id); if(c) showSiteContactModal(p.id, c); };
  });

  const signoffProjBtn = document.getElementById('signoff-proj-btn');
  if (signoffProjBtn) signoffProjBtn.onclick = () => showProjectSignoffModal(p, allUnits);

  el.querySelectorAll('.unit-signoff-row').forEach(r => {
    r.onclick = () => openUnit(r.dataset.unit);
  });
  el.querySelectorAll('.add-floor-btn').forEach(b => { b.onclick = (e) => { e.stopPropagation(); showFloorModal(b.dataset.bld); }; });
  el.querySelectorAll('.edit-bld-btn').forEach(b => { b.onclick = (e) => { e.stopPropagation(); const bld = p.buildings.find(x => x.id === b.dataset.bld); if(bld) showBuildingModal(p.id, bld); }; });
  el.querySelectorAll('.add-unit-btn').forEach(b => { b.onclick = (e) => { e.stopPropagation(); showUnitModal(b.dataset.floor); }; });
  el.querySelectorAll('.unit-dot').forEach(d => {
    d.onclick = (e) => { e.stopPropagation(); openUnit(d.dataset.unit); };
  });
}

// ========== UNIT DETAIL ==========
async function openUnit(unitId) {
  currentUnit = await loadUnitDetail(unitId);
  if (!currentUnit) return toast('Unit not found');
  currentView = 'unit-detail';
  render();
}

async function renderUnitDetail(el) {
  if (!currentUnit || !currentProject) { currentView = 'projects'; render(); return; }
  const u = currentUnit;
  const stepIdx = unitStatuses.indexOf(u.status);

  let unitFloor = null, unitBuilding = null;
  for (const b of currentProject.buildings) {
    for (const f of b.floors) {
      if (f.units.some(x => x.id === u.id)) { unitFloor = f; unitBuilding = b; break; }
    }
    if (unitBuilding) break;
  }

  // Compute appliance tracking stats
  const appl = u.appliances || [];
  const totalAppl = appl.filter(a => !a.is_replacement || a.replacement_status === 'installed').length;
  const orderedCount = appl.filter(a => a.confirmed_ordered).length;
  const deliveredCount = appl.filter(a => a.confirmed_delivered).length;
  const installedCount = appl.filter(a => a.confirmed_installed).length;
  const inspectedCount = appl.filter(a => a.confirmed_inspected).length;
  const damagedCount = appl.filter(a => a.delivery_condition === 'damaged' || a.delivery_condition === 'wrong_item').length;
  const replacementsNeeded = appl.filter(a => a.replacement_status === 'needed' || a.replacement_status === 'ordered' || a.replacement_status === 'shipped').length;

  // Load signoffs for this unit
  const { data: signoffs } = await supabase.from('iqbuild_signoffs').select('*').eq('entity_type', 'unit').eq('entity_id', u.id).order('signed_at', { ascending: false });
  const unitSignoffs = signoffs || [];

  el.innerHTML = `
    <div class="breadcrumb">
      <span onclick="window._nav('projects')">Projects</span><span class="sep">›</span>
      <span onclick="window._openProj('${currentProject.id}')">${currentProject.name}</span><span class="sep">›</span>
      <span>${unitBuilding?.name || ''}</span><span class="sep">›</span>
      <span>Unit ${u.unit_number}</span>
    </div>
    <div class="page-header">
      <h1>Unit ${u.unit_number} ${u.signed_off ? '<span class="badge badge-green" style="font-size:.7rem;vertical-align:middle">SIGNED OFF</span>' : ''}</h1>
      <div style="display:flex;gap:.5rem">
        <button class="btn-outline btn-sm" id="edit-unit-btn">${icons.edit} Edit</button>
        <button class="btn-secondary btn-sm" id="assign-pkg-btn">${icons.packages} Assign Package</button>
        <button class="btn-primary btn-sm" id="add-appliance-btn">${icons.plus} Add Appliance</button>
      </div>
    </div>

    <!-- Status & Info -->
    <div class="stats-row">
      <div class="stat-card"><div class="label">Status</div><div class="value" style="font-size:1rem;margin-top:.5rem">${statusBadge(u.status)}</div>
        <div class="pipeline" style="margin-top:.5rem">${unitStatuses.filter(s => s !== 'on_hold').map((s,i) => `<div class="pipeline-step ${i <= stepIdx && u.status !== 'on_hold' ? 'done' : ''}" title="${s.replace(/_/g,' ')}"></div>`).join('')}</div>
      </div>
      <div class="stat-card"><div class="label">Type</div><div class="value" style="font-size:1rem;margin-top:.5rem">${u.unit_type || '—'}</div></div>
      <div class="stat-card"><div class="label">Buyer</div><div class="value" style="font-size:.9rem;margin-top:.5rem">${u.buyer_name || 'Not assigned'}</div><div class="sub">${u.buyer_email || ''}</div></div>
      <div class="stat-card"><div class="label">Upgrades</div><div class="value">${u.has_upgrades ? formatCurrency(u.upgrade_total) : 'None'}</div></div>
    </div>

    <!-- Product Tracking Summary -->
    <div class="card" style="margin-bottom:1rem;padding:.75rem 1rem">
      <div style="display:flex;flex-wrap:wrap;gap:1.25rem;align-items:center;font-size:.8rem">
        <strong>Product Tracking:</strong>
        <span>📦 Ordered: <strong>${orderedCount}/${totalAppl}</strong></span>
        <span>🚚 Delivered: <strong>${deliveredCount}/${totalAppl}</strong></span>
        <span>🔧 Installed: <strong>${installedCount}/${totalAppl}</strong></span>
        <span>✅ Inspected: <strong>${inspectedCount}/${totalAppl}</strong></span>
        ${damagedCount ? `<span style="color:var(--red)">⚠️ Damaged: <strong>${damagedCount}</strong></span>` : ''}
        ${replacementsNeeded ? `<span style="color:var(--orange)">🔄 Replacements pending: <strong>${replacementsNeeded}</strong></span>` : ''}
      </div>
    </div>

    <!-- Quick Status Update -->
    <div class="card" style="margin-bottom:1rem;padding:.75rem 1rem">
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
        <strong style="font-size:.8rem;color:var(--text-light)">Update Status:</strong>
        ${unitStatuses.map(s => `<button class="btn-sm ${s === u.status ? 'btn-primary' : 'btn-outline'} status-btn" data-status="${s}">${s.replace(/_/g,' ')}</button>`).join('')}
      </div>
    </div>

    <!-- Appliances — Full Tracking Table -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Appliances (${appl.length})</h3></div>
      ${appl.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Type</th><th>Brand / Model</th><th>Serial#</th><th>Grade</th><th>Ordered</th><th>Delivered</th><th>Installed</th><th>Inspected</th><th>Condition</th><th>Actions</th></tr></thead>
          <tbody>${appl.map(a => {
            const condBadge = a.delivery_condition === 'good' ? 'badge-green' : a.delivery_condition === 'damaged' ? 'badge-red' : a.delivery_condition === 'missing' ? 'badge-red' : a.delivery_condition === 'wrong_item' ? 'badge-orange' : 'badge-gray';
            const isReplacement = a.is_replacement;
            return `
            <tr class="${isReplacement ? 'style="background:#fffbeb"' : ''}" style="${isReplacement ? 'background:#fffbeb' : ''}">
              <td><strong>${a.appliance_type}</strong>${isReplacement ? '<br><span class="badge badge-yellow" style="font-size:.6rem">REPLACEMENT</span>' : ''}${a.replacement_status && a.replacement_status !== 'none' ? '<br><span class="badge badge-orange" style="font-size:.6rem">REPL: ' + a.replacement_status + '</span>' : ''}</td>
              <td>${a.brand || '—'}<br><span style="font-size:.75rem;color:var(--text-muted)">${a.model || ''}</span></td>
              <td style="font-size:.8rem">${a.serial_number || '—'}</td>
              <td>${statusBadge(a.upgrade_status)}</td>
              <td style="text-align:center"><input type="checkbox" class="confirm-chk" data-appliance="${a.id}" data-stage="ordered" ${a.confirmed_ordered ? 'checked' : ''} title="${a.confirmed_ordered_by ? 'by ' + a.confirmed_ordered_by : ''}"></td>
              <td style="text-align:center"><input type="checkbox" class="confirm-chk" data-appliance="${a.id}" data-stage="delivered" ${a.confirmed_delivered ? 'checked' : ''} title="${a.confirmed_delivered_by ? 'by ' + a.confirmed_delivered_by : ''}"></td>
              <td style="text-align:center"><input type="checkbox" class="confirm-chk" data-appliance="${a.id}" data-stage="installed" ${a.confirmed_installed ? 'checked' : ''} title="${a.confirmed_installed_by ? 'by ' + a.confirmed_installed_by : ''}"></td>
              <td style="text-align:center"><input type="checkbox" class="confirm-chk" data-appliance="${a.id}" data-stage="inspected" ${a.confirmed_inspected ? 'checked' : ''} title="${a.confirmed_inspected_by ? 'by ' + a.confirmed_inspected_by : ''}"></td>
              <td><span class="badge ${condBadge}">${(a.delivery_condition || 'pending').replace(/_/g,' ')}</span></td>
              <td style="white-space:nowrap">
                <button class="btn-icon btn-sm edit-appl-btn" data-id="${a.id}" title="Edit">${icons.edit}</button>
                <button class="btn-icon btn-sm damage-btn" data-id="${a.id}" title="Report Damage" style="color:var(--red)">⚠</button>
                ${a.delivery_condition === 'damaged' || a.delivery_condition === 'wrong_item' || a.delivery_condition === 'missing' ? `<button class="btn-icon btn-sm repl-btn" data-id="${a.id}" title="Order Replacement" style="color:var(--orange)">🔄</button>` : ''}
              </td>
            </tr>
            ${a.damage_notes ? `<tr><td colspan="10" style="padding:.3rem .75rem;font-size:.8rem;color:var(--red);background:#fef2f2"><strong>Damage:</strong> ${a.damage_notes} ${a.damage_reported_at ? '<span style="color:var(--text-muted)">(' + formatDate(a.damage_reported_at) + ')</span>' : ''}</td></tr>` : ''}
            ${a.replacement_notes ? `<tr><td colspan="10" style="padding:.3rem .75rem;font-size:.8rem;color:var(--orange);background:#fffbeb"><strong>Replacement:</strong> ${a.replacement_brand || ''} ${a.replacement_model || ''} — ${a.replacement_notes} ${a.replacement_eta ? '| ETA: ' + formatDate(a.replacement_eta) : ''}</td></tr>` : ''}
          `}).join('')}</tbody>
        </table></div>
      ` : '<div class="empty-state" style="padding:1.5rem"><p>No appliances yet. Assign a package or add appliances individually.</p></div>'}
    </div>

    <!-- Installation Work Orders -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Installation (${u.installations.length})</h3><button class="btn-primary btn-sm" id="add-install-btn">${icons.plus} Work Order</button></div>
      <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem">Installation is tracked separately from delivery — includes labour, parts (hoses, vents, connectors), and billing.</p>
      ${u.installations.length ? u.installations.map(inst => {
        const parts = inst.iqbuild_installation_parts || [];
        const partsCost = parts.reduce((a, p) => a + Number(p.total_cost || 0), 0);
        return `
        <div style="border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.5rem;background:${inst.status === 'complete' ? '#f0fdf4' : '#fff'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
            <div>
              <strong>${inst.installer_company || inst.installer_name || 'Unassigned'}</strong>
              ${inst.installer_name && inst.installer_company ? ' <span style="font-size:.8rem;color:var(--text-muted)">(' + inst.installer_name + ')</span>' : ''}
              ${statusBadge(inst.status)}
            </div>
            <div style="display:flex;gap:.4rem;align-items:center">
              <span style="font-size:.85rem;font-weight:600;color:var(--navy)">${formatCurrency(Number(inst.labour_cost || 0) + partsCost)}</span>
              <button class="btn-icon btn-sm edit-install-btn" data-id="${inst.id}">${icons.edit}</button>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:1rem;font-size:.8rem;color:var(--text-light);margin-bottom:.4rem">
            ${inst.scheduled_date ? '<span>📅 ' + formatDate(inst.scheduled_date) + '</span>' : ''}
            <span>💰 Labour: ${formatCurrency(inst.labour_cost)}</span>
            <span>🔧 Parts: ${formatCurrency(partsCost)} (${parts.length} items)</span>
            <span>📋 Billed to: ${inst.billed_to || '—'}</span>
            ${inst.invoice_number ? '<span>🧾 INV: ' + inst.invoice_number + ' (' + (inst.invoice_status || 'pending') + ')</span>' : ''}
            ${inst.po_number ? '<span>PO: ' + inst.po_number + '</span>' : ''}
          </div>
          ${inst.scope_notes ? '<div style="font-size:.8rem;color:var(--text);margin-bottom:.3rem"><strong>Scope:</strong> ' + inst.scope_notes + '</div>' : ''}
          ${inst.issues_found ? '<div style="font-size:.8rem;color:var(--red);margin-bottom:.3rem"><strong>Issues:</strong> ' + inst.issues_found + '</div>' : ''}
          ${parts.length ? `
            <div style="margin-top:.4rem;border-top:1px solid var(--border);padding-top:.4rem">
              <table style="width:100%;font-size:.8rem">
                <thead><tr><th style="font-size:.7rem">Part</th><th style="font-size:.7rem">For</th><th style="font-size:.7rem">Qty</th><th style="font-size:.7rem">Cost</th><th style="font-size:.7rem">Supplied By</th><th style="font-size:.7rem">Included</th></tr></thead>
                <tbody>${parts.map(pt => `
                  <tr style="cursor:default">
                    <td><strong>${pt.part_name}</strong><br><span style="color:var(--text-muted)">${pt.part_type.replace(/_/g,' ')}</span></td>
                    <td>${pt.unit_appliance_id ? (appl.find(a => a.id === pt.unit_appliance_id)?.appliance_type || '—') : 'General'}</td>
                    <td>${pt.quantity}</td>
                    <td>${formatCurrency(pt.total_cost)}</td>
                    <td>${pt.supplied_by || '—'}</td>
                    <td>${pt.included_in_price ? '<span class="badge badge-green">Incl</span>' : '<span class="badge badge-yellow">Extra</span>'}</td>
                  </tr>
                `).join('')}</tbody>
              </table>
            </div>
          ` : ''}
          <div style="margin-top:.4rem"><button class="btn-outline btn-sm add-part-btn" data-inst="${inst.id}">${icons.plus} Add Part</button></div>
        </div>`;
      }).join('') : '<p style="font-size:.85rem;color:var(--text-muted);padding:.25rem 0">No installation work orders yet.</p>'}
    </div>

    <!-- Notes -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Unit Notes</h3><button class="btn-outline btn-sm" id="save-notes-btn">Save</button></div>
      <textarea id="unit-notes-field" style="width:100%;min-height:80px;border:1px solid var(--border);border-radius:8px;padding:.6rem;font-size:.85rem">${u.notes || ''}</textarea>
    </div>

    <!-- Milestones -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-header"><h3>Milestones & Inspections</h3>
        ${u.milestones.length === 0 ? `<button class="btn-outline btn-sm" id="init-milestones-btn">Initialize</button>` : ''}
      </div>
      ${u.milestones.length ? u.milestones.map(m => {
        const tpl = m.iqbuild_milestone_templates || {};
        const iconClass = m.status === 'passed' ? 'passed' : m.status === 'failed' ? 'failed' : m.status === 'in_progress' ? 'in_progress' : 'pending';
        const iconSymbol = m.status === 'passed' ? '✓' : m.status === 'failed' ? '✗' : m.status === 'in_progress' ? '⏳' : '○';
        return `
          <div class="milestone-item milestone-click" data-mid="${m.id}" data-status="${m.status}">
            <div class="milestone-icon ${iconClass}">${iconSymbol}</div>
            <div class="milestone-name">${tpl.name || 'Milestone'}</div>
            <div class="milestone-meta">${tpl.category || ''}</div>
            <div>${statusBadge(m.status)}</div>
          </div>
        `;
      }).join('') : '<p style="font-size:.85rem;color:var(--text-muted);padding:.5rem 0">Click "Initialize" to set up the inspection checklist.</p>'}
    </div>

    <!-- Sign-Off Section -->
    <div class="card" style="margin-bottom:1rem;${u.signed_off ? 'border-color:var(--green);border-width:2px' : ''}">
      <div class="card-header"><h3>${u.signed_off ? '✅ Unit Signed Off' : 'Unit Sign-Off'}</h3>
        ${!u.signed_off ? `<button class="btn-primary btn-sm" id="signoff-unit-btn">Sign Off Unit</button>` : ''}
      </div>
      ${u.signed_off ? `
        <div style="font-size:.85rem;padding:.25rem 0">
          <p><strong>Signed by:</strong> ${u.signoff_name} ${u.signoff_role ? '(' + u.signoff_role + ')' : ''}</p>
          <p><strong>Date:</strong> ${formatDate(u.signoff_date)}</p>
          ${u.signoff_notes ? `<p><strong>Notes:</strong> ${u.signoff_notes}</p>` : ''}
        </div>
      ` : `<p style="font-size:.85rem;color:var(--text-muted)">All appliances must be confirmed installed and inspected before sign-off.</p>`}
    </div>

    <!-- Sign-off History -->
    ${unitSignoffs.length ? `
    <div class="card">
      <div class="card-header"><h3>Sign-Off History (${unitSignoffs.length})</h3></div>
      ${unitSignoffs.map(s => `
        <div style="border-bottom:1px solid var(--border);padding:.5rem 0;font-size:.85rem">
          <strong>${s.signoff_type.replace(/_/g,' ')}</strong> by ${s.signed_by} ${s.signed_role ? '(' + s.signed_role + ')' : ''} — ${formatDate(s.signed_at)}
          ${s.notes ? `<br><span style="color:var(--text-light)">${s.notes}</span>` : ''}
        </div>
      `).join('')}
    </div>
    ` : ''}
  `;

  // ===== BIND ALL EVENTS =====
  document.getElementById('edit-unit-btn').onclick = () => showUnitModal(null, u);
  document.getElementById('add-appliance-btn').onclick = () => showApplianceModal(u.id);
  document.getElementById('assign-pkg-btn').onclick = () => showAssignPackageModal(u);
  document.getElementById('add-install-btn').onclick = () => showInstallationModal(u);

  el.querySelectorAll('.edit-install-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); const inst = u.installations.find(x => x.id === b.dataset.id); if(inst) showInstallationModal(u, inst); };
  });
  el.querySelectorAll('.add-part-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); showPartModal(u, b.dataset.inst); };
  });

  const initBtn = document.getElementById('init-milestones-btn');
  if (initBtn) initBtn.onclick = () => initMilestones(u.id);

  const signoffBtn = document.getElementById('signoff-unit-btn');
  if (signoffBtn) signoffBtn.onclick = () => showUnitSignoffModal(u);

  // Save notes
  document.getElementById('save-notes-btn').onclick = async () => {
    await supabase.from('iqbuild_units').update({ notes: document.getElementById('unit-notes-field').value, updated_at: new Date().toISOString() }).eq('id', u.id);
    toast('Notes saved');
  };

  // Status buttons
  el.querySelectorAll('.status-btn').forEach(b => {
    b.onclick = async () => {
      await supabase.from('iqbuild_units').update({ status: b.dataset.status, updated_at: new Date().toISOString() }).eq('id', u.id);
      await logActivity(currentProject.id, 'unit', u.id, 'status_changed', u.status, b.dataset.status, `Unit ${u.unit_number} → ${b.dataset.status}`);
      toast(`Unit ${u.unit_number} → ${b.dataset.status.replace(/_/g,' ')}`);
      currentUnit = await loadUnitDetail(u.id);
      currentProject = await loadProjectDetail(currentProject.id);
      renderView();
    };
  });

  // Confirmation checkboxes
  el.querySelectorAll('.confirm-chk').forEach(chk => {
    chk.onclick = async (e) => {
      const applianceId = chk.dataset.appliance;
      const stage = chk.dataset.stage;
      const checked = chk.checked;
      const now = new Date().toISOString();
      const update = {};
      update[`confirmed_${stage}`] = checked;
      update[`confirmed_${stage}_at`] = checked ? now : null;
      update[`confirmed_${stage}_by`] = checked ? currentUser.email : null;
      // Auto-update appliance status
      if (stage === 'ordered' && checked) update.status = 'ordered';
      if (stage === 'delivered' && checked) { update.status = 'delivered'; if (!update.delivery_condition || update.delivery_condition === 'pending') update.delivery_condition = 'good'; }
      if (stage === 'installed' && checked) update.status = 'installed';
      if (stage === 'inspected' && checked) update.status = 'inspected';
      update.updated_at = now;
      await supabase.from('iqbuild_unit_appliances').update(update).eq('id', applianceId);
      await logActivity(currentProject.id, 'appliance', applianceId, `confirmed_${stage}`, null, checked ? 'true' : 'false', `${stage} ${checked ? 'confirmed' : 'unconfirmed'} for unit ${u.unit_number}`);
      toast(`${stage} ${checked ? '✓' : '✗'}`);
      currentUnit = await loadUnitDetail(u.id);
      renderView();
    };
  });

  // Milestone clicks
  el.querySelectorAll('.milestone-click').forEach(m => {
    m.onclick = () => showMilestoneUpdateModal(m.dataset.mid, m.dataset.status);
  });

  // Edit appliance
  el.querySelectorAll('.edit-appl-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); const a = appl.find(x => x.id === b.dataset.id); if (a) showApplianceModal(u.id, a); };
  });

  // Damage report
  el.querySelectorAll('.damage-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); showDamageModal(u, b.dataset.id); };
  });

  // Replacement order
  el.querySelectorAll('.repl-btn').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); showReplacementModal(u, b.dataset.id); };
  });
}

// ===== ASSIGN PACKAGE TO UNIT =====
async function showAssignPackageModal(unit) {
  const { data: pkgs } = await supabase.from('iqbuild_packages').select('*, iqbuild_package_items(*)').eq('project_id', currentProject.id);
  const packages = pkgs || [];
  if (!packages.length) { toast('No packages defined for this project. Create packages first.'); return; }

  showModal('Assign Package → Unit ' + unit.unit_number, `
    <p style="font-size:.85rem;color:var(--text-light);margin-bottom:1rem">This will create individual appliance records in this unit from the selected package. Each item becomes a trackable appliance with its own confirmation chain.</p>
    <div class="form-group"><label>Select Package</label><select id="m-pkg-select">
      ${packages.map(p => `<option value="${p.id}">${p.name} (${p.iqbuild_package_items?.length || 0} items — ${formatCurrency(p.base_cost)})</option>`).join('')}
    </select></div>
    <div id="m-pkg-preview"></div>
  `, async () => {
    const pkgId = document.getElementById('m-pkg-select').value;
    const pkg = packages.find(p => p.id === pkgId);
    if (!pkg) return false;
    const items = pkg.iqbuild_package_items || [];
    if (!items.length) { toast('Package has no items'); return false; }

    const appliances = items.map(it => ({
      unit_id: unit.id,
      appliance_type: it.appliance_type || it.category || 'other',
      brand: it.brand || null,
      model: it.model || null,
      product_id: it.product_id || it.aiq_product_id || null,
      original_cost: Number(it.negotiated_price || it.unit_cost || 0),
      upgrade_status: pkg.is_builder_grade ? 'builder_grade' : 'upgrade_requested',
      status: 'pending',
      delivery_condition: 'pending',
      notes: it.notes || null,
    }));

    const { error } = await supabase.from('iqbuild_unit_appliances').insert(appliances);
    if (error) { toast('Error: ' + error.message); return false; }

    // Update unit package reference and counts
    await supabase.from('iqbuild_units').update({ package_id: pkgId, updated_at: new Date().toISOString() }).eq('id', unit.id);
    await logActivity(currentProject.id, 'unit', unit.id, 'package_assigned', null, pkg.name, `Package "${pkg.name}" assigned to unit ${unit.unit_number} — ${items.length} appliances created`);
    toast(`${items.length} appliances created from "${pkg.name}"`);
    currentUnit = await loadUnitDetail(unit.id);
    renderView();
  });

  // Preview on change
  const previewPkg = () => {
    const pkgId = document.getElementById('m-pkg-select').value;
    const pkg = packages.find(p => p.id === pkgId);
    const items = pkg?.iqbuild_package_items || [];
    document.getElementById('m-pkg-preview').innerHTML = items.length ? `
      <div style="border:1px solid var(--border);border-radius:8px;padding:.5rem;margin-top:.5rem;font-size:.8rem">
        ${items.map(it => `<div style="padding:3px 0;border-bottom:1px solid var(--border)"><strong>${it.appliance_type || it.category}</strong> — ${it.brand || ''} ${it.model || ''} <span style="color:var(--text-muted)">${formatCurrency(it.negotiated_price || it.unit_cost)}</span></div>`).join('')}
      </div>
    ` : '';
  };
  setTimeout(() => {
    const sel = document.getElementById('m-pkg-select');
    if (sel) { sel.onchange = previewPkg; previewPkg(); }
  }, 50);
}

// ===== DAMAGE REPORT =====
function showDamageModal(unit, applianceId) {
  const a = unit.appliances.find(x => x.id === applianceId);
  if (!a) return;
  const conditions = ['good','damaged','missing','wrong_item'];
  showModal(`Report Damage — ${a.appliance_type}`, `
    <div style="background:var(--bg);border-radius:8px;padding:.75rem;margin-bottom:1rem;font-size:.85rem">
      <strong>${a.brand || ''} ${a.model || ''}</strong> | Serial: ${a.serial_number || 'N/A'} | Unit ${unit.unit_number}
    </div>
    <div class="form-group"><label>Condition</label><select id="m-dcond">${conditions.map(c => `<option value="${c}" ${a.delivery_condition === c ? 'selected' : ''}>${c.replace(/_/g,' ')}</option>`).join('')}</select></div>
    <div class="form-group"><label>Damage Description *</label><textarea id="m-ddesc" placeholder="Describe the damage — dent, scratch, broken part, wrong color, etc.">${a.damage_notes || ''}</textarea></div>
    <div class="form-group"><label>Reported By</label><input id="m-dby" value="${currentUser.email}"></div>
  `, async () => {
    const condition = document.getElementById('m-dcond').value;
    const notes = document.getElementById('m-ddesc').value.trim();
    if (!notes) { toast('Please describe the damage'); return false; }
    const update = {
      delivery_condition: condition,
      damage_notes: notes,
      damage_reported_at: new Date().toISOString(),
      replacement_status: (condition === 'damaged' || condition === 'missing' || condition === 'wrong_item') ? 'needed' : 'none',
      updated_at: new Date().toISOString(),
    };
    await supabase.from('iqbuild_unit_appliances').update(update).eq('id', applianceId);
    // Create signoff record for damage report
    await supabase.from('iqbuild_signoffs').insert({
      project_id: currentProject.id,
      entity_type: 'unit',
      entity_id: unit.id,
      signoff_type: 'damage_report',
      signed_by: document.getElementById('m-dby').value,
      notes: `${a.appliance_type} (${a.brand || ''} ${a.model || ''}): ${notes}`,
    });
    await logActivity(currentProject.id, 'appliance', applianceId, 'damage_reported', null, condition, `Damage reported: ${a.appliance_type} in unit ${unit.unit_number} — ${notes}`);
    toast('Damage reported');
    currentUnit = await loadUnitDetail(unit.id);
    renderView();
  });
}

// ===== UNIT SIGN-OFF (DIGITAL) =====
function showUnitSignoffModal(unit) {
  const appl = unit.appliances || [];
  const allInspected = appl.length > 0 && appl.every(a => a.confirmed_inspected || a.is_replacement);
  const pendingReplacements = appl.filter(a => a.replacement_status && a.replacement_status !== 'none' && a.replacement_status !== 'installed');
  const ackText = `I, the undersigned, hereby confirm and acknowledge the following for Unit ${unit.unit_number}:\n\n1. All appliances have been delivered, installed, connected, and fully tested in working condition.\n2. A complete inspection has been performed and all appliances are confirmed to be free of damage, defects, and cosmetic imperfections.\n3. No damage has been caused to the unit, surrounding property, flooring, cabinetry, countertops, walls, or any part of the building or complex during delivery or installation.\n4. There are no outstanding issues, incomplete work, missing items, or unresolved service matters related to the appliance scope for this unit.\n5. All deliveries for this unit have been received and accepted in full.\n6. Once signed, this unit is considered complete and accepted. No returns, exchanges, or take-backs will be permitted on installed appliances unless covered under manufacturer warranty.\n7. Any exceptions to the above are documented in the notes below. Undocumented issues raised after sign-off are not the responsibility of the appliance retailer.\n\nBy signing below, I accept full responsibility for confirming the above and release the appliance retailer from further liability related to the delivery, installation, and condition of appliances in this unit.`;

  showModal('Digital Sign-Off — Unit ' + unit.unit_number, `
    ${!allInspected ? `<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:.75rem;margin-bottom:1rem;font-size:.85rem;color:#92400e"><strong>Warning:</strong> Not all appliances confirmed inspected.</div>` : ''}
    ${pendingReplacements.length ? `<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:.75rem;margin-bottom:1rem;font-size:.85rem;color:#991b1b"><strong>Warning:</strong> ${pendingReplacements.length} replacement(s) still pending.</div>` : ''}
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:.75rem;margin-bottom:1rem;font-size:.85rem;color:#166534">
      <strong>Tracking Summary:</strong><br>
      ${appl.length ? `✓ ${appl.filter(a=>a.confirmed_ordered).length}/${appl.length} ordered | ✓ ${appl.filter(a=>a.confirmed_delivered).length}/${appl.length} delivered | ✓ ${appl.filter(a=>a.confirmed_installed).length}/${appl.length} installed | ✓ ${appl.filter(a=>a.confirmed_inspected).length}/${appl.length} inspected` : 'No appliances'}
    </div>
    <h4 style="font-size:.9rem;margin-bottom:.75rem;border-bottom:1px solid var(--border);padding-bottom:.5rem">Signer Information</h4>
    <div class="form-group"><label>Full Name *</label><input id="m-soname" placeholder="First and last name"></div>
    <div class="form-row">
      <div class="form-group"><label>Email *</label><input id="m-soemail" type="email" value="${currentUser.email}"></div>
      <div class="form-group"><label>Phone</label><input id="m-sophone"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Role *</label><select id="m-sorole"><option value="site_manager">Site Manager</option><option value="inspector">Inspector</option><option value="project_manager">Project Manager</option><option value="client">Client / Developer</option><option value="general_contractor">General Contractor</option></select></div>
      <div class="form-group"><label>Company</label><input id="m-socompany"></div>
    </div>
    <div class="form-group"><label>Title</label><input id="m-sotitle" placeholder="e.g. Site Superintendent"></div>
    <h4 style="font-size:.9rem;margin:.75rem 0;border-bottom:1px solid var(--border);padding-bottom:.5rem">Digital Acknowledgment</h4>
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.75rem;font-size:.82rem;color:var(--text);white-space:pre-line;max-height:250px;overflow-y:auto;line-height:1.5">${ackText}</div>
    <div class="form-group"><label><input type="checkbox" id="m-soack"> I agree to the above acknowledgment and confirm this digital sign-off is binding *</label></div>
    <div class="form-group"><label>Exceptions / Notes</label><textarea id="m-sonotes" placeholder="Any exceptions, conditions, punch list items..."></textarea></div>
    <p style="font-size:.75rem;color:var(--text-muted)">This sign-off is digitally recorded with timestamp, signer identity, and a tamper-evident hash. It serves as a binding completion record.</p>
  `, async () => {
    const name = document.getElementById('m-soname').value.trim();
    const email = document.getElementById('m-soemail').value.trim();
    const ackChecked = document.getElementById('m-soack').checked;
    if (!name) { toast('Full name is required'); return false; }
    if (!email) { toast('Email is required'); return false; }
    if (!ackChecked) { toast('You must agree to the acknowledgment'); return false; }
    const now = new Date().toISOString();
    const role = document.getElementById('m-sorole').value;
    const company = document.getElementById('m-socompany').value.trim() || null;
    const phone = document.getElementById('m-sophone').value.trim() || null;
    const title = document.getElementById('m-sotitle').value.trim() || null;
    const notes = document.getElementById('m-sonotes').value.trim() || null;
    // Generate tamper-evident hash
    const hashInput = `${name}|${email}|${now}|${ackText}|unit:${unit.id}`;
    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(hashInput));
    const sigHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

    // Update unit
    await supabase.from('iqbuild_units').update({
      signed_off: true, signoff_name: name, signoff_date: now,
      signoff_role: role, signoff_notes: notes,
      signoff_email: email, signoff_phone: phone, signoff_company: company,
      status: 'complete', updated_at: now,
    }).eq('id', unit.id);
    // Create digital signoff record
    await supabase.from('iqbuild_signoffs').insert({
      project_id: currentProject.id, entity_type: 'unit', entity_id: unit.id,
      signoff_type: 'completion', signed_by: name, signed_role: role,
      signer_email: email, signer_phone: phone, signer_company: company, signer_title: title,
      acknowledgment: ackText, signature_hash: sigHash, is_binding: true,
      notes: notes,
      user_agent: navigator.userAgent,
      checklist: { appliances: appl.length, ordered: appl.filter(a=>a.confirmed_ordered).length, delivered: appl.filter(a=>a.confirmed_delivered).length, installed: appl.filter(a=>a.confirmed_installed).length, inspected: appl.filter(a=>a.confirmed_inspected).length, damaged: appl.filter(a=>a.delivery_condition==='damaged').length },
    });
    await logActivity(currentProject.id, 'unit', unit.id, 'signed_off', null, `${name} (${role})`, `Unit ${unit.unit_number} digitally signed off by ${name}, ${role}${company ? ', ' + company : ''}`);
    toast(`Unit ${unit.unit_number} signed off ✅`);
    currentUnit = await loadUnitDetail(unit.id);
    currentProject = await loadProjectDetail(currentProject.id);
    renderView();
  });
}

}

// ========== MODALS ==========
function showModal(title, bodyHtml, onSave) {
  modalOpen = true;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h2>${title}</h2><button class="btn-icon modal-close-btn">${icons.close}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">
        <button class="btn-outline modal-cancel-btn">Cancel</button>
        <button class="btn-primary modal-save-btn">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-close-btn').onclick = () => closeModal(overlay);
  overlay.querySelector('.modal-cancel-btn').onclick = () => closeModal(overlay);
  overlay.querySelector('.modal-save-btn').onclick = async () => {
    const result = await onSave();
    if (result !== false) closeModal(overlay);
  };
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(overlay); };
}

function closeModal(overlay) {
  modalOpen = false;
  overlay.remove();
}

// -- Appliance Modal
function showApplianceModal(unitId, existing) {
  const a = existing || {};
  const appTypes = ['refrigerator','range','cooktop','wall_oven','dishwasher','hood','microwave','washer','dryer','freezer','wine_cooler','ice_maker','garbage_disposal','compactor'];
  const upgradeStatuses = ['builder_grade','upgrade_requested','upgrade_approved','upgrade_ordered','upgrade_installed'];
  const appStatuses = ['pending','ordered','delivered','installed','inspected'];
  showModal(existing ? 'Edit Appliance' : 'Add Appliance', `
    <div class="form-row">
      <div class="form-group"><label>Appliance Type *</label><select id="m-atype">${appTypes.map(t => `<option value="${t}" ${a.appliance_type === t ? 'selected' : ''}>${t.replace(/_/g,' ')}</option>`).join('')}</select></div>
      <div class="form-group"><label>Status</label><select id="m-astatus">${appStatuses.map(s => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Brand</label><input id="m-abrand" value="${a.brand || ''}"></div>
      <div class="form-group"><label>Model</label><input id="m-amodel" value="${a.model || ''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Serial Number</label><input id="m-aserial" value="${a.serial_number || ''}"></div>
      <div class="form-group"><label>Grade</label><select id="m-agrade">${upgradeStatuses.map(s => `<option value="${s}" ${a.upgrade_status === s ? 'selected' : ''}>${s.replace(/_/g,' ')}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Original Cost ($)</label><input type="number" id="m-acost" value="${a.original_cost || ''}"></div>
      <div class="form-group"><label>Upgrade Cost Diff ($)</label><input type="number" id="m-adiff" value="${a.upgrade_cost_diff || ''}"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="m-anotes">${a.notes || ''}</textarea></div>
    ${existing ? `<div style="margin-top:.5rem"><button class="btn-danger btn-sm" id="del-appliance-btn">${icons.trash} Remove Appliance</button></div>` : ''}
  `, async () => {
    const record = {
      appliance_type: document.getElementById('m-atype').value,
      status: document.getElementById('m-astatus').value,
      brand: document.getElementById('m-abrand').value.trim() || null,
      model: document.getElementById('m-amodel').value.trim() || null,
      serial_number: document.getElementById('m-aserial').value.trim() || null,
      upgrade_status: document.getElementById('m-agrade').value,
      original_cost: parseFloat(document.getElementById('m-acost').value) || 0,
      upgrade_cost_diff: parseFloat(document.getElementById('m-adiff').value) || 0,
      notes: document.getElementById('m-anotes').value.trim() || null,
      updated_at: new Date().toISOString(),
    };
    if (existing) {
      const { error } = await supabase.from('iqbuild_unit_appliances').update(record).eq('id', existing.id);
      if (error) { toast('Error: ' + error.message); return false; }
    } else {
      record.unit_id = unitId;
      const { error } = await supabase.from('iqbuild_unit_appliances').insert(record);
      if (error) { toast('Error: ' + error.message); return false; }
    }
    toast(existing ? 'Appliance updated' : 'Appliance added');
    // Update has_upgrades
    const { data: allAppl } = await supabase.from('iqbuild_unit_appliances').select('upgrade_status,upgrade_cost_diff').eq('unit_id', unitId);
    const hasUpgrades = (allAppl || []).some(x => x.upgrade_status !== 'builder_grade');
    const upgradeTotal = (allAppl || []).reduce((a, x) => a + Number(x.upgrade_cost_diff || 0), 0);
    await supabase.from('iqbuild_units').update({ has_upgrades: hasUpgrades, upgrade_total: upgradeTotal }).eq('id', unitId);

    currentUnit = await loadUnitDetail(unitId);
    renderView();
  });

  if (existing) {
    setTimeout(() => {
      const delBtn = document.getElementById('del-appliance-btn');
      if (delBtn) delBtn.onclick = async () => {
        if (!confirm('Remove this appliance?')) return;
        await supabase.from('iqbuild_unit_appliances').delete().eq('id', existing.id);
        toast('Appliance removed');
        currentUnit = await loadUnitDetail(unitId);
        document.querySelector('.modal-overlay')?.remove();
        modalOpen = false;
        renderView();
      };
    }, 100);
  }
}

// -- Milestone Update Modal
function showMilestoneUpdateModal(milestoneId, currentStatus) {
  const msStatuses = ['pending','in_progress','passed','failed','waived','not_applicable'];
  showModal('Update Milestone', `
    <div class="form-group"><label>Status</label><select id="m-mstatus">${msStatuses.map(s => `<option value="${s}" ${s === currentStatus ? 'selected' : ''}>${s.replace(/_/g,' ')}</option>`).join('')}</select></div>

  `, async () => {
    const newStatus = document.getElementById('m-mstatus').value;
    const record = {
      status: newStatus,
      inspector_name: document.getElementById('m-minsp').value.trim() || null,
      completed_date: document.getElementById('m-mdate').value || null,
      inspection_notes: document.getElementById('m-mnotes').value.trim() || null,
      updated_at: new Date().toISOString(),

    }
    renderView();
  });
}
