<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Arena — ApplianceIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f2f6f8;color:#182838}button,input{font:inherit}.hidden{display:none!important}
:root{--navy:#193a60;--teal:#0d9488;--green:#059669;--amber:#d97706;--red:#dc2626;--muted:#607587;--border:#d6e0e6;--card:#fff;--soft:#edf3f6}
.top{height:62px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:var(--navy);letter-spacing:-.4px}.brand span{color:var(--teal)}.top a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.hero h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-1px}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:700px}.pill{display:inline-flex;padding:6px 10px;border:1px solid #b8dcd8;border-radius:999px;background:#ecf9f7;color:#08786f;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:6px;margin-bottom:18px}.tab{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:9px;padding:10px 15px;font-size:13px;font-weight:800;cursor:pointer}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(25,58,96,.04)}.span4{grid-column:span 4}.span5{grid-column:span 5}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.kicker{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.big{font-size:34px;font-weight:900;color:var(--navy);margin-top:5px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.section-title{font-size:17px;font-weight:900;color:var(--navy);margin:0 0 12px}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;transition:.16s;text-align:left}.mode:hover{transform:translateY(-1px);border-color:#8fc9c3}.mode.active{border:2px solid var(--teal);background:#f1fbfa}.mode .ico{font-size:24px}.mode h3{font-size:14px;margin:8px 0 4px;color:var(--navy)}.mode p{font-size:12px;line-height:1.45;color:var(--muted);margin:0}.primary{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.primary:disabled{opacity:.45;cursor:default}.secondary{border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.danger{background:#fff;border:1px solid #f3b0b0;color:var(--red);border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.prescription{background:linear-gradient(135deg,#193a60,#2d577f);color:#fff;border-radius:14px;padding:20px}.prescription .kicker{color:#a9c5dc}.prescription h2{margin:5px 0 8px;font-size:22px}.prescription p{margin:0;color:#d4e2ed;font-size:13px;line-height:1.5}.difficulty{display:flex;gap:3px;margin-top:12px}.dot{width:18px;height:5px;border-radius:4px;background:rgba(255,255,255,.2)}.dot.on{background:#5eead4}
.dna-row{display:grid;grid-template-columns:180px 1fr 52px 76px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1f3}.dna-row:last-child{border-bottom:0}.dna-name{font-size:13px;font-weight:700;color:#2f4659}.bar{height:8px;background:#e7edf1;border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0d9488,#22c55e)}.score{font-weight:900;color:var(--navy);text-align:right}.trend{font-size:11px;font-weight:800;text-align:right}.trend.improving{color:var(--green)}.trend.declining{color:var(--red)}.trend.stable{color:var(--muted)}
.chat-shell{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden}.chat-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;align-items:center}.chat-head h2{font-size:17px;color:var(--navy);margin:0}.chat-head p{font-size:12px;color:var(--muted);margin:4px 0 0}.chat-body{height:430px;overflow:auto;padding:18px;background:#f6f9fa}.msg{max-width:78%;padding:12px 14px;border-radius:14px;margin-bottom:10px;font-size:14px;line-height:1.5;white-space:pre-wrap}.msg.ai{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}.msg.me{background:var(--navy);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.msg .who{font-size:10px;font-weight:900;opacity:.6;text-transform:uppercase;margin-bottom:4px}.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff}.chat-input input{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 13px;outline:none}.chat-input input:focus{border-color:var(--teal)}.chat-actions{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--border);background:#fbfcfd}.quiet{font-size:11px;color:var(--muted)}
.result-score{font-size:54px;font-weight:900;color:var(--navy);letter-spacing:-2px}.result-score small{font-size:18px;color:var(--muted);letter-spacing:0}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.callout{border-radius:12px;padding:15px;background:#f6f9fa;border:1px solid var(--border)}.callout strong{display:block;font-size:12px;color:var(--navy);margin-bottom:5px}.callout p,.callout li{font-size:13px;line-height:1.5;color:#3f5668}.callout ul{padding-left:18px;margin:6px 0}.secret{background:#fff8e9;border-color:#f2d39a}.good{background:#edf9f3;border-color:#b5e2cd}.bad{background:#fff1f1;border-color:#f0c1c1}.next{background:#eef7ff;border-color:#c8def3}.login{max-width:390px;margin:10vh auto;background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}.login h1{color:var(--navy);margin:0 0 6px}.login p{color:var(--muted);font-size:13px}.login input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;margin:7px 0}.error{color:var(--red);font-size:12px;margin:8px 0}.loading{text-align:center;padding:50px;color:var(--muted)}.spinner{width:30px;height:30px;border:3px solid #d7e4e7;border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.span4,.span5,.span7,.span8{grid-column:span 12}.mode-grid{grid-template-columns:1fr}.hero{display:block}.hero .pill{margin-top:12px}.dna-row{grid-template-columns:125px 1fr 44px}.trend{display:none}.chat-body{height:55vh}.result-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login hidden">
  <h1>Performance Arena</h1><p>Sign in with your ApplianceIQ Academy account.</p>
  <div id="loginError" class="error"></div>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button>
</div>
<div id="app" class="hidden">
  <div class="top"><div class="brand">Appliance<span>IQ</span> · Performance Brain</div><div style="display:flex;gap:16px;align-items:center"><a href="./index.html">← Academy</a><a href="#" onclick="logout();return false">Sign out</a></div></div>
  <div class="wrap">
    <div class="hero"><div><h1>Performance Arena</h1><p>Adaptive sales practice that changes based on what you actually need to improve.</p></div><span class="pill" id="orgPill">Performance Brain V2</span></div>
    <div class="tabs"><button class="tab active" data-tab="arena" onclick="showTab('arena')">Beat the Bot</button><button class="tab" data-tab="dna" onclick="showTab('dna')">Sales DNA</button></div>
    <div id="arenaView"></div><div id="dnaView" class="hidden"></div>
  </div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';
const sb=createClient(SB_URL,SB_KEY); window.sb=sb;
const state={user:null,org:null,skills:[],next:null,mode:'you_sell',session:null,scenario:null,messages:[],busy:false,result:null};
const labels={discovery:'Discovery',product_knowledge:'Product Knowledge',recommendation:'Recommendation Quality',value_building:'Value Building',objection_handling:'Objection Handling',closing:'Closing',attachment:'Attachment Selling',communication:'Communication',trust:'Trust & Credibility',process_discipline:'Process Discipline'};
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
function scoreColor(n){return n>=80?'var(--green)':n>=65?'var(--amber)':'var(--red)'}
function trendIcon(t){return t==='improving'?'↑':t==='declining'?'↓':'→'}
window.login=async()=>{const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;document.getElementById('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('loginError').textContent=error.message;return}await boot()};
window.logout=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('loginView').classList.remove('hidden');return}state.user=session.user;const {data:members,error}=await sb.from('organization_members').select('organization_id,role,status').eq('user_id',state.user.id).eq('status','active').limit(10);if(error||!members?.length){document.getElementById('loginView').classList.remove('hidden');document.getElementById('loginError').textContent='No active organization membership found.';return}const orgId=members[0].organization_id;const {data:org}=await sb.from('organizations').select('id,name').eq('id',orgId).single();state.org=org;document.getElementById('loginView').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('orgPill').textContent=(org?.name||'Organization')+' · Performance Brain';await refreshPerformance();renderArena();renderDna()}
async function refreshPerformance(){const {data:rows}=await sb.from('performance_skill_state').select('competency_id,rolling_score,confidence,sample_size,trend,last_observed_at').eq('organization_id',state.org.id).eq('user_id',state.user.id);const ids=(rows||[]).map(r=>r.competency_id);let comps=[];if(ids.length){const r=await sb.from('performance_competencies').select('id,code,name,category').in('id',ids);comps=r.data||[]}const map=new Map(comps.map(c=>[c.id,c]));state.skills=(rows||[]).map(r=>({...r,code:map.get(r.competency_id)?.code||'',name:map.get(r.competency_id)?.name||'Competency'})).sort((a,b)=>Number(a.rolling_score)-Number(b.rolling_score));const next=await sb.rpc('performance_get_next_scenario',{p_organization_id:state.org.id,p_user_id:state.user.id});state.next=next.data?.[0]||null}
window.showTab=(name)=>{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.getElementById('arenaView').classList.toggle('hidden',name!=='arena');document.getElementById('dnaView').classList.toggle('hidden',name!=='dna');if(name==='dna')renderDna()};
window.selectMode=(m)=>{if(state.session)return;state.mode=m;renderArena()};
function modeCard(m,ico,title,desc){return `<button class="mode ${state.mode===m?'active':''}" onclick="selectMode('${m}')"><div class="ico">${ico}</div><h3>${title}</h3><p>${desc}</p></button>`}
function difficultyDots(n){let s='';for(let i=1;i<=10;i++)s+=`<span class="dot ${i<=Number(n||0)?'on':''}"></span>`;return s}
function renderArena(){const el=document.getElementById('arenaView');if(state.result){renderResult(el);return}if(state.session){renderChat(el);return}const n=state.next;el.innerHTML=`<div class="grid"><div class="card span7"><h2 class="section-title">Choose training mode</h2><div class="mode-grid">${modeCard('you_sell','🛒','You Sell','The AI is the customer. Your behaviour is scored and added to Sales DNA.')}${modeCard('bot_sells','👔','Bot Sells','Act as the customer and study an expert sales demonstration.')}${modeCard('beat_the_expert','⚔️','Beat the Expert','Sell the same scenario, then compare your approach with an expert version.')}</div><div style="margin-top:16px"><button class="primary" onclick="startAdaptive()">Start adaptive challenge</button></div></div><div class="span5">${n?`<div class="prescription"><div class="kicker">AI prescription</div><h2>${esc(n.title)}</h2><p>${esc(n.reason)}</p><div class="difficulty">${difficultyDots(n.difficulty)}</div><div style="font-size:11px;margin-top:7px;color:#bcd1df">Difficulty ${n.difficulty}/10 · Target: ${esc(n.target_competency_name||n.target_competency_code)}</div></div>`:`<div class="card"><div class="loading">No prescription available yet.</div></div>`}</div><div class="card span12"><h2 class="section-title">How scoring works</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${Object.values(labels).map(x=>`<div style="background:var(--soft);border-radius:9px;padding:10px;font-size:12px;font-weight:700;color:#42596c">${esc(x)}</div>`).join('')}</div><p class="sub" style="margin-top:12px">Scores are hidden during the roleplay so you sell the customer, not the rubric. After the session, the Performance Brain updates your rolling skill profile and prescribes the next challenge.</p></div></div>`}
window.startAdaptive=async()=>{if(state.busy)return;state.busy=true;const el=document.getElementById('arenaView');el.innerHTML='<div class="card"><div class="loading"><div class="spinner"></div>Building your adaptive customer…</div></div>';try{const {data,error}=await sb.rpc('performance_start_adaptive_roleplay',{p_organization_id:state.org.id,p_mode:state.mode});if(error)throw error;const row=data?.[0];if(!row)throw new Error('No adaptive scenario returned');state.session=row.roleplay_session_id;state.scenario=row;const opening=await edge({action:'opening',session_id:state.session});state.messages=[{role:'ai',content:opening.customer_response||'Hi, I need some help.'}];renderChat(el)}catch(e){state.session=null;el.innerHTML=`<div class="card"><div class="error">${esc(e.message||e)}</div><button class="secondary" onclick="renderArena()">Back</button></div>`}finally{state.busy=false}};
async function edge(payload){const {data:{session}}=await sb.auth.getSession();const r=await fetch(SB_URL+'/functions/v1/performance-roleplay',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||'Roleplay request failed');return d}
function renderChat(el=document.getElementById('arenaView')){const s=state.scenario||{};const aiName=state.mode==='bot_sells'?'AI Sales Expert':'Customer';el.innerHTML=`<div class="chat-shell"><div class="chat-head"><div><h2>${esc(s.title||'Adaptive Roleplay')}</h2><p>Difficulty ${esc(s.difficulty||'')} / 10 · ${state.mode==='you_sell'?'You are the salesperson':state.mode==='bot_sells'?'You are the customer':'You sell, then compare with the expert'}</p></div><span class="pill">${esc((s.target_competency_code||'adaptive').replaceAll('_',' '))}</span></div><div class="chat-body" id="chatBody">${state.messages.map(m=>`<div class="msg ${m.role==='me'?'me':'ai'}"><div class="who">${m.role==='me'?'You':aiName}</div>${esc(m.content)}</div>`).join('')}${state.busy?'<div class="msg ai"><div class="who">AI</div>Thinking…</div>':''}</div><div class="chat-input"><input id="chatInput" placeholder="Type your response…" onkeydown="if(event.key==='Enter')sendMessage()" ${state.busy?'disabled':''}><button class="primary" onclick="sendMessage()" ${state.busy?'disabled':''}>Send</button></div><div class="chat-actions"><span class="quiet">Scoring stays hidden until the end of the interaction.</span><button class="danger" onclick="finishRoleplay()" ${state.busy?'disabled':''}>End & score</button></div></div>`;setTimeout(()=>{const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight;document.getElementById('chatInput')?.focus()},0)}
window.sendMessage=async()=>{const input=document.getElementById('chatInput'),msg=input?.value.trim();if(!msg||state.busy)return;state.messages.push({role:'me',content:msg});state.busy=true;renderChat();try{const d=await edge({action:'message',session_id:state.session,message:msg});state.messages.push({role:'ai',content:d.response||d.customer_response||'Tell me more.'})}catch(e){state.messages.push({role:'ai',content:'Connection error: '+(e.message||e)})}finally{state.busy=false;renderChat()}};
window.finishRoleplay=async()=>{if(state.busy)return;state.busy=true;const el=document.getElementById('arenaView');el.innerHTML='<div class="card"><div class="loading"><div class="spinner"></div>Performance Brain is scoring the interaction…</div></div>';try{state.result=await edge({action:'end',session_id:state.session});state.session=null;await refreshPerformance();renderResult(el);renderDna()}catch(e){state.busy=false;el.innerHTML=`<div class="card"><div class="error">${esc(e.message||e)}</div><button class="secondary" onclick="renderArena()">Return</button></div>`}finally{state.busy=false}};
function renderResult(el){const r=state.result;if(r.mode==='bot_sells'){const l=r.learning_summary||{};el.innerHTML=`<div class="grid"><div class="card span12"><span class="pill">Expert demonstration</span><h2 class="section-title" style="margin-top:12px">What to copy</h2><p style="color:#3f5668;line-height:1.6">${esc(l.summary||'Demonstration complete.')}</p><div class="result-grid"><div class="callout good"><strong>Techniques</strong><ul>${(l.techniques||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="callout"><strong>Turning points</strong><ul>${(l.turning_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><button class="primary" style="margin-top:14px" onclick="resetArena()">Start another</button></div></div>`;return}const scores=r.scores||{},c=r.coach_summary||{},next=r.next_prescription;el.innerHTML=`<div class="grid"><div class="card span4"><div class="kicker">Session score</div><div class="result-score">${Math.round(Number(r.session_score||0))}<small>/100</small></div><p class="sub">${esc(r.feedback||'')}</p></div><div class="card span8"><h2 class="section-title">Competency scorecard</h2>${Object.entries(labels).map(([k,v])=>{const n=Number(scores[k]||0);return `<div class="dna-row"><div class="dna-name">${esc(v)}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,n))}%;background:${scoreColor(n)}"></div></div><div class="score" style="color:${scoreColor(n)}">${Math.round(n)}</div><div></div></div>`}).join('')}</div><div class="card span12"><div class="result-grid"><div class="callout good"><strong>Strongest moment</strong><p>${esc(c.strongest_moment||'Not enough evidence yet.')}</p></div><div class="callout bad"><strong>Biggest coaching opportunity</strong><p>${esc(c.weakest_moment||'Not enough evidence yet.')}</p></div><div class="callout"><strong>Missed opportunities</strong><ul>${(c.missed_opportunities||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="callout secret"><strong>What the customer knew that you could not see</strong><ul>${arr(c.customer_secrets).map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul></div>${c.expert_comparison?`<div class="callout"><strong>Expert comparison</strong><p><b>Expert approach:</b> ${esc(c.expert_comparison.expert_approach||'')}</p><p><b>Biggest gap:</b> ${esc(c.expert_comparison.biggest_gap||'')}</p></div>`:''}<div class="callout next"><strong>Next prescription</strong><p>${next?`${esc(next.title)} · Difficulty ${esc(next.difficulty)}<br>${esc(next.reason)}`:esc(c.recommended_next_action||'Continue adaptive practice.')}</p></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" onclick="resetArena()">Start next challenge</button><button class="secondary" onclick="showTab('dna')">View Sales DNA</button></div></div></div>`}
function arr(v){if(Array.isArray(v))return v;if(v&&typeof v==='object')return Object.entries(v).map(([k,x])=>k.replaceAll('_',' ')+': '+String(x));return v?[String(v)]:[]}
window.resetArena=()=>{state.result=null;state.session=null;state.scenario=null;state.messages=[];renderArena()};
function renderDna(){const el=document.getElementById('dnaView');if(!state.skills.length){el.innerHTML='<div class="card"><h2 class="section-title">Sales DNA</h2><p class="sub">Complete adaptive roleplays to establish your competency profile.</p></div>';return}const avg=state.skills.reduce((a,b)=>a+Number(b.rolling_score),0)/state.skills.length,weak=state.skills[0],strong=state.skills[state.skills.length-1];el.innerHTML=`<div class="grid"><div class="card span4"><div class="kicker">Overall Sales DNA</div><div class="big">${Math.round(avg)}</div><div class="sub">Across ${state.skills.length} measured competencies</div></div><div class="card span4"><div class="kicker">Strongest</div><div class="big" style="font-size:25px;color:var(--green)">${esc(strong.name)}</div><div class="sub">${Math.round(Number(strong.rolling_score))}/100 · ${esc(strong.trend)}</div></div><div class="card span4"><div class="kicker">Priority</div><div class="big" style="font-size:25px;color:${scoreColor(Number(weak.rolling_score))}">${esc(weak.name)}</div><div class="sub">${Math.round(Number(weak.rolling_score))}/100 · ${esc(weak.trend)}</div></div><div class="card span8"><h2 class="section-title">Competency profile</h2>${state.skills.map(s=>`<div class="dna-row"><div class="dna-name">${esc(s.name)}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(s.rolling_score)))}%"></div></div><div class="score">${Math.round(Number(s.rolling_score))}</div><div class="trend ${esc(s.trend)}">${trendIcon(s.trend)} ${esc(s.trend)}</div></div>`).join('')}</div><div class="card span4"><h2 class="section-title">Evidence quality</h2>${state.skills.slice().sort((a,b)=>Number(b.confidence)-Number(a.confidence)).slice(0,6).map(s=>`<div style="padding:9px 0;border-bottom:1px solid #edf1f3"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(s.name)}</b><span>${Math.round(Number(s.confidence)*100)}%</span></div><div class="sub">${s.sample_size} observation${Number(s.sample_size)===1?'':'s'}</div></div>`).join('')}</div></div>`}
boot();
</script>
</body>
</html>
