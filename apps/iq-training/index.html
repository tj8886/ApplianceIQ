<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Training System — ApplianceIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f5f7;--surface:#ffffff;--surface2:#f5f8fa;--surface3:#e8eef2;
  --border:#d0dbe3;--text:#1a2b3c;--text2:#4a6275;--text3:#8899a8;
  --accent:#0d9488;--accent2:#14b8a6;--accent-glow:rgba(13,148,136,.08);
  --navy:#1e3a5f;--navy-light:#2c5282;
  --green:#059669;--orange:#d97706;--red:#dc2626;--cyan:#0891b2;
  --gold:#d97706;--silver:#64748b;--bronze:#b45309;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
html{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f0f5f7 0%,#e0eff5 50%,#d5eaef 100%)}
.login-box{width:100%;max-width:380px;padding:40px 32px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(30,58,95,.08)}
.login-box h1{font-size:24px;font-weight:800;margin-bottom:4px;color:var(--navy)}
.login-box p{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.login-box input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:14px;margin-bottom:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.login-box button:hover{background:var(--accent2);transform:translateY(-1px)}
.login-box .error{color:var(--red);font-size:12px;margin-bottom:12px;display:none}

#app{min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{font-size:16px;font-weight:800;color:var(--navy)}
.topbar-breadcrumb{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px}
.topbar-breadcrumb span{cursor:pointer;transition:color .2s}
.topbar-breadcrumb span:hover{color:var(--accent)}
.topbar-breadcrumb .sep{color:var(--text3);font-size:11px}
.topbar-right{display:flex;align-items:center;gap:12px}
.notif-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;color:var(--text2);font-size:16px;transition:all .2s}
.notif-btn:hover{background:var(--surface3);color:var(--text)}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .2s}
.user-btn:hover{background:var(--surface3);color:var(--text)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -1px 3px rgba(30,58,95,.04)}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;transition:color .2s}
.bnav-item.active{color:var(--accent)}
.bnav-item span{font-size:20px}

.main{max-width:1200px;margin:0 auto;padding:20px}

.dash-header{margin-bottom:24px}
.dash-header h2{font-size:28px;font-weight:800;color:var(--navy);margin-bottom:4px}
.dash-header p{color:var(--text2);font-size:14px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.stat-card .label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:800;color:var(--navy)}
.stat-card .sub{font-size:12px;color:var(--text3);margin-top:4px}
.stat-card.accent .value{color:var(--accent)}
.stat-card.green .value{color:var(--green)}
.stat-card.gold .value{color:var(--gold)}

.zone-map{display:flex;gap:12px;margin-bottom:28px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.zone-card{flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.zone-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(13,148,136,.1)}
.zone-card.locked{opacity:.5;cursor:default}
.zone-card.locked:hover{border-color:var(--border);transform:none;box-shadow:none}
.zone-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(13,148,136,.12)}
.zone-card .zone-num{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.zone-card h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.zone-card .zone-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.zone-card .zone-progress{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.zone-card .zone-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .5s}
.zone-card .zone-pct{font-size:11px;color:var(--text3);margin-top:6px;font-weight:600}
.zone-card .lock-icon{position:absolute;top:12px;right:12px;font-size:16px;color:var(--text3)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:18px;font-weight:700;color:var(--navy)}
.section-header .see-all{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}

.lanes-container{display:grid;gap:16px;margin-bottom:28px}
.lane-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.lane-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(13,148,136,.08)}
.lane-tag{display:inline-block;padding:3px 8px;background:var(--accent-glow);color:var(--accent);font-size:11px;font-weight:600;border-radius:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.lane-card h4{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.lane-card .lane-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.lane-progress{display:flex;align-items:center;gap:10px}
.lane-progress-bar{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.lane-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .5s}
.lane-progress-text{font-size:12px;font-weight:600;color:var(--text2);min-width:40px;text-align:right}

.deck-list{display:grid;gap:10px;margin-bottom:24px}
.deck-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.deck-row:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(13,148,136,.08)}
.deck-row.completed{border-left:3px solid var(--green)}
.deck-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface3);border-radius:50%;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0}
.deck-row.completed .deck-num{background:rgba(5,150,105,.1);color:var(--green)}
.deck-info{flex:1;min-width:0}
.deck-info h5{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-info p{font-size:12px;color:var(--text2)}
.deck-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);flex-shrink:0}

#card-player{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border)}
.player-header .back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);cursor:pointer;font-size:14px;font-weight:500;transition:color .2s}
.player-header .back-btn:hover{color:var(--accent)}
.player-header .deck-title{font-size:14px;font-weight:600;color:var(--navy);text-align:center;flex:1}
.player-header .card-counter{font-size:13px;color:var(--text2);font-weight:600}
.player-progress{height:3px;background:var(--surface3)}
.player-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s}
.card-stage{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 120px);padding:20px}
.card-container{width:100%;max-width:560px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 4px 16px rgba(30,58,95,.06)}
.card-type-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.card-type-badge.fact{background:rgba(8,145,178,.1);color:var(--cyan)}
.card-type-badge.script{background:rgba(217,119,6,.1);color:var(--gold)}
.card-type-badge.demo{background:rgba(126,34,206,.1);color:#7e22ce}
.card-type-badge.versus{background:rgba(220,38,38,.1);color:var(--red)}
.card-type-badge.scenario{background:rgba(5,150,105,.1);color:var(--green)}
.card-type-badge.quiz{background:rgba(13,148,136,.1);color:var(--accent)}
.coach-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface2);border-radius:4px;font-size:11px;font-weight:600;color:var(--text2);margin-left:8px}
.card-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:16px;line-height:1.3}
.card-front{font-size:15px;line-height:1.7;color:var(--text);white-space:pre-line}
.card-back{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--text2);white-space:pre-line;display:none}
.card-back.show{display:block}
.reveal-btn{display:block;width:100%;padding:12px;margin-top:16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.reveal-btn:hover{background:var(--surface3);color:var(--accent)}
.quiz-options{display:grid;gap:8px;margin-top:16px}
.quiz-opt{padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;font-size:14px;line-height:1.5;transition:all .2s;color:var(--text)}
.quiz-opt:hover{border-color:var(--accent);background:var(--accent-glow)}
.quiz-opt.correct{border-color:var(--green);background:rgba(5,150,105,.08);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(220,38,38,.08);color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.player-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-top:20px}
.player-nav button{padding:10px 24px;border-radius:var(--radius-xs);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.player-nav .prev-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.player-nav .prev-btn:hover{background:var(--surface3);color:var(--text)}
.player-nav .next-btn{background:var(--accent);color:#fff}
.player-nav .next-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.player-nav .next-btn.finish{background:var(--green)}

#notif-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:#fff;border-left:1px solid var(--border);z-index:150;overflow-y:auto;box-shadow:-4px 0 16px rgba(30,58,95,.08)}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.notif-header h3{font-size:16px;font-weight:700;color:var(--navy)}
.notif-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;border-radius:var(--radius-xs);transition:all .2s}
.notif-close:hover{background:var(--surface2);color:var(--text)}
.notif-list{padding:12px}
.notif-item{display:flex;gap:10px;padding:12px;border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;transition:background .2s}
.notif-item:hover{background:var(--surface2)}
.notif-item.unread{background:var(--accent-glow)}
.notif-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.notif-content h5{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px}
.notif-content p{font-size:12px;color:var(--text2);line-height:1.4}
.notif-content .notif-time{font-size:11px;color:var(--text3);margin-top:4px}

.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.badge-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.badge-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.badge-card.earned{border-color:var(--gold);box-shadow:0 2px 8px rgba(217,119,6,.1)}
.badge-card.locked{opacity:.4}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-card h5{font-size:12px;font-weight:600;color:var(--navy);line-height:1.3}

.brand-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.brand-filter{padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s}
.brand-filter.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.brand-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.brand-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,148,136,.08)}
.brand-card h4{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px}
.brand-card .brand-tier{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.brand-card .brand-tier.entry{color:var(--text3)}
.brand-card .brand-tier.mid{color:var(--cyan)}
.brand-card .brand-tier.luxury{color:var(--gold)}
.brand-card .brand-tier.ultra_luxury{color:#7e22ce}
.brand-card .brand-parent{font-size:12px;color:var(--text3)}

/* ── LIVE PRACTICE SCORER ── */
.recorder-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.recorder-header{padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#f0fdf9,#ecfeff)}
.recorder-header h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:4px}
.recorder-header p{font-size:13px;color:var(--text2)}
.recorder-body{padding:24px}
.rec-status{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--text3);flex-shrink:0}
.rec-dot.recording{background:#dc2626;animation:pulse 1s infinite}
.rec-dot.done{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rec-status-text{font-size:15px;font-weight:600;color:var(--navy)}
.rec-timer{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--text2)}
.rec-controls{display:flex;gap:12px;margin-bottom:20px}
.rec-btn{padding:12px 28px;border-radius:var(--radius-xs);font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
.rec-btn.start{background:var(--accent);color:#fff}
.rec-btn.start:hover{background:var(--accent2);transform:translateY(-1px)}
.rec-btn.stop{background:#dc2626;color:#fff}
.rec-btn.stop:hover{background:#b91c1c}
.rec-btn.score{background:var(--navy);color:#fff}
.rec-btn.score:hover{background:var(--navy-light);transform:translateY(-1px)}
.rec-btn:disabled{opacity:.4;cursor:default;transform:none}
.transcript-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;max-height:300px;overflow-y:auto;margin-bottom:16px;font-size:13px;line-height:1.7;color:var(--text)}
.transcript-box .turn{margin-bottom:8px;padding:8px 12px;border-radius:8px}
.transcript-box .turn.rep{background:rgba(13,148,136,.06);border-left:3px solid var(--accent)}
.transcript-box .turn.cust{background:rgba(30,58,95,.04);border-left:3px solid var(--navy)}
.turn-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.turn-label.rep{color:var(--accent)}
.turn-label.cust{color:var(--navy)}
.role-toggle{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;width:fit-content}
.role-toggle button{padding:8px 20px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--surface2);color:var(--text2)}
.role-toggle button.active-rep{background:var(--accent);color:#fff}
.role-toggle button.active-cust{background:var(--navy);color:#fff}
.scorecard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:24px}
.scorecard-header{padding:20px 24px;background:linear-gradient(135deg,var(--navy),#2c5282);color:#fff}
.scorecard-header h3{font-size:20px;font-weight:800;margin-bottom:4px}
.scorecard-header .total-score{font-size:48px;font-weight:900;margin-top:8px}
.score-row{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-row .score-label{flex:1;font-size:14px;font-weight:600;color:var(--navy)}
.score-row .score-bar{flex:2;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;margin:0 16px}
.score-row .score-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.score-row .score-val{font-size:16px;font-weight:800;min-width:40px;text-align:right}
.score-feedback{padding:16px 24px;font-size:13px;line-height:1.6;color:var(--text2);border-top:1px solid var(--border);background:var(--surface2)}

/* ── ROLEPLAY / AI COACH ── */
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.coach-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.coach-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 20px rgba(13,148,136,.12)}
.coach-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.coach-avatar{font-size:40px;margin-bottom:8px}
.coach-card h4{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px}
.coach-card p{font-size:11px;color:var(--text2);line-height:1.4}
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 160px);background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.chat-header-avatar{font-size:28px}
.chat-header-info h4{font-size:15px;font-weight:700;color:var(--navy)}
.chat-header-info p{font-size:12px;color:var(--text2)}
.chat-header .chat-close{margin-left:auto;cursor:pointer;color:var(--text3);font-size:18px;padding:4px 8px;border-radius:4px;transition:all .2s}
.chat-header .chat-close:hover{background:var(--surface3);color:var(--text)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6;animation:fadeIn .3s ease}
.chat-msg.coach{background:var(--surface2);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-msg.coach .msg-name{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}
.chat-msg.typing{color:var(--text3);font-style:italic}
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface2)}
.chat-input-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border .2s}
.chat-input-bar input:focus{border-color:var(--accent)}
.chat-input-bar button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.chat-input-bar button:hover{background:var(--accent2)}
.chat-input-bar button:disabled{opacity:.5;cursor:default}
.topic-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.topic-pill{padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s}
.topic-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

@media(max-width:768px){
  .dash-grid{grid-template-columns:1fr}
  .zone-map{flex-direction:column}
  .zone-card{flex:none;width:100%}
  .main{padding:16px}
  .topbar{padding:10px 16px}
  .bottom-nav{display:block}
  .brand-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .badges-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  #notif-panel{width:100%}
  body{padding-bottom:64px}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.slide-in{animation:slideIn .25s ease}
.loading-spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <h1>IQ Training</h1>
    <p>ApplianceIQ Intelligence Group</p>
    <div class="error" id="login-error"></div>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="your@email.com" value="">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="••••••••" value="">
    <button onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app" class="hidden">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">IQ Training</div>
      <div class="topbar-breadcrumb" id="breadcrumb"></div>
    </div>
    <div class="topbar-right">
      <div class="notif-btn" onclick="toggleNotifs()">🔔<div class="notif-badge hidden" id="notif-count">0</div></div>
      <div class="user-btn" id="user-btn" onclick="doLogout()">Sign Out</div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main" id="main-content"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="bottom-nav-inner">
      <div class="bnav-item active" onclick="navTo('dashboard')"><span>🏠</span>Home</div>
      <div class="bnav-item" onclick="navTo('roleplay')"><span>🎤</span>Coach</div>
      <div class="bnav-item" onclick="navTo('brands')"><span>🏷️</span>Brands</div>
      <div class="bnav-item" onclick="navTo('badges')"><span>🏅</span>Badges</div>
    </div>
  </div>
</div>

<!-- Card Player (overlay) -->
<div id="card-player"></div>

<!-- Notifications Panel -->
<div id="notif-panel">
  <div class="notif-header">
    <h3>Notifications</h3>
    <div class="notif-close" onclick="toggleNotifs()">✕</div>
  </div>
  <div class="notif-list" id="notif-list"></div>
</div>

<!-- SCRIPTS -->
<script>
// ── GLOBAL NAV (must be in regular script, not module) ──
let currentView = 'dashboard';
let currentZone = null;
let currentLane = null;
let currentDeck = null;
let viewHistory = [];

function navTo(view, data) {
  if (currentView !== view) viewHistory.push({ view: currentView, zone: currentZone, lane: currentLane });
  currentView = view;
  if (data) {
    if (data.zone !== undefined) currentZone = data.zone;
    if (data.lane !== undefined) currentLane = data.lane;
    if (data.deck !== undefined) currentDeck = data.deck;
  }
  renderView();
  updateBnav();
}

function goBack() {
  const prev = viewHistory.pop();
  if (prev) {
    currentView = prev.view;
    currentZone = prev.zone;
    currentLane = prev.lane;
    renderView();
    updateBnav();
  }
}

function updateBnav() {
  document.querySelectorAll('.bnav-item').forEach((el, i) => {
    const tabs = ['dashboard','roleplay','brands','badges'];
    el.classList.toggle('active', tabs[i] === currentView);
  });
}

function toggleNotifs() {
  const p = document.getElementById('notif-panel');
  if (p.style.display === 'block') { p.style.display = 'none'; }
  else { p.style.display = 'block'; p.classList.add('slide-in'); loadNotifications(); }
}

function doLogout() {
  if (window._supabase) window._supabase.auth.signOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').style.display = 'flex';
}
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';
const sb = createClient(SB_URL, SB_KEY);
window._supabase = sb;

// ── STATE ──
let S = {
  user: null,
  zones: [],
  lanes: [],
  courses: [],
  decks: [],
  cards: [],
  badges: [],
  earnedBadges: [],
  notifications: [],
  productCards: [],
  completedDecks: new Set(),
  completedCards: new Set(),
  repProgress: {}
};

// ── PILLAR CONSTANTS ──
var pillarLabels = { sales_iq:'Sales IQ', product_iq:'Product IQ', brand_iq:'Brand IQ', leadership_iq:'Leadership IQ' };
var pillarIcons = { sales_iq:'💰', product_iq:'🔧', brand_iq:'🏷️', leadership_iq:'👑' };
var pillarColors = { sales_iq:'#6366f1', product_iq:'#06b6d4', brand_iq:'#f59e0b', leadership_iq:'#a855f7' };
var pillarDescs = {
  sales_iq:'The complete selling system. Scripts, objection handling, closing techniques, and the psychology of the sale.',
  product_iq:'Category-by-category product mastery. Specs that sell, features that matter, and competitive cross-references.',
  brand_iq:'Know every brand on your floor. 156 brands, each with PIM-linked product data, story, tier, and positioning.',
  leadership_iq:'From seller to leader. Hiring, coaching, training systems, P&L, metrics, and culture building.'
};

// ── AUTH ──
window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  S.user = data.user;
  await initApp();
};

// Check existing session
const { data: { session } } = await sb.auth.getSession();
if (session) {
  S.user = session.user;
  await initApp();
}

async function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  try {
    await Promise.all([loadZones(), loadCourses(), loadBadgesData(), loadNotifications()]);
    console.log('Data loaded:', S.zones.length, 'zones,', S.courses.length, 'courses,', S.badges.length, 'badges,', S.notifications.length, 'notifs');
  } catch(e) { console.error('Init error:', e); }
  renderView();
}

// ── DATA LOADERS ──
async function loadZones() {
  const { data } = await sb.from('iq_zones').select('*').order('zone_number');
  S.zones = data || [];
  const { data: lanes } = await sb.from('iq_lanes').select('*').order('zone_id').order('sort_order');
  S.lanes = lanes || [];
}

async function loadCourses() {
  const { data } = await sb.from('iq_courses').select('id,pillar,course_key,name,subtitle,icon,brand_id,zone_level,category,sort_order').order('pillar').order('sort_order');
  S.courses = data || [];
}

async function loadDecksForLane(laneId) {
  const { data } = await sb.from('iq_decks').select('*').eq('lane_id', laneId).order('sort_order');
  S.decks = data || [];
}

async function loadCardsForDeck(deckId) {
  const { data } = await sb.from('iq_cards').select('*').eq('deck_id', deckId).order('sort_order');
  S.cards = data || [];
}

async function loadBadgesData() {
  const { data } = await sb.from('iq_badges').select('id,badge_key,badge_type,name,description,icon,color,pillar,brand_id,course_id').order('badge_type').order('sort_order');
  S.badges = data || [];
}

async function loadNotifications() {
  const { data } = await sb.from('iq_notifications').select('*').order('created_at', { ascending: false }).limit(30);
  S.notifications = data || [];
  renderNotifPanel();
  const unread = (data || []).filter(n => !n.is_read).length;
  const badge = document.getElementById('notif-count');
  if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}
window.loadNotifications = loadNotifications;

async function loadBrandProducts(brandId) {
  const { data } = await sb.from('iq_product_cards').select('*').eq('brand_id', brandId).order('card_type').order('title');
  return data || [];
}

// ── RENDERERS ──
function renderView() {
  const mc = document.getElementById('main-content');
  const bc = document.getElementById('breadcrumb');
  switch(currentView) {
    case 'dashboard': renderDashboard(mc); bc.innerHTML = ''; break;
    case 'pillar': renderPillar(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], [pillarLabels[currentDeck] || currentDeck]); break;
    case 'roleplay': renderRoleplay(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], ['AI Coach']); break;
    case 'zone': renderZone(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], [S.zones.find(z=>z.id===currentZone)?.name]); break;
    case 'lane': renderLane(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], [S.zones.find(z=>z.id===currentZone)?.name,'zone',{zone:currentZone}], [S.lanes.find(l=>l.id===currentLane)?.name]); break;
    case 'brands': renderBrands(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], ['Brand IQ']); break;
    case 'badges': renderBadges(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], ['Badges']); break;
    case 'notifications': renderNotifPage(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], ['Notifications']); break;
    case 'brand-detail': renderBrandDetail(mc); bc.innerHTML = crumb(['Dashboard','dashboard'], ['Brand IQ','brands'], [currentDeck?.name || 'Brand']); break;
  }
  mc.classList.add('fade-in');
  setTimeout(() => mc.classList.remove('fade-in'), 300);
};

window.renderView = renderView;

function crumb(...parts) {
  return parts.map((p, i) => {
    if (p.length === 1) return '<span>' + esc(p[0]) + '</span>';
    if (p.length === 2) return '<span onclick="navTo(\'' + p[1] + '\')">' + esc(p[0]) + '</span>';
    if (p.length === 3) return '<span onclick="navTo(\'' + p[1] + '\',' + JSON.stringify(p[2]) + ')">' + esc(p[0]) + '</span>';
    return '';
  }).join('<span class="sep">›</span>');
}

function renderDashboard(el) {
  var totalCards = 307;
  var pillars = ['sales_iq','product_iq','brand_iq','leadership_iq'];
  var pillarCounts = {};
  pillars.forEach(function(p) { pillarCounts[p] = S.courses.filter(function(c) { return c.pillar === p; }).length; });

  var pillarHtml = pillars.map(function(p) {
    var count = pillarCounts[p];
    var col = pillarColors[p];
    var clickAction = p === 'brand_iq' ? "navTo('brands')" : "navTo('pillar',{deck:'" + p + "'})";
    return '<div class="zone-card" style="border-top:3px solid ' + col + '" onclick="' + clickAction + '">'
      + '<div style="font-size:28px;margin-bottom:8px">' + pillarIcons[p] + '</div>'
      + '<h3>' + pillarLabels[p] + '</h3>'
      + '<div class="zone-desc">' + pillarDescs[p] + '</div>'
      + '<div style="margin-top:12px;font-size:13px;font-weight:600;color:' + col + '">' + count + ' courses</div>'
      + '</div>';
  }).join('');

  var zoneHtml = S.zones.map(function(z) {
    var isLocked = z.zone_number > 2;
    var isCurrent = z.zone_number <= 2;
    var pct = z.zone_number === 1 ? 100 : (z.zone_number === 2 ? 15 : 0);
    var descs = ['Days 1-14: Culture, floor basics, vocabulary','Weeks 3-10: Sales process, product deep dive, brands, competitive','Months 4-8: Advanced selling, specialization prep','Months 9-18: Category or brand mastery','Month 18+: Leadership, mentoring, continuous growth'];
    return '<div class="zone-card ' + (isLocked?'locked':'') + (isCurrent&&z.zone_number===2?' current':'') + '" onclick="' + (isLocked?'':'navTo(\'zone\',{zone:'+z.id+'})') + '">'
      + (isLocked?'<div class="lock-icon">🔒</div>':'')
      + '<div class="zone-num">Zone ' + z.zone_number + '</div>'
      + '<h3>' + esc(z.name) + '</h3>'
      + '<div class="zone-desc">' + descs[z.zone_number-1] + '</div>'
      + '<div class="zone-progress"><div class="zone-progress-fill" style="width:'+pct+'%"></div></div>'
      + '<div class="zone-pct">' + pct + '% complete</div>'
      + '</div>';
  }).join('');

  var recentNotifs = S.notifications.slice(0, 5).map(function(n) {
    return '<div class="notif-item ' + (!n.is_read?'unread':'') + '">'
    + '<div class="notif-icon">' + (n.icon||'📢') + '</div>'
    + '<div class="notif-content"><h5>' + esc(n.title) + '</h5><p>' + esc(n.body||'') + '</p><div class="notif-time">' + timeAgo(n.created_at) + '</div></div></div>';
  }).join('') || '<p style="color:var(--text3);text-align:center;padding:20px;font-size:13px">No notifications yet</p>';

  el.innerHTML = '<div class="dash-header"><h2>Your Training</h2><p>Four pillars. Five zones. One system to master appliance sales.</p></div>'
    + '<div class="dash-grid">'
    + '<div class="stat-card accent"><div class="label">Cards Completed</div><div class="value">' + S.completedCards.size + '</div><div class="sub">of ' + totalCards + ' total</div></div>'
    + '<div class="stat-card green"><div class="label">Current Zone</div><div class="value">2</div><div class="sub">The Build</div></div>'
    + '<div class="stat-card gold"><div class="label">Badges Earned</div><div class="value">' + S.earnedBadges.length + '</div><div class="sub">of ' + S.badges.length + ' available</div></div>'
    + '</div>'
    + '<div style="background:linear-gradient(135deg,var(--navy),#2c5282);border-radius:var(--radius);padding:24px;margin-bottom:28px;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(30,58,95,.15)" onclick="navTo(\'roleplay\')" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'">'
    + '<div style="display:flex;align-items:center;gap:16px"><div style="font-size:36px">🎤</div><div>'
    + '<h3 style="font-size:18px;font-weight:800;color:#fff;margin-bottom:4px">AI Coach — Live Roleplay</h3>'
    + '<p style="font-size:13px;color:rgba(255,255,255,.75)">6 coaching personas pulling live PIM data. Practice objections, learn products, roleplay customer scenarios.</p>'
    + '</div><div style="color:rgba(255,255,255,.5);font-size:24px;margin-left:auto">&#8250;</div></div></div>'
    + '<div class="section-header"><h3>The Four Pillars</h3></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:32px">' + pillarHtml + '</div>'
    + '<div class="section-header"><h3>Your Progression — Zone Map</h3></div>'
    + '<div class="zone-map">' + zoneHtml + '</div>'
    + '<div class="section-header"><h3>Recent Notifications</h3><span class="see-all" onclick="navTo(\'notifications\')">See all</span></div>'
    + '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">' + recentNotifs + '</div>';
}

function renderPillar(el) {
  var pillar = currentDeck;
  if (!pillar || !pillarLabels[pillar]) { navTo('dashboard'); return; }
  var courses = S.courses.filter(function(c) { return c.pillar === pillar; });
  var col = pillarColors[pillar];
  var lanes = S.lanes.filter(function(l) { return l.pillar === pillar; });

  var coursesHtml = courses.map(function(c) {
    return '<div class="deck-row" onclick="navTo(\'brands\')">'
      + '<div class="deck-num" style="background:' + col + '22;color:' + col + '">' + (c.icon || pillarIcons[pillar]) + '</div>'
      + '<div class="deck-info"><h5>' + esc(c.name) + '</h5><p>' + esc(c.subtitle || '') + '</p></div>'
      + '</div>';
  }).join('');

  var lanesHtml = lanes.length ? '<div class="section-header" style="margin-top:24px"><h3>Training Lanes</h3></div>'
    + '<div class="lanes-container">' + lanes.map(function(l) {
      var zone = S.zones.find(function(z) { return z.id === l.zone_id; });
      return '<div class="lane-card" onclick="navTo(\'lane\',{zone:' + l.zone_id + ',lane:' + l.id + '})">'
        + '<div class="lane-tag" style="background:' + col + '22;color:' + col + '">' + (zone ? 'Zone ' + zone.zone_number : '') + '</div>'
        + '<h4>' + esc(l.name) + '</h4>'
        + '<div class="lane-desc">' + esc(l.description || '') + '</div>'
        + '</div>';
    }).join('') + '</div>' : '';

  el.innerHTML = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">'
    + '<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;background:' + col + '15;border:2px solid ' + col + ';border-radius:var(--radius)">' + pillarIcons[pillar] + '</div>'
    + '<div><h2 style="font-size:24px;font-weight:800">' + pillarLabels[pillar] + '</h2>'
    + '<p style="color:var(--text2);font-size:13px">' + courses.length + ' courses · ' + pillarDescs[pillar].substring(0,80) + '...</p></div></div>'
    + lanesHtml
    + '<div class="section-header" style="margin-top:24px"><h3>All Courses (' + courses.length + ')</h3></div>'
    + '<div class="deck-list">' + coursesHtml + '</div>';
}

function renderZone(el) {
  const zone = S.zones.find(z => z.id === currentZone);
  if (!zone) { navTo('dashboard'); return; }
  const zoneLanes = S.lanes.filter(l => l.zone_id === currentZone);
  const laneTagColors = { sales_iq:'var(--accent2)', product_iq:'var(--cyan)', brand_iq:'var(--gold)', leadership_iq:'#a855f7' };

  const lanesHtml = zoneLanes.map(l => {
    const pct = 0;
    const tagCol = laneTagColors[l.pillar] || 'var(--accent)';
    return '<div class="lane-card" onclick="navTo(\'lane\',{zone:'+currentZone+',lane:'+l.id+'})">'
      + '<div class="lane-tag" style="background:' + tagCol + '22;color:' + tagCol + '">' + (pillarLabels[l.pillar]||l.pillar) + '</div>'
      + '<h4>' + esc(l.name) + '</h4>'
      + '<div class="lane-desc">' + esc(l.description||'') + '</div>'
      + '<div class="lane-progress"><div class="lane-progress-bar"><div class="lane-progress-fill" style="width:'+pct+'%"></div></div><div class="lane-progress-text">'+pct+'%</div></div>'
      + '</div>';
  }).join('') || '<p style="color:var(--text3);padding:20px;text-align:center">No lanes in this zone yet</p>';

  el.innerHTML = '<div class="dash-header"><h2>' + esc(zone.name) + '</h2><p>Zone ' + zone.zone_number + ' — ' + zoneLanes.length + ' learning lanes</p></div>'
    + '<div class="lanes-container">' + lanesHtml + '</div>';
}

async function renderLane(el) {
  const lane = S.lanes.find(l => l.id === currentLane);
  if (!lane) { goBack(); return; }
  el.innerHTML = '<div class="loading-spinner"></div>';
  await loadDecksForLane(currentLane);

  const decksHtml = S.decks.map(d => {
    const done = S.completedDecks.has(d.id);
    return '<div class="deck-row ' + (done?'completed':'') + '" onclick="openDeck('+d.id+')">'
      + '<div class="deck-num">' + (done?'✓':d.deck_number) + '</div>'
      + '<div class="deck-info"><h5>' + esc(d.title) + '</h5><p>' + esc(d.description||'').substring(0,80) + (d.description && d.description.length > 80 ? '...' : '') + '</p></div>'

function renderCard() {
  const ps = window._playerState;
  if (!ps || !ps.cards.length) return;
  const card = ps.cards[ps.cardIndex];
  const total = ps.cards.length;
  const pct = ((ps.cardIndex + 1) / total) * 100;
  const typeIcons = { fact:'📘', script:'📝', demo:'🎯', versus:'⚔️', scenario:'🎭', quiz:'❓' };
  const coachNames = { tj:'TJ', natalie:'Natalie', caden:'Caden', katrina:'Katrina', asher:'Asher', leah:'Leah' };

  let body = '';
  if (card.card_type === 'quiz') {
    const opts = card.options || [];
    body = '<div class="card-front">' + esc(card.front||'') + '</div>'
      + '<div class="quiz-options">' + opts.map((o,i) =>
        '<div class="quiz-opt" onclick="checkQuiz(this,\'' + esc(card.correct_option||'').replace(/'/g,"\\'") + '\')">' + esc(o) + '</div>'
      ).join('') + '</div>';
  } else if (card.back) {
    body = '<div class="card-front">' + esc(card.front||'') + '</div>'
      + '<div class="card-back" id="card-back">' + esc(card.back) + '</div>'
      + '<div class="reveal-btn" id="reveal-btn" onclick="document.getElementById(\'card-back\').classList.add(\'show\');this.style.display=\'none\'">Reveal Answer ↓</div>';
  } else {
    body = '<div class="card-front">' + esc(card.front||'') + '</div>';
  }

  const isLast = ps.cardIndex === total - 1;
  const isFirst = ps.cardIndex === 0;

  document.getElementById('card-player').innerHTML =
    '<div class="player-header">'
    + '<div class="back-btn" onclick="closePlayer()">← Back</div>'
    + '<div class="deck-title">' + esc(ps.deck?.title||'Deck') + '</div>'
    + '<div class="card-counter">' + (ps.cardIndex+1) + '/' + total + '</div></div>'
    + '<div class="player-progress"><div class="player-progress-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="card-stage"><div class="card-container fade-in">'
    + '<div><span class="card-type-badge ' + card.card_type + '">' + (typeIcons[card.card_type]||'📄') + ' ' + card.card_type + '</span>'
    + '<span class="coach-tag">🎤 ' + (coachNames[card.coach]||card.coach||'Coach') + '</span></div>'
    + '<div class="card-title">' + esc(card.title) + '</div>'
    + body
    + '<div class="player-nav">'
    + (isFirst ? '<div></div>' : '<button class="prev-btn" onclick="prevCard()">← Previous</button>')
    + '<button class="next-btn' + (isLast?' finish':'') + '" onclick="nextCard()">' + (isLast?'✓ Complete Deck':'Next →') + '</button>'
    + '</div></div></div>';
};

window.renderCard = renderCard;

function checkQuiz(el, correct) {
  const opts = el.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => {
    o.classList.add('disabled');
    if (o.textContent === correct) o.classList.add('correct');
    else if (o === el && o.textContent !== correct) o.classList.add('wrong');
  });
};

function nextCard() {
  const ps = window._playerState;
  if (ps.cardIndex < ps.cards.length - 1) {
    ps.cardIndex++;
    renderCard();
  } else {
    S.completedDecks.add(ps.deckId);
    closePlayer();
    renderView();
  }
}

function prevCard() {
  const ps = window._playerState;
  if (ps.cardIndex > 0) { ps.cardIndex--; renderCard(); }
}

function closePlayer() {
  document.getElementById('card-player').style.display = 'none';
  window._playerState = null;
}

window.checkQuiz = checkQuiz;
window.nextCard = nextCard;
window.prevCard = prevCard;

function formatTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

function startRecording() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Speech recognition requires Chrome or Edge browser.');
    return;
  }
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = new SpeechRec();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-CA';

  var recState = { recording: true, transcript: '', timer: 0 };
  window._recState = recState;
  window._recognition = recognition;

  window._recInterval = setInterval(function() {
    recState.timer++;
    var timerEl = document.getElementById('rec-timer');
    if (timerEl) timerEl.textContent = formatTime(recState.timer);
  }, 1000);

  recognition.onresult = function(event) {
    var final_text = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final_text += event.results[i][0].transcript;
      }
    }
    if (final_text.trim()) {
      recState.transcript += (recState.transcript ? ' ' : '') + final_text.trim();
      var box = document.getElementById('transcript-box');
      if (box) {
        box.innerHTML = '<p style="white-space:pre-line">' + esc(recState.transcript) + '</p>';
        box.scrollTop = box.scrollHeight;
      }
    }
  };

  recognition.onerror = function(e) {
    if (e.error === 'no-speech') return;
    console.log('Speech error:', e.error);
  };

  recognition.onend = function() {
    if (recState.recording) recognition.start();
  };

  recognition.start();
  renderView();
}
window.startRecording = startRecording;

function stopRecording() {
  var recState = window._recState;
  if (!recState) return;
  recState.recording = false;
  if (window._recognition) { window._recognition.onend = null; window._recognition.stop(); }
  if (window._recInterval) clearInterval(window._recInterval);
  window._recState = recState;
  renderView();
}
window.stopRecording = stopRecording;

function clearRecording() {
  if (window._recognition) { window._recognition.onend = null; window._recognition.stop(); }
  if (window._recInterval) clearInterval(window._recInterval);
  window._recState = { recording: false, transcript: '', timer: 0 };
  window._scorecard = null;
  renderView();
}
window.clearRecording = clearRecording;

    + 'If a category was not observed in the conversation, score it 0 and note "Not observed in this session" in feedback.\n\n'
    + 'RETURN FORMAT (JSON only, no wrapping):\n'
    + '{"scores":{"greeting":7,"rapport":8,"discovery":6,"product_selection":5,"lifestyle_demo":4,"value_building":6,"objection_handling":7,"closing":3,"complete_ticket":2,"followup":1,"cross_selling":3,"product_knowledge":7},"overall_score":52,"summary":"...","top_strength":"...","top_improvement":"...","specific_feedback":{"greeting":"...","rapport":"...","discovery":"...","product_selection":"...","lifestyle_demo":"...","value_building":"...","objection_handling":"...","closing":"...","complete_ticket":"...","followup":"...","cross_selling":"...","product_knowledge":"..."}}\n\n'
    + 'TRANSCRIPT OF PRACTICE SESSION:\n' + recState.transcript;

  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: scorePrompt }]
      })
    });
    var data = await resp.json();
    var text = data.content ? data.content.map(function(b) { return b.text || ''; }).join('') : '';
    var clean = text.replace(/```json|```/g, '').trim();
    window._scorecard = JSON.parse(clean);
    window._scorecard._transcript = recState.transcript;
    window._scorecard._duration = recState.timer;
  } catch(e) {
    console.error('Score error:', e);
    window._scorecard = { scores: {}, overall_score: 0, summary: 'Scoring failed — please try again.', top_strength: '', top_improvement: '', specific_feedback: {} };
  }
  renderView();
}
window.scoreSession = scoreSession;

function renderScorecard(el) {
  var sc = window._scorecard;
  if (!sc) { renderRoleplay(el); return; }

  var categories = [
    { key:'greeting', label:'The Greeting', icon:'👋' },
    { key:'rapport', label:'Building Rapport', icon:'🤝' },
    { key:'discovery', label:'Needs Discovery', icon:'🔍' },
    { key:'product_selection', label:'Product Selection', icon:'🎯' },
    { key:'lifestyle_demo', label:'Lifestyle Demo', icon:'✋' },
    { key:'value_building', label:'Building Value', icon:'💎' },
    { key:'objection_handling', label:'Objection Handling', icon:'🛡' },
    { key:'closing', label:'Closing', icon:'🤝' },
    { key:'complete_ticket', label:'Complete Ticket', icon:'📋' },
    { key:'followup', label:'Follow-Up & Referrals', icon:'📞' },
    { key:'cross_selling', label:'Cross-Selling', icon:'🔗' },
    { key:'product_knowledge', label:'Product Knowledge', icon:'📚' }
  ];

  var overall = sc.overall_score || 0;
  var scoreColor = overall >= 80 ? 'var(--green)' : (overall >= 60 ? 'var(--gold)' : 'var(--red)');

  var rowsHtml = categories.map(function(c) {
    var val = (sc.scores && sc.scores[c.key]) || 0;
    var pct = val * 10;
    var barColor = val >= 8 ? 'var(--green)' : (val >= 6 ? 'var(--accent)' : (val >= 4 ? 'var(--gold)' : 'var(--red)'));
    var feedback = (sc.specific_feedback && sc.specific_feedback[c.key]) || '';
    return '<div class="score-row"><div class="score-label">' + c.icon + ' ' + c.label + '</div>'
      + '<div class="score-bar"><div class="score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>'
      + '<div class="score-val" style="color:' + barColor + '">' + val + '</div></div>'
      + (feedback ? '<div class="score-feedback">' + esc(feedback) + '</div>' : '');
  }).join('');

  el.innerHTML = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer" onclick="window._scorecard=null;renderView()">'
    + '<span style="color:var(--text2);font-size:18px">&#8592;</span><span style="color:var(--text2);font-size:14px">Back to Coach</span></div>'
    + '<div class="scorecard">'
    + '<div class="scorecard-header"><h3>Practice Session Scorecard</h3>'
    + '<p style="opacity:.75;font-size:13px">' + (sc._duration ? formatTime(sc._duration) + ' session' : '') + '</p>'
    + '<div class="total-score" style="color:' + scoreColor + '">' + overall + '<span style="font-size:20px;opacity:.6">/100</span></div></div>'
    + rowsHtml
    + '<div style="padding:20px 24px;border-top:1px solid var(--border)">'
    + '<p style="font-size:14px;line-height:1.7;color:var(--text);margin-bottom:12px"><strong>' + esc(sc.summary || '') + '</strong></p>'
    + (sc.top_strength ? '<p style="font-size:13px;color:var(--green);margin-bottom:6px">💪 <strong>Top strength:</strong> ' + esc(sc.top_strength) + '</p>' : '')
    + (sc.top_improvement ? '<p style="font-size:13px;color:var(--gold)">📈 <strong>Work on:</strong> ' + esc(sc.top_improvement) + '</p>' : '')
    + '</div></div>';
}

function renderChat(el) {
  var c = coaches[rpState.coach];
  var msgsHtml = rpState.messages.map(function(m) {
    if (m.role === 'assistant') {
      return '<div class="chat-msg coach"><div class="msg-name">' + c.avatar + ' ' + c.name + '</div>' + formatMsg(m.content) + '</div>';
    } else {
      return '<div class="chat-msg user">' + esc(m.content) + '</div>';
    }
  }).join('');
  if (rpState.loading) {
    msgsHtml += '<div class="chat-msg coach typing">' + c.avatar + ' ' + c.name + ' is thinking...</div>';
  }

  el.innerHTML = '<div class="chat-container">'
    + '<div class="chat-header"><div class="chat-header-avatar">' + c.avatar + '</div>'
    + '<div class="chat-header-info"><h4>' + c.name + '</h4><p>' + c.role + '</p></div>'
    + '<div class="chat-close" onclick="endChat()">End Chat</div></div>'
    + '<div class="chat-messages" id="chat-msgs">' + msgsHtml + '</div>'
    + '<div class="chat-input-bar">'
    + '<input type="text" id="chat-input" placeholder="Ask ' + c.name + ' anything..." onkeydown="if(event.key===\'Enter\')sendMsg()">'
    + '<button onclick="sendMsg()" id="chat-send-btn"' + (rpState.loading?' disabled':'') + '>Send</button>'
    + '</div></div>';

  var msgBox = document.getElementById('chat-msgs');
  if (msgBox) msgBox.scrollTop = msgBox.scrollHeight;
}

function formatMsg(text) {
  if (!text) return '';
  return esc(text).replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

async function startChat(coachKey, initialMsg) {
  rpState.coach = coachKey;
  rpState.messages = [];
  rpState.loading = false;
  rpState.context = null;

  // Load live context from Supabase
  try {
    var contextParts = [];
    var prodRes = await sb.from('aiq_products').select('brand_name,model,category,msrp,sale_price,specs_json,short_description').limit(30);
    if (prodRes.data) {
      contextParts.push('LIVE PIM PRODUCTS (' + prodRes.data.length + ' sample):\n' + prodRes.data.map(function(p) {
        return '- ' + (p.brand_name||'') + ' ' + (p.model||'') + ' (' + (p.category||'') + ') MSRP: $' + (p.msrp||'N/A');
      }).join('\n'));
    }
    var ccrRes = await sb.from('competitive_cross_reference').select('category,tier,comparison_notes').limit(20);
    if (ccrRes.data) {
      contextParts.push('COMPETITIVE CROSS-REFERENCE (' + ccrRes.data.length + ' sample):\n' + ccrRes.data.map(function(c) {
        return '- [' + (c.category||'') + '] ' + (c.comparison_notes||'').substring(0,150);
      }).join('\n'));
    }
    var brandRes = await sb.from('brand_catalog').select('brand_name,brand_tier,parent_company,brand_tagline').eq('is_active',true).limit(30);
    if (brandRes.data) {
      contextParts.push('BRANDS (' + brandRes.data.length + ' sample):\n' + brandRes.data.map(function(b) {
        return '- ' + b.brand_name + ' (' + (b.brand_tier||'mid') + ') — ' + (b.parent_company||'Independent');
      }).join('\n'));
    }
    rpState.context = contextParts.join('\n\n');
  } catch(e) {
    console.error('Context load error:', e);
    rpState.context = 'Live data unavailable.';
  }

  if (initialMsg) {
    rpState.messages.push({ role: 'user', content: initialMsg });
    currentView = 'roleplay';
    renderView();
    await callCoach();
  } else {
    currentView = 'roleplay';
    renderView();
  }
}
window.startChat = startChat;

async function sendMsg() {
  var input = document.getElementById('chat-input');
  if (!input || !input.value.trim() || rpState.loading) return;
  var msg = input.value.trim();
  input.value = '';
  rpState.messages.push({ role: 'user', content: msg });
  renderView();
  await callCoach();
}
window.sendMsg = sendMsg;

async function callCoach() {
  rpState.loading = true;
  renderView();

  var c = coaches[rpState.coach];
  var sysPrompt = 'You are ' + c.name + ', ' + c.role + ' at ApplianceIQ — a training platform for appliance sales reps in Canada.\n\n'
    + 'PERSONA: ' + c.desc + '\n\n'
    + 'RULES:\n'
    + '- Stay in character as ' + c.name + ' at ALL times\n'
    + '- Keep responses concise (2-4 paragraphs max) — sales reps are busy\n'
    + '- Use real product data, specs, and prices from the context below when relevant\n'
    + '- Give actionable scripts, not theory\n'
    + '- If roleplaying a customer scenario, play both sides — coach the rep through it\n'
    + '- Reference Canadian context (pricing in CAD, building codes, EnerGuide)\n'
    + '- When you disagree with another coach approach, say so briefly\n\n'
    + 'LIVE DATA FROM PIM:\n' + (rpState.context || 'No data loaded.');

  var apiMessages = rpState.messages.map(function(m) { return { role: m.role, content: m.content }; });

  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: sysPrompt,
        messages: apiMessages
      })
    });
    var data = await resp.json();
    var reply = data.content ? data.content.map(function(b) { return b.text || ''; }).join('') : 'Sorry, I could not generate a response.';
    rpState.messages.push({ role: 'assistant', content: reply });
  } catch(e) {
    console.error('Coach API error:', e);
    rpState.messages.push({ role: 'assistant', content: 'Connection error — please try again.' });
  }

  rpState.loading = false;
  renderView();
}

function endChat() {
  rpState.coach = null;
  rpState.messages = [];
  rpState.loading = false;
  rpState.context = null;
  renderView();
}
window.endChat = endChat;

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}
</script>
