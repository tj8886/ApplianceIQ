<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQ Academy — ApplianceIQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e3a5f'/><text x='50' y='68' text-anchor='middle' font-family='Arial' font-weight='800' font-size='42' fill='white'>IQ</text></svg>" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f5f7;--surface:#ffffff;--surface2:#f5f8fa;--surface3:#e8eef2;
  --border:#d0dbe3;--text:#1a2b3c;--text2:#4a6275;--text3:#8899a8;
  --accent:#0d9488;--accent2:#14b8a6;--accent-glow:rgba(13,148,136,.08);
  --navy:#1e3a5f;--navy-light:#2c5282;
  --green:#059669;--orange:#d97706;--red:#dc2626;--cyan:#0891b2;
  --gold:#d97706;--silver:#64748b;--bronze:#b45309;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
html{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f0f5f7 0%,#e0eff5 50%,#d5eaef 100%)}
.login-box{width:100%;max-width:380px;padding:40px 32px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(30,58,95,.08)}
.login-box h1{font-size:24px;font-weight:800;margin-bottom:4px;color:var(--navy)}
.login-box p{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.login-box input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:14px;margin-bottom:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.login-box button:hover{background:var(--accent2);transform:translateY(-1px)}
.login-box .error{color:var(--red);font-size:12px;margin-bottom:12px;display:none}

/* APP SHELL */
#app{min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(30,58,95,.04);gap:12px}
.topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-logo{font-size:16px;font-weight:800;color:var(--navy);cursor:pointer}
.topbar-center{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;justify-content:center}
.topbar-center::-webkit-scrollbar{display:none}
.tab-btn{background:none;border:none;color:var(--text3);font-size:12px;padding:8px 12px;cursor:pointer;font-weight:600;letter-spacing:.3px;transition:all .2s;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.notif-btn{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;color:var(--text2);font-size:16px;transition:all .2s}
.notif-btn:hover{background:var(--surface3);color:var(--text)}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .2s}
.user-btn:hover{background:var(--surface3);color:var(--text)}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100;box-shadow:0 -1px 3px rgba(30,58,95,.04)}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;transition:color .2s}
.bnav-item.active{color:var(--accent)}
.bnav-item span{font-size:18px}

/* MAIN CONTENT */
.main{max-width:1200px;margin:0 auto;padding:20px}

/* DASHBOARD */
.dash-header{margin-bottom:24px}
.dash-header h2{font-size:28px;font-weight:800;color:var(--navy);margin-bottom:4px}
.dash-header p{color:var(--text2);font-size:14px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.stat-card .label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:800;color:var(--navy)}
.stat-card .sub{font-size:12px;color:var(--text3);margin-top:4px}
.stat-card.accent .value{color:var(--accent)}
.stat-card.green .value{color:var(--green)}
.stat-card.gold .value{color:var(--gold)}

/* SECTION HEADERS */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:18px;font-weight:700;color:var(--navy)}
.section-header .see-all{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}

/* ZONE MAP */
.zone-map{display:flex;gap:12px;margin-bottom:28px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.zone-card{flex:0 0 220px;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.zone-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(13,148,136,.1)}
.zone-card.locked{opacity:.5;cursor:default}.zone-card.locked:hover{border-color:var(--border);transform:none;box-shadow:none}
.zone-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(13,148,136,.12)}
.zone-card .zone-num{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.zone-card h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.zone-card .zone-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.zone-card .zone-progress{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.zone-card .zone-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .5s}
.zone-card .zone-pct{font-size:11px;color:var(--text3);margin-top:6px;font-weight:600}
.zone-card .lock-icon{position:absolute;top:12px;right:12px;font-size:16px;color:var(--text3)}

/* LANES & DECKS */
.lanes-container{display:grid;gap:16px;margin-bottom:28px}
.lane-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.lane-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(13,148,136,.08)}
.lane-tag{display:inline-block;padding:3px 8px;background:var(--accent-glow);color:var(--accent);font-size:11px;font-weight:600;border-radius:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.lane-card h4{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.lane-card .lane-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.lane-progress{display:flex;align-items:center;gap:10px}
.lane-progress-bar{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.lane-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .5s}
.lane-progress-text{font-size:12px;font-weight:600;color:var(--text2);min-width:40px;text-align:right}

/* DECK LIST & CARD PLAYER */
.deck-list{display:grid;gap:10px;margin-bottom:24px}
.deck-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.deck-row:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(13,148,136,.08)}
.deck-row.completed{border-left:3px solid var(--green)}
.deck-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface3);border-radius:50%;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0}
.deck-row.completed .deck-num{background:rgba(5,150,105,.1);color:var(--green)}
.deck-info{flex:1;min-width:0}
.deck-info h5{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-info p{font-size:12px;color:var(--text2)}
.deck-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);flex-shrink:0}

#card-player{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border)}
.player-header .back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);cursor:pointer;font-size:14px;font-weight:500;transition:color .2s}
.player-header .back-btn:hover{color:var(--accent)}
.player-header .deck-title{font-size:14px;font-weight:600;color:var(--navy);text-align:center;flex:1}
.player-header .card-counter{font-size:13px;color:var(--text2);font-weight:600}
.player-progress{height:3px;background:var(--surface3)}
.player-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s}
.card-stage{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 120px);padding:20px}
.card-container{width:100%;max-width:560px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 4px 16px rgba(30,58,95,.06)}
.card-type-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.card-type-badge.fact{background:rgba(8,145,178,.1);color:var(--cyan)}
.card-type-badge.script{background:rgba(217,119,6,.1);color:var(--gold)}
.card-type-badge.demo{background:rgba(126,34,206,.1);color:#7e22ce}
.card-type-badge.versus{background:rgba(220,38,38,.1);color:var(--red)}
.card-type-badge.scenario{background:rgba(5,150,105,.1);color:var(--green)}
.card-type-badge.quiz{background:rgba(13,148,136,.1);color:var(--accent)}
.coach-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface2);border-radius:4px;font-size:11px;font-weight:600;color:var(--text2);margin-left:8px}
.card-title{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:16px;line-height:1.3}
.card-front{font-size:15px;line-height:1.7;color:var(--text);white-space:pre-line}
.card-back{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--text2);white-space:pre-line;display:none}
.card-back.show{display:block}
.reveal-btn{display:block;width:100%;padding:12px;margin-top:16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.reveal-btn:hover{background:var(--surface3);color:var(--accent)}
.quiz-options{display:grid;gap:8px;margin-top:16px}
.quiz-opt{padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;font-size:14px;line-height:1.5;transition:all .2s;color:var(--text)}
.quiz-opt:hover{border-color:var(--accent);background:var(--accent-glow)}
.quiz-opt.correct{border-color:var(--green);background:rgba(5,150,105,.08);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(220,38,38,.08);color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.7}
.player-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-top:20px}
.player-nav button{padding:10px 24px;border-radius:var(--radius-xs);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.player-nav .prev-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.player-nav .prev-btn:hover{background:var(--surface3);color:var(--text)}
.player-nav .next-btn{background:var(--accent);color:#fff}
.player-nav .next-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.player-nav .next-btn.finish{background:var(--green)}

/* NOTIFICATIONS PANEL */
#notif-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:#fff;border-left:1px solid var(--border);z-index:150;overflow-y:auto;box-shadow:-4px 0 16px rgba(30,58,95,.08)}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.notif-header h3{font-size:16px;font-weight:700;color:var(--navy)}
.notif-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;border-radius:var(--radius-xs);transition:all .2s}
.notif-close:hover{background:var(--surface2);color:var(--text)}
.notif-list{padding:12px}
.notif-item{display:flex;gap:10px;padding:12px;border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;transition:background .2s}
.notif-item:hover{background:var(--surface2)}
.notif-item.unread{background:var(--accent-glow)}
.notif-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.notif-content h5{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px}
.notif-content p{font-size:12px;color:var(--text2);line-height:1.4}
.notif-content .notif-time{font-size:11px;color:var(--text3);margin-top:4px}

/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.badge-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.badge-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.badge-card.earned{border-color:var(--gold);box-shadow:0 2px 8px rgba(217,119,6,.1)}
.badge-card.locked{opacity:.4}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-card h5{font-size:12px;font-weight:600;color:var(--navy);line-height:1.3}

/* BRANDS */
.brand-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.brand-filter{padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s}
.brand-filter.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.brand-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(30,58,95,.03)}
.brand-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(13,148,136,.08)}
.brand-card h4{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px}
.brand-card .brand-tier{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.brand-card .brand-tier.entry{color:var(--text3)}
.brand-card .brand-tier.mid{color:var(--cyan)}
.brand-card .brand-tier.luxury{color:var(--gold)}
.brand-card .brand-tier.ultra_luxury{color:#7e22ce}
.brand-card .brand-parent{font-size:12px;color:var(--text3)}

/* RECORDER / HUMAN TO HUMAN */
.recorder-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.recorder-header{padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#f0fdf9,#ecfeff)}
.recorder-header h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:4px}
.recorder-header p{font-size:13px;color:var(--text2)}
.recorder-body{padding:24px}
.rec-status{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--text3);flex-shrink:0}
.rec-dot.recording{background:#dc2626;animation:pulse 1s infinite}
.rec-dot.done{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rec-status-text{font-size:15px;font-weight:600;color:var(--navy)}
.rec-timer{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--text2)}
.rec-controls{display:flex;gap:12px;margin-bottom:20px}
.rec-btn{padding:12px 28px;border-radius:var(--radius-xs);font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
.rec-btn.start{background:var(--accent);color:#fff}.rec-btn.start:hover{background:var(--accent2);transform:translateY(-1px)}
.rec-btn.stop{background:#dc2626;color:#fff}.rec-btn.stop:hover{background:#b91c1c}
.rec-btn.score{background:var(--navy);color:#fff}.rec-btn.score:hover{background:var(--navy-light);transform:translateY(-1px)}
.rec-btn:disabled{opacity:.4;cursor:default;transform:none}
.transcript-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;max-height:300px;overflow-y:auto;margin-bottom:16px;font-size:13px;line-height:1.7;color:var(--text)}
.scorecard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:24px}
.scorecard-header{padding:20px 24px;background:linear-gradient(135deg,var(--navy),#2c5282);color:#fff}
.scorecard-header h3{font-size:20px;font-weight:800;margin-bottom:4px}
.scorecard-header .total-score{font-size:48px;font-weight:900;margin-top:8px}
.score-row{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-row .score-label{flex:1;font-size:14px;font-weight:600;color:var(--navy)}
.score-row .score-bar{flex:2;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;margin:0 16px}
.score-row .score-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.score-row .score-val{font-size:16px;font-weight:800;min-width:40px;text-align:right}
.score-feedback{padding:16px 24px;font-size:13px;line-height:1.6;color:var(--text2);border-top:1px solid var(--border);background:var(--surface2)}

/* AI COACH / CHAT */
.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.coach-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.coach-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 20px rgba(13,148,136,.12)}
.coach-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.coach-avatar{font-size:40px;margin-bottom:8px}
.coach-card h4{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:2px}

<script>
// ── GLOBAL NAV (regular script, not module) ──
var currentView = 'dashboard';
var currentZone = null, currentLane = null, currentDeck = null;
var viewHistory = [];

function navTo(view, data) {
  if (currentView !== view) viewHistory.push({ view: currentView, zone: currentZone, lane: currentLane });
  currentView = view;
  if (data) {
    if (data.zone !== undefined) currentZone = data.zone;
    if (data.lane !== undefined) currentLane = data.lane;
    if (data.deck !== undefined) currentDeck = data.deck;
  }
  renderView();
  updateTabs();
}

function goBack() {
  var prev = viewHistory.pop();
  if (prev) { currentView = prev.view; currentZone = prev.zone; currentLane = prev.lane; renderView(); updateTabs(); }
}

function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === currentView); });
  document.querySelectorAll('.bnav-item').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === currentView); });
}

function toggleNotifs() {
  var p = document.getElementById('notif-panel');
  if (p.style.display === 'block') { p.style.display = 'none'; }
  else { p.style.display = 'block'; p.classList.add('slide-in'); if (typeof loadNotifications === 'function') loadNotifications(); }
}

function doLogout() {
  if (window._supabase) window._supabase.auth.signOut();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').style.display = 'flex';
}

function showToast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4000);
}

function openCurriculumView() {
  document.getElementById('curriculum-view').style.display = 'block';
  if (typeof renderCurrSidebar === 'function') renderCurrSidebar();
  updateTabs();
}

function closeCurriculum() {
  document.getElementById('curriculum-view').style.display = 'none';
  currentView = 'dashboard';
  updateTabs();
}
</script>

window.doLogin = async function() {
  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-pass').value;
  var errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }
  var { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  S.user = data.user;
  await initApp();
};

var { data: { session } } = await sb.auth.getSession();

async function initApp() {
  document.getElementById('login-screen').style.display = 'none';

  renderView();
}

async function loadCurriculum() {
  var { data: vols } = await sb.from('academy_volumes').select('*').order('sort_order');
  var { data: chs } = await sb.from('academy_chapters').select('*').order('sort_order');
  S.volumes = vols || [];
  S.chapters = chs || [];
  // Load progress
  if (S.user) {
    var { data: prog } = await sb.from('academy_progress').select('chapter_id').eq('user_id', S.user.id);
    S.completedChapterIds = new Set((prog||[]).map(function(r){ return r.chapter_id; }));
  }
  // Load quizzes
  try {
    var { data: qd } = await sb.from('academy_quizzes').select('volume_id,questions').order('volume_id');
    S.quizzes = (qd||[]).map(function(r){ return { vol: r.volume_id, questions: r.questions }; });
  } catch(e) { S.quizzes = []; }
  // Load quiz scores
  if (S.user) {
    try {
      var { data: qs } = await sb.from('academy_quiz_scores').select('*').eq('user_id', S.user.id);
      (qs||[]).forEach(function(r){ S.quizScores[r.vol] = { score:r.score, total:r.total, ts:r.updated_at }; });
    } catch(e) {}
  }
  updateCurrProgressPill();
}

function updateCurrProgressPill() {
  var real = S.chapters.filter(function(c){ return c.chapter_number >= 1; });
  var done = real.filter(function(c){ return S.completedChapterIds.has(c.id); }).length;
  var el = document.getElementById('curr-progress-pill');
  if (el) el.textContent = done + ' / ' + real.length + ' chapters';
}

async function loadVendors() {

    var { data } = await sb.from('mfr_vendors').select('*').order('name');
    S.vendors = data || [];
  } catch(e) { S.vendors = []; }
}

async function loadBrandCatalog() {
  try {
    var { data: brands } = await sb.from('brand_catalog').select('*').eq('is_active', true).order('brand_name');
    S.brandCatalog = brands || [];
    var { data: cards } = await sb.from('brand_training_cards').select('*').order('brand_id');
    S.brandTrainingCards = {};
    (cards || []).forEach(function(c){ S.brandTrainingCards[c.brand_id] = c; });
    if (S.user) {
      var { data: prog } = await sb.from('academy_brand_progress').select('brand_id, level, module_key').eq('user_id', S.user.id);
      S.brandProgress = {};
      (prog || []).forEach(function(p){ if (!S.brandProgress[p.brand_id]) S.brandProgress[p.brand_id] = []; S.brandProgress[p.brand_id].push(p.level + ':' + p.module_key); });
      var { data: certs } = await sb.from('academy_brand_certifications').select('*').eq('user_id', S.user.id);
      S.brandCertifications = {};
      (certs||[]).forEach(function(c){ S.brandCertifications[c.brand_id] = c; });
      var { data: assigns } = await sb.from('organization_brands').select('brand_id,assignment_type');
      S.orgBrandAssignments = {};
      (assigns||[]).forEach(function(a){ S.orgBrandAssignments[a.brand_id] = a.assignment_type; });
    }
  } catch(e) { console.error('Brand catalog load error:', e); }
}

async function loadRoleplayPersonas() {
  if (!S.user) return;
  try {
    var { data: member } = await sb.from('organization_members').select('organization_id').eq('user_id', S.user.id).maybeSingle();
    if (!member) return;
    var { data: org } = await sb.from('organizations').select('*').eq('id', member.organization_id).maybeSingle();
    S.currentOrg = org;
    var { data: personas } = await sb.from('ai_personas').select('persona_name,persona_role,avatar_emoji,tone').eq('organization_id', org.id).eq('active', true);
    S.roleplayPersonas = personas || [];
  } catch(e) { console.error('Persona load error:', e); }
}

async function loadNotifications() {
  // Load from both notification systems
  var iqNotifs = [], acNotifs = [];
  try {
    var { data: iq } = await sb.from('iq_notifications').select('*').order('created_at', { ascending: false }).limit(20);
    iqNotifs = (iq||[]).map(function(n){ n._source = 'iq'; return n; });
  } catch(e) {}
  try {
    var { data: ac } = await sb.from('academy_notifications').select('*').eq('user_id', S.user.id).order('created_at', { ascending: false }).limit(20);
    acNotifs = (ac||[]).map(function(n){ n._source = 'academy'; return n; });
  } catch(e) {}
  S.notifications = iqNotifs.concat(acNotifs).sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); }).slice(0, 30);
  renderNotifPanel();
  var unread = S.notifications.filter(function(n){ return !n.is_read; }).length;
  var badge = document.getElementById('notif-count');
  if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}
window.loadNotifications = loadNotifications;

// Card player — same as original IQ Training
async function openDeck(deckId) {
  var player = document.getElementById('card-player');
  player.style.display = 'block';
  player.innerHTML = '<div class="loading-spinner" style="margin-top:40vh"></div>';
  await loadCardsForDeck(deckId);
  var deck = S.decks.find(function(d){ return d.id === deckId; });
  window._playerState = { deckId: deckId, cardIndex: 0, cards: S.cards, deck: deck };
  renderCard();
}
window.openDeck = openDeck;

function renderCard() {
  var ps = window._playerState;
  if (!ps || !ps.cards.length) return;
  var card = ps.cards[ps.cardIndex];
  var total = ps.cards.length;
  var pct = ((ps.cardIndex + 1) / total) * 100;
  var typeIcons = { fact:'📘', script:'📝', demo:'🎯', versus:'⚔️', scenario:'🎭', quiz:'❓' };
  var coachNames = { tj:'TJ', natalie:'Natalie', caden:'Caden', katrina:'Katrina', asher:'Asher', leah:'Leah' };
  var body = '';
  if (card.card_type === 'quiz') {
    var opts = card.options || [];
    body = '<div class="card-front">' + esc(card.front||'') + '</div>'
      + '<div class="quiz-options">' + opts.map(function(o){ return '<div class="quiz-opt" onclick="checkQuiz(this,\'' + esc(card.correct_option||'').replace(/'/g,"\\'") + '\')">' + esc(o) + '</div>'; }).join('') + '</div>';
  } else if (card.back) {
    body = '<div class="card-front">' + esc(card.front||'') + '</div>'
      + '<div class="card-back" id="card-back">' + esc(card.back) + '</div>'
      + '<div class="reveal-btn" onclick="document.getElementById(\'card-back\').classList.add(\'show\');this.style.display=\'none\'">Reveal Answer ↓</div>';
  } else {
    body = '<div class="card-front">' + esc(card.front||'') + '</div>';
  }
  var isLast = ps.cardIndex === total - 1;
  var isFirst = ps.cardIndex === 0;
  document.getElementById('card-player').innerHTML =
    '<div class="player-header"><div class="back-btn" onclick="closePlayer()">← Back</div><div class="deck-title">' + esc(ps.deck?.title||'Deck') + '</div><div class="card-counter">' + (ps.cardIndex+1) + '/' + total + '</div></div>'
    + '<div class="player-progress"><div class="player-progress-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="card-stage"><div class="card-container fade-in">'
    + '<div><span class="card-type-badge ' + card.card_type + '">' + (typeIcons[card.card_type]||'📄') + ' ' + card.card_type + '</span>'
    + '<span class="coach-tag">🎤 ' + (coachNames[card.coach]||card.coach||'Coach') + '</span></div>'
    + '<div class="card-title">' + esc(card.title) + '</div>' + body
    + '<div class="player-nav">'
    + (isFirst ? '<div></div>' : '<button class="prev-btn" onclick="prevCard()">← Previous</button>')
    + '<button class="next-btn' + (isLast?' finish':'') + '" onclick="nextCard()">' + (isLast?'✓ Complete Deck':'Next →') + '</button>'
    + '</div></div></div>';
}
window.renderCard = renderCard;

function checkQuiz(el, correct) { el.parentElement.querySelectorAll('.quiz-opt').forEach(function(o){ o.classList.add('disabled'); if(o.textContent===correct) o.classList.add('correct'); else if(o===el&&o.textContent!==correct) o.classList.add('wrong'); }); }
function nextCard() { var ps = window._playerState; if(ps.cardIndex<ps.cards.length-1){ps.cardIndex++;renderCard();}else{S.completedDecks.add(ps.deckId);closePlayer();renderView();} }
function prevCard() { var ps = window._playerState; if(ps.cardIndex>0){ps.cardIndex--;renderCard();} }
function closePlayer() { document.getElementById('card-player').style.display='none'; window._playerState=null; }
window.checkQuiz=checkQuiz; window.nextCard=nextCard; window.prevCard=prevCard; window.closePlayer=closePlayer;

function vendorInitials(name) {
  var clean = name.replace(/[^A-Za-z0-9 ]/g,'');
  var parts = clean.split(' ').filter(Boolean);
  if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

async function loadVendorServiceData(vendorName) {
  var el = document.getElementById('vendor-service-data');
  if (!el) return;
  try {
    var { data: contacts } = await sb.from('aiq_vendor_contacts').select('*').ilike('brand_name', '%' + vendorName + '%');
    var { data: warranties } = await sb.from('aiq_warranty_policies').select('*').ilike('brand_name', '%' + vendorName + '%');
    var { data: recalls } = await sb.from('aiq_recalls').select('*').ilike('brand_name', '%' + vendorName + '%').order('recall_date', { ascending: false });
    var html = '';
    if ((contacts||[]).length) {
      html += '<div class="vendor-section"><div class="vendor-section-title">❤️ Service Contacts</div>'
        + (contacts||[]).map(function(c){ return '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px;margin-bottom:8px"><strong>' + esc(c.contact_name||'') + '</strong> — ' + esc(c.contact_role||'') + '<br><span style="font-size:12px;color:var(--text2)">' + esc(c.phone||'') + ' · ' + esc(c.email||'') + '</span></div>'; }).join('') + '</div>';
    }
    if ((warranties||[]).length) {
      html += '<div class="vendor-section"><div class="vendor-section-title">📋 Warranty Policies</div>'
        + (warranties||[]).map(function(w){ return '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px;margin-bottom:8px"><strong>' + esc(w.category||'') + '</strong> — ' + esc(w.warranty_term||'') + '<br><span style="font-size:12px;color:var(--text2)">' + esc(w.coverage_details||'') + '</span></div>'; }).join('') + '</div>';
    }
    if ((recalls||[]).length) {
      html += '<div class="vendor-section"><div class="vendor-section-title">⚠️ Active Recalls</div>'
        + (recalls||[]).map(function(r){ return '<div style="background:rgba(220,38,38,.04);border:1px solid rgba(220,38,38,.2);border-radius:var(--radius-xs);padding:12px;margin-bottom:8px"><strong style="color:var(--red)">' + esc(r.model||'') + '</strong> — ' + esc(r.reason||'') + '<br><span style="font-size:12px;color:var(--text2)">' + esc(r.recall_date||'') + '</span></div>'; }).join('') + '</div>';

    el.innerHTML = html || '<p style="color:var(--text3);font-size:13px">No service data found for this vendor.</p>';
  } catch(e) { el.innerHTML = ''; }
}

  var rowsHtml = filtered.map(function(row) {

      var bn = row['brand' + i];
      var bName = (bn && typeof bn === 'object' && bn.brand_name) ? bn.brand_name : null;
      if (row['brand' + i + '_model']) brands.push({ name: bName || '—', model: row['brand' + i + '_model'] || '', notes: row['brand' + i + '_notes'] || '' });
    }
    var isOpen = _compareOpenId === row.id;
    var tierColor = row.tier === 'Luxury' ? '#a78bfa' : row.tier === 'Premium' ? '#60a5fa' : row.tier === 'Mid-Range' ? '#34d399' : '#94a3b8';
    return '<div class="compare-card' + (isOpen ? ' open' : '') + '">'
      + '<div class="compare-header" onclick="_compareOpenId=_compareOpenId===\'' + row.id + '\'?null:\'' + row.id + '\';renderView()">'

      + '<h3 style="font-size:16px;font-weight:700;color:var(--navy);margin:0">' + esc(row.category) + '</h3>'
      + '<div class="compare-brands">' + brands.map(function(b){ return '<span>' + esc(b.name) + '</span>'; }).join('') + '</div></div>'
      + '<span style="font-size:18px;transition:transform .2s;transform:rotate(' + (isOpen?'180':'0') + 'deg);color:var(--text3)">▼</span></div>'
      + (isOpen ? '<div style="padding:0 20px 20px;border-top:1px solid var(--border)">'
        + (row.comparison_notes ? '<p style="font-size:13px;color:var(--accent);font-style:italic;margin:12px 0 16px;padding:10px 14px;background:var(--accent-glow);border-radius:8px;border-left:3px solid var(--accent)">💡 ' + esc(row.comparison_notes) + '</p>' : '')
        + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">'
        + brands.map(function(b, idx) {

async function updateDailyMetric(field, delta) {
  var el = document.getElementById('sc-' + field);
  if (!el) return;
  var current = parseInt(el.textContent) || 0;
  var newVal = Math.max(0, current + delta);
  el.textContent = newVal;
  var today = new Date().toISOString().slice(0,10);
  var upsertData = { user_id: S.user.id, metric_date: today };
  upsertData[field] = newVal;
  try {
    await sb.from('academy_daily_metrics').upsert(upsertData, { onConflict: 'user_id,metric_date' });
  } catch(e) { console.error('Metric save error:', e); }
}

async function loadLeaderboard() {

function formatContent(content) {
  if (!content) return '';
  return content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/^/, '<p>') + '</p>';
}

async function loadChapter(slug, volId) {
  var vol = S.volumes.find(function(v){ return v.id === volId; });
  var inner = document.getElementById('curr-reader-inner');
  inner.innerHTML = '<div class="loading-spinner"></div>';
  document.getElementById('curr-reader').scrollTop = 0;
  document.querySelectorAll('.ch-item').forEach(function(i){ i.classList.toggle('active', i.dataset.slug === slug); });
  window._currentSlug = slug;

  try {
    var res = await fetch('content/' + slug + '.json');
    if (!res.ok) throw new Error('Content not found');
    var data = await res.json();
    var ch = S.chapters.find(function(c){ return c.slug === slug; });
    var isComplete = ch && S.completedChapterIds.has(ch.id);
    var real = S.chapters.filter(function(c){ return c.chapter_number >= 1; });
    var idx = real.findIndex(function(c){ return c.slug === slug; });
    var prev = idx > 0 ? real[idx-1] : null;
    var next = idx < real.length-1 ? real[idx+1] : null;
    var prevVol = prev ? S.volumes.find(function(v){ return v.id === prev.volume_id; }) : null;
    var nextVol = next ? S.volumes.find(function(v){ return v.id === next.volume_id; }) : null;

    inner.innerHTML = '<div class="chapter-header">'
      + '<div class="chapter-vol-label">Volume ' + (data.vol||'') + ' — ' + esc(vol?.title||'') + '</div>'
      + '<h1 class="chapter-title">' + esc(data.title) + '</h1>'
      + (data.intro ? '<p class="chapter-intro">' + esc(data.intro) + '</p>' : '') + '</div>'
      + (data.sections||[]).map(function(s) {
        return '<div class="section-block"><h2 class="section-title">' + esc(s.title) + '</h2><div class="section-content">' + formatContent(s.content) + '</div></div>';
      }).join('')
      + '<button class="btn-ai-trainer" onclick="openTrainer()"><span style="color:var(--accent)">✦</span> Ask AI Trainer</button>'
      + '<div class="chapter-actions"><div class="nav-pair">'
      + (prev ? '<button class="btn-nav" onclick="loadChapter(\'' + prev.slug + '\',' + (prevVol?prevVol.id:'null') + ')">← Previous</button>' : '<span></span>')
      + (next ? '<button class="btn-nav" onclick="loadChapter(\'' + next.slug + '\',' + (nextVol?nextVol.id:'null') + ')">Next →</button>' : '')
      + '</div>'
      + (ch ? '<button class="btn-complete ' + (isComplete?'done':'') + '" onclick="toggleChapterComplete(\'' + ch.id + '\',\'' + slug + '\')" id="complete-btn">' + (isComplete?'✓ Completed':'Mark as Complete') + '</button>' : '')
      + '</div>';
    window._currentChapterData = data;
  } catch(e) {
    inner.innerHTML = '<div style="text-align:center;padding:60px;color:var(--red)">Could not load chapter. Please try again.</div>';
  }
}
window.loadChapter = loadChapter;

async function toggleChapterComplete(chId, slug) {
  var btn = document.getElementById('complete-btn');
  if (S.completedChapterIds.has(chId)) {
    S.completedChapterIds.delete(chId);
    await sb.from('academy_progress').delete().eq('user_id', S.user.id).eq('chapter_id', chId);
    if (btn) { btn.textContent = 'Mark as Complete'; btn.classList.remove('done'); }
  } else {
    S.completedChapterIds.add(chId);
    await sb.from('academy_progress').insert({ user_id: S.user.id, chapter_id: chId });
    if (btn) { btn.textContent = '✓ Completed'; btn.classList.add('done'); }
  }
  updateCurrProgressPill();
  renderCurrSidebar();
  var chItem = document.querySelector('.ch-item[data-slug="' + slug + '"]');
  if (chItem) chItem.classList.toggle('completed', S.completedChapterIds.has(chId));
}
window.toggleChapterComplete = toggleChapterComplete;

// ── AI TRAINER (Netlify function) ──
var TRAINER = { open:false, sessionId:null, slug:null, ctx:null, lessonText:'', history:[] };

function openTrainer() {
  var slug = window._currentSlug;
  var ch = S.chapters.find(function(c){ return c.slug === slug; });
  var vol = ch ? S.volumes.find(function(v){ return v.id === ch.volume_id; }) : null;
  TRAINER.ctx = { volume: vol ? 'Volume ' + vol.vol_number + ' — ' + vol.title : '', chapter: ch ? ch.title : slug };
  TRAINER.slug = slug;
  var d = window._currentChapterData;
  TRAINER.lessonText = d ? (d.title + '\n' + (d.intro||'') + '\n\n' + (d.sections||[]).map(function(s){ return '## ' + s.title + '\n' + s.content; }).join('\n\n')).slice(0,24000) : '';
  document.getElementById('ai-context').innerHTML = '<b>' + esc(TRAINER.ctx.volume) + '</b><br>' + esc(TRAINER.ctx.chapter);
  var panel = document.getElementById('ai-panel');
  panel.classList.add('open'); panel.style.display = 'flex';
  TRAINER.open = true;
  TRAINER.history = [];
  document.getElementById('ai-msgs').innerHTML = '';
  trainerRender({ msg_role:'assistant', content:'Hi — I can see you\'re on "' + (TRAINER.ctx.chapter||'this lesson') + '". Ask me anything about this lesson, or tap a quick action below.' });
}
window.openTrainer = openTrainer;

function closeTrainer() {
  document.getElementById('ai-panel').classList.remove('open');
  setTimeout(function(){ document.getElementById('ai-panel').style.display='none'; TRAINER.open=false; }, 250);
  TRAINER.open = false;
}
window.closeTrainer = closeTrainer;

function trainerRender(m) {
  var box = document.getElementById('ai-msgs');
  var el = document.createElement('div');
  el.className = 'ai-msg ' + (m.msg_role === 'user' ? 'user' : 'assistant');
  el.textContent = m.content;
  box.appendChild(el); box.scrollTop = box.scrollHeight;
  return el;
}

function trainerAsk(q) { document.getElementById('ai-input').value = q; sendTrainer(); }
window.trainerAsk = trainerAsk;

async function sendTrainer() {
  var input = document.getElementById('ai-input');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';
  var userMsg = { msg_role:'user', content:q };
  TRAINER.history.push(userMsg); trainerRender(userMsg);
  var thinking = trainerRender({ msg_role:'assistant', content:'Thinking…' });
  thinking.classList.add('thinking');
  var sysPrompt = 'You are the ApplianceIQ AI Trainer — an expert appliance sales training coach.\n\n'
    + 'CONTEXT:\n' + (TRAINER.ctx.volume||'') + '\nChapter: ' + (TRAINER.ctx.chapter||'') + '\n\n'
    + 'LESSON CONTENT (grounding — answer from this):\n' + (TRAINER.lessonText||'No lesson loaded.').substring(0,16000) + '\n\n'
    + 'RULES:\n- Answer based on the lesson content above\n- Keep responses concise (2-3 paragraphs)\n- Use real examples from the appliance sales floor\n- If asked to quiz, create questions from the lesson\n- Canadian context (CAD pricing, building codes, EnerGuide)\n- Be encouraging but direct';
  var apiMessages = TRAINER.history.filter(function(m){ return m.content !== 'Thinking…'; }).map(function(m){ return { role: m.msg_role === 'user' ? 'user' : 'assistant', content: m.content }; });
  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: sysPrompt, messages: apiMessages })
    });
    var data = await resp.json();
    thinking.remove();
    var replyText = data.content ? data.content.map(function(b){ return b.text||''; }).join('') : 'Sorry — could not generate a response.';
    var aiMsg = { msg_role:'assistant', content:replyText };
    TRAINER.history.push(aiMsg); trainerRender(aiMsg);
  } catch(e) { thinking.remove(); trainerRender({ msg_role:'assistant', content:'Connection problem — please try again.' }); }
}
window.sendTrainer = sendTrainer;

async function startChat(coachKey, initialMsg, mode) {
  rpState.coach = coachKey;
  rpState.messages = [];
  rpState.loading = false;
  rpState.mode = mode || null;
  // Load cross-app context for AI
  try {
    rpState.context = await loadCrossAppContext();
  } catch(e) { rpState.context = 'Live data unavailable.'; }

  if (rpState.mode === 'ai_customer' && !initialMsg) initialMsg = 'Start a roleplay. You are a customer walking into an appliance store. Pick a realistic scenario and open the conversation as the customer would. I am the sales rep.';
  if (rpState.mode === 'ai_rep' && !initialMsg) initialMsg = 'Start a roleplay. You are an expert appliance sales rep. I am a customer walking in. Greet me and begin the sales process.';
  if (initialMsg) { rpState.messages.push({ role: 'user', content: initialMsg }); currentView = 'roleplay'; renderView(); await callCoach(); }
  else { currentView = 'roleplay'; renderView(); }
}
window.startChat = startChat;

async function sendMsg() {
  var input = document.getElementById('chat-input');
  if (!input || !input.value.trim() || rpState.loading) return;
  var msg = input.value.trim();
  rpState.messages.push({ role: 'user', content: msg });
  trackEvent('ai_question', { pillar: window._activeCourse ? window._activeCourse.pillar : null, course_key: window._activeCourse ? window._activeCourse.course_key : null, content: msg });
  input.value = ''; renderView(); await callCoach();
}
window.sendMsg = sendMsg;

async function callCoach() {
  rpState.loading = true; renderView();
  var c = coaches[rpState.coach];
  var sysPrompt = '';
  if (rpState.mode === 'ai_customer') {
    sysPrompt = 'You are a CUSTOMER in an appliance store. Stay in character as a realistic Canadian customer. Keep responses SHORT (2-4 sentences). Reference real products from data below.\n\nLIVE DATA:\n' + (rpState.context||'No data.');
  } else if (rpState.mode === 'ai_rep') {
    sysPrompt = 'You are an EXPERT APPLIANCE SALES REP demonstrating the 11-step sales process. Show techniques with [coaching notes]. Use real specs and prices.\n\nLIVE DATA:\n' + (rpState.context||'No data.');
  } else {
    sysPrompt = 'You are ' + c.name + ', ' + c.role + ' at ApplianceIQ.\nPERSONA: ' + c.desc + '\nKeep responses concise (2-4 paragraphs). Use real product data. Give actionable scripts. Canadian context.\n\nLIVE DATA:\n' + (rpState.context||'No data.');
  }
  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: sysPrompt, messages: rpState.messages.map(function(m){ return { role: m.role, content: m.content }; }) })
    });
    var data = await resp.json();
    var reply = data.content ? data.content.map(function(b){ return b.text || ''; }).join('') : 'Sorry, could not generate a response.';
    rpState.messages.push({ role: 'assistant', content: reply });
  } catch(e) { rpState.messages.push({ role: 'assistant', content: 'Connection error — please try again.' }); }
  rpState.loading = false; renderView();
}

function endChat() { rpState.coach = null; rpState.messages = []; rpState.loading = false; rpState.context = null; rpState.mode = null; renderView(); }
window.endChat = endChat;

// Human to Human recorder (from IQ Training)
function formatTime(s) { var m = Math.floor(s/60); var sec = s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }

function startRecording() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { alert('Speech recognition requires Chrome or Edge.'); return; }
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = new SpeechRec(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-CA';
  var recState = { recording: true, transcript: '', timer: 0 };
  window._recState = recState; window._recognition = recognition;
  window._recInterval = setInterval(function(){ recState.timer++; var t = document.getElementById('rec-timer'); if(t) t.textContent = formatTime(recState.timer); }, 1000);
  recognition.onresult = function(event) { var ft = ''; for (var i = event.resultIndex; i < event.results.length; i++) { if (event.results[i].isFinal) ft += event.results[i][0].transcript; } if (ft.trim()) { recState.transcript += (recState.transcript ? ' ' : '') + ft.trim(); var box = document.getElementById('transcript-box'); if (box) { box.innerHTML = '<p style="white-space:pre-line">' + esc(recState.transcript) + '</p>'; box.scrollTop = box.scrollHeight; } } };
  recognition.onerror = function(e) { if (e.error === 'no-speech') return; };
  recognition.onend = function() { if (recState.recording) recognition.start(); };
  recognition.start(); renderView();
}
window.startRecording = startRecording;

function stopRecording() { var recState = window._recState; if (!recState) return; recState.recording = false; if (window._recognition) { window._recognition.onend = null; window._recognition.stop(); } if (window._recInterval) clearInterval(window._recInterval); renderView(); }
window.stopRecording = stopRecording;

function clearRecording() { if (window._recognition) { window._recognition.onend = null; window._recognition.stop(); } if (window._recInterval) clearInterval(window._recInterval); window._recState = { recording: false, transcript: '', timer: 0 }; window._scorecard = null; renderView(); }
window.clearRecording = clearRecording;

async function scoreSession() {
  var recState = window._recState;
  if (!recState || !recState.transcript || recState.transcript.trim().length < 20) return;
  var mc = document.getElementById('main-content');
  mc.innerHTML = '<div style="text-align:center;padding:60px 20px"><div class="loading-spinner"></div><p style="margin-top:16px;color:var(--text2)">Analyzing ' + formatTime(recState.timer) + ' of practice...</p></div>';
  var scorePrompt = 'You are the ApplianceIQ Sales Scoring AI. Analyze this recorded sales practice session for appliance retail.\n\nIdentify who is the sales rep and who is the customer. Score across 12 categories (1-10): Greeting/Rapport, Needs Discovery, Product Knowledge, Feature-Benefit Selling, Objection Handling, Cross-Selling, Closing Technique, Follow-Up Setup, Product Demo, Value Building, Customer Engagement, Professionalism.\n\nRespond in JSON only: {"scores":{"Greeting":8,...},"total":85,"feedback":"...","rep_identified":"...","customer_identified":"..."}\n\nTranscript:\n' + recState.transcript;
  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: scorePrompt }] })
    });
    var data = await resp.json();
    var text = data.content ? data.content.map(function(b){ return b.text||''; }).join('') : '{}';
    var clean = text.replace(/```json|```/g, '').trim();
    window._scorecard = JSON.parse(clean);
  } catch(e) { window._scorecard = { scores: {}, total: 0, feedback: 'Could not parse results.' }; }
  renderView();
}

function renderScorecardResult(el) {

}

// CROSS-APP CONTEXT — Feeds live data from all apps into AI coach
// ══════════════════════════════════════════════════════════════════════════════
async function loadCrossAppContext() {
  var ctx = [];
  try {
    // PIM — latest products
    var { data: prods } = await sb.from('aiq_products').select('brand_name,model,category,msrp,sale_price,short_description').order('updated_at', { ascending: false }).limit(40);
    if (prods && prods.length) ctx.push('LIVE PIM PRODUCTS (' + prods.length + '):\n' + prods.map(function(p){ return '- ' + (p.brand_name||'') + ' ' + (p.model||'') + ' (' + (p.category||'') + ') $' + (p.msrp||'N/A') + (p.sale_price ? ' SALE $' + p.sale_price : ''); }).join('\n'));
    // CCR — competitive intel
    var { data: ccr } = await sb.from('competitive_cross_reference').select('category,tier,comparison_notes').limit(25);
    if (ccr && ccr.length) ctx.push('COMPETITIVE INTEL (' + ccr.length + '):\n' + ccr.map(function(c){ return '- [' + (c.tier||'') + ' ' + (c.category||'') + '] ' + (c.comparison_notes||'').substring(0,120); }).join('\n'));
    // CRM — recent deals/pipeline
    var { data: deals } = await sb.from('crm_deals').select('title,stage,value,brand').order('updated_at', { ascending: false }).limit(15);
    if (deals && deals.length) ctx.push('CRM PIPELINE (' + deals.length + ' recent):\n' + deals.map(function(d){ return '- ' + (d.title||'Deal') + ' | ' + (d.stage||'') + ' | $' + (d.value||0) + (d.brand ? ' | ' + d.brand : ''); }).join('\n'));
    // CRM — coaching reviews
    var { data: reviews } = await sb.from('ai_coaching_reviews').select('coaching_focus,score,summary').order('created_at', { ascending: false }).limit(10);
    if (reviews && reviews.length) ctx.push('COACHING REVIEWS (' + reviews.length + '):\n' + reviews.map(function(r){ return '- [' + (r.coaching_focus||'') + '] Score: ' + (r.score||'-') + ' — ' + (r.summary||'').substring(0,100); }).join('\n'));
    // Up System — recent interactions
    var { data: interactions } = await sb.from('iq_customer_interactions').select('interaction_type,product_interest,outcome,notes').order('created_at', { ascending: false }).limit(10);
    if (interactions && interactions.length) ctx.push('FLOOR INTERACTIONS (' + interactions.length + '):\n' + interactions.map(function(i){ return '- ' + (i.interaction_type||'') + ' | ' + (i.product_interest||'') + ' | ' + (i.outcome||'') + ' ' + (i.notes||'').substring(0,80); }).join('\n'));
    // Field — recent findings
    var { data: findings } = await sb.from('field_findings').select('category,severity,description').order('created_at', { ascending: false }).limit(10);
    if (findings && findings.length) ctx.push('FIELD FINDINGS (' + findings.length + '):\n' + findings.map(function(f){ return '- [' + (f.severity||'') + '] ' + (f.category||'') + ': ' + (f.description||'').substring(0,100); }).join('\n'));
    // Warranty & Recalls
    var { data: recalls } = await sb.from('aiq_recalls').select('brand_name,model,reason').order('recall_date', { ascending: false }).limit(10);
    if (recalls && recalls.length) ctx.push('ACTIVE RECALLS (' + recalls.length + '):\n' + recalls.map(function(r){ return '- ' + (r.brand_name||'') + ' ' + (r.model||'') + ': ' + (r.reason||''); }).join('\n'));
  } catch(e) { console.warn('Cross-app context load partial:', e); }
  return ctx.join('\n\n');
}

    { name:'Field Audits', icon:'📋', table:'field_findings', desc:'Store issues → compliance training' },
    { name:'Competitive Intel', icon:'⚔️', table:'competitive_cross_reference', desc:'214 matchups → Between Brands' },
    { name:'Warranties', icon:'📜', table:'aiq_warranty_policies', desc:'159 policies → Service IQ' },
    { name:'Recalls', icon:'⚠️', table:'aiq_recalls', desc:'103 recalls → Service IQ alerts' }
  ];
  sources.forEach(function(src) {
    connectionsHtml += '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-xs);padding:14px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">' + src.icon + '</span><strong style="font-size:13px;color:var(--navy)">' + src.name + '</strong><span style="font-size:10px;background:rgba(5,150,105,.1);color:var(--green);padding:2px 6px;border-radius:4px;font-weight:700;margin-left:auto">LIVE</span></div><div style="font-size:11px;color:var(--text3)">' + src.desc + '</div></div>';
  });
  connectionsHtml += '</div>';
  // Content suggestions + AI generate button
  var suggestionsHtml = '<div class="section-header"><h3>Content Development Queue</h3><div class="see-all" onclick="generateContentSuggestions()">✦ Generate AI Suggestions</div></div>'
    + '<div id="suggestions-list">' + renderSuggestionsList(suggestions) + '</div>';
  el.innerHTML = '<div class="dash-header"><h2>🧠 Intelligence Hub</h2><p>Learning analytics, cross-app insights, and content development</p></div>'
    + statsHtml + breakdownHtml + connectionsHtml + questionsHtml + suggestionsHtml;
}

function renderSuggestionsList(suggestions) {
  if (!suggestions.length) return '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:24px"><p style="color:var(--text2);font-size:14px;margin-bottom:12px">No content suggestions yet.</p><p style="color:var(--text3);font-size:12px">Click "Generate AI Suggestions" to analyze learning patterns and get module ideas.</p></div>';
  return '<div style="display:grid;gap:10px;margin-bottom:24px">' + suggestions.map(function(s) {
    var prioColor = s.priority === 'critical' ? 'var(--red)' : s.priority === 'high' ? 'var(--gold)' : s.priority === 'medium' ? 'var(--accent)' : 'var(--text3)';
    var statusColor = s.status === 'new' ? 'var(--cyan)' : s.status === 'accepted' ? 'var(--green)' : s.status === 'built' ? 'var(--navy)' : 'var(--text3)';
    return '<div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;border-left:3px solid ' + prioColor + '">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
      + '<span style="font-size:10px;font-weight:700;color:' + prioColor + ';text-transform:uppercase">' + (s.priority||'') + '</span>'
      + '<span style="font-size:10px;font-weight:700;color:' + statusColor + ';background:' + statusColor + '15;padding:2px 6px;border-radius:4px">' + (s.status||'') + '</span>'
      + (s.pillar ? '<span style="font-size:10px;color:var(--text3)">' + (pillarLabels[s.pillar]||s.pillar) + '</span>' : '') + '</div>'
      + '<h4 style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px">' + esc(s.title) + '</h4>'
      + '<p style="font-size:12px;color:var(--text2);line-height:1.5">' + esc(s.rationale||'') + '</p>'
      + '<div style="display:flex;gap:6px;margin-top:10px">'
      + '<button onclick="updateSuggestion(' + s.id + ',\'accepted\')" style="padding:4px 12px;font-size:11px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600">Accept</button>'
      + '<button onclick="updateSuggestion(' + s.id + ',\'dismissed\')" style="padding:4px 12px;font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;cursor:pointer;color:var(--text3);font-weight:600">Dismiss</button></div></div>';
  }).join('') + '</div>';
}
window.updateSuggestion = async function(id, status) {
  await sb.from('academy_content_suggestions').update({ status: status, reviewed_at: new Date().toISOString() }).eq('id', id);
  showToast('Suggestion ' + status);
  var mc = document.getElementById('main-content');
  renderIntelligenceHub(mc);
};

async function generateContentSuggestions() {
  showToast('Analyzing learning patterns...');
  // Gather intelligence from all sources
  var crossAppCtx = await loadCrossAppContext();
  var { data: events } = await sb.from('academy_learning_events').select('event_type,pillar,content').order('created_at', { ascending: false }).limit(200);
  var { data: courses } = await sb.from('iq_courses').select('pillar,name,course_key,chapter_slugs').order('pillar');
  var evtSummary = {};
  (events || []).forEach(function(e) {
    var k = (e.event_type||'') + '|' + (e.pillar||'general');
    if (!evtSummary[k]) evtSummary[k] = { count: 0, samples: [] };
    evtSummary[k].count++;
    if (evtSummary[k].samples.length < 3 && e.content) evtSummary[k].samples.push(e.content.substring(0,100));
  });
  var courseList = (courses||[]).filter(function(c){ return c.pillar !== 'brand_iq'; }).map(function(c){ return c.pillar + ' | ' + c.name + ' (' + (c.chapter_slugs||[]).length + ' chapters)'; }).join('\n');
  var prompt = 'You are the ApplianceIQ Training Content Strategist. Analyze this data and suggest 5 new training modules or content improvements.\n\n'
    + 'EXISTING COURSES:\n' + courseList + '\n\n'
    + 'LEARNING EVENT PATTERNS:\n' + JSON.stringify(evtSummary) + '\n\n'
    + 'CROSS-APP INTELLIGENCE:\n' + crossAppCtx.substring(0,8000) + '\n\n'
    + 'Respond in JSON only, no markdown. Array of objects: [{"type":"new_module|update_existing|new_cards|gap_alert","pillar":"sales_iq|product_iq|brand_iq|service_iq|leadership_iq","title":"...","rationale":"...","priority":"critical|high|medium|low"}]';
  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    var data = await resp.json();
    var text = data.content ? data.content.map(function(b){ return b.text||''; }).join('') : '[]';
    var clean = text.replace(/```json|```/g, '').trim();
    var ideas = JSON.parse(clean);
    // Insert suggestions
    for (var i = 0; i < ideas.length; i++) {
      await sb.from('academy_content_suggestions').insert({
        suggestion_type: ideas[i].type || 'new_module',
        pillar: ideas[i].pillar || null,
        title: ideas[i].title,
        rationale: ideas[i].rationale,
        priority: ideas[i].priority || 'medium',
        source_data: { events: Object.keys(evtSummary).length, generated_at: new Date().toISOString() }
      });
    }
    showToast(ideas.length + ' suggestions generated');
    var mc = document.getElementById('main-content');
    renderIntelligenceHub(mc);
  } catch(e) { showToast('Error generating suggestions: ' + e.message); }
}
window.generateContentSuggestions = generateContentSuggestions;

function timeAgo(ts) {
  if (!ts) return '';
  var diff = Date.now() - new Date(ts).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}
</script>
