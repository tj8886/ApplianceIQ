<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApplianceIQ Academy — Trade Portal</title>

<style>
:root{
  --navy:#0f1f3d;--navy-2:#16294a;--teal:#2f7d72;--teal-dark:#276b61;--teal-tint:#e6f0ed;
  --sand:#e9e0d0;--sand-text:#9c7c46;--ink:#1f2b3d;--steel:#64748b;--line:#e3e8ee;
  --bg:#f4f6f8;--card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
.logo-pill{background:var(--navy);color:#fff;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;font-family:'Sora',Arial,sans-serif}

/* Auth */
#auth-screen{position:fixed;inset:0;background:linear-gradient(160deg,#eef3f1,#f4f6f8);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.auth-box{width:100%;max-width:440px;padding:44px 38px;border:1px solid var(--line);background:var(--card);border-radius:22px;box-shadow:0 20px 60px rgba(15,31,61,.08)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.auth-logo-main{font-family:'Sora',Arial,sans-serif;font-size:20px;font-weight:800;color:var(--navy)}
.auth-sub{text-align:center;color:var(--steel);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;font-weight:700}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.auth-tab{flex:1;text-align:center;padding:11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--steel);border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--teal)}
.btn{background:var(--teal);color:#fff;border:none;padding:13px;border-radius:999px;font-family:'Sora',Arial,sans-serif;font-weight:700;font-size:14px;cursor:pointer;width:100%;transition:background .2s}
.btn:hover{background:var(--teal-dark)}
.msg{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.msg.err{background:#fdecec;color:#9c2c2c}
.msg.ok{background:var(--teal-tint);color:var(--teal-dark)}
.hint{font-size:11px;color:var(--steel);margin-top:4px}
.role-pick{display:flex;gap:10px;margin-bottom:8px}
.role-opt{flex:1;text-align:center;padding:14px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--steel)}
.role-opt.on{border-color:var(--teal);background:var(--teal-tint);color:var(--teal-dark)}

/* Shell */
#app{display:none}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;font-family:'Sora',Arial,sans-serif;font-weight:800;font-size:16px;color:var(--navy)}
.topbar-logo b{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:14px}
.role-chip{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:6px 14px;border-radius:999px;text-transform:capitalize}
.signout{background:none;border:1px solid var(--line);color:var(--steel);font-size:11px;padding:6px 14px;border-radius:999px;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:32px 22px 80px}
.page-eyebrow{font-size:10px;color:var(--teal);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.page-title{font-family:'Sora',Arial,sans-serif;font-size:clamp(24px,3.5vw,34px);font-weight:800;color:var(--navy);letter-spacing:-.6px;margin-bottom:8px}
.page-sub{color:var(--steel);font-size:14px;max-width:680px;margin-bottom:24px}

/* Controls */
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-size:14px;outline:none}
.search:focus{border-color:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--steel);font-size:12px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Vendor sections */
.v-section{margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(15,31,61,.04)}
.v-head{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;user-select:none}
.v-logo{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora',Arial,sans-serif;font-weight:800;font-size:15px}
.v-meta{flex:1}
.v-name{font-family:'Sora',Arial,sans-serif;font-size:17px;font-weight:700;color:var(--navy)}
.v-count{font-size:12px;color:var(--steel)}
.v-arrow{color:var(--steel);font-size:14px;transition:transform .2s}
.v-section.open .v-arrow{transform:rotate(180deg)}
.v-body{display:none;padding:0 22px 18px}
.v-section.open .v-body{display:block}
.cat-block{margin-top:14px}
.cat-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:8px}
.asset{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;text-decoration:none;transition:.15s}
.asset:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(15,31,61,.06)}
.asset-info{min-width:0}
.asset-title{font-size:14px;font-weight:700;color:var(--navy);font-family:'Sora',Arial,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-note{font-size:12px;color:var(--steel);margin-top:2px}
.asset-badge{font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:5px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.asset-badge.file{color:var(--sand-text);background:#f3ecdd}

.loading{text-align:center;padding:60px;color:var(--steel)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:var(--steel);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo"><span class="logo-pill">IQ</span><span class="auth-logo-main">ApplianceIQ <b style="color:var(--teal)">Academy</b></span></div>
    <div class="auth-sub" id="auth-sub">Trade Portal</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
      <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>
    <div id="auth-msg"></div>
    <div id="form-signin">
      <div class="field"><label>Email</label><input type="email" id="si-email" placeholder="you@yourfirm.com"></div>
      <div class="field"><label>Password</label><input type="password" id="si-pass" placeholder="••••••••"></div>
      <button class="btn" onclick="signIn()">Sign In</button>
    </div>
    <div id="form-register" style="display:none">
      <div class="field"><label>I am a…</label>
        <div class="role-pick">
          <div class="role-opt on" id="ro-builder" onclick="pickRole('builder')">🏗️ Builder</div>
          <div class="role-opt" id="ro-designer" onclick="pickRole('designer')">🎨 Designer</div>
        </div>
        <div class="hint">This tailors what you see — builders get specs, installation & availability; designers get CAD, finishes & imagery. You'll see everything either way, just organized for you.</div>
      </div>
      <div class="field"><label>Your name</label><input type="text" id="rg-name" placeholder="Jane Builder"></div>
      <div class="field"><label>Firm</label><input type="text" id="rg-firm" placeholder="Your company"></div>
      <div class="field"><label>Email</label><input type="email" id="rg-email" placeholder="you@yourfirm.com"></div>
      <div class="field"><label>Password</label><input type="password" id="rg-pass" placeholder="Choose a password"></div>
      <button class="btn" onclick="register()">Create Trade Account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><span class="logo-pill">IQ</span>ApplianceIQ <b>Academy</b></div>
    <div class="topbar-right">
      <span class="role-chip" id="role-chip">—</span>
      <button class="signout" onclick="signOut()">Sign Out</button>
    </div>
  </div>
  <div class="wrap" id="app-body"><div class="loading"><div class="spin"></div>Loading…</div></div>
</div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';
const sb = createClient(SB_URL, SB_KEY);

let ME=null, MYAUD='builder', CATS=null, VENDORS=[], ASSETS=[], FILTER='All', SEARCH='';
let REG_ROLE='builder';

// Category labels + which groups matter most per audience (ordering)
const CAT_LABEL={spec_sheet:'Spec / Cut Sheets',install_guide:'Installation Guides',owners_manual:'Owner & Use Manuals',warranty:'Warranty',energy_guide:'Energy Guides',parts_diagram:'Parts Diagrams',cad_file:'CAD / Revit / Design Files',sell_sheet:'Sell Sheets',product_image:'Product & Lifestyle Images',comparison:'Comparison Guides',faq_objection:'FAQ',promo:'Promotions',price_map:'Pricing',spiff:'Spiffs',coop:'Marketing Assets',launch:'Launch Kits',discontinuation:'Transition Notices',service_bulletin:'Service Bulletins',rep_directory:'Rep Directory',availability:'Availability & Lead Times',training_video:'Training Videos',training_doc:'Training Docs',certification:'Certification',brand_video:'Brand & Product Videos'};
// Preferred category order per audience (what they care about most, first)
const ORDER={
  builder:['spec_sheet','cad_file','install_guide','availability','energy_guide','warranty','owners_manual','launch','discontinuation','rep_directory','brand_video','product_image'],
  designer:['cad_file','product_image','spec_sheet','energy_guide','launch','comparison','brand_video','warranty','install_guide','availability','rep_directory','owners_manual']
};

function switchTab(t){
  document.getElementById('tab-signin').classList.toggle('active',t==='signin');
  document.getElementById('tab-register').classList.toggle('active',t==='register');
  document.getElementById('form-signin').style.display=t==='signin'?'block':'none';
  document.getElementById('form-register').style.display=t==='register'?'block':'none';
  msg('');
}
function pickRole(r){ REG_ROLE=r;
  document.getElementById('ro-builder').classList.toggle('on',r==='builder');
  document.getElementById('ro-designer').classList.toggle('on',r==='designer');
}
function msg(t,k){ document.getElementById('auth-msg').innerHTML=t?`<div class="msg ${k||'err'}">${t}</div>`:''; }

async function signIn(){
  msg('');
  const email=document.getElementById('si-email').value.trim(), pass=document.getElementById('si-pass').value;
  if(!email||!pass){ msg('Enter your email and password.'); return; }
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ msg(error.message); return; }
  boot();
}
async function register(){
  msg('');
  const name=document.getElementById('rg-name').value.trim();
  const firm=document.getElementById('rg-firm').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const pass=document.getElementById('rg-pass').value;
  if(!name||!email||!pass){ msg('Fill in your name, email, and password.'); return; }
  const {data:sd,error:se}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,firm}}});
  if(se){ msg(se.message); return; }
  const uid=sd.user?.id;
  if(!uid){ msg('Check your email to confirm, then sign in.','ok'); return; }
  const roleRow={user_id:uid,is_retailer:false};
  roleRow['is_'+REG_ROLE]=true;
  await sb.from('mfr_user_roles').upsert(roleRow);
  msg('Account created. Loading…','ok');
  setTimeout(boot,600);
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ document.getElementById('auth-screen').style.display='flex'; document.getElementById('app').style.display='none'; return; }
  ME=user;
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';

  const {data:role}=await sb.from('mfr_user_roles').select('*').eq('user_id',ME.id).maybeSingle();
  MYAUD = role?.is_designer ? 'designer' : (role?.is_builder ? 'builder' : 'builder');
  CATS = await (await fetch('mfr_categories.json')).json();

  const {data:vrows}=await sb.from('mfr_vendors').select('id,slug,name,tier').eq('status','active').order('name');
  VENDORS=vrows||[];
  const {data:arows}=await sb.from('mfr_assets').select('*').eq('is_published',true).order('created_at',{ascending:false});
  ASSETS=(arows||[]).filter(a=>!a.audiences||a.audiences.includes(MYAUD)||a.audiences.includes('all'));

  render();
}

function initials(name){ const p=name.replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean); return ((p[0]?.[0]||'')+(p[1]?.[0]||p[0]?.[1]||'')).toUpperCase(); }

function render(){
  document.getElementById('role-chip').textContent=MYAUD;
  const body=document.getElementById('app-body');
  const isB=MYAUD==='builder';
  const title=isB?'Builder Resource Portal':'Designer Resource Portal';
  const sub=isB
    ? 'Everything you need to spec and install with confidence — spec sheets, CAD/Revit files, installation guides, lead times, energy and warranty docs, organized by brand.'
    : 'Design-ready resources — CAD/Revit files, finishes, panel-ready specs, lifestyle and product imagery, and comparison guides, organized by brand.';

  // vendors that actually have assets for this audience
  const vendorIds=new Set(ASSETS.map(a=>a.vendor_id));
  const activeVendors=VENDORS.filter(v=>vendorIds.has(v.id));
  const tiers=['All',...Array.from(new Set(activeVendors.map(v=>v.tier).filter(Boolean)))];

  body.innerHTML=`
    <div class="page-eyebrow">Trade Portal</div>
    <h1 class="page-title">${title}</h1>
    <p class="page-sub">${sub}</p>
    <div class="controls">
      <input class="search" id="search" placeholder="Search brands, models, documents…" oninput="onSearch(this.value)">
    </div>
    <div class="chips" id="chips">${tiers.map(t=>`<button class="chip ${t===FILTER?'active':''}" onclick="setFilter('${t}')">${t}</button>`).join('')}</div>
    <div id="vendor-list"></div>`;
  renderList();
}
function onSearch(v){ SEARCH=v.toLowerCase(); renderList(); }
function setFilter(t){ FILTER=t; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.textContent===t)); renderList(); }

function renderList(){
  const wrap=document.getElementById('vendor-list');
  const vendorIds=new Set(ASSETS.map(a=>a.vendor_id));
  let activeVendors=VENDORS.filter(v=>vendorIds.has(v.id));
  if(FILTER!=='All') activeVendors=activeVendors.filter(v=>v.tier===FILTER);

  const order=ORDER[MYAUD]||Object.keys(CAT_LABEL);
  let html='';
  activeVendors.forEach(v=>{
    let assets=ASSETS.filter(a=>a.vendor_id===v.id);
    if(SEARCH){
      assets=assets.filter(a=>(a.title||'').toLowerCase().includes(SEARCH)||(a.model||'').toLowerCase().includes(SEARCH)||v.name.toLowerCase().includes(SEARCH)||(CAT_LABEL[a.category]||'').toLowerCase().includes(SEARCH));
    }
    if(!assets.length) return;
    // group by category, ordered
    const byCat={};
    assets.forEach(a=>{ (byCat[a.category]=byCat[a.category]||[]).push(a); });
    const cats=Object.keys(byCat).sort((a,b)=>{ const ia=order.indexOf(a),ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
    html+=`<div class="v-section" id="vs-${v.id}">
      <div class="v-head" onclick="document.getElementById('vs-${v.id}').classList.toggle('open')">
        <div class="v-logo">${initials(v.name)}</div>
        <div class="v-meta"><div class="v-name">${v.name}</div><div class="v-count">${assets.length} document${assets.length!==1?'s':''} · ${cats.length} categor${cats.length!==1?'ies':'y'}</div></div>
        <div class="v-arrow">▼</div>
      </div>
      <div class="v-body">
        ${cats.map(ck=>`<div class="cat-block"><div class="cat-label">${CAT_LABEL[ck]||ck}</div>
          ${byCat[ck].map(a=>{ const url=a.external_url||a.file_url||'#'; const isFile=!!a.file_url&&!a.external_url;
            return `<a class="asset" href="${url}" target="_blank" rel="noopener">
              <div class="asset-info"><div class="asset-title">${a.title}</div>${(a.model||a.description)?`<div class="asset-note">${[a.model,a.description].filter(Boolean).join(' · ')}</div>`:''}</div>
              <span class="asset-badge ${isFile?'file':''}">${isFile?'Download':'Open ↗'}</span></a>`;
          }).join('')}
        </div>`).join('')}
      </div>
    </div>`;
  });
  wrap.innerHTML = html || '<div class="empty">No resources match yet. As manufacturers upload files tagged for '+MYAUD+'s, they will appear here automatically.</div>';
  // open first vendor by default
  const first=document.querySelector('.v-section'); if(first) first.classList.add('open');
}

[signIn,signOut,register,switchTab,setFilter,pickRole].forEach(fn=>{if(typeof fn==='function')window[fn.name]=fn;});

boot();
</script>
<script src="https://ai-iq-coach.netlify.app/widget.js" data-app="academy"></script>
</body>
</html>
