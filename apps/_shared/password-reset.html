<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | ApplianceIQ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f7;color:#102540;font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:white;border:1px solid #dce4eb;border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 12px 36px #10254012}h1{font-size:26px;margin:8px 0}.brand{font-weight:750;color:#147b5b}label{display:block;font-weight:600;margin:18px 0 6px}input{width:100%;padding:12px;border:1px solid #9caebd;border-radius:7px;font:inherit}button{width:100%;border:0;border-radius:7px;background:#147b5b;color:white;font:inherit;font-weight:600;padding:12px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#147b5b}#message{padding:12px;background:#eef6f3;border-radius:7px;overflow-wrap:anywhere}#message[data-error="true"]{background:#fff0ef;color:#9d2722}[hidden]{display:none!important}.back{display:block;margin-top:22px;text-align:center}.hint{color:#52677a;font-size:14px}
  </style>
</head>
<body>
<main>
  <div class="brand">ApplianceIQ</div>
  <h1 id="heading">Reset your password</h1>
  <p id="message" role="status" aria-live="polite">Checking your reset link…</p>
  <form id="request-form" hidden>
    <label for="reset-email">Account email</label>
    <input id="reset-email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required>
    <button id="request-button" type="submit">Send reset email</button>
    <p class="hint">Use the email associated with your existing account. This does not create an account or change access permissions.</p>
  </form>
  <form id="password-form" hidden>
    <label for="new-password">New password</label>
    <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
    <p class="hint">Use at least 12 characters. Your password is shared by your ApplianceIQ apps.</p>
    <button id="save-button" type="submit">Save new password</button>
  </form>
  <a class="back" href="/">Back to sign in</a>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/+esm';
import { passwordRecovery } from './_aiq/password-recovery.mjs';
const authClient = createClient('__AIQ_US_URL__', '__AIQ_US_KEY__', { auth: { flowType: 'implicit' } });
const requestForm = document.getElementById('request-form'), passwordForm = document.getElementById('password-form');
let screen = 'request';
const recovery = passwordRecovery(authClient.auth, (state, message) => {
  if (['ready','request','expired','saved'].includes(state)) screen = state;
  requestForm.hidden = !['request','expired'].includes(screen);
  passwordForm.hidden = screen !== 'ready';
  const status = document.getElementById('message');
  status.textContent = message;
  status.dataset.error = String(state === 'error' || state === 'expired');
  if (state === 'saved' || state === 'expired') passwordForm.reset();
});
requestForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('request-button');
  button.disabled = true;
  try {
    const accepted = await recovery.request(document.getElementById('reset-email').value.trim(), location.origin + '/password-reset.html');
    if (accepted) { button.textContent = 'Request accepted'; setTimeout(() => { button.disabled = false; button.textContent = 'Send reset email'; }, 60000); }
    else button.disabled = false;
  } catch { button.disabled = false; }
});
passwordForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('save-button');
  button.disabled = true;
  try { await recovery.save(document.getElementById('new-password').value, document.getElementById('confirm-password').value); }
  finally { button.disabled = false; }
});
await recovery.initialize();
// Strip callback data after the SDK has finished processing it; never log or forward it.
history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
