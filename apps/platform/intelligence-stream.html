<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ Intelligence Stream</title><style>body{font-family:Inter,system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.card b{display:block;font-size:25px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h3{margin-top:0}.row{padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#ccfbf1;color:#0f766e;font-size:10px;font-weight:700;margin-right:6px}button,select{font:inherit;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Intelligence Stream</h1><div class="muted">Governed events, identities and cross-app outcomes</div></div><div><select id="range"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select> <button id="refresh">Refresh</button></div></div><div class="cards" id="cards"></div><div class="grid"><div class="panel"><h3>Store intelligence</h3><div id="stores"></div></div><div class="panel"><h3>Employee intelligence</h3><div id="employees"></div></div></div><div class="panel" style="margin-top:16px"><h3>Latest governed events</h3><div id="events"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');async function context(){const{data,error}=await sb.rpc('my_platform_context');if(error)throw error;return data}function since(){const d=new Date();d.setDate(d.getDate()-Number(document.getElementById('range').value));return d.toISOString()}async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const c=await context();if(!c?.organization_id)throw new Error('No active organization context');const s=since();const[sum,stores,employees,feed]=await Promise.all([sb.rpc('platform_intelligence_summary',{p_organization_id:c.organization_id,p_since:s}),sb.rpc('platform_intelligence_store_rollup',{p_organization_id:c.organization_id,p_since:s}),sb.rpc('platform_intelligence_employee_rollup',{p_organization_id:c.organization_id,p_since:s}),sb.rpc('platform_intelligence_feed',{p_organization_id:c.organization_id,p_since:s,p_limit:100,p_event_types:null})]);for(const r of[sum,stores,employees,feed])if(r.error)throw r.error;const x=sum.data||{};const metrics=[['Events',x.events||0],['Sales',x.sales||0],['Revenue','$'+Number(x.revenue||0).toLocaleString()],['Traffic groups',x.traffic_groups||0],['Interactions',x.interactions||0],['No sales',x.no_sales||0],['Learning',x.learning_events||0],['Field scores',x.field_scores||0]];document.getElementById('cards').innerHTML=metrics.map(m=>`<div class="card"><span class="muted">${m[0]}</span><b>${m[1]}</b></div>`).join('');document.getElementById('stores').innerHTML=(stores.data||[]).map(r=>`<div class="row"><b>${r.store_name||r.store_id}</b><br><span class="muted">Revenue $${Number(r.revenue||0).toLocaleString()} · Sales ${r.sales} · Conversion ${r.conversion_pct??'—'}% · Traffic ${r.traffic_groups}</span></div>`).join('')||'<div class="muted">No store intelligence yet.</div>';document.getElementById('employees').innerHTML=(employees.data||[]).map(r=>`<div class="row"><b>${r.display_name}</b><br><span class="muted">Revenue $${Number(r.revenue||0).toLocaleString()} · Sales ${r.sales} · Interactions ${r.interactions} · Learning ${r.learning_events}</span></div>`).join('')||'<div class="muted">No employee intelligence yet.</div>';document.getElementById('events').innerHTML=(feed.data||[]).map(r=>`<div class="row"><span class="pill">${r.event_type}</span><b>${r.source_system}</b> <span class="muted">${new Date(r.occurred_at).toLocaleString()} · ${r.subject_entity_type||''}</span></div>`).join('')||'<div class="muted">No events in range.</div>'}document.getElementById('refresh').onclick=load;document.getElementById('range').onchange=load;load().catch(e=>document.getElementById('events').innerHTML='<div class="muted">'+String(e.message||e)+'</div>');</script></body></html>
