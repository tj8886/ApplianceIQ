<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ePASS Setup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f8fafc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:10px}.btn{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#0d9488;color:#fff;border-color:#0d9488}.buttons{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px;border-radius:8px;background:#f8fafc;color:#475569;font-size:13px}.error{color:#dc2626}.ok{color:#16a34a}.resources{display:grid;grid-template-columns:150px 1fr;gap:9px;align-items:center}.small{font-size:12px;color:#64748b}@media(max-width:700px){.grid,.resources{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><h1>ePASS Setup</h1><p>Connect ePASS, import retail data, then match employees and stores.</p><div id="status" class="card notice">Loading…</div><div class="card"><h2>API Connection</h2><div class="grid"><div class="wide"><label>ePASS API base URL</label><input id="baseUrl" placeholder="https://..."></div><div><label>API key</label><input id="apiKey" type="password" autocomplete="off"></div><div><label>API secret</label><input id="apiSecret" type="password" autocomplete="off"></div><div><label>API key header</label><input id="keyHeader" value="X-API-Key"></div><div><label>API secret header</label><input id="secretHeader" value="X-API-Secret"></div></div><p class="small">Credentials are stored behind the connector Vault reference, not in ordinary connector settings.</p></div><div class="card"><h2>Endpoint Paths</h2><div id="resources" class="resources"></div><div class="buttons" style="margin-top:14px"><button class="btn primary" onclick="saveConfig()">Save</button><button class="btn" onclick="testConnection()">Test</button><button class="btn" onclick="runSync()">Run first sync</button><button class="btn" onclick="openMatching()">Match employees & stores</button></div><div id="result" class="notice" style="margin-top:14px">No action run yet.</div></div></div><script>const U='https://fumwwhyozeouoqscolke.supabase.co',K='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';const sb=supabase.createClient(U,K);const cid=new URLSearchParams(location.search).get('connection_id');const defs=[['customers','Customers'],['invoices','Invoices'],['models','Products / Models'],['service','Service Tickets'],['salespeople','Salespeople'],['locations','Stores / Locations']];let current={};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('resources').innerHTML=defs.map(([k,l])=>`<label>${esc(l)}</label><input id="ep-${k}" value="${esc(current?.configuration?.endpoints?.[k]||'')}" placeholder="Relative API path">`).join('')}async function invoke(action,payload={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign in to ApplianceIQ first.');const r=await fetch(`${U}/functions/v1/epass-sync`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':K},body:JSON.stringify({action,connection_id:cid,...payload})});const j=await r.json();if(!r.ok)throw new Error(j.detail||j.error||'Request failed');return j}async function load(){try{current=await invoke('status');const c=current.connection||{};document.getElementById('status').innerHTML=`<b>Status:</b> ${esc(c.status)} · <b>Auth:</b> ${esc(c.auth_status)} · <b>Last success:</b> ${esc(c.last_success_at||'never')}`;document.getElementById('baseUrl').value=current.configuration?.base_url||'';render()}catch(e){show(e.message,true)}}function endpoints(){const x={};for(const [k] of defs){const v=document.getElementById(`ep-${k}`).value.trim();if(v)x[k]=v}return x}async function saveConfig(){try{show('Saving…');const key=document.getElementById('apiKey').value,secret=document.getElementById('apiSecret').value;await invoke('configure',{base_url:document.getElementById('baseUrl').value.trim(),api_key_header:document.getElementById('keyHeader').value.trim(),api_secret_header:document.getElementById('secretHeader').value.trim(),endpoints:endpoints(),credential:(key||secret)?{api_key:key,api_secret:secret}:undefined});show('Configuration saved.',false,true);await load()}catch(e){show(e.message,true)}}async function testConnection(){try{show('Testing…');const j=await invoke('test');show(`Connection succeeded (HTTP ${j.status}).`,false,true)}catch(e){show(e.message,true)}}async function runSync(){try{show('Sync running…');const j=await invoke('sync',{sync_type:'full'});show(`Sync ${j.status}: ${j.processed||0} processed, ${j.failed||0} failed.`,j.status==='failed',j.status==='success')}catch(e){show(e.message,true)}}function openMatching(){location.href=`connector-onboarding.html?connection_id=${encodeURIComponent(cid)}`}function show(m,e=false,o=false){document.getElementById('result').innerHTML=`<span class="${e?'error':o?'ok':''}">${esc(m)}</span>`}load();</script></body></html>
