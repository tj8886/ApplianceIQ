<!DOCTYPE html>
<html lang="en" data-aiq-module="platform">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApplianceIQ Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#0a0f1e;--teal:#0d9488;--teal2:#14b8a6;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}button,select,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-weight:800;font-size:20px}.brand span{color:#2dd4bf}.side small{color:#94a3b8}.navbtn{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.navbtn.active,.navbtn:hover{background:rgba(20,184,166,.14);color:#5eead4}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}.context-select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;max-width:230px}.spacer{flex:1}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;position:relative}.badge{position:absolute;right:-5px;top:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:2px 6px}.body{padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}.context-card{background:#ecfeff;border:1px solid #99f6e4;padding:12px 14px;border-radius:10px;min-width:260px}.context-card b{display:block;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.app{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;position:relative}.app:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08);border-color:#99f6e4}.app .icon{font-size:28px}.app h3{margin:10px 0 5px}.app p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.tag{position:absolute;right:12px;top:12px;font-size:10px;padding:3px 7px;border-radius:999px;background:#ccfbf1;color:#0f766e;font-weight:700}.section-title{margin:28px 0 12px;font-size:15px}.drawer{position:fixed;top:0;right:-430px;width:min(430px,100vw);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(15,23,42,.12);z-index:20;transition:right .2s;padding:20px;overflow:auto}.drawer.open{right:0}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.notif{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.notif.unread b:before{content:'• ';color:var(--teal)}.notif small{color:var(--muted)}.searchbox{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:30;padding-top:12vh}.searchbox.open{display:block}.searchpanel{width:min(720px,92vw);margin:auto;background:#fff;border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.searchpanel input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px}.results{margin-top:10px;max-height:55vh;overflow:auto}.result{padding:10px;border-radius:8px;cursor:pointer}.result:hover{background:#f1f5f9}.result-type{font-size:10px;text-transform:uppercase;color:#0f766e;font-weight:700}.empty{padding:20px;color:var(--muted);text-align:center}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px;flex-wrap:wrap;height:auto;min-height:70px}.body{padding:18px}.hero{display:block}.context-card{margin-top:12px}.context-select{max-width:46vw}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div><div class="brand">Appliance<span>IQ</span></div><small>Retail Operating System</small></div><button class="navbtn active">Workspace</button><button class="navbtn" onclick="location.href='integrations.html'">Apps & Integrations</button><button class="navbtn" onclick="location.href='integration-health.html'">Integration Health</button><button class="navbtn" onclick="location.href='connector-reliability.html'">Reliability</button><button class="navbtn" onclick="location.href='connector-certification.html'">Certification</button><div style="margin-top:auto"><small id="userline">Loading user…</small></div></aside>
<main class="main"><div class="top"><select id="orgSelect" class="context-select" aria-label="Organization"></select><select id="locSelect" class="context-select" aria-label="Location"></select><div class="spacer"></div><button class="iconbtn" id="searchBtn">Search</button><button class="iconbtn" id="notifBtn">Notifications <span class="badge" id="notifBadge" style="display:none">0</span></button></div>
<div class="body"><div class="hero"><div><h1 id="hello">Your ApplianceIQ workspace</h1><div class="muted">One context, every app.</div></div><div class="context-card"><b>Current context</b><span id="ctxText">Organization-wide</span><div><button id="clearCtx" style="margin-top:8px;border:0;background:transparent;color:#0f766e;padding:0;cursor:pointer">Clear focused record</button></div></div></div><div class="section-title">Your apps</div><div class="grid" id="apps"></div><div class="section-title">Platform operations</div><div class="grid" id="ops"></div></div></main></div>
<div class="drawer" id="drawer"><div class="drawer-head"><h3>Notifications</h3><button class="iconbtn" id="closeDrawer">Close</button></div><div id="notifications"></div></div>
<div class="searchbox" id="searchbox"><div class="searchpanel"><input id="searchInput" placeholder="Search apps, customers, products, orders…"><div class="results" id="results"></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { createAIQContextBridge } from './aiq-context-bridge.js';
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');
const bridge=createAIQContextBridge({supabase:sb,moduleKey:'platform'});let ctx={},mods=[],notifs=[],searchTimer=null;
const APP_MAP={crm:'crm',spec_iq:'spec_iq',academy:'iq_academy',up_system:'iq_up_system',command_center:'command_center',field:'iq_field',product_iq:'product_iq',scraper:'pim_scraper',ai_coach:'ai_coach'};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}document.getElementById('userline').textContent=session.user.user_metadata?.full_name||session.user.email;ctx=await bridge.init();const [o,m,e,n]=await Promise.all([bridge.organizations(),sb.from('platform_modules').select('*').eq('is_active',true).order('display_order'),sb.rpc('my_entitled_apps'),sb.from('crm_notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30)]);mods=m.data||[];notifs=n.data||[];renderOrgs(o);await renderLocs();renderContext();renderApps(Array.isArray(e.data)?e.data:null);renderNotifs();}
function renderOrgs(rows){const s=document.getElementById('orgSelect');s.innerHTML=rows.map(x=>`<option value="${x.organization_id}" ${x.organization_id===ctx.organization_id?'selected':''}>${x.organization_name}</option>`).join('')}
async function renderLocs(){const rows=await bridge.locations(ctx.organization_id);const s=document.getElementById('locSelect');s.innerHTML='<option value="">All locations</option>'+rows.map(x=>`<option value="${x.location_id}" ${x.location_id===ctx.location_id?'selected':''}>${x.location_name}${x.location_code?' · '+x.location_code:''}</option>`).join('')}
function renderContext(){document.getElementById('ctxText').textContent=ctx.entity_type?`${ctx.entity_type}: ${ctx.entity_label||ctx.entity_id}`:(ctx.location_name||'Organization-wide');document.getElementById('hello').textContent=ctx.organization_name?`${ctx.organization_name} workspace`:'Your ApplianceIQ workspace'}
function allowed(m,ent){if(!ent)return true;const k=APP_MAP[m.key];return !k||ent.includes(k)}function card(m){return `<div class="app" data-key="${m.key}"><span class="tag">${m.marketplace_category||'App'}</span><div class="icon">${m.icon||'◻'}</div><h3>${m.name}</h3><p>${m.description||''}</p></div>`}
function renderApps(ent){const publicMods=mods.filter(m=>m.visibility==='public'&&allowed(m,ent));document.getElementById('apps').innerHTML=publicMods.map(card).join('')||'<div class="empty">No apps enabled.</div>';document.getElementById('ops').innerHTML=mods.filter(m=>m.visibility==='private'&&m.key!=='workspace').map(card).join('');document.querySelectorAll('.app').forEach(el=>el.onclick=()=>openModule(el.dataset.key))}
async function openModule(key){const m=mods.find(x=>x.key===key);if(!m?.app_url)return;await bridge.setContext({source_module_key:'platform'});const {data:{session}}=await sb.auth.getSession();let url=m.app_url;if(url.startsWith('/')){location.href=url;return}const relay=btoa(JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,expires_at:session.expires_at}));const c=btoa(unescape(encodeURIComponent(JSON.stringify({organization_id:ctx.organization_id,location_id:ctx.location_id,entity_type:ctx.entity_type,entity_id:ctx.entity_id,entity_label:ctx.entity_label}))));window.open(`${url}#aiq_relay=${relay}&aiq_context=${encodeURIComponent(c)}`,'_blank')}
async function focusAndOpen(row){ctx=await bridge.setContext({organization_id:row.organization_id,location_id:row.location_id||ctx.location_id,entity_type:row.entity_type,entity_id:row.entity_id,entity_label:row.entity_label,source_module_key:'platform',context:{search:true}});renderContext();searchbox.classList.remove('open');await openModule(row.module_key)}
function renderNotifs(){const unread=notifs.filter(n=>!n.is_read).length,b=document.getElementById('notifBadge');b.textContent=unread;b.style.display=unread?'block':'none';document.getElementById('notifications').innerHTML=notifs.map(n=>`<div class="notif ${n.is_read?'':'unread'}" data-id="${n.id}" data-url="${n.action_url||''}"><b>${n.title}</b><div>${n.body||''}</div><small>${new Date(n.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No notifications.</div>';document.querySelectorAll('.notif').forEach(el=>el.onclick=async()=>{const n=notifs.find(x=>x.id===el.dataset.id);if(n&&!n.is_read){await sb.rpc('platform_mark_notification_read',{p_notification_id:n.id});n.is_read=true;n.read_at=new Date().toISOString();renderNotifs()}if(el.dataset.url){if(el.dataset.url.startsWith('/'))location.href=el.dataset.url;else window.open(el.dataset.url,'_blank')}})}
document.getElementById('orgSelect').onchange=async e=>{ctx=await bridge.setContext({organization_id:e.target.value,location_id:null,entity_type:null,entity_id:null,entity_label:null,context:{}});await renderLocs();renderContext()};document.getElementById('locSelect').onchange=async e=>{ctx=await bridge.setContext({location_id:e.target.value||null,entity_type:null,entity_id:null,entity_label:null,context:{}});renderContext()};document.getElementById('clearCtx').onclick=async()=>{ctx=await bridge.clearEntity();renderContext()};
document.getElementById('notifBtn').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.remove('open');
const searchbox=document.getElementById('searchbox'),input=document.getElementById('searchInput');document.getElementById('searchBtn').onclick=()=>{searchbox.classList.add('open');input.focus()};searchbox.onclick=e=>{if(e.target===searchbox)searchbox.classList.remove('open')};input.oninput=e=>{clearTimeout(searchTimer);const q=e.target.value.trim();if(q.length<2){document.getElementById('results').innerHTML='';return}searchTimer=setTimeout(async()=>{const appRows=mods.filter(m=>(m.name+' '+(m.description||'')).toLowerCase().includes(q.toLowerCase())).map(m=>({entity_type:'app',entity_id:m.key,entity_label:m.name,subtitle:m.description,module_key:m.key}));const {data,error}=await sb.rpc('platform_global_search',{p_query:q,p_limit:30});const rows=[...appRows,...(error?[]:(data||[]))];document.getElementById('results').innerHTML=rows.map((r,i)=>`<div class="result" data-i="${i}"><div class="result-type">${r.entity_type}</div><b>${r.entity_label}</b><div class="muted">${r.subtitle||''}</div></div>`).join('')||'<div class="empty">No matches.</div>';document.querySelectorAll('.result').forEach(el=>el.onclick=()=>{const r=rows[Number(el.dataset.i)];if(r.entity_type==='app')openModule(r.module_key);else focusAndOpen(r)})},180)};
boot().catch(e=>{console.error(e);document.body.innerHTML='<div class="empty">Workspace failed to load: '+String(e.message||e)+'</div>'});
</script></body></html>
