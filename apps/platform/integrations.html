<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ApplianceIQ Integrations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f172a;--slate:#475569;--muted:#94a3b8;--line:#e2e8f0;--bg:#f8fafc;--teal:#0d9488;--teal2:#0f766e;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--navy)}button,input{font:inherit}.wrap{max-width:1240px;margin:0 auto;padding:30px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:var(--slate)}.pill{padding:7px 12px;border-radius:999px;background:#ccfbf1;color:var(--teal2);font-size:12px;font-weight:700}.tabs{display:flex;gap:8px;margin-bottom:22px}.tab{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px;font-weight:700;color:var(--slate);cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.search{flex:1;min-width:240px;border:1px solid var(--line);padding:10px 12px;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;min-height:236px}.cardtop{display:flex;gap:12px;align-items:flex-start}.logo{width:44px;height:44px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-weight:900;font-size:18px}.title{flex:1}.title h3{margin:0;font-size:16px}.vendor{font-size:12px;color:var(--muted);margin-top:3px}.desc{font-size:13px;line-height:1.5;color:var(--slate);margin:14px 0;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tag{font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;background:#f1f5f9;color:var(--slate)}.status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.status.active{color:var(--green)}.status.beta{color:var(--amber)}.status.planned{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:8px;font-weight:700;color:var(--navy);cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal2)}.btn:disabled{opacity:.45;cursor:not-allowed}.empty,.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;color:var(--slate)}.connections{display:flex;flex-direction:column;gap:12px}.connection{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px}.connection .grow{flex:1}.connection h3{margin:0 0 4px;font-size:15px}.connection p{margin:0;color:var(--muted);font-size:12px}.modalback{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px}.modalback.open{display:flex}.modal{background:#fff;width:min(600px,100%);border-radius:14px;padding:24px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 5px}.modal p{color:var(--slate);font-size:13px}.variants{display:grid;gap:9px;margin:18px 0}.variant{border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer}.variant.selected{border-color:var(--teal);background:#f0fdfa}.variant b{display:block;font-size:14px}.variant span{font-size:12px;color:var(--muted)}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.error{color:var(--red);font-size:13px;margin-top:10px}.loading{padding:30px;text-align:center;color:var(--muted)}
</style></head>
<body>
<div class="wrap"><div class="head"><div><h1>Apps & Integrations</h1><p>Connect your retail systems once, then let ApplianceIQ apps use the data you authorize.</p></div><div class="pill">IQ Connector Platform</div></div><div class="tabs"><button class="tab active" data-tab="catalog">Connectors</button><button class="tab" data-tab="connections">My Connections</button></div><div id="catalogView"><div class="toolbar"><input id="search" class="search" placeholder="Search Shopify, Dynamics, STORIS, ePASS…"></div><div id="catalog" class="loading">Loading connectors…</div></div><div id="connectionsView" style="display:none"><div id="connections" class="loading">Loading connections…</div></div></div>
<div class="modalback" id="connectModal"><div class="modal"><h2 id="modalTitle">Connect</h2><p id="modalDesc"></p><div id="variants" class="variants"></div><div id="modalError" class="error"></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="continueBtn" onclick="prepareConnection()">Continue</button></div></div></div>
<script>
const SUPABASE_URL='https://fumwwhyozeouoqscolke.supabase.co',SUPABASE_ANON_KEY='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let connectors=[],connections=[],selectedConnector=null,selectedVariant=null,organizationId=null;
const ONBOARDING_CONNECTORS=new Set(['microsoft_dynamics_365','epass','oracle_xstore','shopify','storis','retailvantage','windward']);
async function getContext(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('catalog').innerHTML='<div class="notice"><strong>Sign-in required.</strong> Open this page inside the ApplianceIQ platform after signing in.</div>';return null}const {data:members,error}=await sb.from('organization_members').select('organization_id,role,status').eq('user_id',session.user.id).eq('status','active').limit(1);if(error||!members?.length){document.getElementById('catalog').innerHTML='<div class="notice">No active ApplianceIQ organization was found for this account.</div>';return null}organizationId=members[0].organization_id;return session}
async function invoke(action,payload={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Session expired');const r=await fetch(`${SUPABASE_URL}/functions/v1/connector-runtime`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,...payload})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function loadCatalog(){try{const j=await invoke('catalog');connectors=j.connectors||[];renderCatalog()}catch(e){document.getElementById('catalog').innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`}}
async function loadConnections(){if(!organizationId)return;try{const j=await invoke('connections',{organization_id:organizationId});connections=j.connections||[];renderConnections()}catch(e){document.getElementById('connections').innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`}}
function renderCatalog(){const q=document.getElementById('search').value.toLowerCase(),rows=connectors.filter(c=>(c.name+' '+c.vendor_name+' '+(c.description||'')).toLowerCase().includes(q));document.getElementById('catalog').className='grid';document.getElementById('catalog').innerHTML=rows.map(c=>{const can=c.status==='active'||c.status==='beta';return `<div class="card"><div class="cardtop"><div class="logo">${escapeHtml((c.name||'?').slice(0,2).toUpperCase())}</div><div class="title"><h3>${escapeHtml(c.name)}</h3><div class="vendor">${escapeHtml(c.vendor_name||'')}</div></div><div class="status ${c.status}">${escapeHtml(c.status)}</div></div><div class="desc">${escapeHtml(c.description||'Retail system connector for the ApplianceIQ data platform.')}</div><div class="meta"><span class="tag">${escapeHtml(c.category||'integration')}</span><span class="tag">${escapeHtml(c.auth_type||'auth')}</span>${c.variants?.length?`<span class="tag">${c.variants.length} products</span>`:''}</div><div class="actions"><button class="btn primary" ${can?'':'disabled'} onclick="openConnect('${c.key}')">${can?'Connect':'Coming soon'}</button></div></div>`}).join('')||'<div class="empty">No connectors match your search.</div>'}
function renderConnections(){const el=document.getElementById('connections');el.className='connections';if(!connections.length){el.innerHTML='<div class="empty">No systems connected yet. Choose a connector from the Connectors tab.</div>';return}el.innerHTML=connections.map(x=>{const c=connectors.find(z=>z.id===x.connector_id),v=c?.variants?.find(z=>z.id===x.variant_id),oauth=c?.key==='microsoft_dynamics_365'&&x.auth_status==='not_configured',hasOnboarding=ONBOARDING_CONNECTORS.has(c?.key);return `<div class="connection"><div class="logo">${escapeHtml((c?.name||'IQ').slice(0,2).toUpperCase())}</div><div class="grow"><h3>${escapeHtml(x.display_name||v?.name||c?.name||'Connection')}</h3><p>${escapeHtml(c?.name||'Connector')} · ${escapeHtml(x.auth_status)} · ${escapeHtml(x.status)}</p></div><div class="actions">${oauth?`<button class="btn primary" onclick="startMicrosoftAuth('${x.id}')">Sign in with Microsoft</button>`:''}${hasOnboarding?`<button class="btn" onclick="openOnboarding('${x.id}','${c?.key||''}')">Configure</button>`:''}</div><span class="status ${x.status==='active'?'active':x.status==='error'?'planned':'beta'}">${escapeHtml(x.status)}</span></div>`}).join('')}
function openOnboarding(id,key){location.href=key==='storis'?`storis-setup.html?connection_id=${encodeURIComponent(id)}`:`connector-onboarding.html?connection_id=${encodeURIComponent(id)}`}
function openConnect(key){selectedConnector=connectors.find(c=>c.key===key);selectedVariant=null;if(!selectedConnector)return;document.getElementById('modalTitle').textContent=`Connect ${selectedConnector.name}`;document.getElementById('modalDesc').textContent=selectedConnector.key==='microsoft_dynamics_365'?'Choose the Microsoft Dynamics 365 product used by this organization. You can add more Dynamics products afterward.':'Prepare this connector for your ApplianceIQ organization.';const vs=selectedConnector.variants||[];document.getElementById('variants').innerHTML=vs.length?vs.map(v=>`<div class="variant" data-key="${v.key}" onclick="selectVariant('${v.key}')"><b>${escapeHtml(v.name)}</b><span>${escapeHtml(v.description||v.api_family||'')}</span></div>`).join(''):'<div class="notice">No product variant is required for this connector.</div>';document.getElementById('modalError').textContent='';document.getElementById('connectModal').classList.add('open')}
function selectVariant(key){selectedVariant=selectedConnector.variants.find(v=>v.key===key);document.querySelectorAll('.variant').forEach(x=>x.classList.toggle('selected',x.dataset.key===key))}
function closeModal(){document.getElementById('connectModal').classList.remove('open')}
async function prepareConnection(){if(selectedConnector.variants?.length&&!selectedVariant){document.getElementById('modalError').textContent='Choose a product first.';return}const b=document.getElementById('continueBtn');b.disabled=true;b.textContent='Preparing…';try{await invoke('prepare_connection',{organization_id:organizationId,connector_key:selectedConnector.key,variant_key:selectedVariant?.key||null,display_name:selectedVariant?.name||selectedConnector.name,settings:{source:'platform_integrations_ui'}});closeModal();await loadConnections();switchTab('connections')}catch(e){document.getElementById('modalError').textContent=e.message}finally{b.disabled=false;b.textContent='Continue'}}
async function startMicrosoftAuth(connectionId){try{const {data:{session}}=await sb.auth.getSession();const r=await fetch(`${SUPABASE_URL}/functions/v1/microsoft-dynamics-auth`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'authorize',organization_id:organizationId,connection_id:connectionId,return_url:location.href})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Microsoft authorization could not start');if(j.authorization_url)location.href=j.authorization_url}catch(e){alert(e.message)}}
function switchTab(name){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));document.getElementById('catalogView').style.display=name==='catalog'?'block':'none';document.getElementById('connectionsView').style.display=name==='connections'?'block':'none';if(name==='connections')loadConnections()}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));document.getElementById('search').oninput=renderCatalog;(async()=>{const s=await getContext();if(s){await loadCatalog();await loadConnections()}})();
</script></body></html>
