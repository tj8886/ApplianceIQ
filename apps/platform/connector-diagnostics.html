<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connector Diagnostics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f172a;--slate:#475569;--muted:#94a3b8;--line:#e2e8f0;--bg:#f8fafc;--teal:#0d9488;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--navy)}button{font:inherit}.wrap{max-width:1280px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--slate)}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.v{font-size:26px;font-weight:800;margin-top:6px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.panel{margin-top:14px}.panel h2{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0}.row:first-child{border-top:0}.grow{flex:1}.title{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f1f5f9;margin-right:5px}.empty{color:var(--muted);padding:16px 0}.error{color:var(--red);margin:14px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.back{color:var(--slate);text-decoration:none;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}.top{flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="top"><div><a class="back" href="integrations.html">← Apps & Integrations</a><h1 id="title">Connector Diagnostics</h1><p id="subtitle">Loading connector health…</p></div><div class="actions"><button class="btn" onclick="refreshAll()">Refresh</button><button class="btn primary" onclick="recalc()">Recalculate Health</button></div></div><div id="error" class="error"></div><div class="grid"><div class="card"><div class="k">Health Score</div><div class="v" id="score">—</div></div><div class="card"><div class="k">Status</div><div class="v" id="status">—</div></div><div class="card"><div class="k">Unresolved Mappings</div><div class="v" id="matches">—</div></div><div class="card"><div class="k">Last Success</div><div class="v" style="font-size:16px" id="lastSuccess">—</div></div></div><div class="panel"><h2>Reconciliation</h2><div id="recon"></div></div><div class="panel"><h2>Quarantine & Dead Letters</h2><div id="quarantine"></div></div><div class="panel"><h2>Recent Sync Jobs</h2><div id="jobs"></div></div></div>
<script>
const SUPABASE_URL='https://fumwwhyozeouoqscolke.supabase.co',SUPABASE_ANON_KEY='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const qs=new URLSearchParams(location.search),connectionId=qs.get('connection_id');let state=null;
async function call(action,payload={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign-in required');const r=await fetch(`${SUPABASE_URL}/functions/v1/connector-diagnostics`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,connection_id:connectionId,...payload})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function fmtDate(v){if(!v)return 'Never';try{return new Date(v).toLocaleString()}catch{return String(v)}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function healthClass(s){return s==='healthy'?'good':s==='degraded'?'warn':'bad'}
async function refreshAll(){document.getElementById('error').textContent='';if(!connectionId){document.getElementById('error').textContent='Missing connection_id.';return}try{state=await call('summary');render()}catch(e){document.getElementById('error').textContent=e.message}}
function render(){const c=state.connection||{},h=state.health||{};document.getElementById('title').textContent=`${c.display_name||c.platform_connectors?.name||'Connector'} Diagnostics`;document.getElementById('subtitle').textContent=`${c.platform_connectors?.name||'Connector'} · ${c.auth_status||'unknown auth'} · ${c.status||'unknown status'}`;document.getElementById('score').textContent=h.health_score??'—';document.getElementById('score').className='v '+healthClass(h.status);document.getElementById('status').textContent=(h.status||'No data').replace('_',' ');document.getElementById('status').className='v '+healthClass(h.status);document.getElementById('matches').textContent=state.unresolved_matches??0;document.getElementById('lastSuccess').textContent=fmtDate(c.last_success_at);
const r=state.reconciliation||[];document.getElementById('recon').innerHTML=r.length?r.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.status||'unknown')}</div><div class="meta">${fmtDate(x.started_at)} · source ${esc(JSON.stringify(x.source_counts||{}))} · IQ ${esc(JSON.stringify(x.iq_counts||{}))}</div><div class="meta">Discrepancies: ${esc(JSON.stringify(x.discrepancies||{}))}</div></div></div>`).join(''):'<div class="empty">No reconciliation runs yet.</div>';
const q=state.quarantine||[];document.getElementById('quarantine').innerHTML=q.length?q.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.external_entity_type)} · ${esc(x.external_id||'unknown')}</div><div class="meta"><span class="tag">${esc(x.status)}</span><span class="tag">${esc(x.stage)}</span><span class="tag">${esc(x.error_code||'error')}</span>${x.retryable?'<span class="tag">retryable</span>':''}</div><div class="meta">${esc(x.error_message||'')} · last seen ${fmtDate(x.last_seen_at)}</div></div><div class="actions">${x.retryable&&['quarantined','retrying'].includes(x.status)?`<button class="btn primary" onclick="act('retry','${x.id}')">Retry</button>`:''}${!['resolved','ignored'].includes(x.status)?`<button class="btn" onclick="act('resolve','${x.id}')">Resolve</button><button class="btn danger" onclick="act('ignore','${x.id}')">Ignore</button>`:''}</div></div>`).join(''):'<div class="empty">No quarantined records.</div>';
const j=state.jobs||[];document.getElementById('jobs').innerHTML=j.length?j.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.job_type||'sync')} · ${esc(x.status)}</div><div class="meta">Started ${fmtDate(x.started_at||x.created_at)} · completed ${fmtDate(x.completed_at)} · attempts ${esc(x.attempt_count??0)}</div>${x.error_details?`<div class="meta">${esc(JSON.stringify(x.error_details))}</div>`:''}</div></div>`).join(''):'<div class="empty">No sync jobs yet.</div>'}
async function act(action,id){try{await call(action,{quarantine_id:id});await refreshAll()}catch(e){document.getElementById('error').textContent=e.message}}
async function recalc(){try{await call('recalculate_health');await refreshAll()}catch(e){document.getElementById('error').textContent=e.message}}
refreshAll();
</script></body></html>
