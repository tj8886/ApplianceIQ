<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ApplianceIQ Connector Onboarding</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f172a;--slate:#475569;--muted:#94a3b8;--line:#e2e8f0;--bg:#f8fafc;--teal:#0d9488;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}button,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.head h1{margin:0;font-size:27px}.head p{margin:7px 0 0;color:var(--slate)}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;color:var(--slate);margin:12px 0}.section{background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}.section h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(210px,1.4fr) minmax(180px,1fr) 110px minmax(230px,1.2fr);gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #f1f5f9}.row:last-child{border-bottom:0}.name b{display:block;font-size:14px}.name span,.sub{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase}.confirmed{background:#dcfce7;color:#166534}.suggested{background:#fef3c7;color:#92400e}.needs_review,.unmatched{background:#fee2e2;color:#991b1b}.rejected{background:#e2e8f0;color:#475569}.confidence{font-size:12px;color:var(--slate)}.actions{display:flex;gap:7px;align-items:center}.actions select{min-width:145px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}.loading{padding:30px;text-align:center;color:var(--muted)}.error{color:var(--red)}@media(max-width:850px){.row{grid-template-columns:1fr}.head{display:block}.head .btn{margin-top:12px}}
</style>
</head>
<body><div class="wrap">
<div class="head"><div><h1>Business Central Setup</h1><p>Match Microsoft salespeople and locations to ApplianceIQ, review uncertain matches, then activate the connection.</p></div><button class="btn" onclick="history.back()">Back</button></div>
<div id="notice" class="notice">Loading connection…</div>
<div id="summary" class="summary"></div>
<div class="toolbar"><button class="btn primary" id="autoBtn" onclick="runAutoMatch()">Auto-match</button><button class="btn" onclick="loadStatus()">Refresh</button><button class="btn primary" id="activateBtn" onclick="activate()">Activate connection</button></div>
<div class="section"><h2>Salespeople</h2><div id="employees" class="loading">Loading…</div></div>
<div class="section"><h2>Locations</h2><div id="locations" class="loading">Loading…</div></div>
</div>
<script>
const SUPABASE_URL='https://fumwwhyozeouoqscolke.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const params=new URLSearchParams(location.search);const connectionId=params.get('connection_id');let state=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function invoke(action,payload={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign in to ApplianceIQ first.');const r=await fetch(`${SUPABASE_URL}/functions/v1/connector-onboarding`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,connection_id:connectionId,...payload})});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'Request failed'),{payload:j});return j}
async function loadStatus(){if(!connectionId){showError('Missing connection_id in the page URL.');return}try{state=await invoke('status');render()}catch(e){showError(e.message)}}
async function runAutoMatch(){setBusy('autoBtn',true,'Matching…');try{state=await invoke('auto_match');render()}catch(e){showError(e.message)}finally{setBusy('autoBtn',false,'Auto-match')}}
async function activate(){setBusy('activateBtn',true,'Activating…');try{state=await invoke('activate');render()}catch(e){if(e.payload?.summary)state={...(state||{}),summary:e.payload.summary};showError(e.message==='onboarding_review_incomplete'?'Review or reject every unresolved salesperson/location before activation.':e.message)}finally{setBusy('activateBtn',false,'Activate connection')}}
function setBusy(id,busy,label){const b=document.getElementById(id);b.disabled=busy;b.textContent=label}
function showError(msg){document.getElementById('notice').innerHTML=`<span class="error">${esc(msg)}</span>`}
function render(){const s=state?.summary||{};const c=state?.connection||{};document.getElementById('notice').innerHTML=`<b>Status:</b> ${esc(c.status||'pending')} · <b>Microsoft:</b> ${esc(c.auth_status||'unknown')} · <b>Last sync:</b> ${esc(c.last_success_at||'not yet synced')}${c.last_error?`<br><span class="error">${esc(c.last_error)}</span>`:''}`;document.getElementById('summary').innerHTML=[['Employees',s.employees_total||0],['Employees confirmed',s.employees_confirmed||0],['Employee review',s.employees_review||0],['Locations',s.locations_total||0],['Locations confirmed',s.locations_confirmed||0],['Location review',s.locations_review||0]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');document.getElementById('activateBtn').disabled=!s.ready;renderRows('employees','employee');renderRows('locations','location')}
function renderRows(elId,type){const rows=(state?.queue||[]).filter(x=>x.external_entity_type===type);const el=document.getElementById(elId);if(!rows.length){el.innerHTML='<div class="notice">Nothing discovered yet. Run the Business Central sync, then Auto-match.</div>';return}el.innerHTML=rows.map(r=>rowHtml(r,type)).join('')}
function rowHtml(r,type){const candidate=type==='employee'?(state?.candidates?.users||[]).find(x=>x.user_id===r.candidate_id):(state?.candidates?.locations||[]).find(x=>x.id===r.candidate_id);const opts=type==='employee'?(state?.candidates?.users||[]).map(x=>`<option value="${x.user_id}" ${x.user_id===r.candidate_id?'selected':''}>${esc(x.full_name||x.email||x.user_id)}</option>`).join(''):(state?.candidates?.locations||[]).map(x=>`<option value="${x.id}" ${x.id===r.candidate_id?'selected':''}>${esc(x.name)}${x.code?' · '+esc(x.code):''}</option>`).join('');return `<div class="row"><div class="name"><b>${esc(r.external_name||r.external_code||r.external_id)}</b><span>${esc(r.external_code||'')}${r.external_email?' · '+esc(r.external_email):''}</span></div><div><span class="badge ${esc(r.status)}">${esc(r.status)}</span><div class="sub">${esc(r.match_method||'No match yet')}</div></div><div class="confidence">${r.confidence!=null?Math.round(Number(r.confidence)*100)+'%':'—'}</div><div class="actions"><select id="sel-${r.id}"><option value="">Choose…</option>${opts}</select><button class="btn" onclick="confirmMatch('${r.id}','${type}','${esc(r.external_id)}')">Confirm</button>${type==='location'?`<button class="btn" onclick="createLocation('${esc(r.external_id)}')">Create</button>`:''}<button class="btn" onclick="rejectMatch('${r.id}')">Ignore</button></div></div>`}
async function confirmMatch(rowId,type,externalId){const v=document.getElementById(`sel-${rowId}`).value;if(!v)return alert('Choose a match first.');try{state=type==='employee'?await invoke('resolve_employee',{external_id:externalId,user_id:v}):await invoke('resolve_location',{external_id:externalId,location_id:v});render()}catch(e){showError(e.message)}}
async function createLocation(externalId){try{state=await invoke('resolve_location',{external_id:externalId,create:true});render()}catch(e){showError(e.message)}}
async function rejectMatch(matchId){try{state=await invoke('reject',{match_id:matchId});render()}catch(e){showError(e.message)}}
loadStatus();
</script></body></html>
