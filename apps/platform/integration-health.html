<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Integration Health</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#0f172a;--slate:#475569;--muted:#94a3b8;--line:#e2e8f0;--bg:#f8fafc;--teal:#0d9488;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--navy)}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.top h1{margin:0}.top p{margin:6px 0;color:var(--slate)}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.k{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.v{font-size:28px;font-weight:850;margin-top:6px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.panel{margin-top:14px}.panel h2{margin:0 0 12px;font-size:17px}.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.grow{flex:1}.title{font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:4px}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:800;margin-right:5px}.link{color:var(--teal);font-weight:800;text-decoration:none}.empty{color:var(--muted);padding:14px 0}.error{color:var(--red);margin:12px 0}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Integration Health</h1><p>System-wide connector health, alerts, reconciliation, and mapping readiness.</p></div><button class="btn" onclick="load()">Refresh</button></div><div id="error" class="error"></div><div class="cards"><div class="card"><div class="k">Overall Health</div><div class="v" id="health">—</div></div><div class="card"><div class="k">Connections</div><div class="v" id="connections">—</div></div><div class="card"><div class="k">Open Alerts</div><div class="v" id="alerts">—</div></div><div class="card"><div class="k">Quarantined</div><div class="v" id="quarantine">—</div></div><div class="card"><div class="k">Unresolved Mappings</div><div class="v" id="matches">—</div></div></div><div class="panel"><h2>Connector Status</h2><div id="rows"></div></div><div class="panel"><h2>Active Alerts</h2><div id="alertRows"></div></div></div><script>
const U='https://fumwwhyozeouoqscolke.supabase.co',K='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV',sb=supabase.createClient(U,K);let orgId=null;function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString():'Never'}function hc(s){return s==='healthy'?'good':s==='degraded'?'warn':'bad'}async function context(){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sign-in required');const {data:m,error}=await sb.from('organization_members').select('organization_id,role,status').eq('user_id',session.user.id).eq('status','active').limit(1);if(error||!m?.length)throw new Error('No active organization');orgId=m[0].organization_id;return session}async function load(){document.getElementById('error').textContent='';try{const s=await context();const r=await fetch(`${U}/functions/v1/connector-diagnostics`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.access_token}`,'apikey':K},body:JSON.stringify({action:'org_summary',organization_id:orgId})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Failed');render(j)}catch(e){document.getElementById('error').textContent=e.message}}function render(j){const s=j.summary||{};document.getElementById('health').textContent=s.overall_health_score??'—';document.getElementById('health').className='v '+(s.overall_health_score>=90?'good':s.overall_health_score>=70?'warn':'bad');document.getElementById('connections').textContent=s.connections??0;document.getElementById('alerts').textContent=s.open_alerts??0;document.getElementById('alerts').className='v '+(s.critical_alerts?'bad':s.open_alerts?'warn':'good');document.getElementById('quarantine').textContent=s.quarantined??0;document.getElementById('matches').textContent=s.unresolved_matches??0;const c=j.connections||[];document.getElementById('rows').innerHTML=c.length?c.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.display_name||x.platform_connectors?.name||'Connector')}</div><div class="meta">${esc(x.platform_connectors?.name||'')} · last success ${fmt(x.last_success_at)} · ${x.quarantine_count||0} quarantined · ${x.unresolved_matches||0} mappings</div></div><div><span class="tag ${hc(x.health?.status)}">${esc(x.health?.status||'no data')}</span><span class="tag">score ${esc(x.health?.health_score??'—')}</span><span class="tag">${x.open_alerts||0} alerts</span></div><a class="link" href="connector-diagnostics.html?connection_id=${encodeURIComponent(x.id)}">Diagnostics</a></div>`).join(''):'<div class="empty">No connector connections yet.</div>';const a=j.alerts||[];document.getElementById('alertRows').innerHTML=a.length?a.map(x=>`<div class="row"><div class="grow"><div class="title">${esc(x.title||x.alert_type)}</div><div class="meta"><span class="tag">${esc(x.severity)}</span><span class="tag">${esc(x.status)}</span> ${esc(x.message||'')}</div></div><a class="link" href="connector-diagnostics.html?connection_id=${encodeURIComponent(x.connection_id)}">Review</a></div>`).join(''):'<div class="empty">No active integration alerts.</div>'}load();
</script></body></html>
