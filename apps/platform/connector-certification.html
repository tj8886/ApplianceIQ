<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connector Certification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0}.top p{color:#64748b}.btn{border:1px solid #cbd5e1;background:white;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.head{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:800}.score{font-size:28px;font-weight:900}.tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#f1f5f9;margin-left:5px}.beta{color:#b45309}.certified{color:#15803d}.development{color:#64748b}.checks{margin-top:12px}.check{display:flex;justify-content:space-between;border-top:1px solid #e2e8f0;padding:8px 0;font-size:13px}.passed{color:#15803d}.failed{color:#b91c1c}.pending,.warning{color:#b45309}.empty{color:#94a3b8}.error{color:#b91c1c;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Connector Certification</h1><p>Development, Beta, and Certified status based on automated and live acceptance checks.</p></div><div><a class="btn" href="integration-health.html">Integration Health</a> <button class="btn" onclick="load()">Refresh</button></div></div><div id="err" class="error"></div><div id="grid" class="grid"></div></div><script>const U='https://fumwwhyozeouoqscolke.supabase.co',K='sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV',sb=supabase.createClient(U,K);let org=null;const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function ctx(){const{data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign-in required');const{data:m}=await sb.from('organization_members').select('organization_id').eq('user_id',session.user.id).eq('status','active').limit(1);if(!m?.length)throw Error('No active organization');org=m[0].organization_id;return session}async function load(){try{document.getElementById('err').textContent='';const s=await ctx();const r=await fetch(U+'/functions/v1/connector-certification',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({action:'summary',organization_id:org})});const j=await r.json();if(!r.ok)throw Error(j.error||'Failed');render(j.connectors||[])}catch(x){document.getElementById('err').textContent=x.message}}function render(rows){document.getElementById('grid').innerHTML=rows.length?rows.map(c=>{const q=c.certification||{},checks=c.checks||[],block=checks.filter(x=>x.required&&x.status!=='passed'&&x.status!=='not_applicable');return `<div class="card"><div class="head"><div><div class="name">${e(c.name)}</div><div><span class="tag ${e(q.lifecycle_status)}">${e(q.lifecycle_status||'development')}</span><span class="tag">${block.length} blocker${block.length===1?'':'s'}</span></div></div><div class="score">${e(q.certification_score??0)}%</div></div><div class="checks">${checks.map(x=>`<div class="check"><span>${e(x.check_name)}${x.required?' *':''}</span><strong class="${e(x.status)}">${e(x.status)}</strong></div>`).join('')}</div></div>`}).join(''):'<div class="empty">No connectors found.</div>'}load();</script></body></html>
