[build]
  base = "."
  command = "node scripts/migration/build-netlify-us.mjs"
  publish = ".aiq-netlify"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
