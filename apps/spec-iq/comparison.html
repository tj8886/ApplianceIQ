<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spec IQ Product Comparison</title>
<style>
:root{--navy:#0f1f3d;--paper:#f6f8fb;--line:#e3e8f0;--steel:#5b6b85;--focus:#2f6fed;--ok:#1a9e56;--danger:#c02d1e}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--navy)}header{background:var(--navy);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;color:var(--steel);font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--focus);color:#fff}.success{background:var(--ok);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.hidden{display:none}.notice{padding:12px 14px;border-radius:8px;margin-bottom:14px}.error{background:#fdecea;color:var(--danger)}.good{background:#e6f7ef;color:var(--ok)}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:10px;padding:16px;position:relative}.winner{border:2px solid var(--ok)}.score{font-size:30px;font-weight:800}.tag{display:inline-block;border-radius:100px;padding:4px 9px;background:#e8effd;color:var(--focus);font-size:12px;font-weight:700}.winner-tag{background:#e6f7ef;color:var(--ok)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--steel)}ul{padding-left:18px;color:var(--steel)}@media(max-width:760px){.grid,.grid2{grid-template-columns:1fr}.wrap{padding:16px}}
</style>
</head>
<body>
<header><strong>Spec IQ · Product Comparison</strong><a href="./">Back to Spec IQ</a></header>
<div class="wrap">
<div id="auth-card" class="card"><h2>Sign in</h2><div class="grid2"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><div style="margin-top:14px"><button class="primary" onclick="signIn()">Sign in</button></div></div>
<div id="app" class="hidden">
<div id="notice"></div>
<div class="card"><h1 style="margin-top:0">Compare products</h1><p style="color:var(--steel)">Enter two to four exact model numbers. The engine scores fit, budget, features and data confidence, then saves the result.</p><div class="grid"><div><label>Model 1</label><input class="model" placeholder="Model number"></div><div><label>Model 2</label><input class="model" placeholder="Model number"></div><div><label>Model 3</label><input class="model" placeholder="Optional"></div></div><div class="grid2" style="margin-top:14px"><div><label>Package to receive winner</label><select id="package"><option value="">Choose later</option></select></div><div><label>Comparison title</label><input id="title" placeholder="Kitchen refrigerator comparison"></div></div><div style="margin-top:16px"><button class="primary" onclick="compareProducts()">Run comparison</button> <button class="secondary" onclick="signOut()">Sign out</button></div></div>
<div id="results" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:14px;align-items:center"><div><h2 style="margin:0">Recommendation</h2><p id="summary" style="color:var(--steel)"></p></div><button id="add-winner" class="success" onclick="addWinner()">Add winner to package</button></div></div><div id="product-grid" class="products"></div><div class="card"><h2>Side-by-side</h2><div style="overflow:auto"><table><thead id="matrix-head"></thead><tbody id="matrix-body"></tbody></table></div></div></div>
</div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');window.sb=sb;
let user=null,organizationId=null,lastComparison=null;
const $=id=>document.getElementById(id);const money=v=>v==null?'—':new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(v);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.signIn=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return note(error.message,true);user=data.user;await boot()};
window.signOut=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){const{data:member,error}=await sb.from('organization_members').select('organization_id').eq('user_id',user.id).limit(1).single();if(error||!member)return note('No organization membership found.',true);organizationId=member.organization_id;$('auth-card').classList.add('hidden');$('app').classList.remove('hidden');const{data:packages}=await sb.from('speciq_packages').select('id,package_name,quote_number,status').eq('organization_id',organizationId).order('updated_at',{ascending:false});$('package').innerHTML='<option value="">Choose later</option>'+(packages??[]).map(p=>`<option value="${p.id}">${esc(p.quote_number||'Draft')} · ${esc(p.package_name)}</option>`).join('')}
window.compareProducts=async()=>{const models=[...document.querySelectorAll('.model')].map(x=>x.value.trim()).filter(Boolean);if(models.length<2)return note('Enter at least two model numbers.',true);note('Running comparison…');const{data,error}=await sb.functions.invoke('product-comparison-engine',{body:{organization_id:organizationId,models,title:$('title').value||null,save:true}});if(error||data?.error)return note(data?.error||error.message,true);lastComparison=data;render(data);note('Comparison saved.',false)};
function render(data){$('results').classList.remove('hidden');const winner=data.labelled_results?.best_overall;$('summary').textContent=winner?`${winner.brand} ${winner.model} scored highest overall at ${winner.overall_score}.`:'No overall winner was returned.';$('add-winner').disabled=!winner||!$('package').value;$('product-grid').innerHTML=(data.products||[]).map(p=>`<div class="product ${winner?.product_id===p.product_id?'winner':''}">${winner?.product_id===p.product_id?'<span class="tag winner-tag">Best overall</span>':'<span class="tag">Compared</span>'}<h3>${esc(p.brand)} ${esc(p.model)}</h3><div class="score">${p.overall_score}</div><div style="color:var(--steel);margin-bottom:8px">Overall score</div><div><strong>${money(p.pricing?.sale_price??p.pricing?.lowest_price??p.pricing?.msrp)}</strong></div><div style="color:var(--steel);font-size:13px;margin-top:8px">${esc(p.dimensions?.width)}″ W × ${esc(p.dimensions?.height)}″ H × ${esc(p.dimensions?.depth)}″ D</div><h4>Strengths</h4><ul>${(p.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>None verified</li>'}</ul><h4>Tradeoffs</h4><ul>${(p.tradeoffs||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>None identified</li>'}</ul></div>`).join('');const products=data.products||[];$('matrix-head').innerHTML='<tr><th>Measure</th>'+products.map(p=>`<th>${esc(p.brand)} ${esc(p.model)}</th>`).join('')+'</tr>';const rows=[['Overall score',p=>p.overall_score],['Physical fit',p=>p.component_scores?.physical_fit],['Budget fit',p=>p.component_scores?.budget_fit],['Required features',p=>p.component_scores?.required_features],['Data confidence',p=>p.component_scores?.data_confidence],['Price',p=>money(p.pricing?.sale_price??p.pricing?.lowest_price??p.pricing?.msrp)],['Width',p=>p.dimensions?.width??'—'],['Height',p=>p.dimensions?.height??'—'],['Depth',p=>p.dimensions?.depth??'—']];$('matrix-body').innerHTML=rows.map(r=>`<tr><th>${r[0]}</th>${products.map(p=>`<td>${esc(r[1](p))}</td>`).join('')}</tr>`).join('')}
window.addWinner=async()=>{if(!lastComparison)return;const packageId=$('package').value;if(!packageId)return note('Choose a package first.',true);const winner=lastComparison.labelled_results?.best_overall;if(!winner)return note('No winner is available.',true);const{data,error}=await sb.rpc('speciq_add_comparison_winner',{p_comparison_id:lastComparison.comparison_id,p_package_id:packageId,p_product_id:winner.product_id,p_selection_reason:`Best overall score: ${winner.overall_score}`});if(error)return note(error.message,true);note('Winner added to the selected package.',false);$('add-winner').disabled=true};
function note(text,isError=false){$('notice').innerHTML=text?`<div class="notice ${isError?'error':'good'}">${esc(text)}</div>`:''}
const{data:{session}}=await sb.auth.getSession();if(session){user=session.user;await boot()}
</script>
</body></html>
