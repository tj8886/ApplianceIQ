<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ AI Manager</title><style>:root{--navy:#0f1f3d;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--steel:#64748b;--accent:#6366f1;--ok:#16834a;--danger:#b42318;--amber:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.links a{color:var(--accent);text-decoration:none;margin-left:14px;font-weight:750;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--steel);font-weight:800}.stat .value{font-size:29px;font-weight:850;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 13px}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:#fff;color:var(--navy)}.muted{color:var(--steel)}.notice{padding:12px;border-radius:9px;background:#eef7f2;color:var(--ok);margin-bottom:14px}.error{background:#fdecea;color:var(--danger)}.brief h2{margin:4px 0}.money{font-size:26px;font-weight:850}.assign{display:grid;grid-template-columns:1fr auto;gap:18px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0ff;color:var(--accent);font-size:11px;font-weight:800}.critical{background:#fdecea;color:var(--danger)}.high{background:#fff4e5;color:var(--amber)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:8px 10px;font-size:12px}.due{font-size:12px;color:var(--steel);margin-top:8px}.overdue{color:var(--danger);font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}@media(max-width:720px){.assign{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:14px}.actions{justify-content:flex-start}}</style></head><body><div class="shell"><div class="top"><div><h1 style="margin:0">AI Manager</h1><div class="muted">Daily briefs, work assignment, overdue control and escalation</div></div><div class="links"><a href="./executive.html">Executive</a><a href="./predictions.html">Predictions</a><a href="./decisions.html">Decisions</a><a href="./">Command Centre</a></div></div><div id="notice"></div><div id="login" class="card"><h2>Sign in</h2><div class="toolbar"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div></div><div id="app" class="hidden"><div class="card toolbar"><select id="org"></select><button class="primary" id="run">Run manager cycle</button><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="signOut">Sign out</button></div><div id="summary" class="grid"></div><div id="brief"></div><div class="section-title"><h2>Active assignments</h2><span class="muted">Sorted by urgency and due date</span></div><div id="assignments"></div><div class="section-title"><h2>Escalations</h2></div><div id="escalations"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(v||0)),dt=v=>v?new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'No due date';let orgId;function note(t,e=false){$('#notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const{data,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('status','active');if(error)return note(error.message,true);const orgs=(data||[]).map(x=>x.organizations).filter(Boolean);$('#org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0]?.id;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(orgId)load()}async function load(){note('Loading manager workspace…');const{data,error}=await sb.rpc('ai_manager_get_dashboard',{p_organization_id:orgId});if(error)return note(error.message,true);render(data);note('')}function render(d){const s=d.summary||{};$('#summary').innerHTML=`<div class="card stat"><div class="label">Open</div><div class="value">${s.open||0}</div></div><div class="card stat"><div class="label">Overdue</div><div class="value">${s.overdue||0}</div></div><div class="card stat"><div class="label">Blocked</div><div class="value">${s.blocked||0}</div></div><div class="card stat"><div class="label">Escalations</div><div class="value">${s.open_escalations||0}</div></div><div class="card stat"><div class="label">Completed 7 days</div><div class="value">${s.completed_7d||0}</div></div>`;const b=d.brief;$('#brief').innerHTML=b?`<div class="card brief"><span class="badge">${esc(b.brief_type)} brief · ${esc(b.brief_date)}</span><h2>${esc(b.headline)}</h2><p>${esc(b.executive_summary)}</p><div class="money">${money(b.financial_exposure_cad)} open financial exposure</div><details><summary>Top priorities and risks</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify({priorities:b.priorities,risks:b.risks,wins:b.wins},null,2))}</pre></details></div>`:'<div class="card muted">No brief generated yet.</div>';$('#assignments').innerHTML=(d.assignments||[]).map(a=>{const overdue=a.due_at&&new Date(a.due_at)<new Date();return`<div class="card assign"><div><span class="badge ${esc(a.priority)}">${esc(a.priority)} · ${esc(a.status)}</span><h3>${esc(a.title)}</h3><div>${esc(a.instructions||'')}</div><div class="due ${overdue?'overdue':''}">${overdue?'Overdue: ':'Due: '}${esc(dt(a.due_at))}</div>${a.blocked_reason?`<div class="notice error" style="margin-top:10px">Blocked: ${esc(a.blocked_reason)}</div>`:''}</div><div class="actions"><button class="secondary" data-id="${a.id}" data-status="accepted">Accept</button><button class="secondary" data-id="${a.id}" data-status="in_progress">Start</button><button class="secondary" data-id="${a.id}" data-status="blocked">Block</button><button class="primary" data-id="${a.id}" data-status="completed">Complete</button></div></div>`}).join('')||'<div class="card muted">No active assignments.</div>';$('#escalations').innerHTML=(d.escalations||[]).map(e=>`<div class="card"><span class="badge critical">Level ${e.level}</span><h3>${esc(e.reason)}</h3><div class="muted">Created ${esc(dt(e.created_at))}</div></div>`).join('')||'<div class="card muted">No open escalations.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status))}async function update(id,status){let reason=null;if(status==='blocked')reason=prompt('Why is this blocked?')||'Blocked pending review';note('Updating assignment…');const{error}=await sb.rpc('ai_manager_update_assignment',{p_assignment_id:id,p_status:status,p_blocked_reason:reason,p_assigned_to:null,p_due_at:null});if(error)return note(error.message,true);await runCycle()}async function runCycle(){note('Running manager cycle…');const{data,error}=await sb.rpc('ai_manager_run_cycle',{p_organization_id:orgId});if(error)return note(error.message,true);note(`Cycle complete: ${data.new_assignments||0} new assignment(s), ${data.overdue||0} overdue, ${data.new_escalations||0} escalation(s).`);load()}$('#signIn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return note(error.message,true);boot()};$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#org').onchange=e=>{orgId=e.target.value;load()};$('#refresh').onclick=load;$('#run').onclick=runCycle;boot();</script><script src="https://ai-iq-coach.netlify.app/widget.js" data-app="command"></script>
</body></html>
