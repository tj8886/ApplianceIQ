<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ Command Center — Manager</title><style>:root{--navy:#0f1f3d;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--steel:#64748b;--accent:#6366f1;--ok:#16834a;--danger:#b42318;--amber:#d97706;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.shell{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.links a{color:var(--accent);text-decoration:none;margin-left:14px;font-weight:750;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--steel);font-weight:800}.stat .value{font-size:29px;font-weight:850;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 13px}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:#fff;color:var(--navy)}.coach-btn{background:var(--navy);color:#fff;border-color:var(--navy)}.muted{color:var(--steel)}.notice{padding:12px;border-radius:9px;background:#eef7f2;color:var(--ok);margin-bottom:14px}.error{background:#fdecea;color:var(--danger)}.brief h2{margin:4px 0}.money{font-size:26px;font-weight:850}.assign{display:grid;grid-template-columns:1fr auto;gap:18px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0ff;color:var(--accent);font-size:11px;font-weight:800}.critical{background:#fdecea;color:var(--danger)}.high{background:#fff4e5;color:var(--amber)}.medium{background:#eff6ff;color:var(--blue)}.low{background:#eef7f2;color:var(--ok)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:8px 10px;font-size:12px}.due{font-size:12px;color:var(--steel);margin-top:8px}.overdue{color:var(--danger);font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;gap:12px}.section-title h2{margin:0}.coach-row{display:grid;grid-template-columns:1.2fr 1.1fr .8fr auto;gap:16px;align-items:center}.coach-name{font-weight:850;font-size:16px}.coach-action{font-weight:750;margin-top:5px}.metric{font-size:12px;color:var(--steel);margin-top:4px}.meter{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:8px}.meter>span{display:block;height:100%;background:var(--accent)}.coaching-head{background:linear-gradient(135deg,#101f3e,#202f62);color:#fff;border:0}.coaching-head .muted{color:#cbd5e1}.coach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}.coach-grid .mini{background:rgba(255,255,255,.09);padding:14px;border-radius:12px}.coach-grid .mini strong{font-size:24px;display:block}.strategy{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}.empty{padding:22px;text-align:center;color:var(--steel)}@media(max-width:900px){.coach-row{grid-template-columns:1fr}.actions{justify-content:flex-start}}@media(max-width:720px){.assign{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:14px}.actions{justify-content:flex-start}}</style></head><body><div class="shell"><div class="top"><div><h1 style="margin:0">Command Center</h1><div class="muted">Manager operations + Coaching Intelligence</div></div><div class="links"><a href="./executive.html">Executive</a><a href="./predictions.html">Predictions</a><a href="./decisions.html">Decisions</a><a href="./">Command Center Home</a></div></div><div id="notice"></div><div id="login" class="card"><h2>Sign in</h2><div class="toolbar"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div></div><div id="app" class="hidden"><div class="card toolbar"><select id="org"></select><button class="primary" id="run">Run manager cycle</button><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="signOut">Sign out</button></div><div id="summary" class="grid"></div><div id="brief"></div><div class="section-title"><div><h2>Coaching Intelligence</h2><div class="muted">Who needs attention, why, and what IQ recommends next</div></div><button class="secondary" id="generateAdaptive">Generate adaptive coaching</button></div><div id="coachingSummary"></div><div id="coaching"></div><div class="section-title"><h2>Active assignments</h2><span class="muted">Sorted by urgency and due date</span></div><div id="assignments"></div><div class="section-title"><h2>Escalations</h2></div><div id="escalations"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(v||0)),dt=v=>v?new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'No due date',pct=v=>v==null?'—':`${Math.round(Number(v))}%`;let orgId,memberNames=new Map();function note(t,e=false){$('#notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const{data,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('status','active');if(error)return note(error.message,true);const orgs=(data||[]).map(x=>x.organizations).filter(Boolean);$('#org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0]?.id;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(orgId)load()}async function loadMemberNames(){memberNames=new Map();const{data}=await sb.rpc('get_org_member_profiles',{p_org_id:orgId});for(const m of(data||[])){const id=m.user_id||m.id||m.profile_id;const name=m.full_name||m.name||m.display_name||m.email;if(id&&name)memberNames.set(id,name)}}function repName(id){return memberNames.get(id)||`Rep ${String(id||'').slice(0,8)}`}async function load(){note('Loading manager workspace…');await loadMemberNames();const[mgr,adaptive,recs]=await Promise.all([sb.rpc('ai_manager_get_dashboard',{p_organization_id:orgId}),sb.rpc('phase5_manager_dashboard',{p_organization_id:orgId}),sb.rpc('phase5_manager_recommendations',{p_organization_id:orgId,p_limit:25})]);if(mgr.error)return note(mgr.error.message,true);render(mgr.data);renderCoaching(adaptive.data||{},recs.data||[]);note('')}function render(d){const s=d.summary||{};$('#summary').innerHTML=`<div class="card stat"><div class="label">Open</div><div class="value">${s.open||0}</div></div><div class="card stat"><div class="label">Overdue</div><div class="value">${s.overdue||0}</div></div><div class="card stat"><div class="label">Blocked</div><div class="value">${s.blocked||0}</div></div><div class="card stat"><div class="label">Escalations</div><div class="value">${s.open_escalations||0}</div></div><div class="card stat"><div class="label">Completed 7 days</div><div class="value">${s.completed_7d||0}</div></div>`;const b=d.brief;$('#brief').innerHTML=b?`<div class="card brief"><span class="badge">${esc(b.brief_type)} brief · ${esc(b.brief_date)}</span><h2>${esc(b.headline)}</h2><p>${esc(b.executive_summary)}</p><div class="money">${money(b.financial_exposure_cad)} open financial exposure</div><details><summary>Top priorities and risks</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify({priorities:b.priorities,risks:b.risks,wins:b.wins},null,2))}</pre></details></div>`:'<div class="card muted">No brief generated yet.</div>';$('#assignments').innerHTML=(d.assignments||[]).map(a=>{const overdue=a.due_at&&new Date(a.due_at)<new Date();return`<div class="card assign"><div><span class="badge ${esc(a.priority)}">${esc(a.priority)} · ${esc(a.status)}</span><h3>${esc(a.title)}</h3><div>${esc(a.instructions||'')}</div><div class="due ${overdue?'overdue':''}">${overdue?'Overdue: ':'Due: '}${esc(dt(a.due_at))}</div>${a.blocked_reason?`<div class="notice error" style="margin-top:10px">Blocked: ${esc(a.blocked_reason)}</div>`:''}</div><div class="actions"><button class="secondary" data-id="${a.id}" data-status="accepted">Accept</button><button class="secondary" data-id="${a.id}" data-status="in_progress">Start</button><button class="secondary" data-id="${a.id}" data-status="blocked">Block</button><button class="primary" data-id="${a.id}" data-status="completed">Complete</button></div></div>`}).join('')||'<div class="card muted">No active assignments.</div>';$('#escalations').innerHTML=(d.escalations||[]).map(e=>`<div class="card"><span class="badge critical">Level ${e.level}</span><h3>${esc(e.reason)}</h3><div class="muted">Created ${esc(dt(e.created_at))}</div></div>`).join('')||'<div class="card muted">No open escalations.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status))}function renderCoaching(d,recs){const s=d.summary||{};$('#coachingSummary').innerHTML=`<div class="card coaching-head"><div><strong style="font-size:18px">Adaptive Coaching Engine</strong><div class="muted">Live Phase 5 learning state for this organization</div></div><div class="coach-grid"><div class="mini"><span>Adaptive reps</span><strong>${s.adaptive_users||0}</strong></div><div class="mini"><span>Decisions</span><strong>${s.decisions||0}</strong></div><div class="mini"><span>Measured / learned</span><strong>${s.learned_decisions||0}</strong></div><div class="mini"><span>Strategy cells</span><strong>${s.strategy_cells||0}</strong></div></div></div>`;const profiles=new Map((d.profiles||[]).map(p=>[p.user_id,p]));$('#coaching').innerHTML=(recs||[]).map((r,i)=>{const p=profiles.get(r.user_id)||{};const priority=Number(r.priority_score||0);const level=priority>=70?'critical':priority>=50?'high':priority>=30?'medium':'low';const confidence=Math.max(0,Math.min(100,Number(r.confidence||p.confidence||0)*100));return`<div class="card coach-row"><div><span class="badge ${level}">${level.toUpperCase()} · ${Math.round(priority)} priority</span><div class="coach-name">${esc(repName(r.user_id))}</div><div class="coach-action">${esc(r.recommended_action||'Continue adaptive coaching')}</div><div class="metric">Learned interventions: ${r.learned_interventions||0}</div></div><div><div class="strategy">${esc(r.preferred_strategy||p.preferred_strategy||'foundation')}</div><div class="metric">Challenge ${r.challenge_level||p.challenge_level||2}/5 · ${esc(r.coaching_intensity||p.coaching_intensity||'standard')} intensity</div><div class="metric">Recent coaching success: ${pct(r.recent_success_rate??p.recent_success_rate)}</div><div class="meter"><span style="width:${confidence}%"></span></div><div class="metric">IQ confidence ${Math.round(confidence)}%</div></div><div><div class="metric">Learning velocity</div><strong>${r.learning_velocity==null?'—':Number(r.learning_velocity).toFixed(1)}</strong></div><div class="actions"><button class="secondary" data-plan="${r.user_id}">View plan</button><button class="primary" data-generate="${r.user_id}">Generate coaching</button><button class="coach-btn" data-coach="${r.user_id}">Open AI Coach</button></div></div>`}).join('')||'<div class="card empty">No coaching priorities yet. Phase 5 will populate these as performance evidence arrives.</div>';document.querySelectorAll('[data-generate]').forEach(b=>b.onclick=()=>generateForRep(b.dataset.generate));document.querySelectorAll('[data-coach]').forEach(b=>b.onclick=()=>openCoach(b.dataset.coach));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>showPlan(b.dataset.plan))}async function showPlan(userId){note(`Loading adaptive plan for ${repName(userId)}…`);const{data,error}=await sb.rpc('phase5_rep_plan',{p_organization_id:orgId,p_user_id:userId});if(error)return note(error.message,true);alert(`${repName(userId)}\n\nStrategy: ${data?.profile?.preferred_strategy||'foundation'}\nChallenge: ${data?.profile?.challenge_level||2}/5\nIntensity: ${data?.profile?.coaching_intensity||'standard'}\nActive interventions: ${(data?.active_interventions||[]).length}\nLearned interventions: ${(data?.recent_learning||[]).length}`);note('')}async function generateForRep(userId){note(`Generating adaptive coaching for ${repName(userId)}…`);const{data,error}=await sb.rpc('phase5_generate_adaptive_coaching',{p_organization_id:orgId,p_user_id:userId,p_focus_date:new Date().toISOString().slice(0,10)});if(error)return note(error.message,true);note(data?.status==='created'?`Adaptive coaching created for ${repName(userId)}.`:`No new intervention required for ${repName(userId)}.`);await load()}async function openCoach(userId){note(`Opening AI Coach for ${repName(userId)}…`);try{await sb.rpc('set_platform_context',{p_organization_id:orgId,p_location_id:null,p_entity_type:'employee',p_entity_id:userId,p_entity_label:repName(userId),p_source_module_key:'command-center',p_context:{intent:'coaching',source:'command-center',phase:5}})}catch{}window.open('https://ai-iq-coach.netlify.app/','_blank','noopener');note('')}async function generateOrg(){note('Generating adaptive coaching for highest-priority reps…');const{data,error}=await sb.rpc('phase5_generate_org_adaptive_coaching',{p_organization_id:orgId,p_focus_date:new Date().toISOString().slice(0,10),p_limit:10});if(error)return note(error.message,true);note(`Adaptive coaching cycle complete: ${(data||[]).length} intervention(s) created.`);await load()}async function update(id,status){let reason=null;if(status==='blocked')reason=prompt('Why is this blocked?')||'Blocked pending review';note('Updating assignment…');const{error}=await sb.rpc('ai_manager_update_assignment',{p_assignment_id:id,p_status:status,p_blocked_reason:reason,p_assigned_to:null,p_due_at:null});if(error)return note(error.message,true);await runCycle()}async function runCycle(){note('Running manager cycle…');const{data,error}=await sb.rpc('ai_manager_run_cycle',{p_organization_id:orgId});if(error)return note(error.message,true);note(`Cycle complete: ${data.new_assignments||0} new assignment(s), ${data.overdue||0} overdue, ${data.new_escalations||0} escalation(s).`);load()}$('#signIn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return note(error.message,true);boot()};$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#org').onchange=e=>{orgId=e.target.value;load()};$('#refresh').onclick=load;$('#run').onclick=runCycle;$('#generateAdaptive').onclick=generateOrg;boot();</script><script src="https://ai-iq-coach.netlify.app/widget.js" data-app="command"></script></body></html>
