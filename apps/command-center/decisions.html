<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ Decision Intelligence</title><style>
:root{--navy:#0f1f3d;--ink:#1f2b3d;--steel:#64748b;--line:#e3e8ee;--bg:#f4f6f8;--card:#fff;--accent:#6366f1;--ok:#1a9e56;--danger:#c02d1e;--amber:#e8590c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:28px 5%}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar button,input{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}.toolbar button,.btn{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border:0}.secondary{background:#fff;color:var(--navy)}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font-size:26px;color:var(--navy)}.stat span{font-size:12px;color:var(--steel)}.case{border-left:5px solid var(--accent)}.case.critical{border-left-color:var(--danger)}.case.high{border-left-color:var(--amber)}.case-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.score{font-size:26px;font-weight:800;color:var(--navy)}.meta{font-size:12px;color:var(--steel);text-transform:uppercase;letter-spacing:.5px}.recommend{background:#f7f8ff;border:1px solid #e4e5ff;border-radius:10px;padding:14px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-weight:700;background:#fff}.actions .accept{background:var(--accent);color:#fff;border:0}.actions .complete{background:var(--ok);color:#fff;border:0}.actions .reject{color:var(--danger)}.notice{padding:12px;border-radius:9px;margin-bottom:14px;background:#eef2ff;color:var(--navy)}.error{background:#fdecea;color:var(--danger)}@media(max-width:700px){.case-head{flex-direction:column}.wrap{padding:18px}}
</style></head><body>
<div class="top"><strong>ApplianceIQ · Decision Intelligence</strong><a href="./executive.html">Executive Intelligence</a></div>
<div class="wrap"><div id="auth" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"> <input id="password" type="password" placeholder="Password"> <button class="primary" onclick="signIn()">Sign in</button></div>
<div id="app" class="hidden"><div id="notice"></div><div class="card"><div class="toolbar"><select id="org"></select><button class="primary" onclick="syncFeed()">Sync intelligence</button><button class="secondary" onclick="loadFeed()">Refresh</button><button class="secondary" onclick="signOut()">Sign out</button></div></div><div id="stats" class="stats"></div><div id="feed"></div></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');window.sb=sb;const $=id=>document.getElementById(id);let user=null,orgId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>v==null?'Not estimated':new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(v);
window.signIn=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return note(error.message,true);user=data.user;await boot()};window.signOut=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){const{data,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('user_id',user.id).eq('status','active');if(error)return note(error.message,true);const orgs=(data??[]).map(x=>x.organizations).filter(Boolean);if(!orgs.length)return note('No organization membership found.',true);$('org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0].id;$('org').onchange=()=>{orgId=$('org').value;loadFeed()};$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadFeed()}
window.syncFeed=async()=>{note('Synchronizing current executive insights…');const{error}=await sb.rpc('decision_sync_executive_insights',{p_organization_id:orgId});if(error)return note(error.message,true);await loadFeed();note('Decision feed synchronized.')};
window.loadFeed=async()=>{const{data,error}=await sb.rpc('decision_get_feed',{p_organization_id:orgId,p_limit:50});if(error)return note(error.message,true);render(data??[])};
function render(items){const open=items.length,critical=items.filter(x=>x.severity==='critical').length,accepted=items.filter(x=>['accepted','in_progress'].includes(x.status)).length,avg=open?items.reduce((a,b)=>a+Number(b.priority_score||0),0)/open:0;$('stats').innerHTML=`<div class="stat"><b>${open}</b><span>Open decisions</span></div><div class="stat"><b>${critical}</b><span>Critical risks</span></div><div class="stat"><b>${accepted}</b><span>Accepted or active</span></div><div class="stat"><b>${avg.toFixed(1)}</b><span>Average priority</span></div>`;$('feed').innerHTML=items.length?items.map(c=>{const a=(c.actions||[])[0];return `<div class="card case ${esc(c.severity)}"><div class="case-head"><div><div class="meta">${esc(c.module)} · ${esc(c.decision_type)} · ${esc(c.severity)}</div><h2>${esc(c.title)}</h2><p>${esc(c.summary)}</p></div><div><div class="score">${Number(c.priority_score||0).toFixed(1)}</div><div class="meta">Priority</div></div></div><div class="recommend"><strong>Recommended action</strong><div>${esc(c.recommendation)}</div></div><div class="meta">Confidence ${Math.round(Number(c.confidence||0)*100)}% · Evidence ${c.evidence_count||0} · Impact ${money(c.financial_impact_cad)}</div>${c.consequence_if_ignored?`<p><strong>If ignored:</strong> ${esc(c.consequence_if_ignored)}</p>`:''}<div class="actions">${a?`<button class="accept" onclick="setAction('${a.id}','accepted')">Accept</button><button onclick="setAction('${a.id}','in_progress')">Start</button><button class="complete" onclick="setAction('${a.id}','completed')">Complete</button><button class="reject" onclick="setAction('${a.id}','rejected')">Reject</button>`:''}</div></div>`}).join(''):'<div class="card">No open decisions. Either operations are flawless, which seems unlikely, or the source systems need more evidence.</div>'}
window.setAction=async(id,status)=>{const payload={p_action_id:id,p_status:status,p_owner_id:null,p_due_at:null,p_outcome_success:status==='completed'?true:null,p_outcome_value:null,p_outcome_unit:null,p_outcome_notes:null};const{error}=await sb.rpc('decision_update_action',payload);if(error)return note(error.message,true);await loadFeed();note(`Action marked ${status.replace('_',' ')}.`)};
function note(t,e=false){$('notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}const{data:{session}}=await sb.auth.getSession();if(session){user=session.user;await boot()}
</script><script src="https://ai-iq-coach.netlify.app/widget.js" data-app="command"></script>
</body></html>
