<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ Executive Briefs</title><style>:root{--navy:#0f1f3d;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--steel:#64748b;--accent:#6366f1;--ok:#18794e;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}.top,.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.links a{margin-left:14px;color:var(--accent);font-weight:700;text-decoration:none;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat .label{font-size:11px;color:var(--steel);text-transform:uppercase;font-weight:800}.stat .value{font-size:29px;font-weight:850;margin-top:4px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.secondary{background:#fff;color:var(--navy)}.notice{padding:12px;border-radius:9px;background:#eef7f2;color:var(--ok);margin:12px 0}.error{background:#fdecea;color:var(--danger)}.brief h2{margin-bottom:4px}.meta,.muted{color:var(--steel)}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0ff;color:var(--accent);font-size:11px;font-weight:850}.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.money{font-size:24px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:760px){.cols{grid-template-columns:1fr}.shell{padding:14px}.top{align-items:flex-start}}@media print{body{background:#fff}.toolbar,.links,#login,#notice,.actions{display:none!important}.card{border:0;box-shadow:none}.shell{max-width:none;padding:0}}</style></head><body><div class="shell"><div class="top"><div><h1 style="margin:0">Executive Daily Brief</h1><div class="muted">Morning priorities, end-of-day results and weekly operating review</div></div><div class="links"><a href="./manager.html">AI Manager</a><a href="./predictions.html">Predictions</a><a href="./decisions.html">Decisions</a><a href="./">Command Centre</a></div></div><div id="notice"></div><div id="login" class="card"><h2>Sign in</h2><div class="toolbar" style="justify-content:flex-start"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div></div><div id="app" class="hidden"><div class="card toolbar"><select id="org"></select><div><button class="primary" data-gen="morning">Morning brief</button><button class="secondary" data-gen="end_of_day">End-of-day</button><button class="secondary" data-gen="weekly">Weekly review</button><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="signOut">Sign out</button></div></div><div id="summary" class="grid"></div><div id="briefs"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(v||0)),date=v=>v?new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:v.includes('T')?'short':undefined}).format(new Date(v)):'';let orgId;function note(t,e=false){$('#notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const{data,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('status','active');if(error)return note(error.message,true);const orgs=(data||[]).map(x=>x.organizations).filter(Boolean);$('#org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0]?.id;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(orgId)load()}async function load(){note('Loading executive briefs…');const{data,error}=await sb.rpc('ai_manager_get_executive_briefs',{p_organization_id:orgId,p_limit:20,p_focus_id:null});if(error||data?.error)return note(data?.error||error.message,true);render(data);note('')}function items(a,kind){return(a||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><div class="muted">${kind==='priority'?`${esc(x.module)} · Priority ${esc(x.priority_score)}${x.financial_impact_cad?` · ${money(x.financial_impact_cad)}`:''}`:kind==='risk'?`${esc(x.status)} · ${x.due_at?'Due '+date(x.due_at):'No due date'}`:`Completed ${date(x.completed_at)}`}</div>${x.recommendation?`<div>${esc(x.recommendation)}</div>`:''}${x.blocked_reason?`<div>${esc(x.blocked_reason)}</div>`:''}</div>`).join('')||'<div class="muted">None recorded.</div>'}function render(d){const s=d.summary||{};$('#summary').innerHTML=`<div class="card stat"><div class="label">Draft briefs</div><div class="value">${s.draft_count||0}</div></div><div class="card stat"><div class="label">Delivered</div><div class="value">${s.delivered_count||0}</div></div><div class="card stat"><div class="label">Last generated</div><div class="value" style="font-size:18px">${date(s.latest_generated_at)||'None'}</div></div>`;$('#briefs').innerHTML=(d.briefs||[]).map(b=>`<article class="card brief"><div class="toolbar"><div><span class="badge">${esc(b.brief_type.replaceAll('_',' '))}</span><h2>${esc(b.headline)}</h2><div class="meta">${date(b.period_start||b.brief_date)}${b.period_end&&b.period_end!==b.period_start?' to '+date(b.period_end):''} · Generated ${date(b.generated_at)}</div></div><div><div class="money">${money(b.financial_exposure_cad)}</div><div class="muted">open exposure</div></div></div><p style="font-size:18px;line-height:1.55">${esc(b.executive_summary)}</p><div class="grid"><div class="card stat"><div class="label">Open</div><div class="value">${b.workload?.open||0}</div></div><div class="card stat"><div class="label">Overdue</div><div class="value">${b.workload?.overdue||0}</div></div><div class="card stat"><div class="label">Completed</div><div class="value">${b.workload?.completed||0}</div></div><div class="card stat"><div class="label">Critical</div><div class="value">${b.workload?.critical||0}</div></div></div><div class="cols"><div><h3>Top priorities</h3>${items(b.priorities,'priority')}</div><div><h3>Risks and overdue work</h3>${items(b.risks,'risk')}<h3>Wins</h3>${items(b.wins,'win')}</div></div><div class="card" style="background:#f8fafc"><strong>Recommended focus</strong><div>${esc(b.narrative?.recommended_focus||'Review the highest-priority open assignment.')}</div><div class="muted" style="margin-top:5px">Predicted opportunity: ${money(b.narrative?.predicted_opportunity_cad)}</div></div><div class="actions"><button class="secondary" onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="emailBrief('${b.id}')">Email brief</button>${b.delivery_status!=='delivered'?`<button class="primary" data-deliver="${b.id}">Mark delivered</button>`:`<span class="notice" style="margin:0">Delivered ${date(b.delivered_at)}</span>`}</div></article>`).join('')||'<div class="card muted">No briefs yet. Generate the morning brief first.</div>';document.querySelectorAll('[data-deliver]').forEach(x=>x.onclick=()=>deliver(x.dataset.deliver))}async function generate(type){note('Generating brief…');const{data,error}=await sb.rpc('ai_manager_generate_executive_brief',{p_organization_id:orgId,p_brief_type:type,p_brief_date:new Date().toISOString().slice(0,10)});if(error)return note(error.message,true);note(`${type.replaceAll('_',' ')} generated.`);load()}async function deliver(id){const{error}=await sb.rpc('ai_manager_mark_brief_delivered',{p_brief_id:id,p_channels:['in_app']});if(error)return note(error.message,true);note('Brief marked delivered.');load()}$('#signIn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return note(error.message,true);boot()};$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#org').onchange=e=>{orgId=e.target.value;load()};$('#refresh').onclick=load;document.querySelectorAll('[data-gen]').forEach(x=>x.onclick=()=>generate(x.dataset.gen));boot();
window.emailBrief=async(briefId)=>{if(!confirm('Send this brief via email to organization admins and managers?'))return;note('Sending brief via email…');try{const{data:{session}}=await sb.auth.getSession();const resp=await fetch('https://fumwwhyozeouoqscolke.supabase.co/functions/v1/brief-email-sender',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({organization_id:orgId,brief_id:briefId})});const result=await resp.json();if(result.ok){note('Brief emailed to '+result.sent+' recipient(s).');load()}else{note(result.error+': '+(result.detail||''),true)}}catch(e){note(e.message,true)}};</script></body></html>
