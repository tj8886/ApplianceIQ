<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ My Work</title><style>:root{--navy:#0f1f3d;--bg:#f4f6f8;--card:#fff;--line:#dfe5ec;--muted:#64748b;--accent:#6366f1;--ok:#16894e;--danger:#c02d1e;--amber:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.shell{max-width:1240px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.links a{color:var(--accent);text-decoration:none;margin-left:14px;font-weight:700;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.toolbar,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat .v{font-size:29px;font-weight:800}.label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}.task{display:grid;grid-template-columns:1fr auto;gap:16px}.muted{color:var(--muted)}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{background:#fff;color:var(--danger);border-color:#f2b8b1}.ok{background:#fff;color:var(--ok);border-color:#b8dec8}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0ff;color:var(--accent);font-size:11px;font-weight:800;margin-right:5px}.hidden{display:none}.notice{padding:11px 13px;border-radius:9px;background:#eef7f2;color:var(--ok);margin-bottom:14px}.error{background:#fdecea;color:var(--danger)}dialog{width:min(760px,94vw);border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px #0003}dialog::backdrop{background:#0f172a99}.modal{padding:22px}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.item{padding:10px 0;border-bottom:1px solid var(--line)}textarea{width:100%;min-height:90px}.files input{max-width:100%}@media(max-width:700px){.task{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:14px}}</style></head><body><div class="shell"><div class="top"><div><h1 style="margin:0">My Work</h1><div class="muted">Named ownership, proof, approvals and escalation history</div></div><div class="links"><a href="./manager.html">AI Manager</a><a href="./briefs.html">Briefs</a><a href="./decisions.html">Decisions</a><a href="./">Command Centre</a></div></div><div id="notice"></div><div id="login" class="card"><h2>Sign in</h2><div class="toolbar"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div></div><div id="app" class="hidden"><div class="card toolbar"><select id="org"></select><select id="scope"><option value="mine">My work</option><option value="team">Team work</option></select><button class="primary" id="refresh">Refresh</button><button id="signOut">Sign out</button></div><div id="summary" class="grid"></div><div id="tasks"></div></div></div><dialog id="detail"><div class="modal"><div class="row" style="justify-content:space-between"><h2 id="detailTitle" style="margin:0"></h2><button onclick="document.querySelector('#detail').close()">Close</button></div><div id="detailBody"></div></div></dialog><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?new Date(d).toLocaleString('en-CA'): 'No deadline';let orgId,data,members=[],currentId;function note(t,e=false){$('#notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const{data:rows,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('status','active');if(error)return note(error.message,true);const orgs=(rows||[]).map(x=>x.organizations).filter(Boolean);$('#org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0]?.id;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(orgId)load()}async function load(){note('Loading work…');const{data:d,error}=await sb.rpc('ai_manager_get_my_work',{p_organization_id:orgId,p_scope:$('#scope').value});if(error||d?.error)return note(d?.error||error.message,true);data=d;members=d.members||[];render();note('')}function render(){const a=data.assignments||[];const pending=a.filter(x=>x.approval_status==='pending').length;const mine=a.filter(x=>x.assigned_to).length;$('#summary').innerHTML=`<div class="card stat"><div class="label">Visible tasks</div><div class="v">${a.length}</div></div><div class="card stat"><div class="label">Assigned</div><div class="v">${mine}</div></div><div class="card stat"><div class="label">Overdue</div><div class="v">${data.overdue||0}</div></div><div class="card stat"><div class="label">Pending approval</div><div class="v">${pending||data.pending_approvals||0}</div></div>`;$('#tasks').innerHTML=a.map(t=>`<div class="card task"><div><div><span class="badge">${esc(t.priority)}</span><span class="badge">${esc(t.status)}</span><span class="badge">${esc(t.approval_status)}</span></div><h2>${esc(t.title)}</h2><div class="muted">Owner: ${esc(t.assignee_name||t.assigned_role||'Unassigned')} · Due: ${esc(fmt(t.due_at))}</div><p>${esc(t.instructions||'')}</p><div class="muted">${t.comments} comments · ${t.attachments} files · ${t.proofs} proof files · escalation ${t.escalation_level||0}</div></div><div class="toolbar"><button data-open="${t.id}">Open</button><button data-assign="${t.id}">Assign</button></div></div>`).join('')||'<div class="card muted">No work in this view.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTask(b.dataset.open));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>quickAssign(b.dataset.assign))}async function quickAssign(id){const opts=['<option value="">Unassigned</option>',...members.map(m=>`<option value="${m.user_id}">${esc(m.name)} (${esc(m.role||'member')})</option>`)].join('');const wrapper=document.createElement('div');wrapper.innerHTML=`<div class="card"><h3>Assign task</h3><select id="qaOwner">${opts}</select><input id="qaRole" placeholder="Or role queue"><input id="qaDue" type="datetime-local"><button class="primary" id="qaSave">Save assignment</button></div>`;$('#detailTitle').textContent='Task ownership';$('#detailBody').innerHTML='';$('#detailBody').append(wrapper);$('#detail').showModal();wrapper.querySelector('#qaSave').onclick=async()=>{const due=wrapper.querySelector('#qaDue').value;const{data:r,error}=await sb.rpc('ai_manager_assign_task',{p_assignment_id:id,p_assigned_to:wrapper.querySelector('#qaOwner').value||null,p_assigned_role:wrapper.querySelector('#qaRole').value||null,p_due_at:due?new Date(due).toISOString():null});if(error||r?.error)return note(r?.error||error.message,true);$('#detail').close();load()}}async function openTask(id){currentId=id;const{data:d,error}=await sb.rpc('ai_manager_get_task_detail',{p_assignment_id:id});if(error||d?.error)return note(d?.error||error.message,true);const a=d.assignment;$('#detailTitle').textContent=a.title;const assigneeOpts=['<option value="">Unassigned</option>',...members.map(m=>`<option value="${m.user_id}" ${m.user_id===a.assigned_to?'selected':''}>${esc(m.name)} (${esc(m.role||'member')})</option>`)].join('');$('#detailBody').innerHTML=`<div class="muted">${esc(a.instructions||'')}</div><div class="section"><h3>Ownership</h3><div class="toolbar"><select id="owner">${assigneeOpts}</select><input id="role" value="${esc(a.assigned_role||'')}" placeholder="Role queue"><input id="due" type="datetime-local"><button id="saveOwner">Save</button></div></div><div class="section"><h3>Add comment</h3><textarea id="comment" placeholder="Update, question or manager note"></textarea><button id="addComment">Add comment</button></div><div class="section files"><h3>Attach evidence</h3><select id="attType"><option value="supporting">Supporting</option><option value="proof">Proof of completion</option><option value="approval">Approval</option></select><input id="file" type="file"><button id="upload">Upload</button></div><div class="section"><h3>Completion</h3><textarea id="completion" placeholder="What was completed and what changed?">${esc(a.completion_summary||'')}</textarea><button class="primary" id="submit">Submit for approval</button>${a.approval_status==='pending'?'<button class="ok" id="approve">Approve</button><button class="danger" id="reject">Reject</button>':''}<div class="muted">Proof required: ${a.proof_required?'Yes':'No'} · Approval: ${esc(a.approval_status)}</div></div><div class="section"><h3>Comments</h3>${(d.comments||[]).map(c=>`<div class="item"><strong>${esc(c.author_name)}</strong> <span class="muted">${esc(fmt(c.created_at))}</span><div>${esc(c.body)}</div></div>`).join('')||'<div class="muted">No comments.</div>'}</div><div class="section"><h3>Files</h3>${(d.attachments||[]).map(f=>`<div class="item">${esc(f.file_name)} · ${esc(f.attachment_type)}</div>`).join('')||'<div class="muted">No files.</div>'}</div><div class="section"><h3>History and escalations</h3>${(d.history||[]).map(h=>`<div class="item"><strong>${esc(h.event_type)}</strong> <span class="muted">${esc(fmt(h.created_at))}</span><div>${esc(h.note||'')}</div></div>`).join('')}${(d.escalations||[]).map(e=>`<div class="item"><strong>Escalation level ${e.level}</strong><div>${esc(e.reason)}</div></div>`).join('')}</div>`;$('#detail').showModal();$('#saveOwner').onclick=async()=>{const due=$('#due').value;await call('ai_manager_assign_task',{p_assignment_id:id,p_assigned_to:$('#owner').value||null,p_assigned_role:$('#role').value||null,p_due_at:due?new Date(due).toISOString():null},true)};$('#addComment').onclick=async()=>call('ai_manager_add_comment',{p_assignment_id:id,p_body:$('#comment').value,p_comment_type:'comment'},true);$('#upload').onclick=()=>uploadFile(a);$('#submit').onclick=async()=>call('ai_manager_submit_completion',{p_assignment_id:id,p_completion_summary:$('#completion').value},true);if($('#approve'))$('#approve').onclick=async()=>call('ai_manager_review_completion',{p_assignment_id:id,p_approve:true,p_reason:null},true);if($('#reject'))$('#reject').onclick=async()=>{const reason=prompt('Reason for rejection');if(reason!==null)call('ai_manager_review_completion',{p_assignment_id:id,p_approve:false,p_reason:reason},true)}}async function uploadFile(a){const f=$('#file').files[0];if(!f)return note('Choose a file first.',true);const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${a.organization_id}/${a.id}/${crypto.randomUUID()}-${safe}`;note('Uploading evidence…');const{error:uerr}=await sb.storage.from('manager-task-files').upload(path,f,{contentType:f.type,upsert:false});if(uerr)return note(uerr.message,true);const{data:r,error}=await sb.rpc('ai_manager_register_attachment',{p_assignment_id:a.id,p_storage_path:path,p_file_name:f.name,p_mime_type:f.type||null,p_file_size_bytes:f.size,p_attachment_type:$('#attType').value});if(error||r?.error)return note(r?.error||error.message,true);note('Evidence uploaded.');openTask(a.id);load()}async function call(fn,args,reopen=false){const{data:r,error}=await sb.rpc(fn,args);if(error||r?.error)return note(r?.error||error.message,true);note('Saved.');if(reopen)openTask(currentId);load()}$('#signIn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return note(error.message,true);boot()};$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#org').onchange=e=>{orgId=e.target.value;load()};$('#scope').onchange=load;$('#refresh').onclick=load;boot();</script></body></html>
