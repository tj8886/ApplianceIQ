<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplianceIQ Predictive Intelligence</title><style>
:root{--navy:#0f1f3d;--bg:#f4f6f8;--card:#fff;--line:#e3e8ee;--steel:#64748b;--accent:#6366f1;--ok:#1a9e56;--danger:#c02d1e;--amber:#e8590c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif}.shell{max-width:1220px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.links a{color:var(--accent);text-decoration:none;margin-left:16px;font-weight:700;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--steel);font-weight:700}.stat .value{font-size:30px;font-weight:800;margin-top:4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 13px}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:#fff;color:var(--navy)}.forecast{display:grid;grid-template-columns:1fr auto;gap:18px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef0ff;color:var(--accent);font-size:11px;font-weight:800}.money{font-size:28px;font-weight:800}.muted{color:var(--steel)}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}details{margin-top:12px}.notice{padding:12px;border-radius:9px;background:#eef7f2;color:var(--ok);margin-bottom:14px}.error{background:#fdecea;color:var(--danger)}.measure{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.measure input{max-width:190px}@media(max-width:700px){.forecast{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:14px}}
</style></head><body><div class="shell"><div class="top"><div><h1 style="margin:0">Predictive Intelligence</h1><div class="muted">Revenue impact, cost of inaction, forecast ranges and model learning</div></div><div class="links"><a href="./executive.html">Executive</a><a href="./decisions.html">Decisions</a><a href="./">Command Centre</a></div></div>
<div id="notice"></div><div id="login" class="card"><h2>Sign in</h2><div class="toolbar"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signIn">Sign in</button></div></div>
<div id="app" class="hidden"><div class="card toolbar"><select id="org"></select><button class="primary" id="generate">Generate forecasts</button><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="signOut">Sign out</button></div><div id="summary" class="grid"></div><div id="forecasts"></div></div></div>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const $=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(v||0)),num=v=>new Intl.NumberFormat('en-CA',{maximumFractionDigits:1}).format(Number(v||0)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let orgId;
function note(t,e=false){$('#notice').innerHTML=t?`<div class="notice ${e?'error':''}">${esc(t)}</div>`:''}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const{data,error}=await sb.from('organization_members').select('organization_id,organizations(id,name)').eq('status','active');if(error)return note(error.message,true);const orgs=(data||[]).map(x=>x.organizations).filter(Boolean);$('#org').innerHTML=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');orgId=orgs[0]?.id;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');if(orgId)load()}
async function load(){note('Loading forecasts…');const{data,error}=await sb.rpc('decision_get_prediction_dashboard',{p_organization_id:orgId});if(error||data?.error)return note(data?.error||error.message,true);render(data);note('')}
function render(d){const s=d.summary||{};$('#summary').innerHTML=`<div class="card stat"><div class="label">Active forecasts</div><div class="value">${s.active_predictions||0}</div></div><div class="card stat"><div class="label">Predicted impact</div><div class="value">${money(s.total_predicted_impact_cad)}</div></div><div class="card stat"><div class="label">Cost of inaction</div><div class="value">${money(s.total_cost_of_inaction_cad)}</div></div><div class="card stat"><div class="label">Measured</div><div class="value">${s.measured_predictions||0}</div></div>`;$('#forecasts').innerHTML=(d.predictions||[]).map(p=>`<div class="card forecast"><div><span class="badge">${esc(p.module)} · ${esc(p.horizon)}</span><h2>${esc(p.title)}</h2><div class="muted">${esc(p.prediction_type.replaceAll('_',' '))} · ${Math.round(Number(p.probability||0)*100)}% probability</div><h3>Forecast range</h3><div>${money(p.lower_bound)} to ${money(p.upper_bound)}</div><div class="bar" style="margin-top:8px"><span style="width:${Math.round(Number(p.probability||0)*100)}%"></span></div><details><summary>Assumptions and model</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(p.assumptions,null,2))}</pre><div class="muted">${esc(p.model_name)} v${esc(p.model_version)}</div></details>${p.status==='active'?`<div class="measure"><input id="actual-${p.id}" type="number" step="0.01" placeholder="Actual result"><button class="secondary" data-measure="${p.id}">Record outcome</button></div>`:`<div class="notice">Measured error: ${num(p.percent_error)}%</div>`}</div><div><div class="muted">Predicted impact</div><div class="money">${money(p.financial_impact_cad)}</div><div class="muted" style="margin-top:14px">Cost if ignored</div><div class="money" style="color:var(--danger)">${money(p.cost_of_inaction_cad)}</div><div class="muted" style="margin-top:14px">Priority ${num(p.priority_score)}/100</div></div></div>`).join('')||'<div class="card muted">No forecasts yet. Generate them from current operational data.</div>';document.querySelectorAll('[data-measure]').forEach(b=>b.onclick=()=>measure(b.dataset.measure))}
async function measure(id){const v=$(`#actual-${id}`).value;if(v==='')return note('Enter the actual result first.',true);const{data,error}=await sb.rpc('decision_record_prediction_outcome',{p_prediction_id:id,p_actual_value:Number(v),p_actual_financial_impact_cad:null});if(error)return note(error.message,true);note(`Outcome recorded. Forecast error: ${num(data.percent_error)}%.`);load()}
$('#signIn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return note(error.message,true);boot()};$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#org').onchange=e=>{orgId=e.target.value;load()};$('#refresh').onclick=load;$('#generate').onclick=async()=>{note('Generating forecasts…');const{data,error}=await sb.rpc('decision_generate_operational_forecasts',{p_organization_id:orgId});if(error)return note(error.message,true);note(`${data.predictions_generated} forecast(s) generated.`);load()};boot();</script></body></html>
