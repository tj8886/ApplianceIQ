<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f1f3d"/>
<title>Admin Dashboard — IQ Intelligence Group</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0f1f3d;--navy2:#162a4d;--blue:#2563eb;--cyan:#06b6d4;--green:#1a9e56;--white:#fff;--bg:#f4f6f8;--ink:#1f2b3d;--muted:#64748b;--line:#e2e8f0;--grad:linear-gradient(135deg,var(--blue),var(--cyan));--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.12);--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;line-height:1.2;color:var(--navy)}
button{font-family:Inter,sans-serif;cursor:pointer}
a{color:var(--blue);text-decoration:none}
input,select,textarea{font-family:Inter,sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f1f3d 0%,#162a4d 55%,#0f1f3d 100%);position:relative;overflow:hidden}
.login-card{position:relative;z-index:2;width:100%;max-width:420px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);padding:40px;margin:20px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo-mark{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Sora;font-weight:800;font-size:17px}
.login-card h1{font-size:22px;text-align:center}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;transition:.15s}
.btn-primary{background:var(--grad);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.9}
.btn-ghost{background:#f1f5f9;color:var(--ink)}
.btn-ghost:hover{background:#e2e8f0}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:#dc2626;font-size:13px;margin-top:10px}

/* Shell */
.shell{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{padding:20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.side-head .logo-mark{width:36px;height:36px;font-size:15px}
.side-head b{font-family:Sora;font-size:15px}
.side-head small{display:block;font-size:10px;color:rgba(255,255,255,.5)}
.side-nav{flex:1;padding:14px 10px}
.side-nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:rgba(255,255,255,.7);font-size:14px;font-weight:500;padding:11px 14px;border-radius:10px;transition:.15s;text-align:left}
.side-nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.side-nav button.active{color:#fff;background:var(--grad)}
.side-foot{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.user-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user-row .em{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .rl{font-size:10px;color:#4ade80}
.signout{background:none;border:none;color:rgba(255,255,255,.4);font-size:12px;padding:0}
.signout:hover{color:#f87171}
main{flex:1;padding:36px 40px;overflow-x:hidden}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:26px}
.page-head p{color:var(--muted);font-size:13px;margin-top:4px}

/* Cards / stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat .lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .vl{font-family:Sora;font-size:28px;font-weight:700;color:var(--navy);margin-top:2px}
.stat .sb{font-size:11px;color:#94a3b8;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.15s;text-align:left;cursor:pointer}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card h3{font-size:15px}
.card .tp{font-size:12px;color:var(--muted);margin-top:2px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:#94a3b8}
.group-lb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 12px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.bg-green{background:#dcfce7;color:#166534}.bg-red{background:#fee2e2;color:#991b1b}.bg-amber{background:#fef3c7;color:#92400e}.bg-indigo{background:#e0e7ff;color:#3730a3}.bg-gray{background:#f1f5f9;color:#475569}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:600;padding:10px 16px;transition:.15s}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .cnt{display:inline-block;background:#f1f5f9;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:6px}

/* Table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
td select{width:auto;padding:5px 8px;font-size:12px}
.mem{display:flex;align-items:center;gap:10px}
.mem .avatar{background:var(--blue)}
.mem .nm{font-weight:600;font-size:13px;color:var(--navy)}
.mem .eml{font-size:11px;color:#94a3b8}
.link-danger{background:none;border:none;color:#f87171;font-size:12px}
.link-danger:hover{color:#dc2626}
.link-muted{background:none;border:none;color:#94a3b8;font-size:12px}
.link-muted:hover{color:var(--ink)}

/* Rows */
.row-item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.row-item .fx{flex:1;min-width:0}
.row-item .nm{font-weight:600;font-size:13px;color:var(--navy)}
.row-item .sb{font-size:11px;color:#94a3b8}
.app-icon{font-size:22px}
.lvl{width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal.wide{max-width:640px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-x{background:none;border:none;font-size:22px;color:#94a3b8;line-height:1}
.modal-body{padding:24px}
.frm-row{margin-bottom:16px}
.frm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.seg{display:flex;gap:8px;margin-bottom:18px}
.seg button{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;background:#f1f5f9;color:var(--muted)}
.seg button.active{background:var(--blue);color:#fff}
.note{background:#eff6ff;border:1px solid #dbeafe;border-radius:12px;padding:14px;font-size:12px;color:#1e40af;margin-top:20px}
.result-ok{background:#dcfce7;color:#166534;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.result-warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.empty{color:#94a3b8;font-size:13px;text-align:center;padding:40px 0}
.back-lnk{background:none;border:none;color:#94a3b8;font-size:13px;margin-bottom:14px;padding:0}
.back-lnk:hover{color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);font-size:13px}
.loading-screen .logo-mark{width:48px;height:48px;font-size:19px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Particles on login */
canvas#pt{position:absolute;inset:0;z-index:1}

.mobile-topbar{display:none}
@media(max-width:860px){
  aside{position:fixed;left:-260px;transition:.25s;z-index:150}
  aside.open{left:0}
  main{padding:70px 18px 30px}
  .mobile-topbar{display:flex;position:fixed;top:0;left:0;right:0;height:54px;background:var(--navy);color:#fff;align-items:center;gap:12px;padding:0 16px;z-index:140}
  .mobile-topbar button{background:none;border:none;color:#fff;font-size:20px}
  .mobile-topbar b{font-family:Sora;font-size:14px}
}
</style>
</head>
<body>

<script>
const SB_URL="https://fumwwhyozeouoqscolke.supabase.co";
const SB_KEY="sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV";

  {l:1,n:"CEO / Owner",p:"Full control — billing, roles, users, all analytics"},
  {l:2,n:"VP",p:"Manage users, view all analytics — Sales, HR, Marketing, any VP"},
  {l:3,n:"Director",p:"View all analytics, manage regions"},

];
const SCOPES=[["own","Own data"],["team","Their team"],["store","Their store(s)"],["all","Whole org"]];

let S={user:null,token:null,super:false,orgs:[],org:null,orgData:null,view:"orgs",tab:"members"};

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function tok(){return localStorage.getItem("igcc_token")}

async function api(path,opts={}){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};
  const t=tok();if(t)h.Authorization="Bearer "+t;
  Object.assign(h,opts.headers||{});
  const r=await fetch(SB_URL+path,{...opts,headers:h});
  if(!r.ok){const e=await r.text();throw new Error(e)}
  const txt=await r.text();
  return txt?JSON.parse(txt):null;
}

async function login(email,pass){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pass})});
  if(!r.ok)throw new Error("bad");
  return r.json();
}

async function signup(email,pass,name){
  const r=await fetch(SB_URL+"/auth/v1/signup",{
    method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pass,data:{full_name:name}})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.msg||d.error_description||"signup_failed");
  return d;
}

async function rpc(fn,args){
  return api("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(args)});
}

async function sendInviteEmail(inv){
  // Fire the org-invite edge function; returns {sent, accept_url}
  try{
    const r=await fetch(SB_URL+"/functions/v1/org-invite",{
      method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+tok(),"Content-Type":"application/json"},
      body:JSON.stringify({
        invite_code:inv.invite_code,invited_email:inv.invited_email,
        org_name:S.org.name,role:inv.role,inviter_email:S.user.email,
        site_origin:location.origin})});
    return await r.json();
  }catch(e){return {ok:false,sent:false}}
}

function signOut(){
  localStorage.removeItem("igcc_token");localStorage.removeItem("igcc_user");
  S={user:null,token:null,super:false,orgs:[],org:null,orgData:null,view:"orgs",tab:"members"};
  render();
}

async function boot(){
  // Invite link? Route to the acceptance flow.
  const m=location.hash.match(/#invite=([a-f0-9]+)/i);
  if(m){S.inviteCode=m[1];await bootInvite();return}
  const t=localStorage.getItem("igcc_token"),u=localStorage.getItem("igcc_user");
  if(t&&u){
    S.token=t;S.user=JSON.parse(u);
    document.getElementById("app").innerHTML='<div class="loading-screen"><div class="logo-mark">IQ</div>Loading Admin Dashboard…</div>';
    try{await postLogin()}catch(e){signOut();return}
  }
  render();
}

/* ─── INVITE ACCEPTANCE FLOW ─── */
async function bootInvite(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="loading-screen"><div class="logo-mark">IQ</div>Checking your invitation…</div>';
  let preview;
  try{
    const r=await fetch(SB_URL+"/rest/v1/rpc/get_invite_preview",{
      method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_code:S.inviteCode})});
    preview=await r.json();
  }catch{preview={ok:false}}
  if(!preview.ok||preview.status!=="pending"||preview.expired){
    app.innerHTML=inviteDeadView(preview);
    return;
  }
  S.invitePreview=preview;
  app.innerHTML=inviteAcceptView();
  initParticles();
}

function inviteDeadView(p){
  const reason=!p||!p.ok?"This invitation link isn't valid.":p.expired?"This invitation has expired.":p.status==="accepted"?"This invitation was already accepted.":"This invitation has been revoked.";
  return `
<div class="login-wrap"><canvas id="pt"></canvas>
<div class="login-card" style="text-align:center">
  <div class="logo-row"><span class="logo-mark">IQ</span></div>
  <h1>Invitation unavailable</h1>
  <p class="login-sub" style="margin-bottom:20px">${reason}</p>
  <p style="font-size:13px;color:var(--muted)">Ask your administrator to send a new invite.</p>
  <p style="margin-top:20px;font-size:12px"><a href="/admin.html" onclick="location.hash=''">Go to sign in</a></p>
</div></div>`}

let invTab="signup";
function inviteAcceptView(){
  const p=S.invitePreview;
  return `
<div class="login-wrap"><canvas id="pt"></canvas>
<div class="login-card">
  <div class="logo-row"><span class="logo-mark">IQ</span></div>

  <div class="seg" style="justify-content:center">
    <button class="${invTab==='signup'?'active':''}" onclick="invTab='signup';document.getElementById('app').innerHTML=inviteAcceptView();initParticles()">Create Account</button>
    <button class="${invTab==='login'?'active':''}" onclick="invTab='login';document.getElementById('app').innerHTML=inviteAcceptView();initParticles()">I Have an Account</button>

  ${invTab==="signup"?`

  <button class="btn btn-green btn-block" id="ia-btn" onclick="doAcceptSignup()">Create Account &amp; Join</button>
  `:`
  <div class="frm-row"><label>Email</label><input id="ia-email" type="email" value="${esc(p.invited_email)}" readonly style="background:#f8fafc;color:#64748b"/></div>
  <div class="frm-row"><label>Password</label><input id="ia-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAcceptLogin()"/></div>
  <button class="btn btn-green btn-block" id="ia-btn" onclick="doAcceptLogin()">Sign In &amp; Join</button>
  `}
  <div class="err" id="ia-err"></div>
</div></div>`}

async function doAcceptSignup(){
  const name=document.getElementById("ia-name").value.trim();
  const pass=document.getElementById("ia-pass").value;
  const err=document.getElementById("ia-err"),btn=document.getElementById("ia-btn");
  if(pass.length<8){err.textContent="Password must be at least 8 characters";return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating account…';
  try{
    const d=await signup(S.invitePreview.invited_email,pass,name);
    if(!d.access_token){
      // Email confirmation is ON for this project — they must confirm first
      err.style.color="#166534";
      err.textContent="Account created! Check your email to confirm, then reopen this invite link and use 'I Have an Account'.";
      btn.textContent="Waiting for confirmation…";
      return;
    }
    await finishAccept(d);
  }catch(e){
    err.textContent=/already/i.test(e.message)?"An account with this email exists — use 'I Have an Account'.":"Signup failed: "+e.message;
    btn.disabled=false;btn.textContent="Create Account & Join";
  }
}

async function doAcceptLogin(){
  const pass=document.getElementById("ia-pass").value;
  const err=document.getElementById("ia-err"),btn=document.getElementById("ia-btn");
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Signing in…';
  try{
    const d=await login(S.invitePreview.invited_email,pass);
    await finishAccept(d);
  }catch(e){
    err.textContent="Invalid password";
    btn.disabled=false;btn.textContent="Sign In & Join";
  }
}

  localStorage.setItem("igcc_token",authData.access_token);
  localStorage.setItem("igcc_user",JSON.stringify(authData.user));

  try{

      document.getElementById("app").innerHTML=inviteDeadView(
        res.error==="email_mismatch"?{ok:true,status:"pending",expired:false}:null);
      if(res.error==="email_mismatch"){
        document.getElementById("app").innerHTML=`
<div class="login-wrap"><canvas id="pt"></canvas>
<div class="login-card" style="text-align:center">

  <h1>Wrong account</h1>

        <span style="margin-left:auto;color:#94a3b8">→</span></a>`;
    }).join("");
    document.getElementById("app").innerHTML=`
<div class="login-wrap"><canvas id="pt"></canvas>
<div class="login-card" style="max-width:460px">
  <div class="logo-row"><span class="logo-mark">IQ</span></div>

    initParticles();

async function bootAfterAccept(){
  document.getElementById("app").innerHTML='<div class="loading-screen"><div class="logo-mark">IQ</div>Loading Admin Dashboard…</div>';
  await postLogin();
  render();
}

async function postLogin(){
  try{
    const admins=await api("/rest/v1/platform_admins?select=user_id");
    S.super=admins.some(a=>a.user_id===S.user.id);
  }catch{S.super=false}
  S.orgs=await api("/rest/v1/organizations?status=eq.active&order=name.asc");
  if(!S.super){
    // Org admins only see orgs they belong to as owner/admin
    try{
      const mems=await api("/rest/v1/organization_members?user_id=eq."+S.user.id+"&role=in.(owner,admin)&status=eq.active&select=organization_id");
      const ids=new Set(mems.map(m=>m.organization_id));
      S.orgs=S.orgs.filter(o=>ids.has(o.id));
    }catch{S.orgs=[]}
  }
}

async function loadOrg(orgId){
  const safe=(p)=>p.catch(e=>{console.error("loadOrg query failed:",e);return []});
  const [mems,roles,ents,invs,locs,locmems]=await Promise.all([
    safe(api("/rest/v1/organization_members?organization_id=eq."+orgId+"&select=*")),
    safe(api("/rest/v1/org_roles?organization_id=eq."+orgId+"&order=role_level.asc")),
    safe(api("/rest/v1/org_app_entitlements?organization_id=eq."+orgId)),
    safe(api("/rest/v1/org_invites?organization_id=eq."+orgId+"&order=created_at.desc")),
    safe(api("/rest/v1/org_locations?organization_id=eq."+orgId+"&order=location_type.desc,name.asc")),
    safe(api("/rest/v1/org_location_members?organization_id=eq."+orgId))
  ]);
  const ids=[...new Set(mems.map(m=>m.user_id))].filter(Boolean);
  let profMap={};
  if(ids.length){
    try{
      const profs=await api("/rest/v1/profiles?id=in.("+ids.join(",")+")");
      profs.forEach(p=>profMap[p.id]=p);
    }catch{}
  }
  mems.forEach(m=>{m._name=profMap[m.user_id]?.full_name||null;m._email=profMap[m.user_id]?.email||null});
  S.orgData={mems,roles,ents,invs,locs,locmems};
}

async function saveStorePicker(userId){
  const stores=S.orgData.locs.filter(l=>l.location_type==="store"&&l.is_active);
  const checked=stores.filter(s=>document.getElementById("sp-"+s.id).checked).map(s=>s.id);
  const primary=document.querySelector('input[name="sp-primary"]:checked')?.value||checked[0]||null;
  try{
    await api("/rest/v1/org_location_members?organization_id=eq."+S.org.id+"&user_id=eq."+userId,{method:"DELETE"});
    for(const locId of checked){
      await api("/rest/v1/org_location_members",{method:"POST",body:JSON.stringify({
        organization_id:S.org.id,location_id:locId,user_id:userId,is_primary:locId===primary})});

    await loadOrg(S.org.id);

async function openBilling(kind){

        return_url:location.origin+"/admin.html"})});

    if(res.ok&&res.url){window.open(res.url,"_blank");return}

      alert("Add at least one active app to this organization before starting a subscription.");
    }else{
      alert("Billing error: "+(res.error||"unknown"));
    }
  }catch(e){alert("Billing request failed: "+e.message.slice(0,140))}
}

async function sendInvites(){
  const btn=document.getElementById("iv-btn");
  const role=document.getElementById("iv-role").value;
  const pos=document.getElementById("iv-pos").value||null;
  const store=document.getElementById("iv-store")?document.getElementById("iv-store").value||null:null;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Sending…';
  let ok=0,fail=0,emailed=0,created=[];
  const send=async(em,rl)=>{
    const rows=await api("/rest/v1/org_invites",{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({organization_id:S.org.id,invited_email:em.trim().toLowerCase(),role:rl,org_role_id:pos,location_id:store,invited_by:S.user.id,status:"pending"})});
    const inv=Array.isArray(rows)?rows[0]:rows;
    if(inv){created.push(inv);const er=await sendInviteEmail(inv);if(er&&er.sent)emailed++}
    return inv;
  };
  try{
    if(invMode==="single"){
      const em=document.getElementById("iv-email").value.trim();
      if(!em){btn.disabled=false;btn.textContent="Send Invite";return}
      try{await send(em,role);ok++}catch{fail++}
    }else{
      const lines=document.getElementById("iv-bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
      for(const line of lines){
        const parts=line.split(",").map(p=>p.trim());
        try{await send(parts[0],parts[1]||role);ok++}catch{fail++}
      }
    }
  }finally{
    const mailNote=emailed===ok&&ok>0?" · emails delivered":emailed>0?` · ${emailed} emailed`:"";
    const linkRows=created.map(inv=>`
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:#fff;border-radius:8px;border:1px solid #bbf7d0">
        <span style="flex:1;font-size:12px;font-weight:600;color:#0f1f3d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(inv.invited_email)}</span>
        <button class="btn btn-primary" style="padding:6px 14px;font-size:12px" onclick="copyInvite('${esc(inv.invite_code)}',this)">Copy Link</button>
      </div>`).join("");
    document.getElementById("iv-result").innerHTML=(fail
      ?`<div class="result-warn">✓ ${ok} created · ${fail} failed (check emails / duplicates)${mailNote}${linkRows}</div>`
      :`<div class="result-ok">✓ ${ok} invite${ok!==1?"s":""} created${mailNote}${linkRows}</div>`);
    btn.disabled=false;btn.textContent="Send More";
    await loadOrg(S.org.id);
  }
}

async function createOrg(){
  const name=document.getElementById("co-name").value.trim();
  if(!name)return;
  const btn=document.getElementById("co-btn");
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating…';
  try{
    const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const rows=await api("/rest/v1/organizations",{method:"POST",headers:{Prefer:"return=representation"},
      body:JSON.stringify({name,slug,tenant_type:document.getElementById("co-type").value,
        tier:document.getElementById("co-tier").value,
        billing_email:document.getElementById("co-bill").value.trim()||null,status:"active"})});
    S.orgs=await api("/rest/v1/organizations?status=eq.active&order=name.asc");
    closeModal();
    const created=Array.isArray(rows)?rows[0]:rows;
    if(created&&created.id){openOrg(created.id)}else{render()}
  }catch(e){
    let msg="Create failed";
    try{const j=JSON.parse(e.message);msg=j.message||j.details||j.hint||msg}catch{msg=e.message.slice(0,160)||msg}
    if(/duplicate key.*slug/i.test(msg))msg="An organization with this name (slug) already exists — pick a different name.";
    document.getElementById("co-err").textContent=msg;
    btn.disabled=false;btn.textContent="Create Organization";
  }
}

  let pricing=[],ents=[];
  try{
    [pricing,ents]=await Promise.all([
      api("/rest/v1/platform_pricing?app_key=eq."+key+"&active=eq.true&order=unit_price_cents.asc"),
      api("/rest/v1/org_app_entitlements?app_key=eq."+key)
    ]);
  }catch(e){console.error(e)}
  const orgById={};S.orgs.forEach(o=>orgById[o.id]=o);
  const entOrgIds=new Set(ents.map(e=>e.organization_id));
  const assignable=S.orgs.filter(o=>!entOrgIds.has(o.id)&&o.tenant_type!=="appliance_iq_internal");
  const mrr=ents.filter(e=>e.status==="active").reduce((s,e)=>s+(e.price_cents_monthly||0),0);
  document.getElementById("main").innerHTML=`
<button class="back-lnk" onclick="nav('registry')">← Back to App Registry</button>
<div class="page-head">
  <div style="display:flex;align-items:center;gap:14px">
    <span style="font-size:38px">${a.icon}</span>
    <div><h1>${a.name}</h1><p style="font-family:monospace">${key}</p></div>
  </div>
  ${APP_URLS[key]?`<a href="${APP_URLS[key]}" target="_blank" class="btn btn-primary">Open App ↗</a>`:""}
</div>
<div class="stats">
  <div class="stat"><div class="lb">Organizations</div><div class="vl" style="color:var(--blue)">${ents.length}</div></div>
  <div class="stat"><div class="lb">Active</div><div class="vl" style="color:var(--green)">${ents.filter(e=>e.status==="active").length}</div></div>
  <div class="stat"><div class="lb">MRR</div><div class="vl">$${(mrr/100).toLocaleString()}</div></div>
</div>

<div class="group-lb" style="color:var(--blue)">Pricing Tiers</div>
${pricing.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:24px">

    <div style="font-family:Sora;font-size:22px;font-weight:700;color:var(--blue);margin:6px 0">$${(p.unit_price_cents/100).toLocaleString()}</div>
    <div style="font-size:11px;color:#94a3b8">per ${p.billing_unit==="flat"?"month":p.billing_unit}/mo · tier: ${esc(p.tier)}</div>

<div class="group-lb" style="color:var(--green)">Organizations Using ${a.name}</div>
${ents.length?ents.map(e=>{

    <div class="fx"><div class="nm">${esc(o?o.name:e.organization_id.slice(0,8))}</div>

    <span class="badge ${e.status==="active"?"bg-green":e.status==="trial"?"bg-amber":"bg-red"}">${esc(e.status)}</span>
    ${o?`<button class="link-muted" onclick="openOrg('${o.id}');S.tab='apps'">Manage →</button>`:""}
  </div>`}).join(""):'<div class="empty" style="padding:16px 0">No organizations have this app yet.</div>'}

${assignable.length?`
<div style="margin-top:18px;border:2px dashed var(--line);border-radius:12px;padding:16px;background:#f8fafc">
  <div class="frm-grid" style="grid-template-columns:2fr 1fr 90px auto;align-items:end;margin-bottom:0">
    <div><label>Add to organization</label><select id="ap-org">${assignable.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div>
    <div><label>Tier</label><select id="ap-tier">${(pricing.length?pricing.map(p=>p.tier):TIERS).map(t=>`<option value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></div>

async function assignApp(key){
  try{
    await api("/rest/v1/org_app_entitlements",{method:"POST",body:JSON.stringify({

      status:"active"})});
    openApp(key);
  }catch(e){alert("Failed: "+e.message.slice(0,160))}

function openAddAdmin(){
  document.getElementById("modal-slot").innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <div class="modal-head"><h3>Add Platform Admin</h3><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px">The person must already have an account (they've logged in at least once). Enter their email to grant super admin access.</p>
    <div class="frm-row"><label>Email</label><input id="pa-email" type="email" placeholder="natalie@company.com"/></div>
    <div class="frm-row"><label>Full Name</label><input id="pa-name" placeholder="Natalie"/></div>
    <div class="err" id="pa-err"></div>

async function addAdmin(){
  const email=document.getElementById("pa-email").value.trim().toLowerCase();
  const name=document.getElementById("pa-name").value.trim();
  const err=document.getElementById("pa-err"),btn=document.getElementById("pa-btn");
  if(!email)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Granting…';
  try{
    const profs=await api("/rest/v1/profiles?email=eq."+encodeURIComponent(email)+"&select=id,email,full_name");
    if(!profs.length)throw new Error("no-account");
    await api("/rest/v1/platform_admins",{method:"POST",body:JSON.stringify({
      user_id:profs[0].id,email,full_name:name||profs[0].full_name,role:"super_admin",created_by:S.user.id})});
    closeModal();loadAdmins();
  }catch(e){
    err.textContent=e.message==="no-account"
      ?"No account found for that email — they need to sign up first."
      :"Failed to grant access (may already be an admin).";
    btn.disabled=false;btn.textContent="Grant Super Admin";
  }
}

async function removeAdmin(id){
  if(!confirm("Remove this platform admin? They will lose access to all organizations."))return;
  try{
    await api("/rest/v1/platform_admins?id=eq."+id,{method:"DELETE"});
    loadAdmins();
  }catch(e){alert("Failed: "+e.message)}
}

/* ─── PARTICLES ─── */
function initParticles(){
  const c=document.getElementById("pt");if(!c)return;
  const x=c.getContext("2d");
  let W,H,pts=[];
  const resize=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight};
  resize();window.addEventListener("resize",resize);
  for(let i=0;i<55;i++)pts.push({x:Math.random()*2000,y:Math.random()*1200,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4});
  const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tick(){
    if(!document.getElementById("pt"))return;
    x.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,1.6,0,7);x.fillStyle="rgba(6,182,212,.5)";x.fill();
    });
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;
      if(d<16000){x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);
        x.strokeStyle="rgba(37,99,235,"+(0.25*(1-d/16000))+")";x.lineWidth=.6;x.stroke()}
    }
    if(!reduced)requestAnimationFrame(tick);
  }
  tick();
}
