[build]
  base = "."
  command = "node scripts/migration/build-netlify-us.mjs"
  publish = ".aiq-netlify"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/command-center/*"
  to = "/command-center/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
