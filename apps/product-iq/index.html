<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f1f3d"/>
<title>Product IQ — The Appliance Industry PIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0f1f3d;--navy2:#162a4d;--indigo:#6366f1;--blue:#2563eb;--cyan:#06b6d4;--teal:#0d9488;--bg:#f4f6f8;--card:#fff;--ink:#1f2b3d;--muted:#64748b;--line:#e3e8ee;--green:#177c45;--greenbg:#e8f7ee;--amber:#a15c00;--amberbg:#fff5df;--red:#ad3125;--redbg:#fdecea;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;margin:0;color:var(--navy)}a{color:var(--indigo);text-decoration:none}

.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;font-family:Sora;font-weight:800;font-size:16px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--navy2),var(--indigo));display:grid;place-items:center;font-size:11px;font-weight:800}
.product-pill{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a5b4fc;margin:0 10px 14px}
.nav{border:0;background:transparent;color:#b7c4d8;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;font:600 13px Inter;display:flex;gap:9px;align-items:center;width:100%}
.nav:hover,.nav.active{background:rgba(255,255,255,.1);color:#fff}
.nav .icon{width:18px;text-align:center;font-size:15px}
.side-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.side-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;padding:8px 11px 4px}
.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.side-link{color:#8b9cc0;text-decoration:none;font-size:12px;padding:7px 11px;display:block}
.side-link:hover{color:#fff}
.user-chip{font-size:11px;color:#7b8dae;padding:8px 11px;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}

main{min-width:0;padding:24px 30px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--navy)}
.avatar{height:30px;width:30px;border-radius:50%;background:#eef0f7;color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.pagehead h1{font-size:26px;letter-spacing:-.7px}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}

.btn{border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font:700 13px Inter;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn-secondary:hover{background:#f8f9fb}
.btn-indigo{background:var(--indigo);color:#fff}.btn-indigo:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-green{color:var(--green);background:var(--greenbg)}.pill-amber{color:var(--amber);background:var(--amberbg)}.pill-red{color:var(--red);background:var(--redbg)}.pill-gray{color:#59687a;background:#eef2f6}.pill-indigo{color:var(--indigo);background:#eef0ff}.pill-cyan{color:#0e7490;background:#ecfeff}.pill-teal{color:var(--teal);background:#e6fffa}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.metric .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.metric .value{font:800 24px Sora;margin-top:4px;color:var(--navy)}
.metric .note{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.control{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font:13px Inter;color:var(--ink)}
.search-input{min-width:220px;flex:1}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:600px}
th{padding:10px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid #eef1f4;vertical-align:middle;font-size:13px}
tr:last-child td{border:0}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f8fbfc}
.model-name{font-weight:800;color:var(--navy)}
.tiny{font-size:12px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cad3df;border-radius:9px}
.error{padding:12px;border-radius:9px;background:var(--redbg);color:var(--red);font-size:13px}
.loading{color:var(--muted);padding:24px}

.record{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.record-top{display:flex;gap:16px;align-items:flex-start}
.record-img{width:80px;height:80px;border-radius:var(--radius);background:#eef2f6;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.record-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px -20px 16px;padding:0 20px;overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;font:600 13px Inter}
.tab.active{color:var(--indigo);border-color:var(--indigo)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv div{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div:nth-child(3n){border-right:0}
.kv small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row{margin-bottom:0}
.form-row.full{grid-column:1/-1}
.form-row label{display:block;font:600 12px Inter;color:var(--navy);margin-bottom:4px}
.form-row input,.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:13px Inter;color:var(--ink)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-row textarea{min-height:80px;resize:vertical}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

/* Asset grid */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.asset-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.15s}
.asset-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.asset-card .preview{height:140px;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
.asset-card .preview img{width:100%;height:100%;object-fit:cover}
.asset-card .info{padding:12px}
.asset-card .info h4{font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-card .info .tiny{display:block}
.asset-card .actions{padding:0 12px 12px;display:flex;gap:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,31,61,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:640px;max-width:100%;max-height:90vh;overflow-y:auto;padding:28px}
.modal h2{margin-bottom:16px}

/* Content stats */
.content-stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.content-stat:last-child{border:0}
.content-stat .cs-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.content-stat .cs-info{flex:1}
.content-stat .cs-info strong{font-size:14px;display:block}
.content-stat .cs-info span{font-size:11px;color:var(--muted)}
.content-stat .cs-count{font:800 18px Sora;color:var(--navy)}

/* Login */
.login-overlay{position:fixed;inset:0;background:var(--navy);z-index:200;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:420px;max-width:90vw;text-align:center}
.login-box .mark{width:48px;height:48px;font-size:16px;border-radius:14px;margin:0 auto 12px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box .sub{margin-bottom:24px}
.login-box .form-row{text-align:left;margin-bottom:14px}
.login-box .btn{width:100%;justify-content:center;padding:11px}
.login-box .demo-hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* Landing */
.landing{min-height:100vh}
.land-nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:20px 24px}
.land-nav .logo{display:flex;align-items:center;gap:10px;font:800 18px Sora;color:#fff}
.land-nav .logo .mark{width:36px;height:36px;border-radius:10px}
.land-hero{background:var(--navy);padding:80px 24px 100px;text-align:center;position:relative;overflow:hidden}
.land-hero::before{content:'';position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.15),transparent 70%);pointer-events:none}
.land-hero h1{font-size:clamp(32px,5vw,52px);color:#fff;max-width:700px;margin:0 auto 16px;letter-spacing:-1px;position:relative}
.land-hero h1 span{color:var(--indigo)}
.land-hero p{color:rgba(255,255,255,.6);font-size:17px;max-width:550px;margin:0 auto 32px;position:relative}
.land-section{max-width:1100px;margin:0 auto;padding:60px 24px}
.land-section h2{font-size:28px;text-align:center;margin-bottom:10px}
.land-section .section-sub{text-align:center;color:var(--muted);margin-bottom:36px;font-size:15px}
.land-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.land-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:.2s}
.land-card:hover{box-shadow:0 8px 30px rgba(0,0,0,.08);transform:translateY(-2px)}
.land-card .lc-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.land-card h3{font-size:16px;margin-bottom:6px}
.land-card p{color:var(--muted);font-size:13px}
.land-two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:40px}
.land-two h3{font-size:22px;margin-bottom:10px}
.land-two p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:12px}
.land-two .list-check{list-style:none;padding:0}
.land-two .list-check li{padding:6px 0;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.land-two .list-check li::before{content:'✓';color:var(--green);font-weight:800;flex-shrink:0}
.land-cta{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius);padding:50px;text-align:center;color:#fff;margin:20px 0 40px}
.land-cta h2{color:#fff;margin-bottom:10px}.land-cta p{color:rgba(255,255,255,.65);margin-bottom:24px}
.land-footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

@media(max-width:900px){
.shell{grid-template-columns:1fr}.side{height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
.brand,.product-pill,.side-bottom,.side-label,.side-sep,.user-chip{display:none}
.nav{white-space:nowrap;font-size:12px;padding:8px 10px}.nav .icon{display:none}
main{padding:16px}
.cards{grid-template-columns:repeat(2,1fr)}
.kv{grid-template-columns:repeat(2,1fr)}.kv div:nth-child(3n){border-right:1px solid var(--line)}.kv div:nth-child(2n){border-right:0}
.land-grid{grid-template-columns:1fr}.land-two{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
.asset-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media(max-width:600px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div{border-right:0!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');

/* ── STATE ── */
const S={user:null,role:{isAdmin:false,isManufacturer:false,isRetailer:false,vendors:[],brandNames:[],loaded:false},view:'landing',page:'dashboard',detail:null,detailTab:'overview',editMode:false,filters:{search:'',brand:'',manufacturer:'',category:'',status:''},pg:0,assetFilter:'all',modal:null};
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$=v=>v?'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}):'—';

const VID_ICONS={product_overview:'🎬',installation_video:'🛠️',how_to_video:'💡',testimonial_video:'⭐','360_view':'🔄',comparison_video:'⚖️'};
const MKT_ICONS={sell_sheet_print:'🖨️',social_media_kit:'📱',co_op_ad_template:'📰',pop_display:'🏪',brand_logo:'🏷️',product_badge:'🏆',email_template:'📧',training_deck:'🎓',catalog_page:'📕'};

/* ── ECOSYSTEM APPS ── */
const APPS=[
  ['CRM','🤝','https://crmaiiq.netlify.app'],
  ['Spec IQ','📋','https://appliance-spec-iq.netlify.app'],
  ['AI Academy','🎓','https://applianceiq-aiacademy.netlify.app'],
  ['IQ Field','🔧','https://applianceiq-iq-field.netlify.app'],
  ['Command Center','🛰️','https://applianceiq-intelligence-group.netlify.app/command-center'],
  ['Brand Portal','🏭','https://applianceiq-brand-portal.netlify.app'],
  ['IQ Up','📈','https://applianceiq-iq-up-system.netlify.app'],
];

/* ── ROLE CONTEXT ── */
async function loadRole(){
  const uid=S.user?.id; if(!uid)return;
  const [{data:roles},{data:members},{data:admin}]=await Promise.all([
    sb.from('mfr_user_roles').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mfr_members').select('vendor_id,role,status,mfr_vendors(id,name)').eq('user_id',uid).eq('status','active'),
    sb.from('product_iq_platform_roles').select('role').eq('user_id',uid).eq('status','active')
  ]);
  const isAdmin=(admin||[]).length>0 || !!roles?.is_admin;
  const vendors=(members||[]).map(m=>({id:m.vendor_id,name:m.mfr_vendors?.name||'Vendor',role:m.role}));
  let brandNames=[];
  if(vendors.length){
    const {data:bs}=await sb.from('brand_catalog').select('brand_name').in('manufacturer_id',vendors.map(v=>v.id));
    brandNames=(bs||[]).map(b=>b.brand_name);
  }
  S.role={isAdmin,isManufacturer:!!roles?.is_manufacturer||vendors.length>0,
    isRetailer:!!roles?.is_retailer||!!roles?.is_builder||!!roles?.is_designer,
    vendors,brandNames,loaded:true};
}
const canEdit=()=>S.role.isAdmin||S.role.isManufacturer;
function roleLabel(){
  if(S.role.isAdmin)return'Platform Admin';
  if(S.role.vendors.length)return S.role.vendors.map(v=>v.name).join(', ');
  if(S.role.isRetailer)return'Retailer';
  return'Viewer';
}

/* ── INIT ── */
async function init(){
  const {data:{user}}=await sb.auth.getUser();
  if(user){S.user=user;await loadRole();S.view='app';render()}
  else showLanding();
}

  S.view='landing';
  document.getElementById('app').innerHTML=`

    <p>Product IQ is the PIM built for the appliance industry. Manufacturers publish. Retailers consume. Everyone wins.</p>

  </div>
  <div class="land-section">

    <div class="land-two">

        <ul class="list-check"><li>Product images, videos & 360° views</li><li>Manuals, spec sheets, energy guides & installation docs</li><li>Marketing sell sheets, co-op ads & social media kits</li><li>Rebate programs & warranty management</li><li>Data quality scoring and validation</li></ul></div>

    </div>
  </div>
  <div class="land-section" style="background:#fff;padding:50px 24px;margin:0;max-width:none"><div style="max-width:1100px;margin:0 auto">

      <div class="land-card"><div class="lc-icon" style="background:#e0f2fe;color:#0284c7">🌐</div><h3>Syndication</h3><p>Published products feed directly into IQ CRM, Academy, Spec IQ, and the entire ecosystem.</p></div>

    <button class="btn" style="background:#fff;color:var(--navy);font-weight:800;padding:12px 28px" onclick="showLogin()">Sign In to Product IQ</button></div></div>

async function renderPage(){

    sb.from('pim_product_documents').select('id,product_id,doc_type'),

  </div>

    <div class="panel">
      <h2>📊 Content Coverage</h2>
      ${[
        {icon:'📸',label:'Products with Images',count:imgProds,total:all.length,bg:'#eef0ff'},
        {icon:'🎬',label:'Products with Videos',count:vidProds,total:all.length,bg:'#fef3c7'},
        {icon:'📄',label:'Products with Documents',count:docProds,total:all.length,bg:'#e8f7ee'},
        {icon:'📢',label:'Marketing Assets',count:(mkts||[]).length,total:null,bg:'#fce7f3'},
        {icon:'⚡',label:'Certifications',count:(certs||[]).length,total:null,bg:'#ecfeff'},
        {icon:'💰',label:'Active Rebates',count:(rebates||[]).filter(r=>r.is_active).length,total:null,bg:'#fff5df'}
      ].map(s=>`<div class="content-stat">
        <div class="cs-icon" style="background:${s.bg}">${s.icon}</div>
        <div class="cs-info"><strong>${s.label}</strong><span>${s.total?Math.round(s.count/s.total*100)+'% coverage':'across catalog'}</span></div>
        <div class="cs-count">${s.count}${s.total?' / '+s.total:''}</div>
      </div>`).join('')}
    </div>
    <div class="panel">
      <h2>📦 Products by Manufacturer</h2>
      ${Object.entries(mfrs).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([name,cnt])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f4">
          <span style="font-weight:600;font-size:13px">${esc(name)}</span>

            <div style="width:100px;height:6px;background:#eef2f6;border-radius:3px;overflow:hidden"><div style="height:100%;width:${cnt/all.length*100}%;background:var(--indigo);border-radius:3px"></div></div>

    <div class="panel">
      <h2>🔍 Data Gaps</h2>

        {label:'Missing Finish/Color',count:all.length-withFinish,action:'data-quality'},
        {label:'Missing Description',count:all.length-withDesc,action:'data-quality'},
        {label:'No Images',count:all.length-imgProds,action:'images'},
        {label:'No Documents',count:all.length-docProds,action:'documents'},

  </div>`;
}

async function renderCatalog(C){

    <select class="control" onchange="S.filters.category=this.value;S.pg=0;renderPage()"><option value="">All Categories</option>${cats.map(c=>`<option${S.filters.category===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>

    <thead><tr><th>Product</th><th>Brand</th><th>Category</th><th>Series</th><th>MSRP</th><th>Status</th></tr></thead>
    <tbody>${page.map(p=>`<tr class="clickable" onclick="go('product-detail','${p.id}')">
      <td><span class="model-name">${esc(p.model)}</span></td>

  </div></div>`;
}

async function renderRebates(C){

    sb.from('aiq_products').select('id,model,brand_name'),
    sb.from('brand_catalog').select('id,brand_name')
  ]);

      <td><span class="model-name">${esc(r.rebate_name)}</span></td>

      <td class="tiny">${p?esc(p.brand_name+' '+p.model):b?esc(b.brand_name):'All'}</td>
      <td class="tiny">${fmtDate(r.start_date)} – ${fmtDate(r.end_date)}</td>

}

/* ══════════════════ DATA QUALITY ══════════════════ */
async function renderDataQuality(C){
  const [{data:products},{data:imgs},{data:docs},{data:dims}]=await Promise.all([
    sb.from('aiq_products').select('id,brand_name,model,short_description,msrp,series,product_line,product_family,category,upc,finish'),
    sb.from('pim_product_images').select('product_id'),
    sb.from('pim_product_documents').select('product_id'),
    sb.from('pim_product_dimensions').select('product_id')
  ]);
  const imgIds=new Set((imgs||[]).map(i=>i.product_id));
  const docIds=new Set((docs||[]).map(d=>d.product_id));
  const dimIds=new Set((dims||[]).map(d=>d.product_id));
  const scored=(products||[]).map(p=>{
    let score=0,total=10,issues=[];
    if(p.short_description){score++}else issues.push('Description');
    if(p.msrp){score++}else issues.push('MSRP');
    if(p.series){score++}else issues.push('Series');
    if(p.product_line){score++}else issues.push('Product Line');
    if(p.product_family){score++}else issues.push('Product Family');
    if(p.upc){score++}else issues.push('UPC');
    if(p.finish){score++}else issues.push('Finish');
    if(imgIds.has(p.id)){score++}else issues.push('Images');
    if(docIds.has(p.id)){score++}else issues.push('Documents');
    if(dimIds.has(p.id)){score++}else issues.push('Dimensions');
    return {...p,score:Math.round(score/total*100),issues};
  }).sort((a,b)=>a.score-b.score);
  const avg=scored.length?Math.round(scored.reduce((s,p)=>s+p.score,0)/scored.length):0;
  C.innerHTML=`
  <div class="pagehead"><div><h1>Data Quality</h1><p class="sub">Content completeness scoring across ${scored.length} products (10 criteria).</p></div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="label">Avg Score</div><div class="value" style="color:${avg>=60?'var(--green)':'var(--amber)'}">${avg}%</div></div>
    <div class="metric"><div class="label">Complete (≥80%)</div><div class="value">${scored.filter(p=>p.score>=80).length} / ${scored.length}</div></div>
    <div class="metric"><div class="label">Critical (&lt;40%)</div><div class="value" style="color:var(--red)">${scored.filter(p=>p.score<40).length}</div></div>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Product</th><th>Score</th><th>Missing</th><th></th></tr></thead>
    <tbody>${scored.map(p=>`<tr>
      <td><span class="model-name">${esc(p.brand_name)} ${esc(p.model)}</span></td>
      <td><span class="pill ${p.score>=80?'pill-green':p.score>=50?'pill-amber':'pill-red'}">${p.score}%</span></td>
      <td class="tiny">${p.issues.length?p.issues.join(' · '):'<span style="color:var(--green)">✅ Complete</span>'}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="go('product-detail','${p.id}')">Fix →</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

/* ══════════════════ EXPORT (retailer-focused) ══════════════════ */
function toCSV(rows){
  if(!rows.length)return'';
  const keys=Object.keys(rows[0]);
  const cell=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return keys.join(',')+'\n'+rows.map(r=>keys.map(k=>cell(r[k])).join(',')).join('\n');
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const EXPORTS={
  products:{label:'Product Catalog',icon:'📦',table:'aiq_products',
    cols:'model,brand_name,manufacturer_name,category,series,product_line,upc,finish,color,msrp,map_price,width_inches,height_inches,depth_inches,weight_lbs,energy_star,ada_compliant,short_description'},
  documents:{label:'Documents & Manuals',icon:'📄',table:'pim_product_documents',cols:'title,doc_type,language,locale,version,file_url,file_name,created_at'},
  images:{label:'Product Images',icon:'📸',table:'pim_product_images',cols:'image_type,file_url,alt_text,finish_shown,angle,width_px,height_px,is_primary'},
  videos:{label:'Product Videos',icon:'🎬',table:'pim_product_videos',cols:'title,video_type,embed_url,video_url,duration_seconds,resolution,language'},
  marketing:{label:'Marketing Assets',icon:'📢',table:'pim_marketing_assets',cols:'title,asset_type,file_url,campaign,season,usage_rights,effective_date,expiry_date'},
  rebates:{label:'Rebates & Promotions',icon:'💰',table:'pim_product_rebates',cols:'rebate_name,rebate_type,rebate_amount,rebate_percent,start_date,end_date,submission_deadline,rebate_form_url,is_active'},
  certifications:{label:'Certifications & Energy',icon:'⚡',table:'pim_product_certifications',cols:'cert_type,cert_body,cert_number,energy_star_rating,annual_energy_kwh,annual_energy_cost,water_usage_gallons,noise_level_dba,energy_guide_url'},
  dimensions:{label:'Dimensions & Cutouts',icon:'📐',table:'pim_product_dimensions',cols:'width_inches,height_inches,depth_inches,depth_with_door_inches,cutout_width,cutout_height,cutout_depth,shipping_weight_lbs,door_swing_direction,cad_file_url,revit_file_url'},
  warranty:{label:'Warranty Coverage',icon:'🛡️',table:'pim_warranty_details',cols:'coverage_name,warranty_type,coverage_years,parts_covered,labor_covered,in_home_service,transferable,registration_url'},
  brands:{label:'Brand Directory',icon:'◆',table:'brand_catalog',cols:'brand_name,parent_company,brand_tier,country,is_active'}
};
async function runExport(key,fmt){
  const e=EXPORTS[key];if(!e)return;
  const {data,error}=await sb.from(e.table).select(e.cols);
  if(error)return alert('Export failed: '+error.message);
  if(!data||!data.length)return alert('No data available to export for '+e.label+'.');
  const stamp=new Date().toISOString().slice(0,10);
  if(fmt==='json')download(`productiq-${key}-${stamp}.json`,JSON.stringify(data,null,2),'application/json');
  else download(`productiq-${key}-${stamp}.csv`,toCSV(data));
}
async function renderExport(C){
  const counts={};
  await Promise.all(Object.entries(EXPORTS).map(async([k,e])=>{
    const {count}=await sb.from(e.table).select('*',{count:'exact',head:true});
    counts[k]=count||0;
  }));
  C.innerHTML=`
  <div class="pagehead"><div><h1>⇩ Export Data</h1><p class="sub">Download product content as CSV or JSON. Exports respect your access level — you receive exactly the records you're permitted to see.</p></div></div>
  <div class="panel" style="background:#eef0ff;border-color:#c7d2fe">
    <div style="display:flex;gap:12px;align-items:center">
      <div style="font-size:22px">${S.role.isAdmin?'🛡️':S.role.vendors.length?'🏭':'🏪'}</div>
      <div><strong>Exporting as: ${esc(roleLabel())}</strong>
      <div class="tiny">${S.role.isAdmin?'Full catalog access across all brands.':S.role.vendors.length?'Scoped to brands owned by '+esc(S.role.vendors.map(v=>v.name).join(', ')):'Published product content across the catalog.'}</div></div>
    </div>
  </div>
  <div class="asset-grid">
    ${Object.entries(EXPORTS).map(([k,e])=>`<div class="asset-card">
      <div class="preview" style="height:80px;font-size:30px">${e.icon}</div>
      <div class="info"><h4>${esc(e.label)}</h4><span class="tiny">${counts[k]} record${counts[k]===1?'':'s'} available</span></div>
      <div class="actions">
        <button class="btn btn-secondary btn-sm" onclick="runExport('${k}','csv')" ${counts[k]?'':'disabled style="opacity:.4"'}>CSV</button>
        <button class="btn btn-secondary btn-sm" onclick="runExport('${k}','json')" ${counts[k]?'':'disabled style="opacity:.4"'}>JSON</button>
      </div>
    </div>`).join('')}
  </div>`;
}

    <div class="metric"><div class="label">Assigned Users</div><div class="value">${(members||[]).length}</div></div>

  </div>
  <div class="panel"><h2>Assigned Manufacturer Users</h2>
    ${(members||[]).length?`<div class="tablewrap"><table>
      <thead><tr><th>Company</th><th>Role</th><th>Status</th><th>User ID</th></tr></thead>
      <tbody>${(members||[]).map(m=>`<tr>
        <td><span class="model-name">${esc(m.mfr_vendors?.name||'—')}</span></td>
        <td><span class="pill pill-indigo">${esc(m.role||'—')}</span></td>
        <td>${m.status==='active'?'<span class="pill pill-green">Active</span>':'<span class="pill pill-gray">'+esc(m.status)+'</span>'}</td>
        <td class="tiny">${esc(m.user_id).substring(0,8)}…</td>
      </tr>`).join('')}</tbody></table></div>`
    :'<div class="empty">No manufacturer users assigned yet.</div>'}
  </div>
  <div class="panel"><h2>Manufacturer Companies &amp; Brand Ownership</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Company</th><th>Brands Owned</th><th>Status</th></tr></thead>
      <tbody>${(vendors||[]).filter(v=>bc[v.id]).sort((a,b)=>bc[b.id]-bc[a.id]).map(v=>`<tr>
        <td><span class="model-name">${esc(v.name)}</span></td>
        <td><span class="pill pill-gray">${bc[v.id]||0}</span></td>
        <td>${v.status==='active'?'<span class="pill pill-green">Active</span>':'<span class="pill pill-gray">'+esc(v.status||'—')+'</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
  </div>`;
}

  <div class="pagehead"><div><h1>Activity Log</h1><p class="sub">Recent changes across the product catalog.</p></div></div>
  <div class="panel"><h2>Version History</h2>
    ${(versions||[]).length?`<div class="tablewrap"><table><thead><tr><th>Product ID</th><th>Version</th><th>Date</th></tr></thead><tbody>
      ${(versions||[]).map(v=>`<tr class="clickable" onclick="go('product-detail','${v.product_id}')"><td class="tiny">${esc(v.product_id).substring(0,8)}…</td><td>v${v.version_number}</td><td class="tiny">${new Date(v.created_at).toLocaleString()}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">No version history yet.</div>'}
  </div>`;
}
