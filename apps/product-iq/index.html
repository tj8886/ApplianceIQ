<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f1f3d"/>
<title>Product IQ — The Appliance Industry PIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0f1f3d;--navy2:#162a4d;--indigo:#6366f1;--blue:#2563eb;--cyan:#06b6d4;--teal:#0d9488;--bg:#f4f6f8;--card:#fff;--ink:#1f2b3d;--muted:#64748b;--line:#e3e8ee;--green:#177c45;--greenbg:#e8f7ee;--amber:#a15c00;--amberbg:#fff5df;--red:#ad3125;--redbg:#fdecea;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;margin:0;color:var(--navy)}a{color:var(--indigo);text-decoration:none}

.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;font-family:Sora;font-weight:800;font-size:16px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--navy2),var(--indigo));display:grid;place-items:center;font-size:11px;font-weight:800}
.product-pill{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a5b4fc;margin:0 10px 14px}
.nav{border:0;background:transparent;color:#b7c4d8;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;font:600 13px Inter;display:flex;gap:9px;align-items:center;width:100%}
.nav:hover,.nav.active{background:rgba(255,255,255,.1);color:#fff}
.nav .icon{width:18px;text-align:center;font-size:15px}
.side-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.side-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;padding:8px 11px 4px}
.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.side-link{color:#8b9cc0;text-decoration:none;font-size:12px;padding:7px 11px;display:block}
.side-link:hover{color:#fff}
.user-chip{font-size:11px;color:#7b8dae;padding:8px 11px;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}

main{min-width:0;padding:24px 30px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--navy)}
.avatar{height:30px;width:30px;border-radius:50%;background:#eef0f7;color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.pagehead h1{font-size:26px;letter-spacing:-.7px}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}

.btn{border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font:700 13px Inter;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn-secondary:hover{background:#f8f9fb}
.btn-indigo{background:var(--indigo);color:#fff}.btn-indigo:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-green{color:var(--green);background:var(--greenbg)}.pill-amber{color:var(--amber);background:var(--amberbg)}.pill-red{color:var(--red);background:var(--redbg)}.pill-gray{color:#59687a;background:#eef2f6}.pill-indigo{color:var(--indigo);background:#eef0ff}.pill-cyan{color:#0e7490;background:#ecfeff}.pill-teal{color:var(--teal);background:#e6fffa}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.metric .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.metric .value{font:800 24px Sora;margin-top:4px;color:var(--navy)}
.metric .note{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.control{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font:13px Inter;color:var(--ink)}
.search-input{min-width:220px;flex:1}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:600px}
th{padding:10px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid #eef1f4;vertical-align:middle;font-size:13px}
tr:last-child td{border:0}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f8fbfc}
.model-name{font-weight:800;color:var(--navy)}
.tiny{font-size:12px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cad3df;border-radius:9px}
.error{padding:12px;border-radius:9px;background:var(--redbg);color:var(--red);font-size:13px}
.loading{color:var(--muted);padding:24px}

.record{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.record-top{display:flex;gap:16px;align-items:flex-start}
.record-img{width:80px;height:80px;border-radius:var(--radius);background:#eef2f6;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.record-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px -20px 16px;padding:0 20px;overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;font:600 13px Inter}
.tab.active{color:var(--indigo);border-color:var(--indigo)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv div{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div:nth-child(3n){border-right:0}
.kv small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row{margin-bottom:0}
.form-row.full{grid-column:1/-1}
.form-row label{display:block;font:600 12px Inter;color:var(--navy);margin-bottom:4px}
.form-row input,.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:13px Inter;color:var(--ink)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-row textarea{min-height:80px;resize:vertical}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

/* Asset grid */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.asset-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.15s}
.asset-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.asset-card .preview{height:140px;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
.asset-card .preview img{width:100%;height:100%;object-fit:cover}
.asset-card .info{padding:12px}
.asset-card .info h4{font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-card .info .tiny{display:block}
.asset-card .actions{padding:0 12px 12px;display:flex;gap:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,31,61,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:640px;max-width:100%;max-height:90vh;overflow-y:auto;padding:28px}
.modal h2{margin-bottom:16px}

/* Content stats */
.content-stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.content-stat:last-child{border:0}
.content-stat .cs-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.content-stat .cs-info{flex:1}
.content-stat .cs-info strong{font-size:14px;display:block}
.content-stat .cs-info span{font-size:11px;color:var(--muted)}
.content-stat .cs-count{font:800 18px Sora;color:var(--navy)}

/* Login */
.login-overlay{position:fixed;inset:0;background:var(--navy);z-index:200;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:420px;max-width:90vw;text-align:center}
.login-box .mark{width:48px;height:48px;font-size:16px;border-radius:14px;margin:0 auto 12px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box .sub{margin-bottom:24px}
.login-box .form-row{text-align:left;margin-bottom:14px}
.login-box .btn{width:100%;justify-content:center;padding:11px}
.login-box .demo-hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* Landing */
.landing{min-height:100vh}
.land-nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:20px 24px}
.land-nav .logo{display:flex;align-items:center;gap:10px;font:800 18px Sora;color:#fff}
.land-nav .logo .mark{width:36px;height:36px;border-radius:10px}
.land-hero{background:var(--navy);padding:80px 24px 100px;text-align:center;position:relative;overflow:hidden}
.land-hero::before{content:'';position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.15),transparent 70%);pointer-events:none}
.land-hero h1{font-size:clamp(32px,5vw,52px);color:#fff;max-width:700px;margin:0 auto 16px;letter-spacing:-1px;position:relative}
.land-hero h1 span{color:var(--indigo)}
.land-hero p{color:rgba(255,255,255,.6);font-size:17px;max-width:550px;margin:0 auto 32px;position:relative}
.land-section{max-width:1100px;margin:0 auto;padding:60px 24px}
.land-section h2{font-size:28px;text-align:center;margin-bottom:10px}
.land-section .section-sub{text-align:center;color:var(--muted);margin-bottom:36px;font-size:15px}
.land-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.land-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:.2s}
.land-card:hover{box-shadow:0 8px 30px rgba(0,0,0,.08);transform:translateY(-2px)}
.land-card .lc-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.land-card h3{font-size:16px;margin-bottom:6px}
.land-card p{color:var(--muted);font-size:13px}
.land-two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:40px}
.land-two h3{font-size:22px;margin-bottom:10px}
.land-two p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:12px}
.land-two .list-check{list-style:none;padding:0}
.land-two .list-check li{padding:6px 0;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.land-two .list-check li::before{content:'✓';color:var(--green);font-weight:800;flex-shrink:0}
.land-cta{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius);padding:50px;text-align:center;color:#fff;margin:20px 0 40px}
.land-cta h2{color:#fff;margin-bottom:10px}.land-cta p{color:rgba(255,255,255,.65);margin-bottom:24px}
.land-footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

@media(max-width:900px){
.shell{grid-template-columns:1fr}.side{height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
.brand,.product-pill,.side-bottom,.side-label,.side-sep,.user-chip{display:none}
.nav{white-space:nowrap;font-size:12px;padding:8px 10px}.nav .icon{display:none}
main{padding:16px}
.cards{grid-template-columns:repeat(2,1fr)}
.kv{grid-template-columns:repeat(2,1fr)}.kv div:nth-child(3n){border-right:1px solid var(--line)}.kv div:nth-child(2n){border-right:0}
.land-grid{grid-template-columns:1fr}.land-two{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
.asset-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media(max-width:600px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div{border-right:0!important}}
</style>
</head>
<body>
<div id="app"><div class="loading" style="padding:40px;text-align:center">Loading Product IQ…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');

/* ── STATE ── */
const S={user:null,role:{isAdmin:false,isManufacturer:false,isRetailer:false,vendors:[],brandNames:[],loaded:false},view:'landing',page:'dashboard',detail:null,detailTab:'overview',editMode:false,filters:{search:'',brand:'',manufacturer:'',category:'',status:''},pg:0,assetFilter:'all',modal:null};
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$=v=>v?'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}):'—';
const fmtDate=v=>v?new Date(v).toLocaleDateString():'—';
const DOC_ICONS={owners_manual:'📖',installation_guide:'🔧',spec_sheet:'📋',energy_guide:'⚡',quick_start:'🚀',warranty_card:'🛡️',safety_data_sheet:'⚠️',troubleshooting:'🔍',parts_list:'🔩',wiring_diagram:'🔌',rough_in_template:'📐',cad_drawing:'📏',revit_file:'🏗️',rebate_form:'💰',sell_sheet:'📄',comparison_chart:'📊'};
const VID_ICONS={product_overview:'🎬',installation_video:'🛠️',how_to_video:'💡',testimonial_video:'⭐','360_view':'🔄',comparison_video:'⚖️'};
const MKT_ICONS={sell_sheet_print:'🖨️',social_media_kit:'📱',co_op_ad_template:'📰',pop_display:'🏪',brand_logo:'🏷️',product_badge:'🏆',email_template:'📧',training_deck:'🎓',catalog_page:'📕'};

/* ── ECOSYSTEM APPS ── */
const APPS=[
  ['CRM','🤝','https://crmaiiq.netlify.app'],
  ['Spec IQ','📋','https://appliance-spec-iq.netlify.app'],
  ['AI Academy','🎓','https://applianceiq-aiacademy.netlify.app'],
  ['IQ Field','🔧','https://applianceiq-iq-field.netlify.app'],
  ['Command Center','🛰️','https://applianceiq-intelligence-group.netlify.app/command-center'],
  ['Brand Portal','🏭','https://applianceiq-brand-portal.netlify.app'],
  ['IQ Up','📈','https://applianceiq-iq-up-system.netlify.app'],
];

/* ── ROLE CONTEXT ── */
async function loadRole(){
  const uid=S.user?.id; if(!uid)return;
  const [{data:roles},{data:members},{data:admin}]=await Promise.all([
    sb.from('mfr_user_roles').select('*').eq('user_id',uid).maybeSingle(),
    sb.from('mfr_members').select('vendor_id,role,status,mfr_vendors(id,name)').eq('user_id',uid).eq('status','active'),
    sb.from('product_iq_platform_roles').select('role').eq('user_id',uid).eq('status','active')
  ]);
  const isAdmin=(admin||[]).length>0 || !!roles?.is_admin;
  const vendors=(members||[]).map(m=>({id:m.vendor_id,name:m.mfr_vendors?.name||'Vendor',role:m.role}));
  let brandNames=[];
  if(vendors.length){
    const {data:bs}=await sb.from('brand_catalog').select('brand_name').in('manufacturer_id',vendors.map(v=>v.id));
    brandNames=(bs||[]).map(b=>b.brand_name);
  }
  S.role={isAdmin,isManufacturer:!!roles?.is_manufacturer||vendors.length>0,
    isRetailer:!!roles?.is_retailer||!!roles?.is_builder||!!roles?.is_designer,
    vendors,brandNames,loaded:true};
}
const canEdit=()=>S.role.isAdmin||S.role.isManufacturer;
function roleLabel(){
  if(S.role.isAdmin)return'Platform Admin';
  if(S.role.vendors.length)return S.role.vendors.map(v=>v.name).join(', ');
  if(S.role.isRetailer)return'Retailer';
  return'Viewer';
}

/* ── INIT ── */
function inviteCodeFromURL(){
  const m=new URLSearchParams(location.search).get('invite');
  return m?m.trim():null;
}
async function init(){
  const code=inviteCodeFromURL();
  const {data:{user}}=await sb.auth.getUser();
  if(code){
    if(user){ // already signed in — redeem straight away
      S.user=user;
      const {data:vn,error}=await sb.rpc('piq_redeem_invite',{p_code:code});
      if(error)return showInvite(code,error.message);
      history.replaceState({},'',location.pathname);
      await loadRole();S.view='app';S.page='dashboard';return render();
    }
    return showInvite(code);
  }
  if(user){S.user=user;await loadRole();S.view='app';render()}
  else showLanding();
}

/* ── INVITE ACCEPTANCE ── */
async function showInvite(code,err){
  const {data}=await sb.rpc('piq_preview_invite',{p_code:code});
  const inv=Array.isArray(data)?data[0]:data;
  if(!inv||!inv.valid){
    document.getElementById('app').innerHTML=`
    <div class="login-overlay"><div class="login-box">
      <div class="mark">PIQ</div><h1>Invite Unavailable</h1>
      <p class="sub">This invite link is invalid, already used, or expired. Ask your administrator for a new one.</p>
      <button class="btn btn-secondary" onclick="location.href=location.pathname">← Back to Product IQ</button>
    </div></div>`;return;
  }
  document.getElementById('app').innerHTML=`
  <div class="login-overlay"><div class="login-box">
    <div class="mark">PIQ</div>
    <h1>You're Invited</h1>
    <p class="sub">${inv.persona==='manufacturer'
      ? 'Manage product content for <b>'+esc(inv.vendor_name)+'</b>'
      : 'Retailer access to the Product IQ catalog'}</p>
    <div class="panel" style="text-align:left;background:#eef0ff;border-color:#c7d2fe;margin-bottom:16px">
      <div class="tiny"><b>${esc(inv.email)}</b></div>
      <div class="tiny">${inv.persona==='manufacturer'?'Role: '+esc(inv.invite_role||'').replace(/_/g,' '):'Browse and export published product data'}</div>
    </div>
    ${err?`<div class="error" style="margin-bottom:12px">${esc(err)}</div>`:''}
    <div class="form-row"><label>Create a Password</label><input id="inv-pw" type="password" placeholder="At least 8 characters"/></div>
    <div class="form-row"><label>Confirm Password</label><input id="inv-pw2" type="password"/></div>
    <div id="inv-err"></div>
    <button class="btn btn-primary" onclick="acceptInvite('${code}','${esc(inv.email)}')" style="margin-top:8px">Accept &amp; Create Account</button>
    <div class="demo-hint">Already have an account with this email? <a href="#" onclick="acceptInviteExisting('${code}','${esc(inv.email)}');return false">Sign in instead</a></div>
  </div></div>`;
  document.getElementById('inv-pw').focus();
}
async function acceptInvite(code,email){
  const pw=document.getElementById('inv-pw').value, pw2=document.getElementById('inv-pw2').value;
  const E=document.getElementById('inv-err');
  const fail=m=>E.innerHTML=`<div class="error" style="margin:8px 0">${esc(m)}</div>`;
  if(pw.length<8)return fail('Password must be at least 8 characters.');
  if(pw!==pw2)return fail('Passwords do not match.');
  E.innerHTML='<div class="tiny" style="margin:8px 0">Creating your account…</div>';
  const {error:se}=await sb.auth.signUp({email,password:pw});
  if(se&&!/already registered|already been registered/i.test(se.message)){
    if(/rate limit|too many/i.test(se.message)){
      return fail('Too many sign-up attempts right now. Please wait a minute and try again. (Administrator: disable "Confirm email" in Supabase Auth settings to remove this limit — invites are already verified.)');
    }
    return fail(se.message);
  }
  await sb.rpc('piq_confirm_invited_email',{p_code:code});
  const {error:le}=await sb.auth.signInWithPassword({email,password:pw});
  if(le)return fail('Account created, but sign-in failed: '+le.message+'. If you already had an account, use "Sign in instead" below.');

/* ══════════════════ PRODUCT DETAIL ══════════════════ */
async function renderProductDetail(C){
  if(!S.detail)return go('catalog');
  const [{data:p,error},{data:dims},{data:versions},{data:accessories},{data:images},{data:videos},{data:docs},{data:features},{data:certs},{data:warranty},{data:rebates},{data:priceHistory},{data:retailerPrices}]=await Promise.all([
    sb.from('aiq_products').select('*').eq('id',S.detail).maybeSingle(),
    sb.from('pim_product_dimensions').select('*').eq('product_id',S.detail).maybeSingle(),
    sb.from('aiq_product_versions').select('*').eq('product_id',S.detail).order('version_number',{ascending:false}),
    sb.from('pim_product_accessories').select('*').eq('product_id',S.detail).order('display_order'),
    sb.from('pim_product_images').select('*').eq('product_id',S.detail).order('display_order'),
    sb.from('pim_product_videos').select('*').eq('product_id',S.detail).order('display_order'),
    sb.from('pim_product_documents').select('*').eq('product_id',S.detail).order('doc_type'),
    sb.from('pim_product_features').select('*').eq('product_id',S.detail).order('display_order'),
    sb.from('pim_product_certifications').select('*').eq('product_id',S.detail),
    sb.from('pim_warranty_details').select('*').eq('product_id',S.detail).order('display_order'),
    sb.from('pim_product_rebates').select('*').eq('product_id',S.detail),
    sb.from('pim_price_history').select('*').eq('product_id',S.detail).order('checked_at',{ascending:false}).limit(20),
    sb.from('pim_retailer_prices').select('*').eq('product_id',S.detail).order('checked_at',{ascending:false})
  ]);
  if(error||!p)return C.innerHTML=`<div class="error">Product not found.</div>`;
  if(S.editMode)return renderProductEdit(C,p);

  // Brand-level warranty policy fallback (used when no per-product pim_warranty_details rows exist)
  var warrantyPolicyMatches=[];
  try{
    var wpRes=await sb.from('aiq_warranty_policies').select('*').eq('brand_name',p.brand_name).in('category',[p.category,'all']);
    warrantyPolicyMatches=wpRes.data||[];
  }catch(e){}
  // Prefer an exact category match over the brand's 'all' fallback
  var warrantyPolicy=warrantyPolicyMatches.find(function(w){return w.category===p.category;})||warrantyPolicyMatches.find(function(w){return w.category==='all';})||null;

  const heroImg=(images||[]).find(i=>i.is_primary)||images?.[0];
  const allTabs=['overview','pricing','retailers','specs','images','videos','documents','marketing','dimensions','features','accessories','certifications','warranty','rebates','history'];
  const tabCounts={images:(images||[]).length,videos:(videos||[]).length,documents:(docs||[]).length,features:(features||[]).length,accessories:(accessories||[]).length,certifications:(certs||[]).length,warranty:(warranty||[]).length||(warrantyPolicy?1:0),rebates:(rebates||[]).length,history:(versions||[]).length,pricing:(priceHistory||[]).length,retailers:(retailerPrices||[]).length};
  const tab=S.detailTab||'overview';

  // Pre-compute complex values
  const condBadges=[];
  if(p.is_discontinued)condBadges.push('<span class="pill pill-red">🚫 Discontinued</span>');
  if(p.is_clearance)condBadges.push('<span class="pill pill-amber">🏷️ Clearance</span>');
  if(p.is_end_of_life)condBadges.push('<span class="pill pill-amber">⚠️ End of Life</span>');
  if(p.is_open_box)condBadges.push('<span class="pill pill-amber">📦 Open Box</span>');
  if(p.is_refurbished)condBadges.push('<span class="pill pill-amber">🔧 Refurbished</span>');
  (p.condition_flags||[]).filter(f=>!['discontinued','clearance','end_of_life','open_box','refurbished'].includes(f)).forEach(f=>condBadges.push('<span class="pill pill-gray">'+f.replace(/_/g,' ')+'</span>'));
  if(p.replacement_model)condBadges.push('<span class="pill pill-indigo">→ '+esc(p.replacement_model)+'</span>');
  const condHtml=condBadges.length?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'+condBadges.join('')+'</div>':'';
  const condNote=p.condition_notes?'<div style="background:var(--amberbg);color:var(--amber);padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:14px">ℹ️ '+esc(p.condition_notes)+'</div>':'';

  let colorsArr=[];
  try{colorsArr=typeof p.available_colors==='string'?JSON.parse(p.available_colors||'[]'):(p.available_colors||[]);}catch(e){}
  const colorsHtml=colorsArr.length?'<div style="margin-top:16px"><h3 style="font-size:14px;margin-bottom:8px">Available Colors & Finishes ('+colorsArr.length+')</h3><div style="display:flex;gap:8px;flex-wrap:wrap">'+colorsArr.map(function(c){return '<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px"><strong style="font-size:13px">'+esc(c.color||c.finish||'')+'</strong>'+(c.model_number?'<br/><span style="font-size:11px;color:var(--muted);font-family:monospace">'+esc(c.model_number)+'</span>':'')+(c.msrp?'<br/><span style="font-size:12px;font-weight:700;color:var(--indigo)">'+fmt$(c.msrp)+'</span>':'')+(c.sale_price?'<span style="font-size:12px;font-weight:700;color:var(--red);margin-left:6px">'+fmt$(c.sale_price)+'</span>':'')+'</div>';}).join('')+'</div></div>':'';

  let specsObj={};
  try{specsObj=typeof p.specs_json==='string'?JSON.parse(p.specs_json||'{}'):(p.specs_json||{});}catch(e){}
  const specsKeys=Object.keys(specsObj).filter(function(k){return specsObj[k]!==null&&specsObj[k]!=='';});
  const specsHtml=specsKeys.length?'<div class="panel"><h2>Detailed Specifications</h2><div class="kv">'+specsKeys.map(function(k){return '<div><small>'+k.replace(/_/g,' ')+'</small>'+esc(String(specsObj[k]))+'</div>';}).join('')+'</div></div>':'<div class="empty">No detailed specifications yet.</div>';

  const priceRows=(priceHistory||[]).map(function(ph){return '<tr><td class="tiny">'+new Date(ph.checked_at).toLocaleDateString()+'</td><td>'+fmt$(ph.msrp)+'</td><td style="color:var(--red)">'+fmt$(ph.sale_price)+'</td><td style="color:var(--green)">'+fmt$(ph.lowest_price)+'</td><td class="tiny">'+esc(ph.lowest_price_source||'')+'</td></tr>';}).join('');

  const latestRetailer = {};
  const rpCountries = new Set((retailerPrices||[]).map(function(rp){return rp.country||'CA';}));
  (retailerPrices||[]).forEach(function(rp) {
    var key = rp.retailer_name + '|' + (rp.country||'CA');
    if (!latestRetailer[key] || new Date(rp.checked_at) > new Date(latestRetailer[key].checked_at)) {
      latestRetailer[key] = rp;
    }
  });
  const retailerList = Object.values(latestRetailer).sort(function(a,b) { return (a.price||99999) - (b.price||99999); });
  
  var retailerHtml = '';
  if (retailerList.length) {
    ['CA','US'].forEach(function(ctry) {
      var ctryRetailers = retailerList.filter(function(r){return (r.country||'CA')===ctry;});
      if (!ctryRetailers.length) return;
      var flag = ctry === 'CA' ? '🇨🇦' : '🇺🇸';
      var curr = ctry === 'CA' ? 'CAD' : 'USD';
      retailerHtml += '<div class="panel" style="margin-bottom:16px"><h2>' + flag + ' ' + ctry + ' Retailer Prices (' + ctryRetailers.length + ') — ' + curr + '</h2><div class="tablewrap"><table><thead><tr><th>Retailer</th><th>Price</th><th>Regular</th><th>Stock</th><th>Condition</th><th>Delivery</th><th>Checked</th></tr></thead><tbody>' + ctryRetailers.map(function(r, i) {
        var isLowest = i === 0 && r.price;
        return '<tr style="' + (isLowest ? 'background:var(--greenbg)' : '') + '">' +
          '<td><strong>' + esc(r.retailer_name) + (isLowest ? ' 🏆' : '') + '</strong>' + (r.product_url ? '<br/><a href="' + esc(r.product_url) + '" target="_blank" style="font-size:11px;color:var(--indigo)">View ↗</a>' : '') + '</td>' +
          '<td style="font-weight:700;font-size:15px;color:' + (r.on_sale ? 'var(--red)' : 'var(--green)') + '">' + (r.price ? fmt$(r.price) : '—') + (r.on_sale && r.sale_label ? '<br/><span style="font-size:10px;color:var(--red)">' + esc(r.sale_label) + '</span>' : '') + '</td>' +
          '<td style="' + (r.on_sale ? 'text-decoration:line-through;color:var(--muted)' : '') + '">' + (r.regular_price ? fmt$(r.regular_price) : '—') + '</td>' +
          '<td>' + (r.in_stock === true ? '<span style="color:var(--green)">✓ In Stock</span>' : r.in_stock === false ? '<span style="color:var(--red)">✗ Out</span>' : '—') + (r.stock_note ? '<br/><span class="tiny">' + esc(r.stock_note) + '</span>' : '') + '</td>' +
          '<td>' + (r.is_open_box ? '<span class="pill pill-amber">Open Box</span>' : r.is_clearance ? '<span class="pill pill-amber">Clearance</span>' : r.is_floor_model ? '<span class="pill pill-amber">Floor</span>' : r.condition === 'discontinued' ? '<span class="pill pill-red">Disco</span>' : '<span class="pill pill-green">New</span>') + '</td>' +
          '<td>' + (r.free_delivery ? '<span style="color:var(--green)">Free</span>' : r.shipping_cost ? fmt$(r.shipping_cost) : '—') + '</td>' +
          '<td class="tiny">' + new Date(r.checked_at).toLocaleDateString() + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    });
  } else {
    retailerHtml = '<div class="empty">No retailer prices yet. Use the PIM Scraper\'s 🏪 Retailer Prices tab to check prices across Canadian and US retailers.</div>';

function showModal(title,html){
  const m=document.createElement('div');m.className='modal-bg';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2>${title}</h2><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-bg').remove()">✕</button></div>${html}</div>`;
  document.body.appendChild(m);
}

  const gb=i=>document.getElementById(i)?.value==='true';

    series:g('e-series'),product_line:g('e-line'),product_family:g('e-family'),

    upc:g('e-upc'),finish:g('e-finish'),color:g('e-color'),color_family:g('e-colorfam'),made_in:g('e-made'),
    width_inches:gn('e-w'),height_inches:gn('e-h'),depth_inches:gn('e-d'),weight_lbs:gn('e-wt'),
    freight_class:g('e-freight'),lead_time_days:gn('e-lead'),

    short_description:g('e-desc'),long_description:g('e-ldesc'),
    updated_by:S.user.id,updated_at:new Date().toISOString()};
  const {error}=await sb.from('aiq_products').update(update).eq('id',id);
  if(error)return alert('Save failed: '+error.message);

/* ══════════════════ DATA QUALITY ══════════════════ */
async function renderDataQuality(C){
  const [{data:products},{data:imgs},{data:docs},{data:dims}]=await Promise.all([
    sb.from('aiq_products').select('id,brand_name,model,short_description,msrp,series,product_line,product_family,category,upc,finish'),
    sb.from('pim_product_images').select('product_id'),
    sb.from('pim_product_documents').select('product_id'),
    sb.from('pim_product_dimensions').select('product_id')
  ]);
  const imgIds=new Set((imgs||[]).map(i=>i.product_id));
  const docIds=new Set((docs||[]).map(d=>d.product_id));
  const dimIds=new Set((dims||[]).map(d=>d.product_id));
  const scored=(products||[]).map(p=>{
    let score=0,total=10,issues=[];
    if(p.short_description){score++}else issues.push('Description');
    if(p.msrp){score++}else issues.push('MSRP');
    if(p.series){score++}else issues.push('Series');
    if(p.product_line){score++}else issues.push('Product Line');
    if(p.product_family){score++}else issues.push('Product Family');
    if(p.upc){score++}else issues.push('UPC');
    if(p.finish){score++}else issues.push('Finish');
    if(imgIds.has(p.id)){score++}else issues.push('Images');
    if(docIds.has(p.id)){score++}else issues.push('Documents');
    if(dimIds.has(p.id)){score++}else issues.push('Dimensions');
    return {...p,score:Math.round(score/total*100),issues};
  }).sort((a,b)=>a.score-b.score);
  const avg=scored.length?Math.round(scored.reduce((s,p)=>s+p.score,0)/scored.length):0;
  C.innerHTML=`
  <div class="pagehead"><div><h1>Data Quality</h1><p class="sub">Content completeness scoring across ${scored.length} products (10 criteria).</p></div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="label">Avg Score</div><div class="value" style="color:${avg>=60?'var(--green)':'var(--amber)'}">${avg}%</div></div>
    <div class="metric"><div class="label">Complete (≥80%)</div><div class="value">${scored.filter(p=>p.score>=80).length} / ${scored.length}</div></div>
    <div class="metric"><div class="label">Critical (&lt;40%)</div><div class="value" style="color:var(--red)">${scored.filter(p=>p.score<40).length}</div></div>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Product</th><th>Score</th><th>Missing</th><th></th></tr></thead>
    <tbody>${scored.map(p=>`<tr>
      <td><span class="model-name">${esc(p.brand_name)} ${esc(p.model)}</span></td>
      <td><span class="pill ${p.score>=80?'pill-green':p.score>=50?'pill-amber':'pill-red'}">${p.score}%</span></td>
      <td class="tiny">${p.issues.length?p.issues.join(' · '):'<span style="color:var(--green)">✅ Complete</span>'}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="go('product-detail','${p.id}')">Fix →</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

/* ══════════════════ EXPORT (retailer-focused) ══════════════════ */
function toCSV(rows){
  if(!rows.length)return'';
  const keys=Object.keys(rows[0]);
  const cell=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return keys.join(',')+'\n'+rows.map(r=>keys.map(k=>cell(r[k])).join(',')).join('\n');
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

async function runExport(key,fmt){
  const e=EXPORTS[key];if(!e)return;
  const {data,error}=await sb.from(e.table).select(e.cols);
  if(error)return alert('Export failed: '+error.message);
  if(!data||!data.length)return alert('No data available to export for '+e.label+'.');
  const stamp=new Date().toISOString().slice(0,10);
  if(fmt==='json')download(`productiq-${key}-${stamp}.json`,JSON.stringify(data,null,2),'application/json');
  else download(`productiq-${key}-${stamp}.csv`,toCSV(data));
}

function inviteURL(code){return location.origin+location.pathname+'?invite='+code}
async function createInvite(){
  const email=document.getElementById('inv-email').value.trim();
  const persona=document.getElementById('inv-persona').value;
  const vendor=document.getElementById('inv-vendor')?.value||null;
  const role=document.getElementById('inv-role')?.value||'product_editor';
  const R=document.getElementById('inv-result');
  if(!email)return R.innerHTML='<div class="error" style="margin-top:12px">Email address is required.</div>';
  const {data,error}=await sb.rpc('piq_create_invite',{p_email:email,p_persona:persona,
    p_vendor_id:persona==='manufacturer'?vendor:null,p_role:role});
  if(error)return R.innerHTML=`<div class="error" style="margin-top:12px">${esc(error.message)}</div>`;
  const inv=Array.isArray(data)?data[0]:data;
  const url=inviteURL(inv.code);
  R.innerHTML=`<div class="panel" style="margin-top:14px;background:var(--greenbg);border-color:#a7e0bd">
    <strong>✅ Invite created for ${esc(inv.email)}</strong>
    <div class="tiny" style="margin:6px 0">${inv.vendor_name?'Company: '+esc(inv.vendor_name):'Retailer access'} · expires in 30 days</div>
    <input class="control" style="width:100%;margin-top:6px" readonly value="${esc(url)}" onclick="this.select()"/>
    <div style="margin-top:8px"><button class="btn btn-indigo btn-sm" onclick="copyInvite('${inv.code}')">📋 Copy Link</button></div>
    <div class="tiny" style="margin-top:8px">Send this link to ${esc(inv.email)}. They set their own password and are granted access automatically.</div>
  </div>`;
  document.getElementById('inv-email').value='';
}
function copyInvite(code){
  const url=inviteURL(code);
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert('Invite link copied:\n'+url),()=>prompt('Copy this link:',url));
  else prompt('Copy this link:',url);
}
async function revokeInvite(id){
  if(!confirm('Revoke this invite? The link will stop working.'))return;
  const {error}=await sb.rpc('piq_revoke_invite',{p_id:id});
  if(error)return alert(error.message);
  renderPage();
}

        '</div>':'')+

        '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px">'+
          (c.support_email?'<a href="mailto:'+esc(c.support_email)+'" style="color:var(--indigo)">✉️ '+esc(c.support_email)+'</a>':'')+
          (c.support_website_url?'<a href="'+esc(c.support_website_url)+'" target="_blank" style="color:var(--indigo)">🌐 Support Site</a>':'')+
          (c.registration_url&&c.registration_url!==c.owner_account_portal_url?'<a href="'+esc(c.registration_url)+'" target="_blank" style="color:var(--indigo)">📝 Register Product</a>':'')+
          (c.parts_url?'<a href="'+esc(c.parts_url)+'" target="_blank" style="color:var(--indigo)">⚙️ Order Parts</a>':'')+
          (c.live_chat_url?'<a href="'+esc(c.live_chat_url)+'" target="_blank" style="color:var(--indigo)">💬 Live Chat</a>':'')+
        '</div>'+

        (c.notes?'<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line,#eee);font-size:12px;color:var(--muted);line-height:1.6">'+esc(c.notes)+'</div>':'')+
      '</div>';
    }).join(''):'<div class="empty">No vendor contact on file for that brand yet. Consider checking the brand\'s official support page directly.</div>');
}

/* ── RECALL SYNC — live client-side pull from CPSC + Health Canada ── */
window.syncRecalls = async function() {
  var btn = document.getElementById('syncRecallsBtn');
  var status = document.getElementById('syncStatus');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }
  if (status) { status.style.display = 'block'; }
  var log = function(msg) {
    if (status) status.innerHTML = '<div class="panel" style="background:var(--indigo-soft,#e0e7ff);border-color:var(--indigo,#4f46e5)"><p style="font-size:12px;color:var(--indigo,#3730a3);margin:0">'+msg+'</p></div>';
    console.log('[syncRecalls]', msg);
  };

  try {
    // 1. Get active brand names to match against
    var {data:brandRows} = await sb.from('brand_catalog').select('brand_name').eq('is_active', true);
    var brandNames = (brandRows||[]).map(function(b){return b.brand_name;}).filter(Boolean);
    var brandNamesLower = brandNames.map(function(n){return n.toLowerCase();});

    function matchesBrand(text) {
      if (!text) return null;
      var t = text.toLowerCase();
      for (var i = 0; i < brandNamesLower.length; i++) {
        if (t.indexOf(brandNamesLower[i]) !== -1) return brandNames[i];
      }
      return null;
    }

    var newCount = 0, updatedCount = 0, checkedCount = 0;

    // 2. CPSC — search by appliance category keywords (CPSC API doesn't support
    // manufacturer/brand search directly, so we search by product category and
    // filter matches client-side against our brand list)
    var categories = ['refrigerator','dishwasher','range','oven','microwave','washer','dryer',
      'freezer','cooktop','range hood','wine cooler','ice maker','dehumidifier','garbage disposal'];

    for (var ci = 0; ci < categories.length; ci++) {
      var cat = categories[ci];
      log('Checking CPSC for "' + cat + '"… (' + (ci+1) + '/' + categories.length + ')');
      try {
        var res = await fetch('https://www.saferproducts.gov/RestWebServices/Recall?ProductName=' + encodeURIComponent(cat) + '&format=json');
        if (!res.ok) { log('CPSC request failed for "' + cat + '" (HTTP ' + res.status + '), skipping…'); continue; }
        var items = await res.json();
        for (var i = 0; i < (items||[]).length; i++) {
          var it = items[i];
          checkedCount++;
          var allNames = []
            .concat((it.Manufacturers||[]).map(function(m){return m.Name;}))
            .concat((it.Importers||[]).map(function(m){return m.Name;}))
            .concat((it.Distributors||[]).map(function(m){return m.Name;}))
            .concat((it.Retailers||[]).map(function(m){return m.Name;}))
            .join(' | ');
          var brand = matchesBrand(allNames) || matchesBrand(it.Title) || matchesBrand((it.Products||[])[0]?.Name);
          if (!brand) continue;

          var models = (it.Products||[]).map(function(p){return p.Model;}).filter(Boolean);
          var row = {
            source: 'CPSC',
            source_recall_id: String(it.RecallID || it.RecallNumber),
            country: 'US',
            brand_name: brand,
            manufacturer_name: (it.Manufacturers||[])[0]?.Name || null,
            product_name: (it.Products||[])[0]?.Name || it.Title,
            model_numbers: models,
            category: cat,
            recall_date: it.RecallDate ? it.RecallDate.split('T')[0] : null,
            title: it.Title,
            description: it.Description,
            hazard: (it.Hazards||[])[0]?.Name || null,
            remedy: (it.Remedies||[])[0]?.Name || null,
            remedy_options: (it.RemedyOptions||[]).map(function(o){return o.Option;}).filter(Boolean),
            units_affected: (it.Products||[])[0]?.NumberOfUnits || null,
            injury_count: (it.Injuries||[]).length,
            injury_notes: (it.Injuries||[])[0]?.Name || null,
            url: it.URL,
            is_appliance_related: true,
            raw_data: it,
            last_synced_at: new Date().toISOString(),
          };
          var {data:existing} = await sb.from('aiq_recalls').select('id').eq('source','CPSC').eq('source_recall_id', row.source_recall_id).maybeSingle();
          await sb.from('aiq_recalls').upsert(row, { onConflict: 'source,source_recall_id' });
          if (existing) updatedCount++; else newCount++;
        }
      } catch (e) { log('Error checking CPSC "' + cat + '": ' + e.message); }
      await new Promise(function(r){ setTimeout(r, 400); }); // be polite to the API
    }

    // 3. Health Canada — fetch the daily open-data JSON dump and filter locally.
    // NOTE: field names below are our best guess from Health Canada's documented
    // schema; if this dataset uses different field names, matches may come back
    // low/zero on first run — raw_data is stored on every match so the mapping
    // can be corrected without re-fetching.
    log('Fetching Health Canada recall dataset…');
    try {
      var hcRes = await fetch('https://recalls-rappels.canada.ca/sites/default/files/opendata-donneesouvertes/HCRSAMOpenData.json');
      if (hcRes.ok) {
        var hcData = await hcRes.json();
        var hcList = Array.isArray(hcData) ? hcData : (hcData.recalls || hcData.data || []);
        var applianceWords = ['refrigerator','dishwasher','range','oven','microwave','washer','dryer','freezer','cooktop','hood','appliance','stove'];
        log('Scanning ' + hcList.length + ' Health Canada records for brand + appliance matches…');
        for (var j = 0; j < hcList.length; j++) {
          var hc = hcList[j];
          var hcTitle = hc.Title || hc.title || hc.ProductName || '';
          var hcDesc = hc.Description || hc.description || hc.Summary || '';
          var combined = (hcTitle + ' ' + hcDesc).toLowerCase();
          var isAppliance = applianceWords.some(function(w){ return combined.indexOf(w) !== -1; });
          if (!isAppliance) continue;
          var hcBrand = matchesBrand(hcTitle) || matchesBrand(hcDesc);
          if (!hcBrand) continue;

          var hcId = String(hc.WebIdentifier || hc.Id || hc.id || hc.RecallId || (hcTitle + j));
          var row2 = {
            source: 'Health Canada',
            source_recall_id: hcId,
            country: 'CA',
            brand_name: hcBrand,
            manufacturer_name: hc.Company || hc.Manufacturer || null,
            product_name: hcTitle,
            model_numbers: [],
            category: 'appliance',
            recall_date: hc.Date || hc.PublishDate || hc.date || null,
            title: hcTitle,
            description: hcDesc,
            hazard: hc.Hazard || hc.hazard || null,
            remedy: null,
            remedy_options: [],
            units_affected: null,
            injury_count: 0,
            injury_notes: null,
            url: hc.URL || hc.Url || hc.url || 'https://recalls-rappels.canada.ca/en',
            is_appliance_related: true,
            raw_data: hc,
            last_synced_at: new Date().toISOString(),
          };
          var {data:existing2} = await sb.from('aiq_recalls').select('id').eq('source','Health Canada').eq('source_recall_id', hcId).maybeSingle();
          await sb.from('aiq_recalls').upsert(row2, { onConflict: 'source,source_recall_id' });
          if (existing2) updatedCount++; else newCount++;
        }
      } else {
        log('Health Canada dataset request failed (HTTP ' + hcRes.status + ') — CORS or availability issue. CPSC results above are still saved.');
      }
    } catch (e) {
      log('Could not reach Health Canada dataset (likely a CORS restriction from this domain): ' + e.message + '. CPSC sync above still completed.');
    }

    log('✅ Sync complete — ' + newCount + ' new, ' + updatedCount + ' updated, ' + checkedCount + ' CPSC records scanned. Refreshing list…');
    S.recallSyncStatus = true;
    setTimeout(function(){ renderPage(); }, 1500);
  } catch (e) {
    log('❌ Sync failed: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync from CPSC + Health Canada'; }
  }
};


init();
</script>
