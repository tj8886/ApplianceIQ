<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product IQ — PIM Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;--surface:#111827;--surface2:#1a2332;--surface3:#1f2937;
  --border:#2a3444;--border2:#374151;
  --text:#e5e7eb;--text2:#9ca3af;--text3:#6b7280;
  --accent:#06b6d4;--accent2:#0891b2;--accent-glow:rgba(6,182,212,.12);
  --green:#10b981;--yellow:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--pink:#ec4899;
  --orange:#f97316;
  --radius:10px;--radius-sm:6px;
}
html{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
body{min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* Layout */
.shell{max-width:1400px;margin:0 auto;padding:20px 24px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;gap:12px}
header h1{font-size:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
header h1 span{color:var(--accent)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse-dot 2s infinite;flex-shrink:0}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.header-right{display:flex;align-items:center;gap:12px}
.last-update{font-size:12px;color:var(--text3)}
.btn{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:var(--border);border-color:var(--text3)}
.btn-accent{background:var(--accent2);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent)}

/* Stat Cards Row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.stat-card .sub{font-size:12px;color:var(--text2);margin-top:4px}
.stat-card.accent .value{color:var(--accent)}
.stat-card.green .value{color:var(--green)}
.stat-card.yellow .value{color:var(--yellow)}
.stat-card.purple .value{color:var(--purple)}
.stat-card.pink .value{color:var(--pink)}
.stat-card.orange .value{color:var(--orange)}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-head h3{font-size:14px;font-weight:600}
.panel-head .badge{font-size:11px;background:var(--surface3);border:1px solid var(--border2);padding:2px 8px;border-radius:12px;color:var(--text2)}
.panel-body{padding:16px}

/* Progress bars */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog-row:last-child{margin-bottom:0}
.prog-label{width:120px;font-size:12px;color:var(--text2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-track{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .6s ease}
.prog-pct{width:44px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border2);color:var(--text3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--accent-glow)}
tbody tr:last-child td{border-bottom:none}
.model-name{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-tag{font-size:11px;color:var(--accent);background:var(--accent-glow);padding:2px 7px;border-radius:3px;white-space:nowrap}
.completeness-bar{display:inline-flex;align-items:center;gap:6px}
.completeness-bar .mini-bar{width:60px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.completeness-bar .mini-fill{height:100%;border-radius:3px}

/* Asset breakdown */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.asset-item{text-align:center;padding:12px 8px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.asset-item .count{font-size:22px;font-weight:700;color:var(--accent)}
.asset-item .type{font-size:11px;color:var(--text2);margin-top:2px;text-transform:capitalize}

/* Realtime feed */
.feed{max-height:280px;overflow-y:auto}
.feed-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.feed-item:last-child{border-bottom:none}
.feed-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px}
.feed-icon.img{background:rgba(6,182,212,.15);color:var(--accent)}
.feed-icon.doc{background:rgba(139,92,246,.15);color:var(--purple)}
.feed-icon.vid{background:rgba(236,72,153,.15);color:var(--pink)}
.feed-icon.prod{background:rgba(16,185,129,.15);color:var(--green)}
.feed-text{flex:1;color:var(--text2)}
.feed-text strong{color:var(--text);font-weight:500}
.feed-time{color:var(--text3);font-size:11px;flex-shrink:0}
.feed-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Product <span>IQ</span> — PIM Dashboard
      <div class="live-dot" title="Realtime connected"></div>
    </h1>
    <div class="header-right">
      <span class="last-update" id="lastUpdate"></span>
      <button class="btn btn-accent" onclick="refreshAll()">↻ Refresh</button>
    </div>
  </header>

  <!-- KPI Row -->
  <div class="stats-row" id="kpiRow">
    <div class="stat-card accent"><div class="label">Total Products</div><div class="value" id="kpiProducts">—</div><div class="sub" id="kpiProductsSub"></div></div>
    <div class="stat-card green"><div class="label">Avg Completeness</div><div class="value" id="kpiComplete">—</div><div class="sub" id="kpiCompleteSub"></div></div>
    <div class="stat-card purple"><div class="label">Total Images</div><div class="value" id="kpiImages">—</div><div class="sub" id="kpiImagesSub"></div></div>
    <div class="stat-card pink"><div class="label">Total Documents</div><div class="value" id="kpiDocs">—</div><div class="sub" id="kpiDocsSub"></div></div>
    <div class="stat-card orange"><div class="label">Total Videos</div><div class="value" id="kpiVids">—</div><div class="sub" id="kpiVidsSub"></div></div>
    <div class="stat-card yellow"><div class="label">Brands</div><div class="value" id="kpiBrands">—</div><div class="sub" id="kpiBrandsSub"></div></div>
  </div>

  <!-- Coverage + Asset Breakdown -->
  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>Data Coverage</h3></div>
      <div class="panel-body" id="coveragePanel"><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Asset Breakdown</h3></div>
      <div class="panel-body" id="assetPanel"><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </div>
  </div>

  <!-- Needs Fixing + Realtime Feed -->
  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h3>Needs Fixing</h3><span class="badge" id="fixCount">—</span></div>
      <div class="panel-body" style="padding:0">
        <div class="tbl-wrap" id="fixTable"><div class="loading"><div class="spinner"></div>Loading…</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Realtime Feed</h3><span class="badge">Live</span></div>
      <div class="panel-body" style="padding:0 16px 8px">
        <div class="feed" id="feedList">
          <div class="feed-empty">Waiting for changes…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Document Type + Image Type breakdowns -->
  <div class="grid-2" style="margin-top:24px">
    <div class="panel">
      <div class="panel-head"><h3>Document Types</h3></div>
      <div class="panel-body" id="docTypePanel"><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Image Types</h3></div>
      <div class="panel-body" id="imgTypePanel"><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bXd3aHlvemVvdW9xc2NvbGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzMzMTAsImV4cCI6MjA5OTk0OTMxMH0.p18JS7NYRO3XuHElMGcM_KqIHdrVKcIEwCNTIBSkDhk';
const sb = createClient(SB_URL, SB_KEY);

// ── Completeness fields ──
const COMPLETENESS_FIELDS = [
  'short_description','category','msrp','color',
  'width_inches','height_inches','depth_inches','weight_lbs',
  'capacity_cu_ft','voltage','specs_json','finish','energy_star'
];
const TOTAL_FIELDS = COMPLETENESS_FIELDS.length; // 13

function calcCompleteness(p) {
  let filled = 0;
  for (const f of COMPLETENESS_FIELDS) {
    const v = p[f];
    if (v !== null && v !== undefined && v !== '') filled++;
  }
  return Math.round((filled / TOTAL_FIELDS) * 100);
}

function commaFmt(n) {
  return (n || 0).toLocaleString();
}

function pctColor(pct) {
  if (pct >= 80) return 'var(--green)';
  if (pct >= 50) return 'var(--yellow)';
  return 'var(--red)';
}

function prettyLabel(s) {
  return (s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function timeAgo(ts) {
  const d = new Date(ts);
  const s = Math.floor((Date.now() - d) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return d.toLocaleDateString();
}

// ── State ──
let products = [];
let imgCounts = {};   // product_id → count
let docCounts = {};
let vidCounts = {};
let imgTotals = 0, docTotals = 0, vidTotals = 0;
let imgByType = {}, docByType = {};
let productsWithImages = 0, productsWithDocs = 0, productsWithVids = 0;

// ── Data loading ──
async function loadProducts() {
  // Fetch all active products with completeness-relevant fields
  const cols = 'id,model,brand_name,category,' + COMPLETENESS_FIELDS.join(',');
  let all = [];
  let from = 0;
  const PAGE = 1000;
  while (true) {
    const { data, error } = await sb.from('aiq_products').select(cols)
      .eq('status', 'active').range(from, from + PAGE - 1);
    if (error) { console.error('products fetch', error); break; }
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  products = all;
}

async function loadImageCounts() {
  // Use PostgREST RPC or manual aggregation
  // We need: per-product count, total count, per-type count, distinct products
  const { data, error } = await sb.rpc('', {}).catch(() => null);
  // Fallback: fetch product_id and image_type from pim_product_images
  let all = [];
  let from = 0;
  const PAGE = 1000;
  while (true) {
    const { data, error } = await sb.from('pim_product_images').select('product_id,image_type').range(from, from + PAGE - 1);
    if (error) { console.error('images fetch', error); break; }
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  imgCounts = {};
  imgByType = {};
  const prodSet = new Set();
  for (const r of all) {
    imgCounts[r.product_id] = (imgCounts[r.product_id] || 0) + 1;
    prodSet.add(r.product_id);
    const t = r.image_type || 'unknown';
    imgByType[t] = (imgByType[t] || 0) + 1;
  }
  imgTotals = all.length;
  productsWithImages = prodSet.size;
}

async function loadDocCounts() {
  let all = [];
  let from = 0;
  const PAGE = 1000;
  while (true) {
    const { data, error } = await sb.from('pim_product_documents').select('product_id,doc_type').range(from, from + PAGE - 1);
    if (error) { console.error('docs fetch', error); break; }
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  docCounts = {};
  docByType = {};
  const prodSet = new Set();
  for (const r of all) {
    docCounts[r.product_id] = (docCounts[r.product_id] || 0) + 1;
    prodSet.add(r.product_id);
    const t = r.doc_type || 'unknown';
    docByType[t] = (docByType[t] || 0) + 1;
  }
  docTotals = all.length;
  productsWithDocs = prodSet.size;
}

async function loadVidCounts() {
  const { data, error } = await sb.from('pim_product_videos').select('product_id,video_type');
  if (error) { console.error('vids fetch', error); return; }
  vidCounts = {};
  const prodSet = new Set();
  for (const r of (data || [])) {
    vidCounts[r.product_id] = (vidCounts[r.product_id] || 0) + 1;
    prodSet.add(r.product_id);
  }
  vidTotals = (data || []).length;
  productsWithVids = prodSet.size;
}

// ── Rendering ──
function renderKPIs() {
  const total = products.length;
  const avgComp = total > 0
    ? Math.round(products.reduce((s, p) => s + calcCompleteness(p), 0) / total)
    : 0;
  const brands = new Set(products.map(p => p.brand_name).filter(Boolean));
  const cats = new Set(products.map(p => p.category).filter(Boolean));

  document.getElementById('kpiProducts').textContent = commaFmt(total);
  document.getElementById('kpiProductsSub').textContent = `${cats.size} categories`;
  document.getElementById('kpiComplete').textContent = avgComp + '%';
  document.getElementById('kpiCompleteSub').textContent = `${TOTAL_FIELDS} fields tracked`;
  document.getElementById('kpiImages').textContent = commaFmt(imgTotals);
  document.getElementById('kpiImagesSub').textContent = `across ${commaFmt(productsWithImages)} products`;
  document.getElementById('kpiDocs').textContent = commaFmt(docTotals);
  document.getElementById('kpiDocsSub').textContent = `across ${commaFmt(productsWithDocs)} products`;
  document.getElementById('kpiVids').textContent = commaFmt(vidTotals);
  document.getElementById('kpiVidsSub').textContent = `across ${commaFmt(productsWithVids)} products`;
  document.getElementById('kpiBrands').textContent = brands.size;
  document.getElementById('kpiBrandsSub').textContent = 'active brands';
  document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function renderCoverage() {
  const total = products.length || 1;
  const fields = [
    { label: 'Has Images', count: productsWithImages },
    { label: 'Has Documents', count: productsWithDocs },
    { label: 'Has Videos', count: productsWithVids },
    { label: 'Has MSRP', count: products.filter(p => p.msrp != null).length },
    { label: 'Has Specs JSON', count: products.filter(p => p.specs_json != null).length },
    { label: 'Has Description', count: products.filter(p => p.short_description).length },
    { label: 'Has Dimensions', count: products.filter(p => p.width_inches != null && p.height_inches != null && p.depth_inches != null).length },
    { label: 'Has Category', count: products.filter(p => p.category).length },
    { label: 'Has Color', count: products.filter(p => p.color).length },
    { label: 'Has Finish', count: products.filter(p => p.finish).length },
    { label: 'Has Energy Star', count: products.filter(p => p.energy_star != null).length },
    { label: 'Has Weight', count: products.filter(p => p.weight_lbs != null).length },
    { label: 'Has Voltage', count: products.filter(p => p.voltage).length },
  ];

  const el = document.getElementById('coveragePanel');
  el.innerHTML = fields.map(f => {
    const pct = Math.round((f.count / total) * 100);
    return `<div class="prog-row">
      <span class="prog-label">${f.label}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${pctColor(pct)}"></div></div>
      <span class="prog-pct" style="color:${pctColor(pct)}">${pct}%</span>
    </div>`;
  }).join('');
}

function renderAssets() {
  const el = document.getElementById('assetPanel');
  // Merge image types + doc types + videos into asset grid
  const items = [];

  // Top image types
  const imgSorted = Object.entries(imgByType).sort((a,b) => b[1] - a[1]).slice(0, 4);
  for (const [t, c] of imgSorted) {
    items.push({ count: c, type: prettyLabel(t) + ' imgs' });
  }

  // Top doc types
  const docSorted = Object.entries(docByType).sort((a,b) => b[1] - a[1]).slice(0, 4);
  for (const [t, c] of docSorted) {
    items.push({ count: c, type: prettyLabel(t) });
  }

  if (vidTotals > 0) {
    items.push({ count: vidTotals, type: 'Videos' });
  }

  el.innerHTML = `<div class="asset-grid">${items.map(i =>
    `<div class="asset-item"><div class="count">${commaFmt(i.count)}</div><div class="type">${i.type}</div></div>`
  ).join('')}</div>`;
}

function renderNeedsFix() {
  // Sort products by completeness ascending, show worst 30
  const scored = products.map(p => ({
    ...p,
    completeness: calcCompleteness(p),
    images: imgCounts[p.id] || 0,
    docs: docCounts[p.id] || 0
  })).sort((a, b) => a.completeness - b.completeness);

  const worst = scored.slice(0, 30);
  const needsFix = scored.filter(p => p.completeness < 50).length;
  document.getElementById('fixCount').textContent = commaFmt(needsFix) + ' < 50%';

  const el = document.getElementById('fixTable');
  if (worst.length === 0) {
    el.innerHTML = '<div class="feed-empty">All products look good!</div>';
    return;
  }

  el.innerHTML = `<table>
    <thead><tr>
      <th>Model</th><th>Brand</th><th>Category</th><th>Imgs</th><th>Docs</th><th>Completeness</th>
    </tr></thead>
    <tbody>${worst.map(p => {
      const c = p.completeness;
      const col = pctColor(c);
      return `<tr>
        <td class="model-name" title="${(p.model||'').replace(/"/g,'&quot;')}">${p.model || '—'}</td>
        <td><span class="brand-tag">${p.brand_name || '—'}</span></td>
        <td style="color:var(--text2)">${prettyLabel(p.category) || '—'}</td>
        <td>${p.images}</td>
        <td>${p.docs}</td>
        <td><div class="completeness-bar">
          <div class="mini-bar"><div class="mini-fill" style="width:${c}%;background:${col}"></div></div>
          <span style="color:${col};font-weight:600">${c}%</span>
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderDocTypes() {
  const el = document.getElementById('docTypePanel');
  const sorted = Object.entries(docByType).sort((a,b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  el.innerHTML = sorted.map(([t, c]) => {
    const pct = Math.round((c / max) * 100);
    return `<div class="prog-row">
      <span class="prog-label">${prettyLabel(t)}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:var(--purple)"></div></div>
      <span class="prog-pct" style="color:var(--purple)">${commaFmt(c)}</span>
    </div>`;
  }).join('');
}

function renderImgTypes() {
  const el = document.getElementById('imgTypePanel');
  const sorted = Object.entries(imgByType).sort((a,b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  el.innerHTML = sorted.map(([t, c]) => {
    const pct = Math.round((c / max) * 100);
    return `<div class="prog-row">
      <span class="prog-label">${prettyLabel(t)}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      <span class="prog-pct" style="color:var(--accent)">${commaFmt(c)}</span>
    </div>`;
  }).join('');
}

function renderAll() {
  renderKPIs();
  renderCoverage();
  renderAssets();
  renderNeedsFix();
  renderDocTypes();
  renderImgTypes();
}

// ── Realtime feed ──
const feedItems = [];
const MAX_FEED = 50;

function addFeedItem(type, icon, text) {
  feedItems.unshift({ type, icon, text, time: new Date() });
  if (feedItems.length > MAX_FEED) feedItems.pop();
  renderFeed();
}

function renderFeed() {
  const el = document.getElementById('feedList');
  if (feedItems.length === 0) {
    el.innerHTML = '<div class="feed-empty">Waiting for changes…</div>';
    return;
  }
  el.innerHTML = feedItems.map(f =>
    `<div class="feed-item">
      <div class="feed-icon ${f.icon}">${f.icon === 'img' ? '🖼' : f.icon === 'doc' ? '📄' : f.icon === 'vid' ? '🎬' : '📦'}</div>
      <div class="feed-text">${f.text}</div>
      <span class="feed-time">${timeAgo(f.time)}</span>
    </div>`
  ).join('');
}

// ── Realtime subscriptions ──
function setupRealtime() {
  const channel = sb.channel('pim-dashboard');

  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'aiq_products' }, (payload) => {
    const ev = payload.eventType;
    const rec = payload.new || payload.old || {};
    const model = rec.model || rec.id?.slice(0, 8) || 'Unknown';
    const brand = rec.brand_name || '';
    if (ev === 'INSERT') {
      addFeedItem('product', 'prod', `New product <strong>${model}</strong>${brand ? ' (' + brand + ')' : ''}`);
    } else if (ev === 'UPDATE') {
      addFeedItem('product', 'prod', `Updated <strong>${model}</strong>${brand ? ' (' + brand + ')' : ''}`);
    } else if (ev === 'DELETE') {
      addFeedItem('product', 'prod', `Deleted product <strong>${model}</strong>`);
    }
    // Debounced refresh
    scheduleRefresh();
  });

  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'pim_product_images' }, (payload) => {
    const ev = payload.eventType;
    const rec = payload.new || {};
    const itype = rec.image_type || 'image';
    if (ev === 'INSERT') {
      addFeedItem('image', 'img', `New <strong>${prettyLabel(itype)}</strong> image added`);
    } else if (ev === 'DELETE') {
      addFeedItem('image', 'img', `Image removed`);
    }
    scheduleRefresh();
  });

  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'pim_product_documents' }, (payload) => {
    const ev = payload.eventType;
    const rec = payload.new || {};
    const dtype = rec.doc_type || 'document';
    if (ev === 'INSERT') {
      addFeedItem('document', 'doc', `New <strong>${prettyLabel(dtype)}</strong> added`);
    }
    scheduleRefresh();
  });

  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'pim_product_videos' }, (payload) => {
    const ev = payload.eventType;
    if (ev === 'INSERT') {
      addFeedItem('video', 'vid', `New <strong>video</strong> added`);
    }
    scheduleRefresh();
  });

  channel.subscribe((status) => {
    console.log('Realtime status:', status);
  });
}

let refreshTimer = null;
function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => refreshAll(), 2000);
}

// ── Init ──
window.refreshAll = async function() {
  await Promise.all([
    loadProducts(),
    loadImageCounts(),
    loadDocCounts(),
    loadVidCounts()
  ]);
  renderAll();
};

async function init() {
  await window.refreshAll();
  setupRealtime();
}

init();
</script>
