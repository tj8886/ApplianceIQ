<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f1f3d"/>
<title>Product IQ — The Appliance Industry PIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0f1f3d;--navy2:#162a4d;--indigo:#6366f1;--blue:#2563eb;--cyan:#06b6d4;--teal:#0d9488;--bg:#f4f6f8;--card:#fff;--ink:#1f2b3d;--muted:#64748b;--line:#e3e8ee;--green:#177c45;--greenbg:#e8f7ee;--amber:#a15c00;--amberbg:#fff5df;--red:#ad3125;--redbg:#fdecea;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;margin:0;color:var(--navy)}a{color:var(--indigo);text-decoration:none}

/* ── SHELL ── */
.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--navy);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;font-family:Sora;font-weight:800;font-size:16px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--navy2),var(--indigo));display:grid;place-items:center;font-size:11px;font-weight:800}
.product-pill{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a5b4fc;margin:0 10px 14px}
.nav{border:0;background:transparent;color:#b7c4d8;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;font:600 13px Inter;display:flex;gap:9px;align-items:center;width:100%}
.nav:hover,.nav.active{background:rgba(255,255,255,.1);color:#fff}
.nav .icon{width:18px;text-align:center;font-size:15px}
.side-sep{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.side-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;padding:8px 11px 4px}
.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.side-link{color:#8b9cc0;text-decoration:none;font-size:12px;padding:7px 11px;display:block}
.side-link:hover{color:#fff}
.user-chip{font-size:11px;color:#7b8dae;padding:8px 11px;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}

/* ── MAIN ── */
main{min-width:0;padding:24px 30px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--navy)}
.avatar{height:30px;width:30px;border-radius:50%;background:#eef0f7;color:var(--indigo);display:grid;place-items:center;font-weight:800;font-size:12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.pagehead h1{font-size:26px;letter-spacing:-.7px}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}

/* ── COMPONENTS ── */
.btn{border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font:700 13px Inter;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn-secondary:hover{background:#f8f9fb}
.btn-indigo{background:var(--indigo);color:#fff}.btn-indigo:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:12px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-green{color:var(--green);background:var(--greenbg)}.pill-amber{color:var(--amber);background:var(--amberbg)}.pill-red{color:var(--red);background:var(--redbg)}.pill-gray{color:#59687a;background:#eef2f6}.pill-indigo{color:var(--indigo);background:#eef0ff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.metric .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.metric .value{font:800 24px Sora;margin-top:4px;color:var(--navy)}
.metric .note{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h2{font-size:15px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.control{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font:13px Inter;color:var(--ink)}
.search-input{min-width:220px;flex:1}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:800px}
th{padding:10px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid #eef1f4;vertical-align:middle;font-size:13px}
tr:last-child td{border:0}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f8fbfc}
.model-name{font-weight:800;color:var(--navy)}
.tiny{font-size:12px;color:var(--muted)}
.pager{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cad3df;border-radius:9px}
.error{padding:12px;border-radius:9px;background:var(--redbg);color:var(--red);font-size:13px}
.loading{color:var(--muted);padding:24px}

/* ── DETAIL ── */
.record{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.record-top{display:flex;gap:16px;align-items:flex-start}
.record-img{width:80px;height:80px;border-radius:var(--radius);background:#eef2f6;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.record-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px -20px 16px;padding:0 20px;overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;font:600 13px Inter}
.tab.active{color:var(--indigo);border-color:var(--indigo)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.kv div{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div:nth-child(3n){border-right:0}
.kv small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}
.spec-group{margin-bottom:16px}
.spec-group h3{font-size:14px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.spec-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #f0f2f5}
.spec-row:last-child{border:0}
.spec-key{color:var(--muted)}

/* ── EDIT FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row{margin-bottom:0}
.form-row.full{grid-column:1/-1}
.form-row label{display:block;font:600 12px Inter;color:var(--navy);margin-bottom:4px}
.form-row input,.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:13px Inter;color:var(--ink)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-row textarea{min-height:80px;resize:vertical}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

/* ── LOGIN OVERLAY ── */
.login-overlay{position:fixed;inset:0;background:var(--navy);z-index:200;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:420px;max-width:90vw;text-align:center}
.login-box .mark{width:48px;height:48px;font-size:16px;border-radius:14px;margin:0 auto 12px}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box .sub{margin-bottom:24px}
.login-box .form-row{text-align:left;margin-bottom:14px}
.login-box .btn{width:100%;justify-content:center;padding:11px}
.login-box .demo-hint{margin-top:16px;font-size:12px;color:var(--muted)}
.login-box .demo-cred{background:#f0f2f7;border-radius:8px;padding:10px;margin-top:8px;font-size:12px;text-align:left}
.login-box .demo-cred b{color:var(--navy)}

/* ── LANDING ── */
.landing{min-height:100vh}
.land-nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:20px 24px}
.land-nav .logo{display:flex;align-items:center;gap:10px;font:800 18px Sora;color:#fff}
.land-nav .logo .mark{width:36px;height:36px;border-radius:10px}
.land-hero{background:var(--navy);padding:80px 24px 100px;text-align:center;position:relative;overflow:hidden}
.land-hero::before{content:'';position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.15),transparent 70%);pointer-events:none}
.land-hero h1{font-size:clamp(32px,5vw,52px);color:#fff;max-width:700px;margin:0 auto 16px;letter-spacing:-1px;position:relative}
.land-hero h1 span{color:var(--indigo)}
.land-hero p{color:rgba(255,255,255,.6);font-size:17px;max-width:550px;margin:0 auto 32px;position:relative}
.land-hero .btn{position:relative}
.land-section{max-width:1100px;margin:0 auto;padding:60px 24px}
.land-section h2{font-size:28px;text-align:center;margin-bottom:10px;letter-spacing:-.5px}
.land-section .section-sub{text-align:center;color:var(--muted);margin-bottom:36px;font-size:15px}
.land-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.land-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:.2s}
.land-card:hover{box-shadow:0 8px 30px rgba(0,0,0,.08);transform:translateY(-2px)}
.land-card .lc-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.land-card h3{font-size:16px;margin-bottom:6px}
.land-card p{color:var(--muted);font-size:13px}
.land-two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:40px}
.land-two h3{font-size:22px;margin-bottom:10px}
.land-two p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:12px}
.land-two .list-check{list-style:none;padding:0}
.land-two .list-check li{padding:6px 0;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.land-two .list-check li::before{content:'✓';color:var(--green);font-weight:800;flex-shrink:0}
.land-cta{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius);padding:50px;text-align:center;color:#fff;margin:20px 0 40px}
.land-cta h2{color:#fff;margin-bottom:10px}.land-cta p{color:rgba(255,255,255,.65);margin-bottom:24px}
.land-footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
.shell{grid-template-columns:1fr}.side{height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
.brand,.product-pill,.side-bottom,.side-label,.side-sep,.user-chip{display:none}
.nav{white-space:nowrap;font-size:12px;padding:8px 10px}.nav .icon{display:none}
main{padding:16px}
.cards{grid-template-columns:repeat(2,1fr)}
.kv{grid-template-columns:repeat(2,1fr)}.kv div:nth-child(3n){border-right:1px solid var(--line)}.kv div:nth-child(2n){border-right:0}
.land-grid{grid-template-columns:1fr}.land-two{grid-template-columns:1fr}
.form-grid{grid-template-columns:1fr}
}
@media(max-width:600px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div{border-right:0!important}}
</style>
</head>
<body>
<div id="app"><div class="loading" style="padding:40px;text-align:center">Loading Product IQ…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');

/* ── STATE ── */
const S={user:null,view:'landing',page:'dashboard',detail:null,editMode:false,filters:{search:'',brand:'',manufacturer:'',category:'',status:''},pg:0};
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── INIT ── */
async function init(){
  const {data:{user}}=await sb.auth.getUser();
  if(user){S.user=user;S.view='app';render()}
  else showLanding();
}

/* ── LANDING PAGE ── */
function showLanding(){
  S.view='landing';
  document.getElementById('app').innerHTML=`
<div class="landing">
  <div class="land-hero">
    <div class="land-nav">
      <div class="logo"><span class="mark">PIQ</span>Product IQ</div>
      <button class="btn btn-indigo" onclick="showLogin()">Sign In</button>
    </div>
    <h1>The Single Source of Truth<br/>for <span>Appliance Product Data</span></h1>
    <p>Product IQ is the PIM built for the appliance industry. Manufacturers publish. Retailers consume. Everyone wins.</p>
    <button class="btn btn-indigo" style="padding:14px 32px;font-size:15px" onclick="showLogin()">Get Started →</button>
  </div>

  <div class="land-section">
    <h2>Built for Both Sides of the Industry</h2>
    <p class="section-sub">One platform where manufacturers manage product data and retailers access it — enriched, validated, and always current.</p>
    <div class="land-two">
      <div>
        <h3>🏭 For Manufacturers</h3>
        <p>Manage your entire product catalog from one place. Add specs, upload assets, set pricing, and publish to the industry.</p>
        <ul class="list-check">
          <li>Centralized product data management</li>
          <li>Spec sheets, documents, and digital assets</li>
          <li>Data quality scoring and validation</li>
          <li>Version history and change tracking</li>
          <li>Control what's published and to whom</li>
        </ul>
      </div>
      <div>
        <h3>🏪 For Retailers</h3>
        <p>Browse the industry's most complete appliance product database. Pull enriched data directly into your operations.</p>
        <ul class="list-check">
          <li>Browse 88+ products across 20 brands</li>
          <li>Full specifications and pricing data</li>
          <li>Always-current, manufacturer-verified content</li>
          <li>Feed data into CRM, Academy, and Spec IQ</li>
          <li>Compare products across brands</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="land-section" style="background:#fff;padding:50px 24px;margin:0;max-width:none">
    <div style="max-width:1100px;margin:0 auto">
    <h2>The Appliance PIM Stack</h2>
    <p class="section-sub">Everything you need to manage and distribute appliance product information at scale.</p>
    <div class="land-grid">
      <div class="land-card"><div class="lc-icon" style="background:#eef0ff;color:var(--indigo)">📦</div><h3>Product Catalog</h3><p>88 products across 9 manufacturers and 20 brands. Refrigeration, cooking, dishwashers, laundry, and ventilation.</p></div>
      <div class="land-card"><div class="lc-icon" style="background:#e8f7ee;color:var(--green)">📋</div><h3>Specifications</h3><p>Structured specs — dimensions, electrical, gas, ventilation, installation, performance, certifications, and warranty data.</p></div>
      <div class="land-card"><div class="lc-icon" style="background:#fff5df;color:var(--amber)">📄</div><h3>Documents & Assets</h3><p>Spec sheets, installation guides, marketing materials, and product images — all managed in one digital asset library.</p></div>
      <div class="land-card"><div class="lc-icon" style="background:var(--redbg);color:var(--red)">🔍</div><h3>Data Quality</h3><p>Automated validation scores every product for completeness. AI-powered suggestions fill gaps and correct inconsistencies.</p></div>
      <div class="land-card"><div class="lc-icon" style="background:#f0e6ff;color:#7c3aed">🔄</div><h3>Version Control</h3><p>Full change history with version snapshots. Every edit tracked, every update auditable, every version restorable.</p></div>
      <div class="land-card"><div class="lc-icon" style="background:#e0f2fe;color:#0284c7">🌐</div><h3>Syndication</h3><p>Published products feed directly into IQ CRM, Academy, Spec IQ, and the entire ApplianceIQ ecosystem.</p></div>
    </div>
    </div>
  </div>

  <div class="land-section">
    <div class="land-cta">
      <h2>The Syndigo for Appliances</h2>
      <p>Product IQ is part of the IQ Intelligence Group ecosystem — the industry's connected intelligence platform.</p>
      <button class="btn" style="background:#fff;color:var(--navy);font-weight:800;padding:12px 28px" onclick="showLogin()">Sign In to Product IQ</button>
    </div>
  </div>
  <div class="land-footer">© 2026 IQ Intelligence Group · Product IQ · Hamilton, Ontario, Canada</div>
</div>`;
}

/* ── LOGIN ── */
function showLogin(){
  document.getElementById('app').innerHTML=`
<div class="login-overlay">
  <div class="login-box">
    <div class="mark">PIQ</div>
    <h1>Product IQ</h1>
    <p class="sub">Sign in with your ApplianceIQ account</p>
    <div class="form-row"><label>Email</label><input id="login-email" type="email" value="demo@applianceiq.com"/></div>
    <div class="form-row"><label>Password</label><input id="login-pass" type="password" value="DemoIQ2026!"/></div>
    <div id="login-error"></div>
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:8px">Sign In</button>
    <button class="btn btn-secondary" onclick="showLanding()" style="margin-top:8px">← Back</button>
    <div class="demo-hint">Demo credentials pre-filled</div>
  </div>
</div>`;
  document.getElementById('login-email').focus();
  document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)return document.getElementById('login-error').innerHTML=`<div class="error" style="margin:8px 0">${esc(error.message)}</div>`;
  const {data:{user}}=await sb.auth.getUser();
  S.user=user;S.view='app';S.page='dashboard';render();
}

/* ── NAV ── */
const NAV=[
  ['dashboard','⌂','Dashboard'],
  ['catalog','☷','Product Catalog'],
  ['brands','◆','Brands'],
  ['_sep'],
  ['_label','MANAGE'],
  ['add-product','＋','Add Product'],
  ['data-quality','◎','Data Quality'],
  ['activity','↻','Activity Log'],
];

function go(page,detail){S.page=page;S.detail=detail||null;S.editMode=false;S.pg=0;render()}

/* ── RENDER SHELL ── */
function render(){
  if(S.view!=='app')return;
  const links=NAV.map(n=>{
    if(n[0]==='_sep')return'<div class="side-sep"></div>';
    if(n[0]==='_label')return`<div class="side-label">${n[1]}</div>`;
    return`<button class="nav ${S.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="icon">${n[1]}</span>${n[2]}</button>`;
  }).join('');
  document.getElementById('app').innerHTML=`<div class="shell">
    <aside class="side">
      <div class="brand"><span class="mark">PIQ</span>Product IQ</div>
      <div class="product-pill">Product Information Management</div>
      ${links}
      <div class="side-bottom">
        <a class="side-link" href="https://applianceiq-intelligence-group.netlify.app" target="_blank">← IQ Intelligence Group</a>
        <div class="user-chip">${esc(S.user?.email||'')}</div>
        <button class="nav" onclick="logout()" style="margin-top:4px"><span class="icon">⏻</span>Sign Out</button>
      </div>
    </aside>
    <main><div class="topbar"><div class="crumb">Product IQ <span>/ </span><b>${esc(NAV.find(n=>n[0]===S.page)?.[2]||S.page)}</b></div><div class="avatar">${esc((S.user?.email||'U')[0].toUpperCase())}</div></div><div id="content"><div class="loading">Loading…</div></div></main>
  </div>`;
  renderPage();
}
async function logout(){await sb.auth.signOut();S.user=null;showLanding()}

/* ── PAGE ROUTER ── */
async function renderPage(){
  const C=document.getElementById('content');if(!C)return;
  try{
    if(S.page==='dashboard')await renderDashboard(C);
    else if(S.page==='catalog')await renderCatalog(C);
    else if(S.page==='brands')await renderBrands(C);
    else if(S.page==='product-detail')await renderProductDetail(C);
    else if(S.page==='add-product')renderAddProduct(C);
    else if(S.page==='data-quality')await renderDataQuality(C);
    else if(S.page==='activity')await renderActivity(C);
    else C.innerHTML=`<div class="empty">Page "${esc(S.page)}" is under construction.</div>`;
  }catch(err){C.innerHTML=`<div class="error">${esc(err.message)}</div>`}
}

/* ── DASHBOARD ── */
async function renderDashboard(C){
  const [{data:products,error},{data:brands},{data:versions},{data:specs}]=await Promise.all([
    sb.from('aiq_products').select('id,brand_name,manufacturer_name,model,category,status,approval_status,public_visible,msrp,updated_at,short_description',{count:'exact'}),
    sb.from('brand_catalog').select('id,brand_name,brand_tier,is_active,product_count'),
    sb.from('aiq_product_versions').select('id,created_at').order('created_at',{ascending:false}).limit(10),
    sb.from('aiq_product_specifications').select('id')
  ]);
  if(error)return C.innerHTML=`<div class="error">${esc(error.message)}</div>`;
  const all=products||[];
  const cats={};all.forEach(p=>{cats[p.category]=(cats[p.category]||0)+1});
  const mfrs={};all.forEach(p=>{mfrs[p.manufacturer_name]=(mfrs[p.manufacturer_name]||0)+1});
  const totalMsrp=all.reduce((s,p)=>s+Number(p.msrp||0),0);
  const withSpecs=(specs||[]).length;

  C.innerHTML=`
  <div class="pagehead"><div><h1>Product Intelligence Dashboard</h1><p class="sub">Your centralized appliance product data management hub.</p></div><button class="btn btn-indigo" onclick="go('add-product')">＋ Add Product</button></div>
  <div class="cards">
    <div class="metric"><div class="label">Total Products</div><div class="value">${all.length}</div><div class="note">Across ${Object.keys(mfrs).length} manufacturers</div></div>
    <div class="metric"><div class="label">Brands</div><div class="value">${(brands||[]).length}</div><div class="note">${(brands||[]).filter(b=>b.is_active).length} active brands</div></div>
    <div class="metric"><div class="label">Categories</div><div class="value">${Object.keys(cats).length}</div><div class="note">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`).join(', ')}</div></div>
    <div class="metric"><div class="label">Avg MSRP</div><div class="value">$${all.length?Math.round(totalMsrp/all.length).toLocaleString():'0'}</div><div class="note">Total catalog value: $${Math.round(totalMsrp).toLocaleString()}</div></div>
  </div>
  <div class="cards" style="grid-template-columns:1fr 1fr">
    <div class="metric"><div class="label">Published</div><div class="value" style="color:var(--green)">${all.filter(p=>p.public_visible).length} / ${all.length}</div><div class="note">${Math.round(all.filter(p=>p.public_visible).length/all.length*100)}% of catalog published</div></div>
    <div class="metric"><div class="label">With Specifications</div><div class="value" style="color:${withSpecs?'var(--green)':'var(--amber)'};">${withSpecs} / ${all.length}</div><div class="note">${withSpecs?Math.round(withSpecs/all.length*100)+'% have specs':'Specs need to be added'}</div></div>
  </div>

  <div style="display:grid;grid-template-columns:1.3fr .7fr;gap:16px">
    <div class="panel">
      <h2>Products by Manufacturer</h2>
      ${Object.entries(mfrs).sort((a,b)=>b[1]-a[1]).map(([name,cnt])=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f4">
          <span style="font-weight:600">${esc(name)}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:120px;height:6px;background:#eef2f6;border-radius:3px;overflow:hidden"><div style="height:100%;width:${cnt/all.length*100}%;background:var(--indigo);border-radius:3px"></div></div>
            <span class="tiny" style="min-width:30px;text-align:right">${cnt}</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="panel">
      <h2>Recent Changes</h2>
      ${(versions||[]).length?versions.slice(0,8).map(v=>`<div style="padding:6px 0;border-bottom:1px solid #eef1f4;font-size:12px"><span class="pill pill-indigo">Version</span> <span class="tiny">${new Date(v.created_at).toLocaleString()}</span></div>`).join(''):'<div class="empty" style="border:0;padding:16px">No version history yet</div>'}
    </div>
  </div>`;
}

/* ── CATALOG ── */
async function renderCatalog(C){
  C.innerHTML=`<div class="pagehead"><div><h1>Product Catalog</h1><p class="sub">Authoritative product records — the single source of truth.</p></div><button class="btn btn-indigo" onclick="go('add-product')">＋ Add Product</button></div>
  <div class="toolbar">
    <input class="control search-input" id="f-search" placeholder="Search model, brand, or description…" value="${esc(S.filters.search)}" oninput="S.filters.search=this.value;S.pg=0;loadCatalog()"/>
    <select class="control" id="f-mfr" onchange="S.filters.manufacturer=this.value;S.pg=0;loadCatalog()"><option value="">All Manufacturers</option></select>
    <select class="control" id="f-brand" onchange="S.filters.brand=this.value;S.pg=0;loadCatalog()"><option value="">All Brands</option></select>
    <select class="control" id="f-cat" onchange="S.filters.category=this.value;S.pg=0;loadCatalog()"><option value="">All Categories</option><option>cooking</option><option>refrigeration</option><option>dishwashers</option><option>laundry</option><option>ventilation</option></select>
  </div>
  <div id="catalog-table"><div class="loading">Loading products…</div></div>`;
  // Populate filter dropdowns
  const {data:allP}=await sb.from('aiq_products').select('manufacturer_name,brand_name');
  if(allP){
    const mfrs=[...new Set(allP.map(p=>p.manufacturer_name))].sort();
    const brands=[...new Set(allP.map(p=>p.brand_name))].sort();
    const mEl=document.getElementById('f-mfr'),bEl=document.getElementById('f-brand');
    mfrs.forEach(m=>mEl?.insertAdjacentHTML('beforeend',`<option value="${esc(m)}">${esc(m)}</option>`));
    brands.forEach(b=>bEl?.insertAdjacentHTML('beforeend',`<option value="${esc(b)}">${esc(b)}</option>`));
    if(S.filters.manufacturer&&mEl)mEl.value=S.filters.manufacturer;
    if(S.filters.brand&&bEl)bEl.value=S.filters.brand;
  }
  loadCatalog();
}

async function loadCatalog(){
  const out=document.getElementById('catalog-table');if(!out)return;
  const f=S.filters, clean=(f.search||'').replace(/[%(),]/g,' ').trim();
  let q=sb.from('aiq_products').select('id,manufacturer_name,brand_name,model,category,series,product_line,status,approval_status,public_visible,msrp,short_description,updated_at,version_number',{count:'exact'}).order('brand_name').order('model');
  if(clean)q=q.or(`model.ilike.%${clean}%,brand_name.ilike.%${clean}%,short_description.ilike.%${clean}%,manufacturer_name.ilike.%${clean}%`);
  if(f.manufacturer)q=q.eq('manufacturer_name',f.manufacturer);
  if(f.brand)q=q.eq('brand_name',f.brand);
  if(f.category)q=q.eq('category',f.category);
  const PER=25;
  const {data,error,count}=await q.range(S.pg*PER,S.pg*PER+PER-1);
  if(error)return out.innerHTML=`<div class="error">${esc(error.message)}</div>`;
  const rows=data||[];
  out.innerHTML=`<div class="tablewrap"><table>
    <thead><tr><th>Product</th><th>Manufacturer</th><th>Category</th><th>Series</th><th>MSRP</th><th>Status</th><th>Published</th><th>Ver</th><th>Updated</th></tr></thead>
    <tbody>${rows.length?rows.map(p=>`<tr class="clickable" onclick="go('product-detail','${p.id}')">
      <td><div class="model-name">${esc(p.brand_name)} ${esc(p.model)}</div><div class="tiny">${esc(p.short_description||'')}</div></td>
      <td>${esc(p.manufacturer_name)}</td>
      <td><span class="pill pill-gray">${esc(p.category)}</span></td>
      <td class="tiny">${esc(p.series||'—')}</td>
      <td style="font-weight:700">${p.msrp?'$'+Number(p.msrp).toLocaleString():'—'}</td>
      <td>${p.status==='active'?'<span class="pill pill-green">Active</span>':p.status==='draft'?'<span class="pill pill-amber">Draft</span>':'<span class="pill pill-gray">'+esc(p.status)+'</span>'}</td>
      <td>${p.public_visible?'<span class="pill pill-green">Yes</span>':'<span class="pill pill-gray">No</span>'}</td>
      <td class="tiny">v${p.version_number}</td>
      <td class="tiny">${new Date(p.updated_at).toLocaleDateString()}</td>
    </tr>`).join(''):`<tr><td colspan="9"><div class="empty">No products match these filters.</div></td></tr>`}</tbody>
  </table>
  <div class="pager"><span>${count||0} products</span><span>
    <button class="btn btn-secondary btn-sm" ${S.pg===0?'disabled':''} onclick="S.pg--;loadCatalog()">← Prev</button>
    <button class="btn btn-secondary btn-sm" ${(S.pg+1)*PER>=(count||0)?'disabled':''} onclick="S.pg++;loadCatalog()">Next →</button>
  </span></div></div>`;
}

/* ── PRODUCT DETAIL ── */
async function renderProductDetail(C){
  if(!S.detail)return go('catalog');
  const [{data:p,error},{data:spec},{data:versions},{data:rels},{data:assets}]=await Promise.all([
    sb.from('aiq_products').select('*').eq('id',S.detail).maybeSingle(),
    sb.from('aiq_product_specifications').select('*').eq('product_id',S.detail).maybeSingle(),
    sb.from('aiq_product_versions').select('*').eq('product_id',S.detail).order('version_number',{ascending:false}),
    sb.from('aiq_product_relationships').select('*').eq('product_id',S.detail),
    sb.from('mfr_assets').select('*').eq('product_id',S.detail)
  ]);
  if(error||!p)return C.innerHTML=`<div class="error">Product not found.</div>`;

  if(S.editMode)return renderProductEdit(C,p,spec);

  const specSections=spec?['dimensions','electrical','gas','ventilation','installation','performance','certifications','warranty'].filter(k=>spec[k]&&Object.keys(spec[k]).length):[];
  const tabData={
    Overview:`<div class="kv">
      <div><small>Brand</small>${esc(p.brand_name)}</div><div><small>Manufacturer</small>${esc(p.manufacturer_name)}</div><div><small>Model</small>${esc(p.model)}</div>
      <div><small>Category</small>${esc(p.category)}</div><div><small>Series</small>${esc(p.series||'—')}</div><div><small>Product Line</small>${esc(p.product_line||'—')}</div>
      <div><small>MSRP</small>${p.msrp?'$'+Number(p.msrp).toLocaleString():'—'}</div><div><small>Country</small>${(p.country_availability||[]).join(', ')||'—'}</div><div><small>Source</small>${esc(p.source_type)} ${p.source_confidence?'('+p.source_confidence+'%)':''}</div>
      <div><small>Launch Date</small>${p.launch_date||'—'}</div><div><small>Product Family</small>${esc(p.product_family||'—')}</div><div><small>Version</small>v${p.version_number}</div>
    </div>`,
    Specifications:specSections.length?specSections.map(section=>`<div class="spec-group"><h3 style="text-transform:capitalize">${section}</h3>${Object.entries(spec[section]).map(([k,v])=>`<div class="spec-row"><span class="spec-key">${esc(k.replace(/_/g,' '))}</span><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`).join('')}</div>`).join(''):'<div class="empty">No specifications added yet. Click Edit to add specs.</div>',
    Documents:(assets||[]).length?assets.map(a=>`<div style="padding:10px 0;border-bottom:1px solid #eef1f4;display:flex;justify-content:space-between"><div><b>${esc(a.title)}</b><br><span class="tiny">${esc(a.category)} · ${esc(a.file_type||'—')}</span></div>${a.is_published?'<span class="pill pill-green">Published</span>':'<span class="pill pill-gray">Draft</span>'}</div>`).join(''):'<div class="empty">No documents or assets linked to this product.</div>',
    Relationships:(rels||[]).length?rels.map(r=>`<div style="padding:10px 0;border-bottom:1px solid #eef1f4"><b>${esc(r.relationship_type)}</b> — ${esc(r.relationship_label||'No label')}<br><span class="tiny">Compatibility: ${esc(r.compatibility_status)} · ${esc(r.direction)}</span></div>`).join(''):'<div class="empty">No product relationships defined.</div>',
    History:(versions||[]).length?`<div class="tablewrap"><table><thead><tr><th>Version</th><th>Date</th></tr></thead><tbody>${versions.map(v=>`<tr><td>v${v.version_number}</td><td class="tiny">${new Date(v.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No version history.</div>'
  };
  const tabNames=Object.keys(tabData);

  C.innerHTML=`
  <div style="margin-bottom:16px"><button class="btn btn-secondary btn-sm" onclick="go('catalog')">← Back to Catalog</button></div>
  <div class="record">
    <div class="record-top">
      <div class="record-img">📦</div>
      <div style="flex:1">
        <div class="tiny">${esc(p.brand_name)} · ${esc(p.manufacturer_name)}</div>
        <h1 style="font-size:24px">${esc(p.model)}</h1>
        <p class="sub" style="margin-bottom:8px">${esc(p.short_description||p.category)}</p>
        <div class="record-meta">
          ${p.status==='active'?'<span class="pill pill-green">Active</span>':'<span class="pill pill-amber">'+esc(p.status)+'</span>'}
          ${p.approval_status==='approved'?'<span class="pill pill-green">Approved</span>':'<span class="pill pill-amber">'+esc(p.approval_status)+'</span>'}
          ${p.public_visible?'<span class="pill pill-green">Published</span>':'<span class="pill pill-gray">Unpublished</span>'}
          <span class="pill pill-indigo">v${p.version_number}</span>
        </div>
      </div>
      <button class="btn btn-primary" onclick="S.editMode=true;renderPage()">Edit Product</button>
    </div>
    <div class="tabs" id="detail-tabs">${tabNames.map((n,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${n}">${n}</button>`).join('')}</div>
    <div id="tab-content">${tabData.Overview}</div>
  </div>`;
  document.querySelectorAll('#detail-tabs .tab').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('#detail-tabs .tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-content').innerHTML=tabData[btn.dataset.tab];
    };
  });
}

async function saveProduct(id,hasSpec){
  const get=id=>document.getElementById(id)?.value||'';
  const tryJSON=v=>{try{return v?JSON.parse(v):null}catch{return null}};
  const update={
    brand_name:get('e-brand'),manufacturer_name:get('e-mfr'),model:get('e-model'),
    category:get('e-cat'),series:get('e-series')||null,product_line:get('e-line')||null,
    msrp:get('e-msrp')?parseFloat(get('e-msrp')):null,product_family:get('e-family')||null,
    short_description:get('e-desc')||null,status:get('e-status'),
    public_visible:get('e-pub')==='true',
    updated_at:new Date().toISOString(),updated_by:S.user.id
  };
  const {error}=await sb.from('aiq_products').update(update).eq('id',id);
  if(error)return alert('Save failed: '+error.message);

  // Save specs
  const specData={
    dimensions:tryJSON(get('e-dims')),electrical:tryJSON(get('e-elec')),
    performance:tryJSON(get('e-perf')),installation:tryJSON(get('e-inst')),
    warranty:tryJSON(get('e-warr')),updated_at:new Date().toISOString()
  };
  const hasAnySpec=Object.values(specData).some(v=>v!==null&&v!=='');
  if(hasAnySpec){
    if(hasSpec==='true'||hasSpec===true){
      await sb.from('aiq_product_specifications').update(specData).eq('product_id',id);
    }else{
      const {data:prod}=await sb.from('aiq_products').select('organization_id').eq('id',id).maybeSingle();
      await sb.from('aiq_product_specifications').insert({product_id:id,organization_id:prod?.organization_id,...specData,version_number:1,created_at:new Date().toISOString()});
    }
  }
  S.editMode=false;renderPage();
}

async function createProduct(){
  const get=id=>document.getElementById(id)?.value?.trim()||'';
  if(!get('n-brand')||!get('n-mfr')||!get('n-model'))return alert('Brand, Manufacturer, and Model are required.');
  const row={
    organization_id:'00000000-0000-0000-0000-000000000001',
    brand_name:get('n-brand'),manufacturer_name:get('n-mfr'),model:get('n-model'),
    category:get('n-cat'),series:get('n-series')||null,product_line:get('n-line')||null,
    msrp:get('n-msrp')?parseFloat(get('n-msrp')):null,product_family:get('n-family')||null,
    short_description:get('n-desc')||null,
    status:'draft',approval_status:'draft',public_visible:false,
    source_type:'manual',source_review_status:'pending',
    country_availability:['CA','US'],version_number:1,
    created_by:S.user.id,updated_by:S.user.id
  };
  const {data,error}=await sb.from('aiq_products').insert(row).select('id').maybeSingle();
  if(error)return alert('Create failed: '+error.message);
  go('product-detail',data.id);
}

/* ── DATA QUALITY ── */
async function renderDataQuality(C){
  const {data:products}=await sb.from('aiq_products').select('id,brand_name,model,short_description,msrp,series,product_line,product_family,category');
  const {data:specs}=await sb.from('aiq_product_specifications').select('product_id');
  const specIds=new Set((specs||[]).map(s=>s.product_id));

  const scored=(products||[]).map(p=>{
    let score=0,total=8,issues=[];
    if(p.short_description){score++}else issues.push('Missing description');
    if(p.msrp){score++}else issues.push('Missing MSRP');
    if(p.series){score++}else issues.push('Missing series');
    if(p.product_line){score++}else issues.push('Missing product line');
    if(p.product_family){score++}else issues.push('Missing product family');
    if(specIds.has(p.id)){score+=3}else issues.push('No specifications');
    return {...p,score:Math.round(score/total*100),issues};
  }).sort((a,b)=>a.score-b.score);

  const avgScore=scored.length?Math.round(scored.reduce((s,p)=>s+p.score,0)/scored.length):0;
  const complete=scored.filter(p=>p.score>=75).length;

  C.innerHTML=`
  <div class="pagehead"><div><h1>Data Quality</h1><p class="sub">Completeness and enrichment scoring for every product record.</p></div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric"><div class="label">Avg Completeness</div><div class="value" style="color:${avgScore>=70?'var(--green)':'var(--amber)'};">${avgScore}%</div></div>
    <div class="metric"><div class="label">Complete (≥75%)</div><div class="value">${complete} / ${scored.length}</div></div>
    <div class="metric"><div class="label">Need Attention (&lt;50%)</div><div class="value" style="color:var(--red)">${scored.filter(p=>p.score<50).length}</div></div>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Product</th><th>Score</th><th>Issues</th><th></th></tr></thead>
    <tbody>${scored.map(p=>`<tr>
      <td><span class="model-name">${esc(p.brand_name)} ${esc(p.model)}</span></td>
      <td><span class="pill ${p.score>=75?'pill-green':p.score>=50?'pill-amber':'pill-red'}">${p.score}%</span></td>
      <td class="tiny">${p.issues.length?p.issues.join(' · '):'<span style="color:var(--green)">Complete</span>'}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="go('product-detail','${p.id}')">Fix →</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

/* ── ACTIVITY ── */
async function renderActivity(C){
  const {data:log}=await sb.from('product_iq_governance_audit_log').select('*').order('created_at',{ascending:false}).limit(50);
  const {data:versions}=await sb.from('aiq_product_versions').select('id,product_id,version_number,created_at').order('created_at',{ascending:false}).limit(30);

  C.innerHTML=`
  <div class="pagehead"><div><h1>Activity Log</h1><p class="sub">Recent changes and governance events across the product catalog.</p></div></div>
  <div class="panel">
    <h2>Version History</h2>
    ${(versions||[]).length?`<div class="tablewrap"><table><thead><tr><th>Product ID</th><th>Version</th><th>Date</th></tr></thead><tbody>
      ${versions.map(v=>`<tr class="clickable" onclick="go('product-detail','${v.product_id}')"><td class="tiny">${esc(v.product_id).substring(0,8)}…</td><td>v${v.version_number}</td><td class="tiny">${new Date(v.created_at).toLocaleString()}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">No version history recorded yet.</div>'}
  </div>
  ${(log||[]).length?`<div class="panel" style="margin-top:16px">
    <h2>Governance Audit Log</h2>
    <div class="tablewrap"><table><thead><tr><th>Action</th><th>Entity</th><th>Actor</th><th>Date</th></tr></thead><tbody>
      ${log.map(e=>`<tr><td><span class="pill pill-indigo">${esc(e.action)}</span></td><td class="tiny">${esc(e.entity_type)}</td><td class="tiny">${esc(e.actor_kind)}</td><td class="tiny">${new Date(e.created_at).toLocaleString()}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`:''}`;
}

init();
</script>
