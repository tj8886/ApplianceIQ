<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApplianceIQ Academy — Manufacturer Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0f1f3d;--navy-2:#16294a;--teal:#2f7d72;--teal-dark:#276b61;--teal-tint:#e6f0ed;
  --sand:#e9e0d0;--sand-text:#9c7c46;--ink:#1f2b3d;--steel:#64748b;--line:#e3e8ee;
  --bg:#f4f6f8;--card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.logo-pill{background:var(--navy);color:#fff;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;font-family:'Sora',Arial,sans-serif}
a{color:var(--teal);text-decoration:none}

/* Auth screen */
#auth-screen{position:fixed;inset:0;background:linear-gradient(160deg,#eef3f1,#f4f6f8);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.auth-box{width:100%;max-width:440px;padding:44px 38px;border:1px solid var(--line);background:var(--card);border-radius:22px;box-shadow:0 20px 60px rgba(15,31,61,.08)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.auth-logo-main{font-family:'Sora',Arial,sans-serif;font-size:20px;font-weight:800;color:var(--navy)}
.auth-sub{text-align:center;color:var(--steel);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;font-weight:700}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.auth-tab{flex:1;text-align:center;padding:11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--steel);border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--teal)}
.btn{background:var(--teal);color:#fff;border:none;padding:13px;border-radius:999px;font-family:'Sora',Arial,sans-serif;font-weight:700;font-size:14px;cursor:pointer;width:100%;transition:background .2s}
.btn:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--navy)}
.btn-ghost:hover{background:var(--bg);border-color:var(--teal)}
.msg{font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:14px}
.msg.err{background:#fdecec;color:#9c2c2c}
.msg.ok{background:var(--teal-tint);color:var(--teal-dark)}
.hint{font-size:11px;color:var(--steel);margin-top:4px}

/* App shell */
#app{display:none}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50}
.topbar-logo{display:flex;align-items:center;gap:10px;font-family:'Sora',Arial,sans-serif;font-weight:800;font-size:16px;color:var(--navy)}
.topbar-logo b{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:14px}
.vendor-chip{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:6px 14px;border-radius:999px}
.signout{background:none;border:1px solid var(--line);color:var(--steel);font-size:11px;padding:6px 14px;border-radius:999px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:32px 22px 80px}
.page-eyebrow{font-size:10px;color:var(--teal);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.page-title{font-family:'Sora',Arial,sans-serif;font-size:clamp(24px,3.5vw,34px);font-weight:800;color:var(--navy);letter-spacing:-.6px;margin-bottom:8px}
.page-sub{color:var(--steel);font-size:14px;max-width:640px;margin-bottom:28px}

/* Admin/vendor switch */
.role-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.role-btn{background:var(--card);border:1px solid var(--line);color:var(--steel);font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
.role-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Category groups */
.cat-group{margin-bottom:32px}
.cat-group-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:12px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(15,31,61,.04)}
.cat-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.cat-name{font-family:'Sora',Arial,sans-serif;font-size:15px;font-weight:700;color:var(--navy)}
.cat-count{font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-tint);padding:3px 9px;border-radius:12px;white-space:nowrap}
.cat-aud{font-size:10px;color:var(--steel);margin-bottom:12px}
.cat-files{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:8px 10px;background:var(--bg);border-radius:8px}
.file-row .fn{font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-del{background:none;border:none;color:#c05050;cursor:pointer;font-size:14px;flex-shrink:0}
.btn-add{width:100%;background:var(--teal-tint);color:var(--teal-dark);border:none;padding:9px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.btn-add:hover{background:var(--teal);color:#fff}

/* Admin/training cards */
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(15,31,61,.04)}
.admin-card h3{font-family:'Sora',Arial,sans-serif;font-size:16px;font-weight:800;color:var(--navy);margin-bottom:12px}
.admin-card table{width:100%;border-collapse:collapse;font-size:13px}
.admin-card th{text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line)}
.admin-card td{padding:10px;border-bottom:1px solid var(--line)}
.pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:1px}
.pill.active{background:var(--teal-tint);color:var(--teal-dark)}
.pill.pending{background:#fef3c7;color:#92400e}
.pill.draft{background:#dbeafe;color:#1e40af}
.pill.published{background:var(--teal-tint);color:var(--teal-dark)}
.empty{text-align:center;padding:40px;color:var(--steel);font-size:14px}

/* Upload modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(15,31,61,.55);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:36px;box-shadow:0 30px 80px rgba(15,31,61,.25)}
.modal h3{font-family:'Sora',Arial,sans-serif;font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px}
.modal .mc{font-size:12px;color:var(--steel);margin-bottom:22px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:12px;font-weight:600;color:var(--steel);cursor:pointer}
.seg button.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.aud-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.aud-chip{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--steel);cursor:pointer;font-weight:600}
.aud-chip.on{background:var(--teal-tint);color:var(--teal-dark);border-color:var(--teal)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1}

/* Admin tables */
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
.admin-card h3{font-family:'Sora',Arial,sans-serif;font-size:16px;color:var(--navy);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink)}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;text-transform:uppercase}
.pill.pending{background:#fdf3e3;color:#9c7c46}
.pill.active,.pill.accepted{background:var(--teal-tint);color:var(--teal-dark)}
.loading{text-align:center;padding:60px;color:var(--steel)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--steel);font-size:13px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo"><span class="logo-pill">IQ</span><span class="auth-logo-main">ApplianceIQ <b style="color:var(--teal)">Academy</b></span></div>
    <div class="auth-sub">Manufacturer Portal</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
      <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</div>
    </div>
    <div id="auth-msg"></div>

    <!-- Sign in -->
    <div id="form-signin">
      <div class="field"><label>Email</label><input type="email" id="si-email" placeholder="you@yourbrand.com"></div>
      <div class="field"><label>Password</label><input type="password" id="si-pass" placeholder="••••••••"></div>
      <button class="btn" onclick="signIn()">Sign In</button>
    </div>

    <!-- Register -->
    <div id="form-register" style="display:none">
      <div class="field"><label>Your name</label><input type="text" id="rg-name" placeholder="Jane Rep"></div>
      <div class="field"><label>Work email</label><input type="email" id="rg-email" placeholder="you@yourbrand.com"></div>
      <div class="field"><label>Password</label><input type="password" id="rg-pass" placeholder="Choose a password"></div>
      <div class="field">
        <label>Your brand</label>
        <select id="rg-vendor"><option value="">Select your brand…</option></select>
        <div class="hint">Don't see your brand? Choose "Other — request new brand" and we'll set it up.</div>
      </div>
      <div class="field" id="rg-other-wrap" style="display:none">
        <label>Brand name</label><input type="text" id="rg-other" placeholder="Your brand name">
      </div>
      <div class="field"><label>Invite code <span style="font-weight:400;color:var(--steel)">(optional)</span></label><input type="text" id="rg-code" placeholder="If you were invited, paste your code"></div>
      <button class="btn" onclick="register()">Create Manufacturer Account</button>
      <div class="hint" style="margin-top:12px">By registering you can upload and manage content for your brand only.</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><span class="logo-pill">IQ</span>ApplianceIQ <b>Academy</b></div>
    <div class="topbar-right">
      <span class="vendor-chip" id="vendor-chip">—</span>
      <button class="signout" onclick="signOut()">Sign Out</button>
    </div>
  </div>
  <div class="wrap" id="app-body">
    <div class="loading"><div class="spin"></div>Loading…</div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-ov" id="upload-modal">
  <div class="modal">
    <h3 id="um-title">Add Content</h3>
    <div class="mc" id="um-cat">—</div>
    <div id="um-msg"></div>
    <div class="seg" id="um-seg">
      <button class="active" data-src="file" onclick="umSetSrc('file')">Upload a file</button>
      <button data-src="link" onclick="umSetSrc('link')">Paste a link</button>
    </div>
    <div class="field"><label>Title</label><input type="text" id="um-t" placeholder="e.g. 800 Series Dishwasher Spec Sheet"></div>
    <div class="field" id="um-file-wrap"><label>File</label><input type="file" id="um-file"><div class="hint">PDF, image, doc, CAD, or video file.</div></div>
    <div class="field" id="um-link-wrap" style="display:none"><label>Link (YouTube, Vimeo, HeyGen, or any URL)</label><input type="url" id="um-link" placeholder="https://…"></div>
    <div class="field"><label>Model <span style="font-weight:400;color:var(--steel)">(optional)</span></label><input type="text" id="um-model" placeholder="e.g. SHX78B75UC"></div>
    <div class="field"><label>Description <span style="font-weight:400;color:var(--steel)">(optional)</span></label><input type="text" id="um-desc" placeholder="Short note"></div>
    <div class="field"><label>Who can see this?</label><div class="aud-chips" id="um-aud"></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
      <button class="btn" id="um-save" onclick="saveAsset()">Save</button>
    </div>
  </div>
</div>

<script>
// ⚠️ APPLIANCEIQ SUPABASE — use the SAME project as the learner portal
const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV';
const sb = supabase.createClient(SB_URL, SB_KEY);
const STORAGE_BUCKET = 'vendor-assets';

let ME = null, MYROLE = null, MYVENDORS = [], ACTIVE_VENDOR = null, CATS = null, ADMIN_VIEW = false;

// ---------- AUTH UI ----------
function switchTab(t){
  document.getElementById('tab-signin').classList.toggle('active', t==='signin');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
  document.getElementById('form-signin').style.display = t==='signin'?'block':'none';
  document.getElementById('form-register').style.display = t==='register'?'block':'none';
  msg('');
}
function msg(text,kind){ document.getElementById('auth-msg').innerHTML = text?`<div class="msg ${kind||'err'}">${text}</div>`:''; }
function umMsg(text,kind){ document.getElementById('um-msg').innerHTML = text?`<div class="msg ${kind||'err'}">${text}</div>`:''; }

async function loadVendorOptions(){
  try{
    const {data} = await sb.from('mfr_vendors').select('slug,name').order('name');
    const sel = document.getElementById('rg-vendor');
    (data||[]).forEach(v=>{ const o=document.createElement('option'); o.value=v.slug; o.textContent=v.name; sel.appendChild(o); });
    const other=document.createElement('option'); other.value='__other__'; other.textContent='Other — request new brand'; sel.appendChild(other);
    sel.onchange=()=>{ document.getElementById('rg-other-wrap').style.display = sel.value==='__other__'?'block':'none'; };
  }catch(e){}
}

async function signIn(){
  msg('');
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email||!pass){ msg('Enter your email and password.'); return; }
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ msg(error.message); return; }
  boot();
}

async function register(){
  msg('');
  const name=document.getElementById('rg-name').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const pass=document.getElementById('rg-pass').value;
  const vslug=document.getElementById('rg-vendor').value;
  const other=document.getElementById('rg-other').value.trim();
  const code=document.getElementById('rg-code').value.trim();
  if(!name||!email||!pass){ msg('Fill in your name, email, and password.'); return; }
  if(!vslug){ msg('Select your brand.'); return; }
  if(vslug==='__other__' && !other){ msg('Enter your brand name.'); return; }

  const {data:sd,error:se}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  if(se){ msg(se.message); return; }
  const uid = sd.user?.id;
  if(!uid){ msg('Check your email to confirm, then sign in.','ok'); return; }

  // set manufacturer role
  await sb.from('mfr_user_roles').upsert({user_id:uid,is_manufacturer:true,is_retailer:false});

  // resolve vendor: existing brand -> join; other -> create pending vendor
  let vendorId=null;
  if(vslug==='__other__'){
    const slug = other.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const {data:nv}=await sb.from('mfr_vendors').insert({slug,name:other,status:'pending'}).select('id').single();
    vendorId = nv?.id;
  } else {
    const {data:ev}=await sb.from('mfr_vendors').select('id').eq('slug',vslug).single();
    vendorId = ev?.id;
  }
  if(vendorId){ await sb.from('mfr_members').insert({user_id:uid,vendor_id:vendorId,member_role:'owner'}); }

  // mark invite accepted if a code was used
  if(code){ await sb.from('mfr_invites').update({status:'accepted',accepted_at:new Date().toISOString()}).eq('code',code); }

  msg('Account created. Loading your portal…','ok');
  setTimeout(boot,600);
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }

// ---------- BOOT ----------
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){ document.getElementById('auth-screen').style.display='flex'; document.getElementById('app').style.display='none'; loadVendorOptions(); return; }
  ME=user;
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';

  CATS = await (await fetch('mfr_categories.json')).json();
  const {data:role}=await sb.from('mfr_user_roles').select('*').eq('user_id',ME.id).maybeSingle();
  MYROLE=role||{};
  const {data:mem}=await sb.from('mfr_members').select('vendor_id, member_role, mfr_vendors(id,slug,name,tier,status)').eq('user_id',ME.id);
  MYVENDORS=(mem||[]).map(m=>m.mfr_vendors).filter(Boolean);
  ACTIVE_VENDOR=MYVENDORS[0]||null;

  render();
}

function render(){
  const body=document.getElementById('app-body');
  const chip=document.getElementById('vendor-chip');
  // role switch bar (admin can toggle admin view)
  let roleBar='';
  if(MYROLE.is_admin){
    roleBar=`<div class="role-bar">
      <button class="role-btn ${!ADMIN_VIEW?'active':''}" onclick="setAdminView(false)">My Uploads</button>
      <button class="role-btn ${ADMIN_VIEW?'active':''}" onclick="setAdminView(true)">Admin — Vendors & Invites</button>
    </div>`;
  }
  if(MYROLE.is_admin && ADMIN_VIEW){ chip.textContent='Admin'; body.innerHTML=roleBar+renderAdminShell(); loadAdmin(); return; }

  if(!ACTIVE_VENDOR){
    chip.textContent='No brand';
    body.innerHTML=roleBar+`<div class="empty">You're not linked to a brand yet. If you registered, your brand may be pending setup. Contact the ApplianceIQ team.</div>`;
    return;
  }
  chip.textContent=ACTIVE_VENDOR.name;
  // vendor switcher if multiple
  let vsw='';
  if(MYVENDORS.length>1){
    vsw=`<div class="role-bar">${MYVENDORS.map(v=>`<button class="role-btn ${v.id===ACTIVE_VENDOR.id?'active':''}" onclick="setVendor('${v.id}')">${v.name}</button>`).join('')}</div>`;
  }

  // Portal view tabs
  const viewTabs = `<div class="role-bar" style="margin-top:14px">
    <button class="role-btn ${PORTAL_VIEW==='assets'?'active':''}" onclick="setPortalView('assets')">📁 Content Library</button>
    <button class="role-btn ${PORTAL_VIEW==='training'?'active':''}" onclick="setPortalView('training')">📚 Brand Training</button>
  </div>`;

  if (PORTAL_VIEW === 'training') {
    body.innerHTML=roleBar+vsw+`
      <div class="page-eyebrow">Brand Training</div>
      <h1 class="page-title">${ACTIVE_VENDOR.name} — Training Content</h1>
      <p class="page-sub">Review and edit your brand's training card — this powers what salespeople see in the Academy. Changes enter review before publishing.</p>
      ${viewTabs}
      <div id="training-editor"><div class="loading"><div class="spin"></div>Loading training content…</div></div>`;
    loadTrainingEditor();
    return;
  }

  body.innerHTML=roleBar+vsw+`
    <div class="page-eyebrow">Manufacturer Portal</div>
    <h1 class="page-title">${ACTIVE_VENDOR.name} — Content Library</h1>
    <p class="page-sub">Upload and manage everything for your brand: specs, installation, manuals, warranty, energy guides, CAD, sales tools, promos, training, and videos. Tag each item for who should see it — retail floors, builders, or designers.</p>
    ${viewTabs}
    <div id="cat-groups"><div class="loading"><div class="spin"></div>Loading your library…</div></div>`;
  loadAssets();
}

function setVendor(id){ ACTIVE_VENDOR=MYVENDORS.find(v=>v.id===id); render(); }
function setAdminView(v){ ADMIN_VIEW=v; render(); }
let PORTAL_VIEW = 'assets'; // 'assets' or 'training'

function setPortalView(v) {
  PORTAL_VIEW = v;
  render();
}

// ---------- ASSETS ----------
let ASSETS=[];
async function loadAssets(){
  const {data}=await sb.from('mfr_assets').select('*').eq('vendor_id',ACTIVE_VENDOR.id).order('created_at',{ascending:false});
  ASSETS=data||[];
  renderCatGroups();
}
function renderCatGroups(){
  const wrap=document.getElementById('cat-groups');
  wrap.innerHTML=CATS.groups.map(g=>`
    <div class="cat-group">
      <div class="cat-group-title">${g.group}</div>
      <div class="cat-grid">
        ${g.cats.map(c=>{
          const files=ASSETS.filter(a=>a.category===c.key);
          return `<div class="cat-card">
            <div class="cat-card-head"><div class="cat-name">${c.label}</div><span class="cat-count">${files.length}</span></div>
            <div class="cat-aud">Default audience: ${c.audiences.join(' · ')}</div>
            <div class="cat-files">
              ${files.length?files.map(f=>`<div class="file-row"><span class="fn">${f.title}</span><button class="file-del" onclick="delAsset('${f.id}')" title="Delete">✕</button></div>`).join(''):'<div style="font-size:11px;color:var(--steel)">Nothing uploaded yet.</div>'}
            </div>
            <button class="btn-add" onclick="openUpload('${c.key}')">+ Add</button>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

// ---------- UPLOAD MODAL ----------
let UM_CAT=null, UM_SRC='file', UM_AUD=[];
function findCat(key){ for(const g of CATS.groups){ const c=g.cats.find(x=>x.key===key); if(c) return c; } return null; }
function openUpload(catKey){
  UM_CAT=findCat(catKey); UM_SRC='file'; UM_AUD=[...UM_CAT.audiences];
  document.getElementById('um-title').textContent='Add — '+UM_CAT.label;
  document.getElementById('um-cat').textContent='For '+ACTIVE_VENDOR.name;
  document.getElementById('um-t').value='';
  document.getElementById('um-model').value='';
  document.getElementById('um-desc').value='';
  document.getElementById('um-link').value='';
  document.getElementById('um-file').value='';
  umMsg('');
  umSetSrc(UM_CAT.type==='video'||UM_CAT.type==='link'?'link':'file');
  const allAud=['retailer','builder','designer'];
  document.getElementById('um-aud').innerHTML=allAud.map(a=>`<span class="aud-chip ${UM_AUD.includes(a)?'on':''}" onclick="toggleAud('${a}',this)">${a}</span>`).join('');
  document.getElementById('upload-modal').style.display='flex';
}
function umSetSrc(s){ UM_SRC=s;
  document.querySelectorAll('#um-seg button').forEach(b=>b.classList.toggle('active',b.dataset.src===s));
  document.getElementById('um-file-wrap').style.display=s==='file'?'block':'none';
  document.getElementById('um-link-wrap').style.display=s==='link'?'block':'none';
}
function toggleAud(a,el){ if(UM_AUD.includes(a)){UM_AUD=UM_AUD.filter(x=>x!==a);el.classList.remove('on');} else {UM_AUD.push(a);el.classList.add('on');} }
function closeUpload(){ document.getElementById('upload-modal').style.display='none'; }

async function saveAsset(){
  umMsg('');
  const title=document.getElementById('um-t').value.trim();
  if(!title){ umMsg('Give it a title.'); return; }
  if(!UM_AUD.length){ umMsg('Pick at least one audience.'); return; }
  const btn=document.getElementById('um-save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    let file_url=null, external_url=null, file_type=UM_CAT.type;
    if(UM_SRC==='link'){
      external_url=document.getElementById('um-link').value.trim();
      if(!external_url){ umMsg('Paste a link or switch to file upload.'); btn.disabled=false; btn.textContent='Save'; return; }
      file_type='link';
    } else {
      const f=document.getElementById('um-file').files[0];
      if(!f){ umMsg('Choose a file or switch to paste-a-link.'); btn.disabled=false; btn.textContent='Save'; return; }
      const path=`${ACTIVE_VENDOR.slug}/${UM_CAT.key}/${Date.now()}-${f.name.replace(/[^A-Za-z0-9._-]/g,'_')}`;
      const {error:ue}=await sb.storage.from(STORAGE_BUCKET).upload(path,f,{upsert:false});
      if(ue){ umMsg('Upload failed: '+ue.message); btn.disabled=false; btn.textContent='Save'; return; }
      const {data:pub}=sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      file_url=pub.publicUrl;
    }
    const {error}=await sb.from('mfr_assets').insert({
      vendor_id:ACTIVE_VENDOR.id, category:UM_CAT.key, title,
      description:document.getElementById('um-desc').value.trim()||null,
      model:document.getElementById('um-model').value.trim()||null,
      file_url, external_url, file_type, audiences:UM_AUD, uploaded_by:ME.id
    });
    if(error){ umMsg('Save failed: '+error.message); btn.disabled=false; btn.textContent='Save'; return; }
    closeUpload(); loadAssets();
  }catch(e){ umMsg('Error: '+e.message); }
  btn.disabled=false; btn.textContent='Save';
}

async function delAsset(id){
  if(!confirm('Delete this item?')) return;
  await sb.from('mfr_assets').delete().eq('id',id);
  loadAssets();
}

// ---------- ADMIN ----------
function renderAdminShell(){
  return `<div class="page-eyebrow">Administration</div>
    <h1 class="page-title">Vendors & Invitations</h1>
    <p class="page-sub">Approve pending brands, invite manufacturers, and see who's registered. Invites let you onboard a vendor by email; anyone can also self-register and pick their brand.</p>
    <div id="admin-content"><div class="loading"><div class="spin"></div>Loading…</div></div>`;
}
async function loadAdmin(){
  const el=document.getElementById('admin-content');
  const {data:vendors}=await sb.from('mfr_vendors').select('*').order('name');
  const {data:invites}=await sb.from('mfr_invites').select('*').order('created_at',{ascending:false});
  el.innerHTML=`
    <div class="admin-card">
      <h3>Send an Invitation</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="flex:2;min-width:200px;margin:0"><label>Email</label><input type="email" id="inv-email" placeholder="rep@brand.com"></div>
        <div class="field" style="flex:1;min-width:140px;margin:0"><label>Brand (optional)</label><input type="text" id="inv-vendor" placeholder="Brand name"></div>
        <button class="btn" style="width:auto;padding:12px 22px" onclick="sendInvite()">Create Invite</button>
      </div>
      <div id="inv-msg" style="margin-top:12px"></div>
    </div>
    <div class="admin-card">
      <h3>Brands (${(vendors||[]).length})</h3>
      <table><thead><tr><th>Brand</th><th>Tier</th><th>Status</th><th></th></tr></thead><tbody>
      ${(vendors||[]).map(v=>`<tr><td><strong>${v.name}</strong></td><td>${v.tier||'—'}</td><td><span class="pill ${v.status}">${v.status}</span></td>
        <td>${v.status==='pending'?`<button class="btn" style="width:auto;padding:6px 14px;font-size:12px" onclick="approveVendor('${v.id}')">Approve</button>`:''}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="admin-card">
      <h3>Invitations (${(invites||[]).length})</h3>
      ${(invites||[]).length?`<table><thead><tr><th>Email</th><th>Brand</th><th>Code</th><th>Status</th></tr></thead><tbody>
      ${invites.map(i=>`<tr><td>${i.email}</td><td>${i.vendor_name||'—'}</td><td><code style="font-size:11px">${i.code}</code></td><td><span class="pill ${i.status}">${i.status}</span></td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">No invitations yet.</div>'}
    </div>`;
}
async function sendInvite(){
  const email=document.getElementById('inv-email').value.trim();
  const vendor=document.getElementById('inv-vendor').value.trim();
  const m=document.getElementById('inv-msg');
  if(!email){ m.innerHTML='<div class="msg err">Enter an email.</div>'; return; }
  const code=Math.random().toString(36).slice(2,10).toUpperCase();
  const {error}=await sb.from('mfr_invites').insert({email,vendor_name:vendor||null,code,invite_role:'manufacturer',invited_by:ME.id});
  if(error){ m.innerHTML='<div class="msg err">'+error.message+'</div>'; return; }
  m.innerHTML=`<div class="msg ok">Invite created. Share this code with ${email}: <strong>${code}</strong> — they enter it when registering.</div>`;
  loadAdmin();
}
async function approveVendor(id){ await sb.from('mfr_vendors').update({status:'active'}).eq('id',id); loadAdmin(); }

// ---------- TRAINING EDITOR ----------
let TRAINING_CARD = null;
let BRAND_CATALOG_ENTRY = null;

async function loadTrainingEditor() {
  const el = document.getElementById('training-editor');
  if (!ACTIVE_VENDOR) { el.innerHTML = '<div class="empty">No brand selected.</div>'; return; }

  // Find brand_catalog entry matching this vendor name
  const { data: brands } = await sb.from('brand_catalog').select('*').ilike('brand_name', ACTIVE_VENDOR.name).limit(1);
  BRAND_CATALOG_ENTRY = brands?.[0] || null;

  if (!BRAND_CATALOG_ENTRY) {
    el.innerHTML = `<div class="empty">No brand catalog entry found for "${ACTIVE_VENDOR.name}". Contact the ApplianceIQ team to link your vendor account to a brand.</div>`;
    return;
  }

  // Load training card
  const { data: cards } = await sb.from('brand_training_cards').select('*').eq('brand_id', BRAND_CATALOG_ENTRY.id).limit(1);
  TRAINING_CARD = cards?.[0] || null;

  renderTrainingEditor();
}

function renderTrainingEditor() {
  const el = document.getElementById('training-editor');
  const c = TRAINING_CARD;

  if (!c) {
    el.innerHTML = `<div class="admin-card">
      <h3>No Training Card Yet</h3>
      <p style="color:var(--steel);margin-bottom:14px">Create a brand training card to power Academy content for your salespeople.</p>
      <button class="btn" style="width:auto;padding:12px 22px" onclick="createTrainingCard()">Create Training Card</button>
    </div>`;
    return;
  }

  const statusColor = c.status === 'published' ? 'var(--teal)' : c.status === 'draft' ? '#ca8a04' : 'var(--steel)';
  const fields = [
    { key: 'heritage', label: 'Brand Heritage & History', type: 'textarea' },
    { key: 'brand_positioning', label: 'Brand Positioning & Market Position', type: 'textarea' },
    { key: 'customer_profile', label: 'Customer Profile', type: 'textarea' },
    { key: 'price_position', label: 'Price Position', type: 'textarea' },
    { key: 'competitive_advantage', label: 'Competitive Advantage', type: 'textarea' },
    { key: 'competitive_weakness', label: 'Known Weakness', type: 'textarea' },
    { key: 'known_for', label: 'Known For', type: 'text' },
    { key: 'parent_company', label: 'Parent Company', type: 'text' },
    { key: 'country_of_origin', label: 'Country of Origin', type: 'text' },
    { key: 'founded_year', label: 'Founded Year', type: 'text' },
  ];

  el.innerHTML = `
    <div class="admin-card" style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
        <div>
          <h3 style="margin-bottom:4px">${ACTIVE_VENDOR.name} Training Card</h3>
          <div style="font-size:12px;color:var(--steel)">
            Version ${c.version || 1} · Status: <span style="color:${statusColor};font-weight:700">${c.status || 'draft'}</span>
            ${c.last_reviewed_at ? ' · Last reviewed: ' + new Date(c.last_reviewed_at).toLocaleDateString() : ''}
            ${c.manufacturer_approved ? ' · <span style="color:var(--teal)">✓ Manufacturer Approved</span>' : ''}
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" style="width:auto;padding:10px 20px;font-size:12px" onclick="saveTrainingCard()">💾 Save Changes</button>
          ${!c.manufacturer_approved ? `<button class="btn-ghost btn" style="width:auto;padding:10px 20px;font-size:12px" onclick="approveTrainingCard()">✓ Approve</button>` : ''}
        </div>
      </div>
    </div>
    <div id="tc-msg"></div>
    ${fields.map(f => `<div class="admin-card" style="margin-bottom:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${f.label}</label>
      ${f.type === 'textarea'
        ? `<textarea id="tc-${f.key}" style="width:100%;min-height:160px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:inherit;font-size:13px;line-height:1.7;color:var(--ink);resize:vertical;outline:none">${esc(c[f.key]||'')}</textarea>`
        : `<input id="tc-${f.key}" type="text" value="${esc(c[f.key]||'')}" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14px;color:var(--ink);outline:none">`
      }
    </div>`).join('')}

    <div class="admin-card" style="margin-bottom:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Floor Talking Points</label>
      <div id="tc-talking-points">
        ${(c.floor_talking_points||[]).map((tp,i) => `<div style="margin-bottom:8px"><textarea id="tc-tp-${i}" style="width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:13px;line-height:1.6;color:var(--ink);resize:vertical;outline:none">${esc(tp)}</textarea></div>`).join('')}
      </div>
      <button class="btn-add" style="margin-top:8px" onclick="addTalkingPoint()">+ Add Talking Point</button>
    </div>

    <div class="admin-card" style="margin-bottom:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Common Objections & Responses</label>
      <div id="tc-objections">
        ${(c.common_objections||[]).map((ob,i) => `<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px">
          <label style="font-size:10px;font-weight:700;color:var(--steel);letter-spacing:1px;text-transform:uppercase">Objection</label>
          <input id="tc-obj-q-${i}" type="text" value="${esc(ob.objection||'')}" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);outline:none;margin:4px 0 10px">
          <label style="font-size:10px;font-weight:700;color:var(--steel);letter-spacing:1px;text-transform:uppercase">Response</label>
          <textarea id="tc-obj-a-${i}" style="width:100%;min-height:80px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink);outline:none;resize:vertical;margin-top:4px">${esc(ob.response||'')}</textarea>
        </div>`).join('')}
      </div>
      <button class="btn-add" style="margin-top:8px" onclick="addObjection()">+ Add Objection</button>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-bottom:40px">
      <button class="btn" style="width:auto;padding:12px 28px" onclick="saveTrainingCard()">💾 Save All Changes</button>
    </div>`;
}

function addTalkingPoint() {
  const container = document.getElementById('tc-talking-points');
  const idx = container.querySelectorAll('textarea').length;
  const div = document.createElement('div');
  div.style.marginBottom = '8px';
  div.innerHTML = `<textarea id="tc-tp-${idx}" style="width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:13px;line-height:1.6;color:var(--ink);resize:vertical;outline:none" placeholder="New talking point..."></textarea>`;
  container.appendChild(div);
}

function addObjection() {
  const container = document.getElementById('tc-objections');
  const idx = container.querySelectorAll('input[id^="tc-obj-q"]').length;
  const div = document.createElement('div');
  div.style.cssText = 'background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px';
  div.innerHTML = `<label style="font-size:10px;font-weight:700;color:var(--steel);letter-spacing:1px;text-transform:uppercase">Objection</label>
    <input id="tc-obj-q-${idx}" type="text" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);outline:none;margin:4px 0 10px" placeholder="Customer objection...">
    <label style="font-size:10px;font-weight:700;color:var(--steel);letter-spacing:1px;text-transform:uppercase">Response</label>
    <textarea id="tc-obj-a-${idx}" style="width:100%;min-height:80px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink);outline:none;resize:vertical;margin-top:4px" placeholder="Your response..."></textarea>`;
  container.appendChild(div);
}

async function saveTrainingCard() {
  const msgEl = document.getElementById('tc-msg');
  msgEl.innerHTML = '<div class="msg ok">Saving...</div>';

  // Gather text fields
  const updates = {};
  ['heritage','brand_positioning','customer_profile','price_position','competitive_advantage','competitive_weakness','known_for','parent_company','country_of_origin','founded_year'].forEach(key => {
    const el = document.getElementById('tc-' + key);
    if (el) updates[key] = el.value.trim() || null;
  });

  // Gather talking points
  const tps = [];
  document.querySelectorAll('#tc-talking-points textarea').forEach(ta => {
    const v = ta.value.trim();
    if (v) tps.push(v);
  });
  updates.floor_talking_points = tps;

  // Gather objections
  const objs = [];
  document.querySelectorAll('input[id^="tc-obj-q-"]').forEach(inp => {
    const idx = inp.id.replace('tc-obj-q-','');
    const q = inp.value.trim();
    const a = document.getElementById('tc-obj-a-'+idx)?.value.trim() || '';
    if (q) objs.push({ objection: q, response: a });
  });
  updates.common_objections = objs;

  updates.version = (TRAINING_CARD.version || 1) + 1;
  updates.updated_at = new Date().toISOString();
  updates.editor_id = ME.id;
  updates.status = 'draft'; // goes to draft on edit, needs review

  const { error } = await sb.from('brand_training_cards').update(updates).eq('id', TRAINING_CARD.id);
  if (error) {
    msgEl.innerHTML = `<div class="msg err">Save failed: ${error.message}</div>`;
    return;
  }
  Object.assign(TRAINING_CARD, updates);
  msgEl.innerHTML = '<div class="msg ok">✓ Saved! Version ' + updates.version + ' — status set to draft for review.</div>';
  setTimeout(() => { msgEl.innerHTML = ''; }, 4000);
}

async function approveTrainingCard() {
  const { error } = await sb.from('brand_training_cards').update({
    manufacturer_approved: true,
    reviewed_by: ME.id,
    last_reviewed_at: new Date().toISOString(),
    status: 'published'
  }).eq('id', TRAINING_CARD.id);
  if (error) { alert('Approval failed: ' + error.message); return; }
  TRAINING_CARD.manufacturer_approved = true;
  TRAINING_CARD.status = 'published';
  renderTrainingEditor();
}

async function createTrainingCard() {
  if (!BRAND_CATALOG_ENTRY) return;
  const { data, error } = await sb.from('brand_training_cards').insert({
    brand_id: BRAND_CATALOG_ENTRY.id,
    organization_id: BRAND_CATALOG_ENTRY.organization_id,
    status: 'draft',
    version: 1
  }).select().single();
  if (error) { alert('Create failed: ' + error.message); return; }
  TRAINING_CARD = data;
  renderTrainingEditor();
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---------- START ----------
boot();
</script>
</body>
</html>
