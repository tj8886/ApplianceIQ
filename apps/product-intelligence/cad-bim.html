<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD & BIM Library — Product IQ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#0f1f3d;--teal:#2f7d72;--bg:#f4f6f8;--line:#e3e8ee;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,system-ui;color:#1f2b3d}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:22px}.side a{color:#c8d2e3;text-decoration:none;display:block;padding:10px 0}.side h2{margin:0 0 22px}.main{padding:30px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}h1{margin:0;color:var(--navy)}.sub{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:16px}.value{font-size:26px;font-weight:800;color:var(--navy)}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.control{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}.search{min-width:260px;flex:1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #eef1f4;text-align:left}.table th{font-size:10px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}.green{background:#e8f7ee;color:#177c45}.amber{background:#fff5df;color:#a15c00}.empty,.loading,.error{padding:28px;text-align:center;color:var(--muted)}.error{color:#ad3125}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><aside class="side"><h2>Product IQ</h2><a href="/product-intelligence/">Dashboard</a><a href="/product-intelligence/products">Products</a><a href="/product-intelligence/cad-bim.html">CAD & BIM Library</a></aside><main class="main"><div class="head"><div><h1>CAD & BIM Library</h1><p class="sub">Official design files, installation geometry, source links and verification status.</p></div></div><div id="app" class="loading">Loading CAD/BIM registry…</div></main></div><script>const {createClient}=supabase;const sb=createClient('https://fumwwhyozeouoqscolke.supabase.co','sb_publishable_wiP3ouBdS_Qub9EMIYJK7w_eiltZHKV');const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=s=>`<span class="pill ${s==='available'?'green':s==='partial'||s==='login_required'?'amber':''}">${esc((s||'research_pending').replaceAll('_',' '))}</span>`;async function init(){const root=document.getElementById('app');const {data:{user}}=await sb.auth.getUser();if(!user){root.innerHTML='<div class="error">Sign in to Product IQ before opening the CAD/BIM Library.</div>';return}const [{data:sources,error},{data:assets},{data:geometry}]=await Promise.all([sb.from('cad_bim_sources').select('*').order('brand_name'),sb.from('product_design_assets').select('id,verification_status,file_format'),sb.from('product_installation_geometry').select('id,is_verified')]);if(error){root.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}const all=sources||[];root.innerHTML=`<div class="cards"><div class="card"><div class="label">Brands indexed</div><div class="value">${all.length}</div></div><div class="card"><div class="label">Design assets</div><div class="value">${assets?.length||0}</div></div><div class="card"><div class="label">Verified assets</div><div class="value">${(assets||[]).filter(x=>x.verification_status!=='unverified').length}</div></div><div class="card"><div class="label">Geometry records</div><div class="value">${geometry?.length||0}</div></div></div><div class="toolbar"><input id="q" class="control search" placeholder="Search brand or format"><select id="status" class="control"><option value="">All statuses</option><option>available</option><option>partial</option><option>login_required</option><option>research_pending</option><option>not_found</option></select></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Brand</th><th>Status</th><th>Formats</th><th>Official CAD</th><th>Official BIM</th><th>Registration</th><th>Last verified</th></tr></thead><tbody id="rows"></tbody></table></div>`;const draw=()=>{const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;const rows=all.filter(x=>(!q||x.brand_name.toLowerCase().includes(q)||(x.formats||[]).join(' ').toLowerCase().includes(q))&&(!s||x.availability_status===s));document.getElementById('rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.brand_name)}</b></td><td>${pill(x.availability_status)}</td><td>${esc((x.formats||[]).join(', '))}</td><td>${x.official_cad_url?`<a href="${esc(x.official_cad_url)}" target="_blank">Open</a>`:'—'}</td><td>${x.official_bim_url?`<a href="${esc(x.official_bim_url)}" target="_blank">Open</a>`:'—'}</td><td>${x.registration_required?'Yes':'No'}</td><td>${x.last_verified_at?new Date(x.last_verified_at).toLocaleDateString():'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No CAD/BIM sources match.</td></tr>'};document.getElementById('q').oninput=draw;document.getElementById('status').onchange=draw;draw()}init();</script></body></html>
