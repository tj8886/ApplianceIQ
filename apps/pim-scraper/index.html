<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0c1222"/>
<title>PIM Scraper v2 — ApplianceIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c1222;--bg2:#111b2e;--surface:#182338;--card:#1e2d47;
  --accent:#00c896;--accent2:#00e6ac;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --txt:#e8edf4;--txt2:#7e8fa6;--line:#283a55;
  --radius:10px;
  --t1:#00c896;--t2:#f59e0b;--t3:#ef4444;
}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* ── Header ── */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
header .logo span{color:var(--accent)}
header .right{display:flex;align-items:center;gap:12px}
.cost-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:var(--txt2)}
.cost-pill .val{color:var(--accent);font-variant-numeric:tabular-nums}

/* ── Tabs ── */
.tab-bar{display:flex;gap:2px;padding:0 24px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{padding:12px 20px;font-size:13px;font-weight:600;color:var(--txt2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;position:relative}
.tab-btn:hover{color:var(--txt)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn .badge{position:absolute;top:6px;right:4px;background:var(--accent);color:#000;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px}
.tab-btn.locked::after{content:'🔒';margin-left:6px;font-size:10px}

/* ── Main content ── */
.main{flex:1;overflow-y:auto;padding:24px}

/* ── Controls bar ── */
.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.field select,.field input{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field select:focus,.field input:focus{border-color:var(--accent)}
.field select{min-width:220px;cursor:pointer}
.field input{min-width:280px}
.field .tier-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px}
.tier-badge.t1{background:rgba(0,200,150,.15);color:var(--t1)}
.tier-badge.t2{background:rgba(245,158,11,.15);color:var(--t2)}
.tier-badge.t3{background:rgba(239,68,68,.15);color:var(--t3)}

/* ── Buttons ── */
.btn{padding:9px 18px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#0a1628;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--txt);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--txt2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}

/* ── Mode toggle ── */
.mode-toggle{display:flex;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.mode-toggle button{padding:8px 16px;font-size:12px;font-weight:600;font-family:inherit;border:none;background:none;color:var(--txt2);cursor:pointer;transition:all .15s}
.mode-toggle button.active{background:var(--accent);color:#0a1628}

/* ── Brand grid (discover) ── */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.brand-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.brand-card:hover{border-color:var(--accent);background:var(--surface)}
.brand-card.selected{border-color:var(--accent);background:rgba(0,200,150,.08)}
.brand-card .name{font-size:13px;font-weight:600}
.brand-card .meta{display:flex;align-items:center;gap:6px}

/* ── Results ── */
.results-panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.results-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.results-header h3{font-size:14px;font-weight:700}
.results-body{max-height:500px;overflow-y:auto}
.result-row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .1s}
.result-row:hover{background:var(--surface)}
.result-row:last-child{border-bottom:none}
.result-row .status{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.result-row .status.ok{background:var(--accent)}
.result-row .status.partial{background:var(--amber)}
.result-row .status.fail{background:var(--red)}
.result-row .status.pending{background:var(--txt2);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.result-row .info{flex:1;min-width:0}
.result-row .model-num{font-size:13px;font-weight:700;color:var(--txt)}
.result-row .brand-label{font-size:11px;color:var(--txt2)}
.result-row .detail{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-row .tier-used{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.result-row .cost{font-size:11px;font-weight:600;color:var(--txt2);margin-left:auto;white-space:nowrap}
.result-row .actions{display:flex;gap:6px;margin-left:8px;flex-shrink:0}

/* ── Spec preview modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec-item{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface);border-radius:6px;font-size:12px}
.spec-item .k{color:var(--txt2);font-weight:500}
.spec-item .v{color:var(--txt);font-weight:600;text-align:right}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

/* ── Progress / log ── */
.log-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;font-size:12px;color:var(--txt2);max-height:180px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;line-height:1.7;display:none}
.log-panel.show{display:block}
.log-panel .entry{display:flex;gap:8px}
.log-panel .ts{color:var(--txt2);opacity:.5;min-width:70px}
.log-panel .msg{color:var(--txt)}
.log-panel .msg.cost{color:var(--amber)}
.log-panel .msg.ok{color:var(--accent)}
.log-panel .msg.err{color:var(--red)}

/* ── Stats row ── */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:140px}
.stat-card .label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-card .value.green{color:var(--accent)}
.stat-card .value.amber{color:var(--amber)}
.stat-card .value.red{color:var(--red)}

/* ── Settings row ── */
.settings-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.settings-row label{font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:6px;cursor:pointer}
.settings-row input[type="checkbox"]{accent-color:var(--accent)}
.settings-row select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--txt);font-size:12px;font-family:inherit}

/* ── Placeholder tabs ── */
.placeholder-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--txt2);gap:12px}
.placeholder-tab .icon{font-size:48px;opacity:.3}
.placeholder-tab h2{font-size:18px;font-weight:700;color:var(--txt)}
.placeholder-tab p{font-size:13px;max-width:400px;text-align:center;line-height:1.6}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--txt2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Appliance<span>IQ</span> PIM Scraper</div>
    <div class="right">
      <div class="cost-pill">Session cost: <span class="val" id="sessionCost">$0.00</span></div>
      <div class="cost-pill">Brands: <span class="val" id="brandCount">0</span></div>
    </div>
  </header>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('discover')">Discover</button>
    <button class="tab-btn locked" onclick="switchTab('price-sync')">Price Sync</button>
    <button class="tab-btn locked" onclick="switchTab('verify')">Verify &amp; Audit</button>
    <button class="tab-btn locked" onclick="switchTab('enrich')">Enrich &amp; Complete</button>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Product Details</h3><button class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
/* ── Globals (non-module, onclick accessible) ── */
var currentTab = 'discover';
var brands = [];
var selectedBrand = null;
var scrapeResults = [];
var sessionCostTotal = 0;
var isProcessing = false;
var discoverMode = 'single'; /* single | batch | browse */
var autoSave = false;
var aiModel = 'gpt-4.1-mini';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    b.classList.toggle('active', ['discover','price-sync','verify','enrich'][i] === tab);
  });
  renderTab();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function setDiscoverMode(mode) {
  discoverMode = mode;
  renderTab();
}

function selectBrand(brandName) {
  selectedBrand = selectedBrand === brandName ? null : brandName;
  renderTab();
}

function toggleAutoSave() { autoSave = !autoSave; }
function setAiModel(val) { aiModel = val; }
</script>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bXd3aHlvemVvdW9xc2NvbGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDE4MDMxMDIsImV4cCI6MjA1NzM3OTEwMn0.yO52szdDkCeJ0n62VUl5JRMjBfSMjpXfn0vqEhmYzao';
const sb = createClient(SB_URL, SB_KEY);

/* ═══════════════════════════════════════════
   CORE: Three-Tier AI Pipeline
   ═══════════════════════════════════════════ */

const TIER_COSTS = { 1: 0, 2: 0.002, 3: 0.30 }; // avg per call
const TIER_LABELS = {
  1: { text:'FREE', cls:'t1', icon:'⚡' },
  2: { text:'CHEAP', cls:'t2', icon:'💲' },
  3: { text:'AI', cls:'t3', icon:'🤖' }
};

function addCost(amount) {
  sessionCostTotal += amount;
  document.getElementById('sessionCost').textContent = '$' + sessionCostTotal.toFixed(4);
}

function logEntry(msg, cls) {
  const el = document.getElementById('scrapeLog');
  if (!el) return;
  el.classList.add('show');
  const now = new Date().toLocaleTimeString('en-US', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.innerHTML += `<div class="entry"><span class="ts">${now}</span><span class="msg ${cls||''}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

/* ── Tier 1: Free edge function ── */
async function callTier1(params) {
  logEntry('Tier 1 → free-extract edge function...');
  try {
    const r = await fetch(SB_URL + '/functions/v1/free-extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await r.json();
    if (data.found || data._partial) {
      logEntry(`Tier 1 ✓ ${data.found ? 'full' : 'partial'} data extracted`, 'ok');
      addCost(0);
      data._tier = 1;
      data._cost = 0;
      return data;
    }
    logEntry('Tier 1: no structured data found', 'err');
    return null;
  } catch (e) {
    logEntry('Tier 1 error: ' + e.message, 'err');
    return null;
  }
}

/* ── Tier 2: GPT (cheap structuring) ── */
async function callTier2(partialData, rawHtml, modelOverride) {
  const apiKey = localStorage.getItem('aiq_openai_key');
  if (!apiKey) {
    logEntry('Tier 2 skipped: no OpenAI API key set', 'err');
    return null;
  }
  const model = modelOverride || aiModel || 'gpt-4.1-mini';
  logEntry(`Tier 2 → ${model} structuring...`);

  const systemPrompt = `You are an appliance product data extractor. Given partial product data and/or raw HTML, extract and structure ALL available product information. Return ONLY valid JSON with these fields where available: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, amperage, wattage, energy_star (boolean), specs (object of key-value pairs), images (array of {url, type}), availability, features (array of strings). Omit fields you cannot determine.`;

  const userMsg = partialData
    ? `Partial data already extracted:\n${JSON.stringify(partialData, null, 2)}\n\nPlease fill in any missing fields and structure completely.`
    : `Extract product data from this HTML (truncated):\n${(rawHtml || '').substring(0, 8000)}`;

  try {
    const body = {
      model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMsg }
      ],
      temperature: 0.1,
      response_format: { type: 'json_object' }
    };
    if (model.startsWith('gpt-5') || model.includes('o')) {
      body.max_completion_tokens = 2000;
      if (model.startsWith('gpt-5')) body.reasoning_effort = 'none';
    } else {
      body.max_tokens = 2000;
    }

    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (data.error) { logEntry('Tier 2 error: ' + data.error.message, 'err'); return null; }

    const txt = data.choices?.[0]?.message?.content || '';
    const parsed = JSON.parse(txt.replace(/```json\s*|```/g, '').trim());
    const cost = ((data.usage?.prompt_tokens||0)*0.0000004 + (data.usage?.completion_tokens||0)*0.0000016);
    addCost(cost);
    logEntry(`Tier 2 ✓ structured via ${model} ($${cost.toFixed(4)})`, 'cost');
    parsed._tier = 2;
    parsed._cost = cost;
    parsed._model = model;
    return parsed;
  } catch (e) {
    logEntry('Tier 2 error: ' + e.message, 'err');
    return null;
  }
}

/* ── Tier 3: Haiku with web search (last resort) ── */
async function callTier3(query, brandInfo) {
  const apiKey = localStorage.getItem('aiq_anthropic_key');
  if (!apiKey) {
    logEntry('Tier 3 skipped: no Anthropic API key set', 'err');
    return null;
  }
  logEntry('Tier 3 → Claude Haiku + web search (last resort)...');

  const systemPrompt = `You are an appliance product data specialist. Search for and extract complete product information for the given appliance model. Return ONLY valid JSON with these fields where available: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, amperage, wattage, energy_star (boolean), specs (object of key-value pairs), images (array of {url, type}), availability, features (array of strings), source_url. Omit fields you cannot determine.`;

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 2000,
        system: systemPrompt,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: `Find complete product specifications for: ${query}. Brand: ${brandInfo?.brand_name || 'unknown'}. Look at the manufacturer website first, then retailer sites if needed.` }]
      })
    });
    const data = await r.json();
    if (data.error) { logEntry('Tier 3 error: ' + data.error.message, 'err'); return null; }

    // Extract text from response blocks
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const fullText = textBlocks.join('\n');

    // Try to parse JSON from response
    const jsonMatch = fullText.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      const parsed = JSON.parse(jsonMatch[0]);
      const cost = 0.30; // approximate with web search
      addCost(cost);
      logEntry(`Tier 3 ✓ extracted via Haiku + web search ($${cost.toFixed(2)})`, 'cost');
      parsed._tier = 3;
      parsed._cost = cost;
      return parsed;
    }
    logEntry('Tier 3: could not parse structured data from response', 'err');
    return null;
  } catch (e) {
    logEntry('Tier 3 error: ' + e.message, 'err');
    return null;
  }
}

/* ═══════════════════════════════════════════
   SMART SCRAPE: Orchestrates tiers per brand
   ═══════════════════════════════════════════ */

async function smartScrape(brandName, modelNumber, directUrl) {
  const brandInfo = brands.find(b => b.brand_name === brandName) || null;
  const tier = brandInfo?.scrape_tier || 3;
  const result = { brand: brandName, model: modelNumber, status: 'pending', data: null, tier_used: 0, cost: 0, url: directUrl };

  // Update UI
  scrapeResults.push(result);
  renderResults();

  // ── Tier 1: Always try free first ──
  if (tier <= 1 || directUrl) {
    const params = directUrl ? { url: directUrl } : { query: `${brandName} ${modelNumber}`, market: 'CA' };
    const t1 = await callTier1(params);
    if (t1) {
      if (t1.found) {
        result.data = t1; result.status = 'ok'; result.tier_used = 1; result.cost = 0;
        renderResults();
        return result;
      }
      // Partial — try Tier 2 to fill gaps
      if (t1._partial && tier <= 2) {
        const t2 = await callTier2(t1, null);
        if (t2) {
          result.data = { ...t1, ...t2, _merged: true }; result.status = 'ok'; result.tier_used = 2; result.cost = t2._cost || 0;
          renderResults();
          return result;
        }
      }
      // Even partial is better than nothing for T1 brands
      if (t1._partial) {
        result.data = t1; result.status = 'partial'; result.tier_used = 1; result.cost = 0;
        renderResults();
        return result;
      }
    }
  }

  // ── Tier 2: Fetchable but no JSON-LD ──
  if (tier <= 2 && brandInfo?.server_fetchable) {
    // Try free-extract with a search query (DuckDuckGo path)
    const t1search = await callTier1({ query: `${brandName} ${modelNumber}`, market: 'CA' });
    if (t1search) {
      if (t1search.found || t1search._partial) {
        const t2 = await callTier2(t1search, null);
        if (t2) {
          result.data = { ...t1search, ...t2, _merged: true }; result.status = t2.model ? 'ok' : 'partial';
          result.tier_used = 2; result.cost = t2._cost || 0;
          renderResults();
          return result;
        }
        result.data = t1search; result.status = 'partial'; result.tier_used = 1; result.cost = 0;
        renderResults();
        return result;
      }
    }
    // Pure Tier 2: GPT structures from brand knowledge
    const t2direct = await callTier2(null, `Brand: ${brandName}, Model: ${modelNumber}. Extract any product information you know.`);
    if (t2direct) {
      result.data = t2direct; result.status = 'partial'; result.tier_used = 2; result.cost = t2direct._cost || 0;
      renderResults();
      return result;
    }
  }

  // ── Tier 3: Last resort — Haiku + web search ──
  if (tier === 3 || (!result.data)) {
    const t3 = await callTier3(`${brandName} ${modelNumber}`, brandInfo);
    if (t3) {
      result.data = t3; result.status = t3.model ? 'ok' : 'partial'; result.tier_used = 3; result.cost = t3._cost || 0;
      renderResults();
      return result;
    }
  }

  result.status = 'fail';
  logEntry(`Failed to extract data for ${brandName} ${modelNumber}`, 'err');
  renderResults();
  return result;
}

/* ═══════════════════════════════════════════
   SAVE TO PIM
   ═══════════════════════════════════════════ */

async function saveToPim(resultIndex) {
  const r = scrapeResults[resultIndex];
  if (!r?.data) return;
  const d = r.data;

  logEntry(`Saving ${r.brand} ${r.model} to PIM...`);

  // Find brand_id from brand_catalog
  const { data: brandRow } = await sb.from('brand_catalog').select('id').ilike('name', r.brand).maybeSingle();

  const record = {
    brand_name: d.brand_name || r.brand,
    manufacturer_name: d.manufacturer_name || d.brand_name || r.brand,
    model: d.model || r.model,
    product_line: d.product_line || null,
    category: d.category || null,
    short_description: d.short_description || d.product_name || null,
    long_description: d.long_description || null,
    msrp: d.msrp || null,
    price_currency: d.currency || 'CAD',
    color: d.color || null,
    finish: d.finish || null,
    width_inches: d.width_inches || null,
    height_inches: d.height_inches || null,
    depth_inches: d.depth_inches || null,
    weight_lbs: d.weight_lbs || null,
    capacity_cu_ft: d.capacity_cu_ft || null,
    voltage: d.voltage || null,
    amperage: d.amperage || null,
    wattage: d.wattage || null,
    energy_star: d.energy_star || null,
    specs_json: d.specs || null,
    source_type: 'scraper_v2',
    source_reference: d.source_url || r.url || null,
    source_confidence: r.tier_used === 1 ? 0.95 : r.tier_used === 2 ? 0.80 : 0.65,
    source_extracted_at: new Date().toISOString(),
    source_review_status: 'pending',
    market: 'CA',
    status: 'active',
    brand_id: brandRow?.id || null
  };

  const { data: saved, error } = await sb.from('aiq_products').upsert(record, { onConflict: 'model,brand_name' }).select().single();
  if (error) {
    logEntry('Save error: ' + error.message, 'err');
    // Fallback: insert without upsert
    const { data: saved2, error: e2 } = await sb.from('aiq_products').insert(record).select().single();
    if (e2) { logEntry('Insert also failed: ' + e2.message, 'err'); return; }
    r._saved = true;
    logEntry(`Saved as new product (ID: ${saved2.id})`, 'ok');
  } else {
    r._saved = true;
    logEntry(`Saved/updated product (ID: ${saved?.id})`, 'ok');
  }
  renderResults();
}

/* ═══════════════════════════════════════════
   UI RENDERING
   ═══════════════════════════════════════════ */

function renderTab() {
  const el = document.getElementById('mainContent');
  if (currentTab === 'discover') return renderDiscover(el);
  const tabNames = { 'price-sync': 'Price Sync', 'verify': 'Verify & Audit', 'enrich': 'Enrich & Complete' };
  const tabDescs = {
    'price-sync': 'Bulk update pricing from manufacturer sites and retailers. Track price changes, MAP violations, and competitive positioning.',
    'verify': 'Compare your PIM data against live manufacturer sites. Flag stale specs, discontinued models, and data drift.',
    'enrich': 'Fill gaps on existing products in your database — missing dimensions, specs, images, and descriptions.'
  };
  el.innerHTML = `<div class="placeholder-tab"><div class="icon">🚧</div><h2>${tabNames[currentTab]}</h2><p>${tabDescs[currentTab]}</p><p style="margin-top:8px;font-size:11px;color:var(--txt2)">Coming in a future update</p></div>`;
}

function renderDiscover(el) {
  const tierBadge = (tier) => {
    const t = TIER_LABELS[tier] || TIER_LABELS[3];
    return `<span class="tier-badge ${t.cls}">${t.icon} ${t.text}</span>`;
  };

  // Sort brands: T1 first, then T2, T3, then alpha
  const sorted = [...brands].sort((a, b) => (a.scrape_tier - b.scrape_tier) || a.brand_name.localeCompare(b.brand_name));

  // Brand option list for select
  const brandOpts = sorted.map(b => {
    const t = TIER_LABELS[b.scrape_tier] || TIER_LABELS[3];
    return `<option value="${b.brand_name}" ${selectedBrand===b.brand_name?'selected':''}>${t.icon} ${b.brand_name} (Tier ${b.scrape_tier})</option>`;
  }).join('');

  // Stats
  const total = scrapeResults.length;
  const ok = scrapeResults.filter(r => r.status === 'ok').length;
  const partial = scrapeResults.filter(r => r.status === 'partial').length;
  const failed = scrapeResults.filter(r => r.status === 'fail').length;

  el.innerHTML = `
    ${total > 0 ? `
    <div class="stats-row">
      <div class="stat-card"><div class="label">Scraped</div><div class="value">${total}</div></div>
      <div class="stat-card"><div class="label">Complete</div><div class="value green">${ok}</div></div>
      <div class="stat-card"><div class="label">Partial</div><div class="value amber">${partial}</div></div>
      <div class="stat-card"><div class="label">Failed</div><div class="value red">${failed}</div></div>
      <div class="stat-card"><div class="label">Session Cost</div><div class="value">$${sessionCostTotal.toFixed(4)}</div></div>
    </div>
    ` : ''}

    <div class="controls">
      <div class="mode-toggle">
        <button class="${discoverMode==='single'?'active':''}" onclick="setDiscoverMode('single')">Single</button>
        <button class="${discoverMode==='batch'?'active':''}" onclick="setDiscoverMode('batch')">Batch</button>
        <button class="${discoverMode==='browse'?'active':''}" onclick="setDiscoverMode('browse')">Browse Brands</button>
      </div>
    </div>

    ${discoverMode === 'single' ? `
    <div class="controls">
      <div class="field">
        <label>Brand</label>
        <select id="brandSelect" onchange="selectBrand(this.value)">
          <option value="">— Select brand —</option>
          ${brandOpts}
        </select>
      </div>
      <div class="field">
        <label>Model Number</label>
        <input type="text" id="modelInput" placeholder="e.g.DERA70EP3SS" onkeydown="if(event.key==='Enter')window.doScrape()"/>
      </div>
      <button class="btn btn-primary" onclick="window.doScrape()" ${isProcessing?'disabled':''}>
        ${isProcessing ? '⏳ Scraping...' : '🔍 Scrape'}
      </button>
    </div>
    <div class="controls" style="margin-top:-8px">
      <div class="field">
        <label>Or paste a URL directly</label>
        <input type="text" id="urlInput" placeholder="https://www.lg.com/ca_en/refrigerators/..." style="min-width:420px"/>
      </div>
      <button class="btn btn-secondary" onclick="window.doUrlScrape()" ${isProcessing?'disabled':''}>Scrape URL</button>
    </div>
    ` : discoverMode === 'batch' ? `
    <div class="controls">
      <div class="field">
        <label>Brand</label>
        <select id="brandSelect" onchange="selectBrand(this.value)">
          <option value="">— Select brand —</option>
          ${brandOpts}
        </select>
      </div>
      <div class="field" style="flex:1">
        <label>Model Numbers (one per line)</label>
        <textarea id="batchInput" rows="5" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;color:var(--txt);font-size:13px;font-family:inherit;resize:vertical;width:100%" placeholder="LRMVS3006S&#10;LRFXS2503S&#10;LRMVS2806S"></textarea>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" onclick="window.doBatchScrape()" ${isProcessing?'disabled':''}>
        ${isProcessing ? '⏳ Processing...' : '🚀 Scrape Batch'}
      </button>
      <span style="font-size:12px;color:var(--txt2)">Processes sequentially with 1s delay between</span>
    </div>
    ` : `
    <div class="brand-grid">
      ${sorted.map(b => `
        <div class="brand-card ${selectedBrand===b.brand_name?'selected':''}" onclick="selectBrand('${b.brand_name.replace(/'/g,"\\'")}')">
          <div>
            <div class="name">${b.brand_name}</div>
            <div style="font-size:11px;color:var(--txt2);margin-top:2px">${b.parent_company||''}</div>
          </div>
          <div class="meta">
            ${tierBadge(b.scrape_tier)}
            ${b.server_fetchable ? '<span style="font-size:10px;color:var(--accent)">✓ fetch</span>' : '<span style="font-size:10px;color:var(--red)">✕ blocked</span>'}
          </div>
        </div>
      `).join('')}
    </div>
    `}

    <div class="settings-row">
      <label><input type="checkbox" ${autoSave?'checked':''} onchange="toggleAutoSave()"/> Auto-save to PIM</label>
      <label>Tier 2 model:
        <select onchange="setAiModel(this.value)">
          <option value="gpt-4.1-mini" ${aiModel==='gpt-4.1-mini'?'selected':''}>GPT-4.1 Mini ($0.002)</option>
          <option value="gpt-4.1-nano" ${aiModel==='gpt-4.1-nano'?'selected':''}>GPT-4.1 Nano ($0.001)</option>
        </select>
      </label>
      <label style="margin-left:auto">
        <button class="btn btn-sm btn-secondary" onclick="window.setApiKeys()">🔑 API Keys</button>
      </label>
    </div>

    <div class="log-panel ${scrapeResults.length > 0 ? 'show' : ''}" id="scrapeLog"></div>

    ${scrapeResults.length > 0 ? `
    <div class="results-panel">
      <div class="results-header">
        <h3>Results (${scrapeResults.length})</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-secondary" onclick="window.exportResults()">📋 Export JSON</button>
          <button class="btn btn-sm btn-danger" onclick="scrapeResults=[];sessionCostTotal=0;document.getElementById('sessionCost').textContent='$0.00';renderTab()">Clear</button>
        </div>
      </div>
      <div class="results-body">
        ${scrapeResults.map((r, i) => renderResultRow(r, i)).join('')}
      </div>
    </div>
    ` : `
    <div style="text-align:center;padding:60px 0;color:var(--txt2)">
      <div style="font-size:36px;margin-bottom:12px;opacity:.3">🔍</div>
      <div style="font-size:14px;font-weight:600">No results yet</div>
      <div style="font-size:12px;margin-top:4px">Select a brand and enter a model number to start scraping</div>
    </div>
    `}
  `;
}

function renderResultRow(r, i) {
  const tierInfo = TIER_LABELS[r.tier_used] || { text:'—', cls:'t3', icon:'' };
  const statusCls = r.status === 'ok' ? 'ok' : r.status === 'partial' ? 'partial' : r.status === 'fail' ? 'fail' : 'pending';
  const detail = r.data
    ? [r.data.product_name, r.data.short_description, r.data.category].filter(Boolean).join(' · ')
    : r.status === 'pending' ? 'Extracting...' : 'No data found';
  const specs = r.data?.specs ? Object.keys(r.data.specs).length : 0;
  const price = r.data?.msrp ? `$${r.data.msrp.toLocaleString()}` : '';

  return `
    <div class="result-row">
      <div class="status ${statusCls}"></div>
      <div class="info">
        <div class="model-num">${r.model || r.data?.model || '—'} <span class="brand-label">${r.brand || r.data?.brand_name || ''}</span></div>
        <div class="detail">${detail}</div>
        ${specs > 0 || price ? `<div class="detail">${specs > 0 ? `${specs} specs` : ''}${specs > 0 && price ? ' · ' : ''}${price}</div>` : ''}
      </div>
      <span class="tier-used tier-badge ${tierInfo.cls}">${tierInfo.icon} T${r.tier_used || '?'}</span>
      <div class="cost">${r.cost > 0 ? '$' + r.cost.toFixed(4) : 'FREE'}</div>
      <div class="actions">
        ${r.data ? `<button class="btn btn-sm btn-secondary" onclick="window.viewResult(${i})">View</button>` : ''}
        ${r.data && !r._saved ? `<button class="btn btn-sm btn-primary" onclick="window.saveResult(${i})">Save</button>` : ''}
        ${r._saved ? `<span style="font-size:11px;color:var(--accent);font-weight:600">✓ Saved</span>` : ''}
      </div>
    </div>
  `;
}

function renderResults() { renderTab(); }

/* ═══════════════════════════════════════════
   ACTION HANDLERS
   ═══════════════════════════════════════════ */

window.doScrape = async function() {
  const brand = document.getElementById('brandSelect')?.value || selectedBrand;
  const model = document.getElementById('modelInput')?.value?.trim();
  if (!brand || !model) { alert('Select a brand and enter a model number'); return; }
  isProcessing = true;
  renderTab();
  await smartScrape(brand, model, null);
  isProcessing = false;
  renderTab();
};

window.doUrlScrape = async function() {
  const url = document.getElementById('urlInput')?.value?.trim();
  if (!url || !url.startsWith('http')) { alert('Paste a valid URL'); return; }
  const brand = document.getElementById('brandSelect')?.value || selectedBrand || 'Unknown';
  isProcessing = true;
  renderTab();
  await smartScrape(brand, '', url);
  isProcessing = false;
  renderTab();
};

window.doBatchScrape = async function() {
  const brand = document.getElementById('brandSelect')?.value || selectedBrand;
  const raw = document.getElementById('batchInput')?.value?.trim();
  if (!brand || !raw) { alert('Select a brand and enter model numbers'); return; }
  const models = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (models.length === 0) return;
  isProcessing = true;
  renderTab();
  for (const m of models) {
    await smartScrape(brand, m, null);
    if (models.indexOf(m) < models.length - 1) {
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  isProcessing = false;
  renderTab();
};

window.viewResult = function(i) {
  const r = scrapeResults[i];
  if (!r?.data) return;
  const d = r.data;
  const tierInfo = TIER_LABELS[r.tier_used] || TIER_LABELS[3];

  document.getElementById('modalTitle').textContent = d.product_name || d.model || 'Product Details';

  let html = '';

  // Summary
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">`;
  const fields = [
    ['Brand', d.brand_name], ['Model', d.model], ['Category', d.category],
    ['MSRP', d.msrp ? '$' + d.msrp.toLocaleString() : null], ['Color', d.color], ['Finish', d.finish],
    ['Width', d.width_inches ? d.width_inches + '"' : null], ['Height', d.height_inches ? d.height_inches + '"' : null],
    ['Depth', d.depth_inches ? d.depth_inches + '"' : null], ['Weight', d.weight_lbs ? d.weight_lbs + ' lbs' : null],
    ['Capacity', d.capacity_cu_ft ? d.capacity_cu_ft + ' cu.ft.' : null], ['Availability', d.availability],
    ['Tier Used', `T${r.tier_used} ${tierInfo.text}`], ['Cost', r.cost > 0 ? '$' + r.cost.toFixed(4) : 'FREE'],
    ['Source', d.source_url ? `<a href="${d.source_url}" target="_blank" style="color:var(--blue)">${new URL(d.source_url).hostname}</a>` : null]
  ].filter(([_, v]) => v);
  for (const [k, v] of fields) {
    html += `<div class="spec-item"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  }
  html += `</div>`;

  // Description
  if (d.short_description) {
    html += `<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin-bottom:6px">Description</div><div style="font-size:13px;color:var(--txt);line-height:1.5">${d.short_description}</div></div>`;
  }

  // Specs
  if (d.specs && Object.keys(d.specs).length > 0) {
    html += `<div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin-bottom:8px">Specifications (${Object.keys(d.specs).length})</div>`;
    html += `<div class="spec-grid">`;
    for (const [k, v] of Object.entries(d.specs)) {
      html += `<div class="spec-item"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    }
    html += `</div>`;
  }

  // Images
  if (d.images?.length > 0) {
    html += `<div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin:16px 0 8px">Images (${d.images.length})</div>`;
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap">`;
    for (const img of d.images.slice(0, 6)) {
      html += `<a href="${img.url}" target="_blank"><img src="${img.url}" style="height:80px;border-radius:6px;border:1px solid var(--line);object-fit:cover" onerror="this.style.display='none'"/></a>`;
    }
    html += `</div>`;
  }

  // Features
  if (d.features?.length > 0) {
    html += `<div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin:16px 0 8px">Features</div>`;
    html += `<div style="font-size:12px;color:var(--txt);line-height:1.8">${d.features.map(f => '• ' + f).join('<br>')}</div>`;
  }

  // Raw JSON toggle
  html += `<details style="margin-top:16px"><summary style="font-size:11px;color:var(--txt2);cursor:pointer;font-weight:600">Raw JSON</summary><pre style="background:var(--surface);padding:12px;border-radius:8px;font-size:11px;color:var(--txt);overflow-x:auto;margin-top:8px;max-height:300px">${JSON.stringify(d, null, 2)}</pre></details>`;

  document.getElementById('modalBody').innerHTML = html;

  // Footer
  document.getElementById('modalFoot').innerHTML = r._saved
    ? `<span style="color:var(--accent);font-size:13px;font-weight:600">✓ Saved to PIM</span><button class="btn btn-secondary" onclick="closeModal()">Close</button>`
    : `<button class="btn btn-secondary" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="window.saveResult(${i});closeModal()">Save to PIM</button>`;

  document.getElementById('modalOverlay').classList.add('open');
};

window.saveResult = function(i) { saveToPim(i); };

window.exportResults = function() {
  const data = scrapeResults.filter(r => r.data).map(r => r.data);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pim-scraper-export-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
};

window.setApiKeys = function() {
  const openaiKey = prompt('OpenAI API Key (for Tier 2 GPT):', localStorage.getItem('aiq_openai_key') || '');
  if (openaiKey !== null) localStorage.setItem('aiq_openai_key', openaiKey);
  const anthropicKey = prompt('Anthropic API Key (for Tier 3 Haiku):', localStorage.getItem('aiq_anthropic_key') || '');
  if (anthropicKey !== null) localStorage.setItem('aiq_anthropic_key', anthropicKey);
};

/* ═══════════════════════════════════════════
   INIT: Load brands from scraper_brand_sources
   ═══════════════════════════════════════════ */

async function init() {
  const { data, error } = await sb.from('scraper_brand_sources')
    .select('brand_name, parent_company, scrape_tier, server_fetchable, has_json_ld, has_spec_tables, bot_protection, url_pattern, url_pattern_type, sitemap_url, sells_direct')
    .order('scrape_tier').order('brand_name');
  if (error) { console.error('Failed to load brands:', error); return; }
  brands = data || [];
  document.getElementById('brandCount').textContent = brands.length;
  renderTab();
}

init();
</script>
