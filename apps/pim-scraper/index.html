async function retailerPriceCheck(query, country) {
  const prompt = country === "US" ? RETAILER_PRICE_PROMPT_US : RETAILER_PRICE_PROMPT;
  const suffix = country === "US" ? " — check US retailers, prices in USD" : " — check Canadian retailers, prices in CAD";
  const result = await callClaude(prompt, "Find retail prices for: " + query + suffix, 2, "claude-sonnet-4-6");
  if (result.found || result.retailers) { result.found = true; result._retailerCheck = true; result._country = country || "CA"; return result; }
  return { found: false, query, error: result.error || "Retailer price check failed", _retailerCheck: true, _country: country || "CA" };
}

function supaFetch(path, opts = {}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: opts.prefer || "return=representation",
      ...opts.headers,
    },
  });
}

function extractJSON(text) {
  // Try direct parse first
  try { return JSON.parse(text.trim()); } catch {}
  // Strip markdown fences
  const stripped = text.replace(/```json\s*/g, "").replace(/```\s*/g, "").trim();
  try { return JSON.parse(stripped); } catch {}
  // Find the first { ... } block
  const start = stripped.indexOf("{");
  const end = stripped.lastIndexOf("}");
  if (start !== -1 && end > start) {
    try { return JSON.parse(stripped.slice(start, end + 1)); } catch {}
  }
  return null;
}

async function callClaude(systemPrompt, userMsg, retries = 3, modelOverride = null) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const headers = { "Content-Type": "application/json" };
      if (ANTHROPIC_API_KEY) {
        headers["x-api-key"] = ANTHROPIC_API_KEY;
        headers["anthropic-version"] = "2023-06-01";
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: modelOverride || "claude-haiku-4-5-20251001",
          max_tokens: 8000,
          system: systemPrompt,
          messages: [{ role: "user", content: userMsg }],
          tools: [{ type: "web_search_20250305", name: "web_search" }],
        }),
      });
      // Rate limited — wait and retry
      if (res.status === 429) {
        const wait = Math.min(15000, 5000 * (attempt + 1));
        if (attempt < retries) { await new Promise(r => setTimeout(r, wait)); continue; }
        return { found: false, error: "Rate limited — try again in a minute" };
      }
      // Overloaded
      if (res.status === 529 || res.status === 503) {
        if (attempt < retries) { await new Promise(r => setTimeout(r, 8000)); continue; }
        return { found: false, error: "API overloaded — try again shortly" };
      }
      if (!res.ok) {
        const errText = await res.text();
        if (attempt < retries) { await new Promise(r => setTimeout(r, 4000)); continue; }
        return { found: false, error: "API error " + res.status + ": " + errText.slice(0, 200) };
      }
      const data = await res.json();
      const allText = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n");
      const parsed = extractJSON(allText);
      if (parsed && (parsed.found === true || parsed.model || parsed.brand_name)) {
        parsed.found = true;
        return parsed;
      }
      if (attempt < retries) {
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
      return { found: false, error: "Could not parse product data from response", raw: allText.slice(0, 500) };
    } catch (e) {
      if (attempt < retries) { await new Promise(r => setTimeout(r, 4000)); continue; }
      return { found: false, error: e.message };
    }
  }
}

async function scrapeProduct(query) {
  let result = await callClaude(SCRAPE_PROMPT, "Find all product specifications for: " + query);
  if (result.found) return result;
  const fallbackPrompt = "Search the web for this appliance product and return a JSON object with the product data. Search for the manufacturer's website specifically. Return ONLY valid JSON, no other text.\n\nThe JSON must have: found (true/false), source_url, manufacturer_name, brand_name, model, category, short_description, msrp, finish, color, available_colors (array of {color, finish, model_number, msrp}), width_inches, height_inches, depth_inches, weight_lbs, energy_star, features (array of strings), images (array of {url, type, alt}), specs (object with capacity_cu_ft, voltage, amperage, installation_type etc).\n\nReturn ALL image URLs from the product gallery. Return ALL color/finish options.";
  result = await callClaude(fallbackPrompt, query + " — search the manufacturer website for full specs, all images, all colors, and MSRP price");
  if (result.found) return result;
  return { found: false, query, error: result.error || "Product not found after multiple attempts" };
}

async function priceCheckProduct(query) {
  const result = await callClaude(PRICE_CHECK_PROMPT, "Check current pricing and availability for: " + query, 2);
  if (result.found || result.pricing) { result.found = true; result._priceOnly = true; return result; }
  return { found: false, query, error: result.error || "Price check failed", _priceOnly: true };
}

  const colors = { accent: { bg: palette.accentSoft, fg: palette.accentText }, green: { bg: palette.greenSoft, fg: palette.green }, red: { bg: palette.redSoft, fg: palette.red }, yellow: { bg: palette.yellowSoft, fg: palette.yellow } };
  const c = colors[color] || colors.accent;
  return <span style={{ ...s.badge, background: c.bg, color: c.fg }}>{children}</span>;
}

function Field({ label, value, editable, onChange }) {
  if (value === null || value === undefined || value === "") return null;
  return (
    <div>
      <div style={s.label}>{label}</div>
      {editable ? (
        <input style={{ ...s.input, padding: "6px 10px", fontSize: 13 }} value={value ?? ""} onChange={(e) => onChange(e.target.value)} />
      ) : (
        <div style={s.val}>{typeof value === "boolean" ? (value ? "Yes" : "No") : String(value)}</div>
      )}
    </div>
  );
}

        {data.error && <div style={{ color: palette.textDim, fontSize: 13, marginTop: 8 }}>{data.error}</div>}

    </div>

}

  // Retailer price save — saves each retailer's price as a row
  const doRetailerSave = async (data) => {
    try {
      const model = data.model;
      const brand = data.brand_name;
      const country = data._country || retailerCountry || "CA";
      if (!model || !brand || !data.retailers || !data.retailers.length) return false;
      
      // Try to find product_id
      let productId = null;
      try {
        const checkRes = await supaFetch("aiq_products?model=eq." + encodeURIComponent(model) + "&brand_name=eq." + encodeURIComponent(brand) + "&select=id");
        const existing = await checkRes.json();
        if (existing && existing.length) productId = existing[0].id;
      } catch(e) {}

      // Also update aiq_products with lowest price and condition
      let lowestPrice = null;
      let lowestSource = "";
      let anyDiscontinued = false;
      let replacementModel = null;
      for (const r of data.retailers) {
        if (r.price && (!lowestPrice || r.price < lowestPrice)) {
          lowestPrice = r.price;
          lowestSource = r.retailer;
        }
        if (r.condition === "discontinued") anyDiscontinued = true;
        if (r.stock_note && r.stock_note.toLowerCase().includes("replaced by")) {
          const match = r.stock_note.match(/replaced by\s+(\S+)/i);
          if (match) replacementModel = match[1];
        }
      }

      for (const r of data.retailers) {
        await supaFetch("pim_retailer_prices", { method: "POST", body: JSON.stringify({
          product_id: productId,
          brand_name: brand,
          model: model,
          retailer_name: r.retailer,
          retailer_url: r.url ? r.url.split("/").slice(0,3).join("/") : null,
          product_url: r.url || null,
          price: r.price ? parseFloat(r.price) : null,
          regular_price: r.regular_price ? parseFloat(r.regular_price) : null,
          on_sale: r.on_sale || false,
          sale_label: r.sale_label || null,
          in_stock: r.in_stock,
          stock_note: r.stock_note || null,
          condition: r.condition || "new",
          is_open_box: r.is_open_box || false,
          is_clearance: r.is_clearance || false,
          is_refurbished: r.is_refurbished || false,
          is_floor_model: r.is_floor_model || false,
          shipping_available: r.shipping_available,
          free_delivery: r.free_delivery || false,
          shipping_cost: r.shipping_cost ? parseFloat(r.shipping_cost) : null,
          price_currency: country === "US" ? "USD" : "CAD",
          country: country,
        }), headers: { Prefer: "return=minimal" } }).catch(() => {});
      }

      // Update aiq_products with lowest price if we have a product_id
      if (productId && (lowestPrice || anyDiscontinued)) {
        const updates = {
          price_checked_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        if (lowestPrice) { updates.lowest_price = lowestPrice; updates.lowest_price_source = lowestSource; }
        if (anyDiscontinued) { updates.is_discontinued = true; updates.status = "discontinued"; }
        if (replacementModel) { updates.replacement_model = replacementModel; }
        await supaFetch("aiq_products?id=eq." + productId, { method: "PATCH", body: JSON.stringify(updates) }).catch(() => {});
      }

      setSaved(p => [...p, { model, action: data.retailers.length + " retailers checked", id: productId }]);
      saveCountRef.current.saved++;
      return true;
    } catch (e) {
      setErrors(p => [...p, "Retailer save " + (data.model || "") + ": " + e.message]);

      return false;

  const runScrape = async (q) => {
    try {
      const r = await scrapeProduct(q);

      return r;
    } catch (e) { return { found: false, query: q, error: e.message }; }
  };

  const scrapeAndMaybeSave = async (q) => {
    const r = await runScrape(q);
    if (r.found) {
      setResults(p => [...p, r]); // Always show the result
      if (autoSave) {
        const ok = await doSave(r);
        if (ok) {
          // Remove from results since it saved successfully
          setResults(p => p.filter(x => x !== r));
        }
        // If save failed, it stays in results so user can retry manually
      }
    } else {
      setResults(p => [...p, r]);
    }
    return r;
  };

  const handleSingle = async () => {

    await scrapeAndMaybeSave(query);
    setLoading(false);
  };

  const handleBulk = async () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    setLoading(true);
    abortRef.current = false;
    saveCountRef.current = { saved: 0, failed: 0 };
    for (let i = 0; i < lines.length; i++) {
      if (abortRef.current) break;
      setProgress({ current: i + 1, total: lines.length, currentQuery: lines[i] });
      await scrapeAndMaybeSave(lines[i]);
      if (i < lines.length - 1) await new Promise((r) => setTimeout(r, 6000));
    }
    setLoading(false);
  };

  const handleEnrichExisting = async () => {

    const incomplete = existingProducts.filter((p) => !p.width_inches || !p.msrp || !p.finish);
    if (!incomplete.length) { setErrors((p) => [...p, "All products already have specs"]); return; }
    const lines = incomplete.slice(0, 20).map((p) => `${p.brand_name} ${p.model}`);
    setBulkText(lines.join("\n"));
    setMode("bulk");
  };

  // ── Site Discovery ──
  const REFRIG_SUBCATS = ["french door refrigerators", "side-by-side refrigerators", "top freezer refrigerators", "bottom freezer refrigerators", "counter-depth refrigerators", "compact refrigerators"];
  const COOKING_SUBCATS = ["gas ranges", "electric ranges", "induction ranges", "double oven ranges", "slide-in ranges"];
  const LAUNDRY_SUBCATS = ["front load washers", "top load washers", "dryers", "washer dryer combos"];

  const getSubcats = (category) => {
    if (!category) return [""]; // search all
    const c = category.toLowerCase();
    if (c.includes("refrig")) return REFRIG_SUBCATS;
    if (c.includes("range")) return COOKING_SUBCATS;
    if (c.includes("washer") || c.includes("laundry")) return LAUNDRY_SUBCATS;
    return [category];
  };

  const handleDiscover = async () => {
    const brand = discoverBrand.trim();
    const category = discoverCategory.trim();
    const url = discoverUrl.trim();
    if (!brand && !url) return;
    
    setDiscoverPhase("discovering");
    setLoading(true);
    setDiscovered([]);
    setSelectedModels(new Set());
    
    let allProducts = [];

    if (url) {
      // Single URL discovery
      setProgress({ current: 1, total: 1, currentQuery: "Scanning page…" });
      const result = await callClaude(DISCOVER_PROMPT, `Find all product model numbers listed on: ${url}`);
      if (result.found && result.products) allProducts = result.products;
    } else {
      // Break into subcategory chunks to avoid overload
      const subcats = getSubcats(category);
      for (let i = 0; i < subcats.length; i++) {
        if (abortRef.current) break;
        const subcat = subcats[i];
        setProgress({ current: i + 1, total: subcats.length, currentQuery: `${brand} ${subcat || "all products"}` });
        
        const searchQuery = subcat
          ? `Find ALL ${brand} ${subcat} currently available on the ${brand} Canadian website. List every model number.`
          : `Find ALL ${brand} ${category || "appliance"} products on the ${brand} Canadian website. List every model number. Search each subcategory.`;
        
        const result = await callClaude(DISCOVER_PROMPT, searchQuery);
        if (result.found && result.products) {
          allProducts = [...allProducts, ...result.products];
        }
        if (i < subcats.length - 1) await new Promise(r => setTimeout(r, 6000));
      }
    }

    // Deduplicate by model number
    const seen = new Set();
    const deduped = [];
    for (const p of allProducts) {
      const key = p.model?.toUpperCase();
      if (key && !seen.has(key)) { seen.add(key); deduped.push(p); }
    }

    if (deduped.length > 0) {
      // Check which ones already exist in PIM
      if (!existingProducts.length) {
        try {
          const res = await supaFetch("aiq_products?select=model,brand_name&limit=1000");
          const ep = await res.json();
          setExistingProducts(ep || []);
        } catch {}
      }
      const existingModels = new Set(existingProducts.map(p => p.model?.toUpperCase()));
      const products = deduped.map(p => ({
        ...p,
        inPIM: existingModels.has(p.model?.toUpperCase()),
      }));
      setDiscovered(products);
      setSelectedModels(new Set(products.filter(p => !p.inPIM).map(p => p.model)));
      setDiscoverPhase("discovered");
    } else {
      setErrors(p => [...p, `No products found for ${brand} ${category}`]);
      setDiscoverPhase("idle");
    }
    setLoading(false);
  };

  const handleScrapeSelected = async () => {
    const toScrape = discovered.filter(p => selectedModels.has(p.model));
    if (!toScrape.length) return;
    
    setDiscoverPhase("scraping");
    setLoading(true);
    abortRef.current = false;
    saveCountRef.current = { saved: 0, failed: 0 };
    
    for (let i = 0; i < toScrape.length; i++) {
      if (abortRef.current) break;
      const p = toScrape[i];
      const q = p.url || `${discoverBrand} ${p.model}`;
      setProgress({ current: i + 1, total: toScrape.length, currentQuery: `${p.model} — ${p.name || ""}` });
      const r = await runScrape(q);
      if (r.found) {
        if (!r.model) r.model = p.model;
        if (!r.brand_name && discoverBrand) r.brand_name = discoverBrand;
        if (autoSave) {
          await doSave(r);
        } else {
          setResults(prev => [...prev, r]);
        }
      } else {
        setResults(prev => [...prev, r]);
      }
      if (i < toScrape.length - 1) await new Promise(r => setTimeout(r, 6000));
    }
    
    setLoading(false);
    setDiscoverPhase("discovered");
  };

  const toggleModel = (model) => {
    setSelectedModels(prev => {
      const next = new Set(prev);
      next.has(model) ? next.delete(model) : next.add(model);
      return next;
    });
  };

  const toggleAll = () => {
    const eligible = mode === "pricecheck" ? discovered : discovered.filter(p => !p.inPIM);
    if (selectedModels.size === eligible.length) {
      setSelectedModels(new Set());
    } else {
      setSelectedModels(new Set(eligible.map(p => p.model)));
    }
  };

  const missCount = existingProducts.filter((p) => !p.width_inches || !p.msrp || !p.finish).length;

  return (
    <div style={s.app}>
      <style>{`@keyframes spin { to { transform: rotate(360deg) } } ::placeholder { color: ${palette.textMuted} } input:focus, textarea:focus { border-color: ${palette.accent} }`}</style>

      <div style={s.header}>
        <div style={s.logo}>PIM <span style={s.logoAccent}>Scraper</span></div>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ display: "flex", gap: 4 }}>
            {[["single", "Single"], ["bulk", "Bulk"], ["discover", "🌐 Site Scrape"], ["pricecheck", "💰 Price Check"], ["retailer", "🏪 Retailer Prices"], ["intel", "🔎 Intelligence"], ["existing", "Enrich Existing"]].map(([m, label]) => (
              <button key={m} style={{ ...s.tab, ...(mode === m ? s.tabActive : {}) }} onClick={() => { setMode(m); if (m === "existing") loadExisting(); }}>{label}</button>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", background: autoSave ? palette.greenSoft : palette.card, border: `1px solid ${autoSave ? palette.green + "40" : palette.border}`, borderRadius: 8, cursor: "pointer" }}
            onClick={() => setAutoSave(!autoSave)}>
            <div style={{ width: 36, height: 20, borderRadius: 10, background: autoSave ? palette.green : palette.border, position: "relative", transition: "background 0.2s" }}>
              <div style={{ width: 16, height: 16, borderRadius: 8, background: "#fff", position: "absolute", top: 2, left: autoSave ? 18 : 2, transition: "left 0.2s" }} />
            </div>
            <span style={{ fontSize: 12, fontWeight: 600, color: autoSave ? palette.green : palette.textMuted }}>Auto-save to PIM</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {showKeyInput ? (
              <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                <input style={{ ...s.input, width: 220, padding: "6px 10px", fontSize: 11 }} type="password"
                  placeholder="Anthropic API key (sk-ant-...)" value={apiKey}
                  onChange={e => setApiKey(e.target.value)} />
                <button style={{ ...s.btn, ...s.btnSm, padding: "6px 10px", fontSize: 11 }} onClick={() => {
                  ANTHROPIC_API_KEY = apiKey;
                  try { localStorage.setItem("aiq_anthropic_key", apiKey); } catch(e) {}
                  setShowKeyInput(false);
                }}>Save</button>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }} onClick={() => setShowKeyInput(true)}>
                <div style={{ width: 8, height: 8, borderRadius: 4, background: apiKey ? palette.green : palette.yellow }} />
                <span style={{ fontSize: 11, color: palette.textDim }}>{apiKey ? "API Key Set" : "No API Key"}</span>
              </div>
            )}
          </div>
        </div>
      </div>

      <div style={s.main}>
        {/* Stats row */}
        {(saved.length > 0 || results.length > 0) && (
          <div style={{ display: "flex", gap: 32, marginBottom: 24, alignItems: "center" }}>
            <div style={s.stat}><div style={s.statNum}>{results.filter((r) => r.found).length}</div><div style={s.statLabel}>Pending review</div></div>
            <div style={s.stat}><div style={{ ...s.statNum, color: palette.green }}>{saved.length}</div><div style={s.statLabel}>Saved to PIM</div></div>
            <div style={s.stat}><div style={{ ...s.statNum, color: palette.red }}>{results.filter((r) => !r.found).length}</div><div style={s.statLabel}>Not found</div></div>
            {results.filter(r => r.found).length > 0 && (
              <button style={{ ...s.btn, ...s.btnGreen, marginLeft: "auto" }}
                onClick={async () => {
                  const found = results.filter(r => r.found);
                  for (const r of found) { await doSave(r); }
                  setResults(prev => prev.filter(r => !r.found));
                }}>
                Save All {results.filter(r => r.found).length} to PIM
              </button>
            )}
            {results.length > 0 && (
              <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }}
                onClick={() => setResults([])}>
                Clear All
              </button>
            )}
          </div>
        )}

        {/* Input area */}
        {mode === "single" && (
          <div style={s.inputRow}>
            <input style={s.input} placeholder="Brand + Model (e.g. Whirlpool WRF555SDFZ) or product page URL" value={query} onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && !loading && handleSingle()} />
            <button style={s.btn} onClick={handleSingle} disabled={loading}>
              {loading ? <span style={s.spinner} /> : "Scrape"}
            </button>
          </div>
        )}

        {mode === "bulk" && (
          <div style={{ marginBottom: 24 }}>
            <textarea style={s.textarea} rows={6} placeholder={"One product per line:\nWhirlpool WRF555SDFZ\nKitchenAid KRFC704FPS\nMaytag MFI2570FEZ"} value={bulkText} onChange={(e) => setBulkText(e.target.value)} />
            <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "center" }}>
              <button style={s.btn} onClick={handleBulk} disabled={loading}>
                {loading ? `Scraping ${progress.current}/${progress.total}…` : `Scrape ${bulkText.split("\n").filter(Boolean).length} Products`}
              </button>
              {loading && <button style={{ ...s.btn, ...s.btnOutline }} onClick={() => { abortRef.current = true; }}>Stop</button>}
              {loading && <span style={{ fontSize: 13, color: palette.textDim }}>{progress.currentQuery}</span>}
            </div>
          </div>
        )}

        {mode === "existing" && (
          <div style={{ ...s.card, marginBottom: 24 }}>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 8 }}>Enrich Existing Products</div>
            <div style={{ fontSize: 13, color: palette.textDim, marginBottom: 16 }}>
              {existingProducts.length} products in PIM{missCount > 0 && <>, <span style={{ color: palette.yellow }}>{missCount} missing specs</span></>}
            </div>
            {missCount > 0 && (
              <button style={s.btn} onClick={handleEnrichExisting}>
                Scrape top 20 incomplete products
              </button>
            )}
            {existingProducts.length > 0 && (
              <div style={{ marginTop: 16, maxHeight: 300, overflow: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ borderBottom: `1px solid ${palette.border}` }}>
                    {["Brand","Model","Category","Width","MSRP","Finish","Status"].map((h) => (
                      <th key={h} style={{ padding: "6px 8px", textAlign: "left", color: palette.textMuted, fontWeight: 500 }}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>{existingProducts.map((p) => (
                    <tr key={p.id} style={{ borderBottom: `1px solid ${palette.border}20` }}>
                      <td style={{ padding: "6px 8px" }}>{p.brand_name}</td>
                      <td style={{ padding: "6px 8px", fontFamily: "monospace", fontSize: 11 }}>{p.model}</td>
                      <td style={{ padding: "6px 8px" }}>{p.category}</td>
                      <td style={{ padding: "6px 8px", color: p.width_inches ? palette.green : palette.red }}>{p.width_inches || "—"}</td>
                      <td style={{ padding: "6px 8px", color: p.msrp ? palette.green : palette.red }}>{p.msrp ? `$${p.msrp}` : "—"}</td>
                      <td style={{ padding: "6px 8px", color: p.finish ? palette.green : palette.red }}>{p.finish || "—"}</td>
                      <td style={{ padding: "6px 8px" }}><Badge color={p.status === "active" ? "green" : "yellow"}>{p.status}</Badge></td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* Price Check mode */}
        {mode === "pricecheck" && (
          <div style={{ marginBottom: 24 }}>
            <div style={s.card}>
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>💰 Price Check & Condition Update</div>
              <div style={{ fontSize: 13, color: palette.textDim, marginBottom: 16 }}>
                Updates ONLY pricing and condition flags — no specs, images, or docs. ~10x cheaper than full scrape.
              </div>

              {/* Sub-mode tabs */}
              <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>
                {[["pc-single","Single"],["pc-bulk","Bulk"],["pc-site","🌐 Site Check"]].map(([m,label]) => (
                  <button key={m} style={{ ...s.tab, ...(priceMode === m ? s.tabActive : {}) }} onClick={() => setPriceMode(m)}>{label}</button>
                ))}
              </div>

              {/* Single price check */}
              {priceMode === "pc-single" && (
                <div>
                  <div style={s.inputRow}>
                    <input style={s.input} placeholder="Brand + Model (e.g. LG LRMVS3006S) or product page URL" value={query} onChange={e => setQuery(e.target.value)}
                      onKeyDown={e => { if(e.key==="Enter"&&!loading){ setLoading(true); setProgress({current:1,total:1,currentQuery:query}); priceCheckProduct(query).then(r=>{if(r.found){r.query=query;if(!r.brand_name)r.brand_name=query.split(" ")[0];if(!r.model)r.model=query.split(" ").slice(1).join(" ");if(autoSave){doPriceSave(r).then(ok=>{if(!ok)setResults(p=>[...p,r]);})}else setResults(p=>[...p,r])}else setResults(p=>[...p,{...r,query}]);setLoading(false)})}}} />
                    <button style={{ ...s.btn, background: "#e17055" }} disabled={loading} onClick={async () => {
                      if(!query.trim())return; setLoading(true);
                      setProgress({current:1,total:1,currentQuery:query});
                      const r=await priceCheckProduct(query); r.query=query;
                      if(r.found){if(!r.brand_name)r.brand_name=query.split(" ")[0];if(!r.model)r.model=query.split(" ").slice(1).join(" ");if(autoSave){const ok=await doPriceSave(r);if(!ok)setResults(p=>[...p,r])}else setResults(p=>[...p,r])}else setResults(p=>[...p,r]);
                      setLoading(false);
                    }}>{loading?"Checking…":"💰 Check Price"}</button>
                  </div>
                </div>
              )}

              {/* Bulk price check */}
              {priceMode === "pc-bulk" && (
                <div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
                    <button style={{ ...s.btn, ...s.btnSm }} onClick={async () => {
                      if (!existingProducts.length) await loadExisting();
                      setBulkText(existingProducts.map(p => p.brand_name + " " + p.model).join("\n"));
                    }}>Load All PIM Products ({existingProducts.length || "…"})</button>
                    <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={async () => {
                      if (!existingProducts.length) await loadExisting();
                      setBulkText(existingProducts.filter(p => !p.msrp).map(p => p.brand_name + " " + p.model).join("\n"));
                    }}>Missing Prices Only</button>
                  </div>
                  <textarea style={s.textarea} rows={6} placeholder={"One per line — model numbers or URLs:\nLG LRMVS3006S\nhttps://www.lg.com/ca_en/refrigerators/LRMVS3006S/\nWhirlpool WRF555SDFZ"} value={bulkText} onChange={e => setBulkText(e.target.value)} />
                  <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "center" }}>
                    <button style={{ ...s.btn, background: "#e17055" }} disabled={loading} onClick={async () => {
                      const lines = bulkText.split("\n").map(l => l.trim()).filter(Boolean);
                      if (!lines.length) return;
                      setLoading(true); abortRef.current = false; saveCountRef.current = { saved: 0, failed: 0 };
                      for (let i = 0; i < lines.length; i++) {
                        if (abortRef.current) break;
                        setProgress({ current: i + 1, total: lines.length, currentQuery: lines[i] });
                        try {
                          const r = await priceCheckProduct(lines[i]);
                          if (r.found) {
                            if (!r.brand_name) r.brand_name = lines[i].split(" ")[0];
                            if (!r.model) r.model = lines[i].split(" ").slice(1).join(" ");
                            if (autoSave) { const ok = await doPriceSave(r); if (!ok) setResults(p => [...p, r]); }
                            else setResults(p => [...p, r]);
                          } else setResults(p => [...p, { ...r, query: lines[i] }]);
                        } catch (e) { setErrors(p => [...p, "Price check " + lines[i] + ": " + e.message]); }
                        if (i < lines.length - 1) await new Promise(r => setTimeout(r, 3000));
                      }
                      setLoading(false);
                    }}>
                      {loading ? "Checking " + progress.current + "/" + progress.total + "…" : "💰 Check " + bulkText.split("\n").filter(Boolean).length + " Products"}
                    </button>
                    {loading && <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={() => { abortRef.current = true; }}>Stop</button>}
                    {loading && <span style={{ fontSize: 13, color: palette.textDim }}>{progress.currentQuery}</span>}
                  </div>
                </div>
              )}

              {/* Site-level price check */}
              {priceMode === "pc-site" && (
                <div>
                  <div style={{ ...s.label, marginBottom: 8 }}>Brand ({allBrands.length})</div>
                  <input style={{ ...s.input, marginBottom: 8 }} placeholder="Search brands…" value={brandSearch} onChange={e => setBrandSearch(e.target.value)} />
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16, maxHeight: brandSearch ? 200 : 80, overflow: "auto" }}>
                    {allBrands.filter(b => !brandSearch || b.brand_name.toLowerCase().includes(brandSearch.toLowerCase())).map(b => (
                      <button key={b.brand_name} onClick={() => { setDiscoverBrand(b.brand_name); setDiscoverCategory(""); setDiscoverUrl(""); setDiscoverPhase("idle"); setDiscovered([]); setBrandSearch(""); }}
                        style={{ ...s.btn, ...s.btnSm, ...(discoverBrand === b.brand_name ? {} : { ...s.btnOutline }), padding: "5px 10px", fontSize: 11 }}>
                        {b.brand_name}
                      </button>
                    ))}
                  </div>

                  {discoverBrand && (
                    <div style={{ marginBottom: 16 }}>
                      <div style={{ ...s.label, marginBottom: 8 }}>Category</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        <button onClick={() => setDiscoverCategory("")}
                          style={{ ...s.btn, ...s.btnSm, ...(!discoverCategory ? {} : { ...s.btnOutline }), padding: "5px 10px", fontSize: 11 }}>All</button>
                        {APPLIANCE_CATEGORIES.map(c => (
                          <button key={c} onClick={() => setDiscoverCategory(c)}
                            style={{ ...s.btn, ...s.btnSm, ...(discoverCategory === c ? {} : { ...s.btnOutline }), padding: "5px 10px", fontSize: 11 }}>
                            {c.replace(/-/g, " ")}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div style={{ ...s.label, marginBottom: 8 }}>Or paste a product listing URL</div>
                  <div style={s.inputRow}>
                    <input style={s.input} placeholder="e.g. https://www.lg.com/ca_en/refrigerators/" value={discoverUrl} onChange={e => setDiscoverUrl(e.target.value)} />
                  </div>

                  <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16 }}>
                    <button style={{ ...s.btn, background: "#e17055" }} onClick={handleDiscover} disabled={loading || discoverPhase === "discovering"}>
                      {discoverPhase === "discovering" ? "Discovering… " + progress.current + "/" + progress.total : "🔍 Discover " + (discoverBrand || "") + " Products"}
                    </button>
                    {discoverPhase === "discovering" && <span style={{ fontSize: 13, color: palette.textDim }}>{progress.currentQuery}</span>}
                    {discoverPhase === "discovering" && <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={() => { abortRef.current = true; }}>Stop</button>}
                  </div>

                  {/* Discovery results for price checking */}
                  {discovered.length > 0 && (
                    <div style={{ ...s.card, margin: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                        <div>
                          <div style={{ fontSize: 15, fontWeight: 600 }}>{discovered.length} Products Found</div>
                          <div style={{ fontSize: 13, color: palette.textDim }}>
                            <span style={{ color: palette.accent }}>{selectedModels.size} selected for price check</span>
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={toggleAll}>
                            {selectedModels.size === discovered.length ? "Deselect All" : "Select All"}
                          </button>
                          <button style={{ ...s.btn, ...s.btnSm, background: "#e17055" }} disabled={loading || selectedModels.size === 0}
                            onClick={async () => {
                              const toCheck = discovered.filter(p => selectedModels.has(p.model));
                              if (!toCheck.length) return;
                              setLoading(true); abortRef.current = false; saveCountRef.current = { saved: 0, failed: 0 };
                              for (let i = 0; i < toCheck.length; i++) {
                                if (abortRef.current) break;
                                const p = toCheck[i];
                                const q = p.url || (discoverBrand + " " + p.model);
                                setProgress({ current: i + 1, total: toCheck.length, currentQuery: p.model + " — price check" });
                                try {
                                  const r = await priceCheckProduct(q);
                                  if (r.found) {
                                    if (!r.model) r.model = p.model;
                                    if (!r.brand_name && discoverBrand) r.brand_name = discoverBrand;
                                    if (autoSave) { const ok = await doPriceSave(r); if (!ok) setResults(prev => [...prev, r]); }
                                    else setResults(prev => [...prev, r]);
                                  } else setResults(prev => [...prev, { ...r, query: q }]);
                                } catch (e) { setErrors(prev => [...prev, "Price " + p.model + ": " + e.message]); }
                                if (i < toCheck.length - 1) await new Promise(r => setTimeout(r, 3000));
                              }
                              setLoading(false);
                            }}>
                            {loading ? "Checking " + progress.current + "/" + progress.total + "…" : "💰 Price Check " + selectedModels.size + " Selected"}
                          </button>
                          {loading && <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={() => { abortRef.current = true; }}>Stop</button>}
                        </div>
                      </div>
                      {loading && progress.currentQuery && <div style={{ fontSize: 13, color: "#e17055", marginBottom: 12 }}>⏳ {progress.currentQuery}</div>}
                      <div style={{ maxHeight: 400, overflow: "auto" }}>
                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                          <thead><tr style={{ borderBottom: "1px solid " + palette.border }}>
                            <th style={{ padding: "6px 8px", width: 30 }}></th>
                            <th style={{ padding: "6px 8px", textAlign: "left", color: palette.textMuted }}>Model</th>
                            <th style={{ padding: "6px 8px", textAlign: "left", color: palette.textMuted }}>Name</th>

        {/* Saved log */}
        {saved.length > 0 && (
          <div style={{ marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap" }}>
            {saved.map((s2, i) => (
              <span key={i} style={{ ...s.badge, background: palette.greenSoft, color: palette.green }}>
                ✓ {s2.model} {s2.action}
              </span>
            ))}
          </div>
        )}

        {/* Results */}
        {results.map((r, i) => (
          <ResultCard key={`${r.model || r.query}-${i}`} result={r} saving={savingIdx === i}
            onSave={async (d) => { setSavingIdx(i); await doSave(d); setResults(p => p.filter((_, j) => j !== i)); setSavingIdx(null); }}
            onDiscard={() => setResults((p) => p.filter((_, j) => j !== i))} />
        ))}

        {!loading && results.length === 0 && saved.length === 0 && (
          <div style={{ textAlign: "center", padding: "64px 0", color: palette.textMuted }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔍</div>
            <div style={{ fontSize: 15, marginBottom: 8 }}>Enter a brand + model number to scrape product specs</div>
            <div style={{ fontSize: 13 }}>Data is pulled from manufacturer websites via web search, then you review and save to PIM</div>
          </div>
        )}
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root")); root.render(React.createElement(PIMScraper));
</script></body></html>
