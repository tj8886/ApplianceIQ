*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f8fb;--bg2:#ffffff;--surface:#f0f3f7;--card:#ffffff;

html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:#0f1f3d;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}

header .logo span{color:var(--accent)}
header .right{display:flex;align-items:center;gap:12px}
.cost-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.cost-pill .val{color:#fff;font-variant-numeric:tabular-nums}

/* Tabs */
.tab-bar{display:flex;gap:2px;padding:0 24px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{padding:12px 20px;font-size:13px;font-weight:600;color:var(--txt2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--txt)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px}

/* Controls */
.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.field select,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field select{min-width:220px;cursor:pointer}
.field input{min-width:280px}

.tier-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}

.tier-badge.t2{background:rgba(47,111,237,.15);color:var(--t2)}
.tier-badge.t3{background:rgba(245,158,11,.15);color:var(--t3)}
.tier-badge.t4{background:rgba(239,68,68,.15);color:var(--t4)}

.btn{padding:9px 18px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--txt);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--txt2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}

.mode-toggle{display:flex;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}

.mode-toggle button.active{background:var(--accent);color:#fff}

.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:20px}
.brand-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(15,31,61,.04)}

.result-row .status{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.result-row .status.ok{background:var(--accent)}
.result-row .status.partial{background:var(--amber)}
.result-row .status.fail{background:var(--red)}

.result-row .info{flex:1;min-width:0}
.result-row .model-num{font-size:13px;font-weight:700}
.result-row .brand-label{font-size:11px;color:var(--txt2);margin-left:6px}
.result-row .detail{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-row .cost{font-size:11px;font-weight:600;color:var(--txt2);margin-left:auto;white-space:nowrap}
.result-row .actions{display:flex;gap:6px;margin-left:8px;flex-shrink:0;align-items:center}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,31,61,.2)}

.spec-item .v{color:var(--txt);font-weight:600;text-align:right}

.prod-table{width:100%;border-collapse:collapse;font-size:12px}

.prod-table .model-cell{font-weight:700;color:var(--txt);font-size:13px}

.diff-added{background:rgba(0,200,150,.1);color:var(--accent);padding:2px 6px;border-radius:4px;font-size:11px}
.diff-changed{background:rgba(245,158,11,.1);color:var(--amber);padding:2px 6px;border-radius:4px;font-size:11px}
.diff-removed{background:rgba(239,68,68,.1);color:var(--red);padding:2px 6px;border-radius:4px;font-size:11px;text-decoration:line-through}

.pbar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;width:100%}
.pbar .fill{height:100%;border-radius:3px;transition:width .3s}
.pbar .fill.green{background:var(--accent)}
.pbar .fill.amber{background:var(--amber)}
.pbar .fill.red{background:var(--red)}

/* Price change indicators */
.price-up{color:var(--red);font-weight:700}
.price-down{color:var(--accent);font-weight:700}
.price-same{color:var(--txt2)}

/* Checkbox list */
.check-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.check-row:hover{background:var(--surface)}
.check-row input{accent-color:var(--accent)}

.completeness{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.completeness.high{background:rgba(0,200,150,.15);color:var(--accent)}
.completeness.med{background:rgba(245,158,11,.15);color:var(--amber)}
.completeness.low{background:rgba(239,68,68,.15);color:var(--red)}

/* Scrollable table wrapper */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:55vh;box-shadow:0 1px 3px rgba(15,31,61,.04)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--txt2)}

    {re:/kegerator/i,v:'Kegerator'},{re:/beverage/i,v:'Beverage Center'},
    {re:/humidor|cigar/i,v:'Cigar Humidor'},{re:/./,v:'Wine Cooler'}
  ],
  'Air Conditioners':[
    {re:/mini.?split|ductless/i,v:'Mini Split / Ductless'},{re:/window/i,v:'Window'},
    {re:/portable/i,v:'Portable'},{re:/through.?the.?wall|thru.?wall/i,v:'Through-the-Wall'},
    {re:/dehumidifier/i,v:'Dehumidifier'},{re:/purifier/i,v:'Air Purifier'},
    {re:/heater/i,v:'Heater'},{re:/\bfan\b/i,v:'Fan'}
  ]
};
function classifySubcategory(d,category){
  if(d.subcategory)return d.subcategory; // AI provided it directly
  if(!category)return null;
  const rules=SUBCAT_RULES[category];if(!rules)return null;
  const text=[d.product_name,d.short_description,d.installation_type,d.series,
    d.specs&&typeof d.specs==='object'?Object.entries(d.specs).map(([k,v])=>k+' '+v).join(' '):''
  ].filter(Boolean).join(' ');
  for(const rule of rules){
    if(rule.re.test(text)){
      if(rule.slide)return rule.slide.test(text)?rule.si:rule.fs;
      return rule.v||rule.fs;
    }
  }
  return null;
}

// ── CONDITION NORMALIZER — maps retailer labels to listing_condition enum ──
function normalizeCondition(raw){
  if(!raw)return 'new';
  const s=String(raw).toLowerCase();
  if(/open\s*box|opened/i.test(s))return 'open_box';
  if(/refurb/i.test(s))return 'refurbished';
  if(/floor\s*model|display|demo/i.test(s))return 'floor_model';
  if(/scratch|dent/i.test(s))return 'scratch_dent';
  if(/clearance|closeout|close.?out/i.test(s))return 'clearance';
  if(/end\s*of\s*life|eol|last\s*chance/i.test(s))return 'end_of_life';
  if(/discontinued/i.test(s))return 'discontinued';
  if(/return/i.test(s))return 'returned';
  if(/\bused\b|pre.?owned/i.test(s))return 'used';
  if(/as.?is|no\s*warranty/i.test(s))return 'as_is';
  if(/sale|promo|deal|special/i.test(s))return 'sale';
  return 'new';
}

// ── SAVE PRICE LISTING — delivers into pim_retailer_prices lifecycle system ──
// Upserts on (brand_name, model, retailer_name, condition_normalized, country)
// Logs every change to pim_price_changes. Manages first/last seen + miss counters.
async function savePriceListing(product,retailer,listing,runId,runStats){
  const condNorm=normalizeCondition(listing.condition);
  const now=new Date().toISOString();
  const rec={
    product_id:product.id||null,
    brand_name:selectedBrand,model:product.model,
    retailer_name:retailer.retailer_name,retailer_url:retailer.website||null,
    product_url:listing.product_url||null,
    price:Number(listing.price),
    regular_price:listing.regular_price?Number(listing.regular_price):null,
    on_sale:!!listing.on_sale,in_stock:listing.in_stock!==false,
    condition:listing.condition||'New',condition_raw:listing.condition||null,
    condition_normalized:condNorm,
    listing_status:listing.in_stock===false?'out_of_stock':'active',
    quantity_available:listing.quantity_available||null,
    country:psMarket,price_currency:psMarket==='CA'?'CAD':'USD',
    checked_at:now,last_seen_at:now,consecutive_misses:0,
    scrape_run_id:runId
  };
  try{
    // Check for existing listing (same model+retailer+condition+country)
    const{data:existing}=await sb.from('pim_retailer_prices')
      .select('id,price,regular_price,in_stock,condition_normalized,condition_raw,listing_status')
      .eq('brand_name',rec.brand_name).eq('model',rec.model)
      .eq('retailer_name',rec.retailer_name).eq('condition_normalized',condNorm)
      .eq('country',psMarket).maybeSingle();

    const{data:saved,error}=await sb.from('pim_retailer_prices')
      .upsert(rec,{onConflict:'brand_name,model,retailer_name,condition_normalized,country'})
      .select('id').maybeSingle();
    if(error){logEntry('Price save err: '+error.message,'err');return false}

    // Log the change
    const changes=[];
    if(!existing){
      changes.push({change_type:'new_listing',new_price:rec.price,new_regular_price:rec.regular_price,new_condition:condNorm,new_condition_raw:rec.condition_raw,new_in_stock:rec.in_stock});
      runStats.new_listings++;
    }else{
      runStats.updated++;
      const oldP=Number(existing.price),newP=rec.price;
      if(oldP!==newP){
        changes.push({change_type:newP<oldP?'price_drop':'price_increase',old_price:oldP,new_price:newP,price_delta:newP-oldP,price_delta_percent:oldP>0?Math.round(((newP-oldP)/oldP)*1000)/10:null});
        runStats.price_changed++;
      }
      if(existing.in_stock===false&&rec.in_stock)changes.push({change_type:'back_in_stock',old_in_stock:false,new_in_stock:true});
      if(existing.in_stock!==false&&!rec.in_stock)changes.push({change_type:'out_of_stock',old_in_stock:true,new_in_stock:false});
      if((existing.condition_raw||'')!==(rec.condition_raw||''))changes.push({change_type:'condition_change',old_condition:existing.condition_normalized,new_condition:condNorm,old_condition_raw:existing.condition_raw,new_condition_raw:rec.condition_raw});
    }
    if(changes.length&&saved?.id){
      await sb.from('pim_price_changes').insert(changes.map(c=>({...c,retailer_price_id:saved.id,scrape_run_id:runId})));
    }
    return true;
  }catch(e){logEntry('Price save exception: '+e.message,'err');return false}
}

// ── ARCHIVE SWEEP — call after a full retailer scrape to age out missing listings ──
// Increments misses for active listings not seen in this run; archives past threshold.
async function archiveMissingListings(retailerName,runId,missThreshold=3){
  try{
    const cutoff=new Date(Date.now()-60*1000).toISOString(); // anything not touched this run
    const{data:missing}=await sb.from('pim_retailer_prices')
      .select('id,consecutive_misses')
      .eq('retailer_name',retailerName).eq('brand_name',selectedBrand)
      .eq('listing_status','active').lt('last_seen_at',cutoff);
    if(!missing||!missing.length)return{missed:0,archived:0};
    let archived=0;
    for(const m of missing){
      const misses=(m.consecutive_misses||0)+1;
      if(misses>=missThreshold){
        await sb.from('pim_retailer_prices').update({consecutive_misses:misses,listing_status:'archived',archived_at:new Date().toISOString()}).eq('id',m.id);
        await sb.from('pim_price_changes').insert({retailer_price_id:m.id,scrape_run_id:runId,change_type:'archived'});
        archived++;
      }else{
        await sb.from('pim_retailer_prices').update({consecutive_misses:misses}).eq('id',m.id);
      }
    }
    return{missed:missing.length,archived};
  }catch(e){return{missed:0,archived:0}}
}

/* ═══ APPLIANCE RELEVANCE FILTER ═══ */
// Only exclude truly non-appliance items. Parts & accessories (handles, filters, trim kits, etc.)
// ARE relevant — they get scraped and classified as 'parts_accessories' by classifySegment()
const EXCLUDE_TERMS = ['bathroom fan','bath fan','ceiling fan','air purifier','humidifier','dehumidifier','water heater','water cooler','water dispenser','furnace','air conditioner','thermostat','toaster','blender','kettle','food processor','stand mixer','coffee maker','slow cooker','vacuum','floor care','iron press','steamer iron','hair dryer','shaver'];
const ACCESSORY_TERMS = ['replacement part','handle kit','knob kit','trim kit','filler panel','stacking kit','door panel kit','hose kit','bracket kit','gasket kit','element kit','filter pack','pedestal kit','wok ring','touch-up paint','descaler kit','water filter','door panel','handle','grate set','drip pan','storage drawer','crisper','shelf','rack','light bulb','cleaner'];
const INCLUDE_TERMS = ['refrigerat','freezer','range','oven','cooktop','rangetop','dishwasher','washer','dryer','laundry','microwave','hood','range hood','wine','beverage','ice maker','garbage disposal','trash compact','warming drawer','grill','smoker','pizza oven','undercounter','freestanding','slide-in','built-in','french door','side-by-side','front load','top load','convection','induction'];
let appliancesOnly = true;

function classifyRelevance(data) {
  if (!appliancesOnly) return { relevant: true };
  const title = ((data.product_name||'') + ' ' + (data.category||'')).toLowerCase();
  // Check INCLUDE first — if it's clearly an appliance, it IS relevant
  for (const term of INCLUDE_TERMS) { if (title.includes(term)) return { relevant: true }; }
  // Accessories ARE relevant — classify as accessory but still scrape
  for (const term of ACCESSORY_TERMS) { if (title.includes(term)) return { relevant: true, accessory: true }; }
  // Only exclude truly non-appliance items
  for (const term of EXCLUDE_TERMS) { if (title.includes(term)) return { relevant: false, reason: term }; }
  return { relevant: true };
}

function classifySegment(data) {
  const name = ((data.product_name||'') + ' ' + (data.short_description||'') + ' ' + (data.category||'')).toLowerCase();
  // Parts & accessories
  if (/replacement|spare part|handle kit|knob kit|trim kit|filler panel|stacking kit|door panel|grate set|drip pan|filter pack|bracket|gasket|element kit|wok ring|touch-up|cleaner|descaler/.test(name)) return 'parts_accessories';
  // Vacuums
  if (/vacuum|roomba|floor care|robot cleaner/.test(name)) return 'vacuum_floor_care';
  // Outdoor
  if (/\bgrill\b|bbq|barbecue|smoker|pizza oven|outdoor kitchen|outdoor fridge/.test(name)) return 'outdoor';
  // Not relevant
  if (/water cooler|water dispenser|bathroom fan|bath fan|ceiling fan|furnace|air condition|humidifier|dehumidifier|air purifier|water heater/.test(name)) return 'not_relevant';
  // Small appliance
  if (/\btoaster\b|blender|kettle|food processor|stand mixer|coffee maker|slow cooker|waffle|bread maker|juicer/.test(name)) return 'small_appliance';
  // Default
  return 'major_appliance';
}

function timeAgo(ts){
  const diff=Date.now()-new Date(ts).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';
  const days=Math.floor(hrs/24);
  if(days<30)return days+'d ago';
  return Math.floor(days/30)+'mo ago';
}

function shortDate(ts){
  const d=new Date(ts);
  const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return m+' '+d.getDate();
}

/* ── CATEGORY PAGE DETECTION — extracts product URLs from listing pages ── */
async function extractProductUrls(url,brand){
  try{
    // Heuristic: category pages often have these path patterns
    const lu=url.toLowerCase();
    const isCategoryLikely=/\/(category|categories|products|collection|collections|models|lineup|series|all-|shop\/)/.test(lu)
      || /\/(refrigerat|dishwash|range|washer|dryer|cooktop|oven|microwave|freezer|hood|laundry|wine|beverage)/.test(lu)
      || lu.endsWith('/') && (lu.split('/').filter(Boolean).length <= 6);

    // Fetch page HTML
    logEntry('Checking if URL is a category page…');
    const resp=await fetch(SB_URL+'/functions/v1/free-extract',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url,raw_text_only:true})
    });
    const raw=await resp.json();
    const html=raw?.text||raw?.raw_text||raw?.html||'';
    if(html.length<200){logEntry('Page too short — treating as single product');return null}

    // Extract all same-domain links from the HTML
    const urlObj=new URL(url);
    const domain=urlObj.hostname;
    const links=new Set();
    // Match href="..." patterns
    const hrefRx=/href=["']([^"']+)["']/gi;
    let m;
    while((m=hrefRx.exec(html))!==null){
      let href=m[1];
      if(href.startsWith('/'))href=urlObj.origin+href;
      try{
        const linkUrl=new URL(href);
        if(linkUrl.hostname===domain||linkUrl.hostname==='www.'+domain||domain==='www.'+linkUrl.hostname){
          links.add(linkUrl.href.split('?')[0].split('#')[0]); // strip query/hash
        }
      }catch(_){}
    }

    // Filter for product-like URLs (not the category page itself, not nav/footer links)
    const skipPaths=['/about','/contact','/careers','/blog','/news','/press','/faq','/support',
      '/warranty','/registration','/privacy','/terms','/legal','/sitemap','/search',
      '/company','/media','/investor','/history','/locations','/store-locator',
      '/rebate','/financing','/promotions','/compare','/how-to','/recipe','/login','/account',
      '/cart','/checkout','/wishlist','/cookie','/accessibility'];
    const categoryPaths=['/category/','/categories/','/collection/','/collections/','/shop/','/all-','/lineup/'];

    const productLinks=[];
    for(const link of links){
      const path=new URL(link).pathname.toLowerCase();
      // Skip the original URL itself
      if(link===url||link===url+'/'||link+'/'===url)continue;
      // Skip nav/footer/utility pages
      if(skipPaths.some(s=>path.includes(s)))continue;
      // Skip other category pages (we want products, not sub-categories... unless they're deeper)
      if(categoryPaths.some(s=>path.includes(s))&&path.split('/').filter(Boolean).length<=3)continue;
      // Product pages tend to have longer, more specific paths
      const segments=path.split('/').filter(Boolean);
      if(segments.length<2)continue; // too short, probably homepage or section
      // Look for model-number-like patterns in the URL
      const lastSeg=segments[segments.length-1];
      const hasModelPattern=/[A-Z]{2,}[\d]|[\d]{2,}[A-Z]|^[A-Z0-9-]{5,}$/i.test(lastSeg);
      const hasProductPath=/product|model|item|spec|detail|p\//i.test(path);
      // Accept if it looks product-like
      if(hasModelPattern||hasProductPath||segments.length>=3){
        // Try to extract model from URL
        const modelGuess=lastSeg.replace(/\.html?$/i,'').replace(/-/g,' ').toUpperCase();
        productLinks.push({url:link,model:hasModelPattern?modelGuess.replace(/\s/g,''):''});
      }
    }

    // If we found multiple product links, this IS a category page
    if(productLinks.length>=2){
      logEntry('📂 Category page: '+productLinks.length+' product URLs extracted from '+links.size+' total links','ok');
      return productLinks;
    }

    // Fallback: if the page has very few links but looks like a category, try Gemini/GPT to find products
    if(isCategoryLikely&&html.length>1000&&productLinks.length<2){
      logEntry('Category heuristic matched but only '+productLinks.length+' product links found — trying AI extraction…');
      const gkey=localStorage.getItem('aiq_google_key');
      if(gkey){
        try{
          const aiResp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+geminiModel+':generateContent?key='+gkey,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              systemInstruction:{parts:[{text:'Extract all individual product page URLs from this HTML page. Return ONLY a JSON array of objects: [{url, model}]. The URLs should be direct links to individual product detail pages, NOT category or listing pages. If no product links found, return empty array [].'}]},
              contents:[{parts:[{text:'Extract product URLs from this '+brand+' category page ('+url+'):\n\n'+html.substring(0,12000)}]}],
              generationConfig:{responseMimeType:'application/json',temperature:0.1,maxOutputTokens:3000}
            })
          });
          const aiData=await aiResp.json();
          const txt=aiData.candidates?.[0]?.content?.parts?.[0]?.text||'';
          const parsed=JSON.parse(txt.replace(/```json\s*|```/g,'').trim());
          const cost=((aiData.usageMetadata?.promptTokenCount||0)*0.0000003+(aiData.usageMetadata?.candidatesTokenCount||0)*0.0000025);
          addCost(cost);
          if(Array.isArray(parsed)&&parsed.length>=2){
            // Normalize relative URLs
            const normalized=parsed.map(p=>{
              let purl=p.url||'';
              if(purl.startsWith('/'))purl=urlObj.origin+purl;
              return{url:purl,model:p.model||''};
            }).filter(p=>p.url.startsWith('http'));
            logEntry('AI extracted '+normalized.length+' product URLs · $'+cost.toFixed(4),'cost');
            return normalized;
          }
        }catch(e){logEntry('AI extraction error: '+e.message,'err')}
      }
    }

    // Not a category page — return null to treat as single product
    return null;
  }catch(e){logEntry('Category check error: '+e.message,'err');return null}
}

/* ── BRAND CONTENT CAPTURE — saves support/care/repair articles to pim_brand_content ── */
async function saveBrandContent(brand,url,contentType){
  try{
    // Check if already saved
    const{data:existing}=await sb.from('pim_brand_content').select('id').eq('url',url).maybeSingle();
    if(existing)return; // already captured

    // Fetch page text
    let title='',summary='',rawText='',productCategory=null,keywords=[];
    try{
      const resp=await fetch(SB_URL+'/functions/v1/free-extract',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url,raw_text_only:true})
      });
      const raw=await resp.json();
      rawText=(raw?.text||raw?.raw_text||'').substring(0,50000);

      // Extract title from page
      const titleMatch=rawText.match(/<title[^>]*>([^<]+)<\/title>/i);
      if(titleMatch)title=titleMatch[1].trim();
      if(!title){
        // Try from URL path
        const segs=new URL(url).pathname.split('/').filter(Boolean);
        title=segs.slice(-2).join(' — ').replace(/-/g,' ');
      }

      // Detect product category from URL
      const catMap={refrigerat:'Refrigerators',dishwash:'Dishwashers',washer:'Washers',
        dryer:'Dryers',range:'Ranges',oven:'Wall Ovens',cooktop:'Cooktops',
        microwave:'Microwaves',hood:'Ventilation',freezer:'Freezers',
        laundry:'Laundry',ice:'Ice Makers',wine:'Wine & Beverage',grill:'Outdoor Grills'};
      const lu=url.toLowerCase();
      for(const[k,v]of Object.entries(catMap)){if(lu.includes(k)){productCategory=v;break}}

      // Extract keywords from URL path
      const pathWords=new URL(url).pathname.split(/[/-]/).filter(w=>w.length>3&&!/^(com|www|html|htm|the|and|for|not)$/.test(w));
      keywords=pathWords.slice(0,10);

      // Simple summary from first meaningful text
      const textOnly=rawText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      if(textOnly.length>100)summary=textOnly.substring(0,500).trim()+'…';
    }catch(_){}

    // Save to pim_brand_content
    await sb.from('pim_brand_content').upsert({
      brand_name:brand,url,title:title||url.split('/').pop(),
      content_type:contentType,product_category:productCategory,
      summary,keywords,raw_text:rawText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').substring(0,30000),
      scraped_at:new Date().toISOString(),status:'active'
    },{onConflict:'url',ignoreDuplicates:true});
  }catch(e){logEntry('Content save error: '+e.message,'err')}
}

async function smartScrape(brand,model,url){
  const t=tier(brand)||4;
  const bi=brandSourceMap[brand]||null;
  const r={brand,model,status:'pending',data:null,tier_used:0,cost:0,url};
  scrapeResults.push(r);renderTab();

  // Pre-filter: separate truly useless URLs from valuable service/care content
  if(url){
    const lu=url.toLowerCase();
    // Truly useless — skip forever, auto-delete from discovery
    const SKIP_FOREVER=['/careers','/privacy','/terms','/cookie','/legal','/sitemap','/search',
      '/company-profile','/environmental','/recycling','/sustainability','/csr','/corporate',
      '/investor','/annual-report','/our-story','/locations','/store-locator',
      '/rebate','/financing','/promotions','/login','/account','/cart','/checkout',
      '/wishlist','/accessibility','/media-room','/press-release','/registration',
      '/newsletter','/unsubscribe','/social','/share','/print'];
    if(SKIP_FOREVER.some(p=>lu.includes(p))){
      r.status='fail';r._autoSkip=true;renderTab();return r;
    }
    // Valuable content — capture to pim_brand_content instead of skipping
    const CONTENT_PATTERNS=[
      {match:['/support','/selfhelp','/self-help','/troubleshoot','/repair','/fix','/error-code','/fault'],type:'repair'},
      {match:['/care','/maintenance','/cleaning','/clean-','/maintain'],type:'care_maintenance'},
      {match:['/how-to','/howto','/tips','/advice','/guide'],type:'how_to'},
      {match:['/install','/installation-guide','/setup'],type:'installation_guide'},
      {match:['/faq','/frequently-asked','/questions'],type:'faq'},
      {match:['/recipe'],type:'recipe'},
      {match:['/about','/contact','/news','/blog','/press'],type:null} // skip these silently
    ];
    for(const pat of CONTENT_PATTERNS){
      if(pat.match.some(p=>lu.includes(p))){
        if(pat.type){
          // Valuable content — save to pim_brand_content
          await saveBrandContent(brand,url,pat.type);
          r.status='ok';r._contentSaved=true;r._contentType=pat.type;
          logEntry('📖 Saved '+pat.type.replace(/_/g,' ')+': '+url.split('/').slice(-2).join('/'),'ok');
        } else {
          r.status='fail';r._autoSkip=true;
        }
        renderTab();return r;
      }
    }
  }

  // T1 — free-extract
  if(t>=1||url){
    const p=url?{url}:{query:brand+' '+model,market:'CA'};
    const t1=await callTier1(p);
    if(t1){
      if(t1.found){r.data=t1;r.status='ok';r.tier_used=1;r.cost=0;renderTab();return r}
      if(t1._partial){
        // Try T2 Gemini to fill gaps
        const t2=await callTier2(t1);
        if(t2&&t2.model){r.data={...t1,...t2,_merged:true};r.status='ok';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}
        // Try T3 to fill gaps
        const t3=await callTier3(t1);
        if(t3&&t3.model){r.data={...t1,...t3,_merged:true};r.status='ok';r.tier_used=3;r.cost=t3._cost||0;renderTab();return r}
        r.data=t1;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r;
      }
    }
    // T1 returned null — if we have a URL, try T2/T3 with the raw page content
    if(!t1&&url){
      logEntry('T1 found nothing, trying T2/T3 with page fetch…');
      try{
        const resp=await fetch(SB_URL+'/functions/v1/free-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,raw_text_only:true})});
        const raw=await resp.json();
        const pageText=raw?.text||raw?.raw_text||'';
        if(pageText.length>100){
          const t2=await callTier2(null,pageText);
          if(t2&&t2.model){r.data=t2;r.status='ok';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}
          const t3=await callTier3(null,pageText);
          if(t3&&t3.model){r.data=t3;r.status='ok';r.tier_used=3;r.cost=t3._cost||0;renderTab();return r}
        }
      }catch(_){}
    }
  }

  // T2 — Gemini Flash Lite (search + extract)
  if(t>=2&&model){
    const t1s=await callTier1({query:brand+' '+model,market:'CA'});
    if(t1s&&(t1s.found||t1s._partial)){
      const t2=await callTier2(t1s);
      if(t2&&t2.model){r.data={...t1s,...t2,_merged:true};r.status='ok';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}
      const t3=await callTier3(t1s);
      if(t3&&t3.model){r.data={...t1s,...t3,_merged:true};r.status='ok';r.tier_used=3;r.cost=t3._cost||0;renderTab();return r}
      r.data=t1s;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r;
    }
  }

  // T4 — Haiku + web search (last resort, only if we have a model number)
  if(model){
    const t4=await callTier4(brand+' '+model,bi);
    if(t4){r.data=t4;r.status=t4.model?'ok':'partial';r.tier_used=4;r.cost=t4._cost||0;renderTab();return r}
  }

  r.status='fail';logEntry('Failed: '+brand+' '+(model||url||''),'err');renderTab();return r;
}

function classifyResult(r) {
  if(r.data){const rel=classifyRelevance(r.data);r._relevant=rel.relevant;r._irrelevantReason=rel.reason;}
}

async function autoSaveIfEnabled(result) {
  classifyResult(result);
  if (!autoSave || !result.data || result._saved) return;
  if (result._relevant===false) { logEntry('Skip auto-save (not appliance: ' + result._irrelevantReason + ')', 'err'); renderTab(); return; }
  const idx = scrapeResults.indexOf(result);
  if (idx >= 0) await saveToPim(idx);
}

      '/themes/','assets/img/','assets/images/','/static/btn','/static/cta',

      'Cart-','Calc-','Speech-','map-white','mobilepin',
      'request-quote','manuals.jpg','simmer.jpg','_nav.',
      'performance_why','prizer-heritage','coty-','customization-menu',
      'kitchen-design','column-fridge-menu','judges',
      'bg-warranty','bg-customer','bg-proud','ccccc.jpg','usa_circle','download_1.jpg',
      '{width}'
    ];
    // Also reject any URL that's clearly a duplicate shared site asset
    const SHARED_ASSET_URLS=new Set(); // populated per-session to catch repeats
    for(let i=0;i<d.images.length;i++){
      const img=d.images[i];
      if(!img?.url)continue;
      const imgUrl=String(img.url);
      const lu=imgUrl.toLowerCase();
      // Skip junk images
      if(JUNK_IMG_PATTERNS.some(p=>lu.includes(p)))continue;
      // Skip data URIs and tiny images
      if(lu.startsWith('data:'))continue;
      // Skip non-image URLs
      if(!lu.match(/\.(jpg|jpeg|png|gif|webp|avif|svg)/i)&&!lu.includes('/image')&&!lu.includes('/photo')&&!lu.includes('Product_Shots')&&!lu.includes('/cdn/'))continue;
      const imgRec={
        product_id:productId,brand_id:br?.id||null,
        image_type:img.type||'product',file_url:imgUrl,
        alt_text:(d.product_name||d.model||'')+' - '+(img.type||'image'),
        is_primary:i===0&&imgCount===0,display_order:imgCount,source:'scraper_v3',
        mime_type:lu.includes('.png')?'image/png':lu.includes('.webp')?'image/webp':lu.includes('.svg')?'image/svg+xml':'image/jpeg'
      };
      const{error:ie}=await sb.from('pim_product_images').upsert(imgRec,{onConflict:'product_id,file_url',ignoreDuplicates:true});
      if(!ie)imgCount++;
    }
    if(imgCount>0)assetLog.push(imgCount+' images');
  }

  // Save documents
  if(d.documents&&d.documents.length>0&&productId){
    let docCount=0;
    for(const doc of d.documents){
      if(!doc?.url)continue;
      const docRec={
        product_id:productId,brand_id:br?.id||null,
        doc_type:doc.doc_type||'other',title:doc.title||doc.file_name||'Document',
        file_url:doc.url,file_name:doc.file_name||null,
        mime_type:'application/pdf',source:'scraper_v2',
        language:'en',locale:rec.market==='CA'?'en-CA':'en-US',
        is_current:true
      };
      const{error:de}=await sb.from('pim_product_documents').upsert(docRec,{onConflict:'product_id,file_url',ignoreDuplicates:true});
      if(!de)docCount++;
    }
    if(docCount>0)assetLog.push(docCount+' docs');
  }

  // Save videos
  if(d.videos&&d.videos.length>0&&productId){
    let vidCount=0;
    for(let i=0;i<d.videos.length;i++){
      const vid=d.videos[i];
      if(!vid?.url)continue;
      const vidRec={
        product_id:productId,brand_id:br?.id||null,
        video_type:vid.type||'product_overview',title:vid.title||(d.product_name||d.model||'')+ ' video',
        video_url:vid.url,embed_url:vid.embed_url||null,
        thumbnail_url:vid.thumbnail||null,
        platform:vid.platform||'unknown',external_video_id:vid.video_id||null,
        source:'scraper_v2',display_order:i,is_current:true
      };
      const{error:ve}=await sb.from('pim_product_videos').upsert(vidRec,{onConflict:'product_id,video_url',ignoreDuplicates:true});
      if(!ve)vidCount++;
    }
    if(vidCount>0)assetLog.push(vidCount+' videos');
  }

  r._saved=true;r._assetLog=assetLog;
  logEntry('Saved ✓'+(assetLog.length?' + '+assetLog.join(', '):''),'ok');renderTab();
}

/* ═══ PRODUCT DATA ═══ */

const COMPLETENESS_FIELDS = ['short_description','category','msrp','color','width_inches','height_inches','depth_inches','weight_lbs','capacity_cu_ft','voltage','specs_json','finish','energy_star'];

function completeness(p) {
  let filled = 0;
  for (const f of COMPLETENESS_FIELDS) { if (p[f] !== null && p[f] !== undefined && p[f] !== '') filled++; }
  return Math.round((filled / COMPLETENESS_FIELDS.length) * 100);
}

function missingFields(p) {
  return COMPLETENESS_FIELDS.filter(f => p[f] === null || p[f] === undefined || p[f] === '');
}

/* ═══ PRICE SYNC LOGIC ═══ */

async function priceSyncOne(product) {
  const t = tier(product.brand_name);
  logEntry('Price check: ' + product.brand_name + ' ' + product.model + '…');

  // Try source URL first
  if (product.source_reference) {
    const t1 = await callTier1({ url: product.source_reference });
    if (t1 && t1.msrp !== undefined) {
      return { product, live_price: t1.msrp, currency: t1.currency || product.price_currency, source: t1.source_url || product.source_reference, tier_used: 1, cost: 0 };
    }
  }

  // Fallback to search
  const t1s = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  if (t1s && t1s.msrp !== undefined) {
    return { product, live_price: t1s.msrp, currency: t1s.currency || product.price_currency, source: t1s.source_url, tier_used: 1, cost: 0 };
  }

  if (t <= 2) {
    const t2 = await callTier2({ brand_name: product.brand_name, model: product.model }, null);
    if (t2 && t2.msrp !== undefined) {
      return { product, live_price: t2.msrp, currency: t2.currency || product.price_currency, source: 'gemini', tier_used: 2, cost: t2._cost || 0 };
    }
    const t3 = await callTier3({ brand_name: product.brand_name, model: product.model }, null);
    if (t3 && t3.msrp !== undefined) {
      return { product, live_price: t3.msrp, currency: t3.currency || product.price_currency, source: 'gpt', tier_used: 3, cost: t3._cost || 0 };
    }
  }

  const t4 = await callTier4(product.brand_name + ' ' + product.model + ' price', brandSourceMap[product.brand_name]);
  if (t4 && t4.msrp !== undefined) {
    return { product, live_price: t4.msrp, currency: t4.currency || product.price_currency, source: t4.source_url || 'haiku', tier_used: 4, cost: t4._cost || 0 };
  }

  return { product, live_price: null, error: 'Could not find price', tier_used: 0, cost: 0 };
}

/* ═══ VERIFY LOGIC ═══ */

async function verifyOne(product) {
  logEntry('Verifying: ' + product.brand_name + ' ' + product.model + '…');
  let liveData = null;

  if (product.source_reference) {
    liveData = await callTier1({ url: product.source_reference });
  }
  if (!liveData || (!liveData.found && !liveData._partial)) {
    liveData = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  }
  if (!liveData || (!liveData.found && !liveData._partial)) {
    return { product, status: 'unreachable', diffs: [], tier_used: 0, cost: 0 };
  }

  // Compare fields
  const diffs = [];
  const checkFields = [
    ['short_description', 'Description'], ['msrp', 'MSRP'], ['color', 'Color'],
    ['width_inches', 'Width'], ['height_inches', 'Height'], ['depth_inches', 'Depth'],
    ['weight_lbs', 'Weight'], ['availability', 'Availability']
  ];
  for (const [field, label] of checkFields) {
    const stored = product[field];
    const live = liveData[field];
    if (live !== undefined && live !== null && String(live) !== String(stored || '')) {
      diffs.push({ field, label, stored: stored, live: live });
    }
  }

  // Check specs
  if (liveData.specs && product.specs_json) {
    const liveSpecs = liveData.specs;
    const storedSpecs = typeof product.specs_json === 'string' ? JSON.parse(product.specs_json) : product.specs_json;
    for (const [k, v] of Object.entries(liveSpecs)) {
      if (storedSpecs[k] === undefined) {
        diffs.push({ field: 'spec:' + k, label: 'Spec: ' + k, stored: null, live: v, type: 'added' });
      } else if (String(storedSpecs[k]) !== String(v)) {
        diffs.push({ field: 'spec:' + k, label: 'Spec: ' + k, stored: storedSpecs[k], live: v, type: 'changed' });
      }
    }
  }

  return { product, status: diffs.length > 0 ? 'drifted' : 'verified', diffs, liveData, tier_used: 1, cost: 0 };
}

/* ═══ ENRICH LOGIC ═══ */

async function enrichOne(product) {
  logEntry('Enriching: ' + product.brand_name + ' ' + product.model + '…');
  const missing = missingFields(product);
  if (missing.length === 0) return { product, enriched: {}, missing: [], tier_used: 0, cost: 0 };

  // Try free-extract first
  let scraped = null;
  if (product.source_reference) {
    scraped = await callTier1({ url: product.source_reference });
  }
  if (!scraped || (!scraped.found && !scraped._partial)) {
    scraped = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  }

  let enriched = {};
  let tierUsed = 1;
  let cost = 0;

  if (scraped) {
    // Map scraped fields to missing product fields
    const fieldMap = {
      short_description: 'short_description', category: 'category', msrp: 'msrp',
      color: 'color', finish: 'finish', width_inches: 'width_inches',
      height_inches: 'height_inches', depth_inches: 'depth_inches',
      weight_lbs: 'weight_lbs', capacity_cu_ft: 'capacity_cu_ft',
      voltage: 'voltage', energy_star: 'energy_star', specs_json: 'specs'
    };
    for (const f of missing) {
      const src = fieldMap[f] || f;
      if (scraped[src] !== undefined && scraped[src] !== null) {
        enriched[f] = scraped[src];
      }
    }
  }

  // If still missing fields, try T2 (Gemini)
  const stillMissing = missing.filter(f => enriched[f] === undefined);
  if (stillMissing.length > 0 && tier(product.brand_name) >= 2) {
    const t2 = await callTier2({ brand_name: product.brand_name, model: product.model, ...enriched }, null);
    if (t2) {
      tierUsed = 2; cost = t2._cost || 0;
      for (const f of stillMissing) {
        const v = t2[f] || t2[f.replace('_json', '')];
        if (v !== undefined && v !== null) enriched[f] = v;
      }
    }
  }

  // T3 (Luna) if still missing
  const stillMissing2 = missing.filter(f => enriched[f] === undefined);
  if (stillMissing2.length > 0 && tier(product.brand_name) >= 2) {
    const t3 = await callTier3({ brand_name: product.brand_name, model: product.model, ...enriched }, null);
    if (t3) {
      tierUsed = 3; cost += t3._cost || 0;
      for (const f of stillMissing2) {
        const v = t3[f] || t3[f.replace('_json', '')];
        if (v !== undefined && v !== null) enriched[f] = v;
      }
    }
  }

  // T4 (Haiku + web) as last resort
  const finalMissing = missing.filter(f => enriched[f] === undefined);
  if (finalMissing.length > 3) {
    const t4 = await callTier4(product.brand_name + ' ' + product.model + ' specifications', brandSourceMap[product.brand_name]);
    if (t4) {
      tierUsed = 4; cost += t4._cost || 0;
      for (const f of finalMissing) {
        const v = t4[f] || t4[f.replace('_json', '')];
        if (v !== undefined && v !== null) enriched[f] = v;
      }
    }
  }

  return { product, enriched, missing, filled: Object.keys(enriched).length, tier_used: tierUsed, cost };
}

          else if(sc==='partial'){
            const fd=[];if(scraped.data?.model)fd.push('model');if(scraped.data?.product_name)fd.push('name');if(scraped.data?.msrp)fd.push('price');if(scraped.data?.specs)fd.push('specs');
            h+='⚠ '+(fd.length?fd.join(', '):'basic data');
          } else h+='✕ failed';
          h+='</span>';
        } else if(cachedDone||scraped?._resumed){
          h+='<span style="font-size:11px;color:var(--txt2)">✓ previously scraped</span>';
        } else {
          h+='<span style="font-size:11px;color:var(--txt2)">ready</span>';
        }
        h+='</td><td>';
        if(scraped&&scraped._contentSaved){
          h+='<span style="font-size:11px;color:var(--accent)">📖 saved</span>';
        } else if(scraped&&scraped._autoSkip){
          h+='<span style="font-size:10px;color:var(--txt2)">—</span>';
        } else if(!scraped&&!cachedDone){
          h+='<button class="btn btn-sm btn-secondary" onclick="window.S.scrapeUrl(\''+esc(r.url).replace(/'/g,"\\'")+'\')">Scrape</button>';
        } else if(scraped&&scraped.data && !scraped._saved){
          h+='<button class="btn btn-sm btn-primary" onclick="window.S.saveResult('+scrapeResults.indexOf(scraped)+')">Save</button>';
        } else if((scraped&&scraped._saved)||cachedDone){
          h+='<span style="font-size:11px;color:var(--accent)">✓</span>';

    if(existing.length>0){

      h+='</div></details>';

  // ── Saved Category Sources (persistent, re-scrapable) ──
  if(selectedBrand){

    h+='<div style="margin-top:12px;margin-bottom:8px">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
    h+='<span style="font-size:13px;font-weight:700">📂 Saved Sources'+(sources.length?' ('+sources.length+')':'')+'</span>';
    h+='<div style="display:flex;gap:6px">';
    if(sources.length>0&&!isProcessing)h+='<button class="btn btn-sm btn-primary" onclick="window.S.rescrapeAllSources()">🔄 Re-scrape All</button>';
    h+='<button class="btn btn-sm btn-secondary" onclick="window.S.addSourceUrl()">+ Add URL</button>';
    h+='</div></div>';
    if(sources.length>0){
      h+='<div style="display:flex;flex-direction:column;gap:4px">';

        h+='<button class="btn btn-sm btn-secondary" onclick="window.S.rescrapeSource('+si+')" '+(isProcessing?'disabled':'')+' style="padding:4px 10px;font-size:11px">🔄</button>';
        h+='<button class="btn btn-sm" onclick="window.S.removeSource('+si+')" style="padding:4px 8px;font-size:11px;color:var(--red);background:none;border:none;cursor:pointer">✕</button>';
        h+='</div>';
      }
      h+='</div>';
    } else {
      h+='<div style="font-size:12px;color:var(--txt2);padding:8px 0">Paste a category URL below and it will be saved here for re-scraping later</div>';
    }
    h+='</div>';
  }

  // Manual entry section (collapsible)
  h+='<details style="margin-top:8px"'+(selectedBrand&&(!discoverResults||!discoverResults.results)?' open':'')+' ><summary style="font-size:12px;color:var(--txt2);cursor:pointer;font-weight:600">Manual model / URL entry</summary>';
  h+='<div class="controls" style="margin-top:10px">';
  h+='<div class="field"><label>Model Number</label><input type="text" id="modelInput" placeholder="e.g. LRMVS3006S" onkeydown="if(event.key===\'Enter\')window.S.doScrape()"/></div>';
  h+='<button class="btn btn-primary" onclick="window.S.doScrape()" '+(isProcessing?'disabled':'')+'>🔍 Scrape</button>';
  h+='</div>';
  h+='<div class="controls" style="margin-top:-8px">';
  h+='<div class="field"><label>Or paste a URL (product page or category page)</label><input type="text" id="urlInput" placeholder="https://www.bosch-home.com/us/en/category/refrigerators/french-door/…" style="min-width:420px"/></div>';
  h+='<button class="btn btn-secondary" onclick="window.S.doUrlScrape()" '+(isProcessing?'disabled':'')+'>Scrape URL</button>';
  h+='</div></details>';

  // Scrape results
  if(scrapeResults.length>0){
    const unsaved=scrapeResults.filter(r=>r.data&&!r._saved).length;
    h+='<div class="results-panel" style="margin-top:16px"><div class="results-header"><h3>Scrape Results ('+scrapeResults.length+')</h3><div style="display:flex;gap:8px">'+(unsaved>0?'<button class="btn btn-sm btn-primary" onclick="window.S.saveAll()">💾 Save All ('+unsaved+')</button>':'')+'<button class="btn btn-sm btn-secondary" onclick="window.S.exportJSON()">📋 Export</button><button class="btn btn-sm btn-danger" onclick="window.S.clearResults()">Clear</button></div></div><div class="results-body">';
    for(let i=0;i<scrapeResults.length;i++){
      const r=scrapeResults[i];const tl=TL[r.tier_used]||TL[0];
      const sc=r.status==='ok'?'ok':r.status==='partial'?'partial':r.status==='fail'?'fail':'pending';
      const det=r.data?[r.data.product_name,r.data.category,r.data.msrp?'$'+Number(r.data.msrp).toLocaleString():null].filter(Boolean).join(' · ')||(r.status==='partial'?'basic data extracted':'data extracted'):(r.status==='pending'?'Extracting…':'No data');
      const specs=r.data?.specs?Object.keys(r.data.specs).length:0;
      const price=r.data?.msrp?'$'+Number(r.data.msrp).toLocaleString():'';
      const docs=r.data?.documents?.length||0;
      const imgs=r.data?.images?.length||0;
      const vids=r.data?.videos?.length||0;
      const feats=r.data?.features?.length||0;
      const assetBits=[];if(specs)assetBits.push(specs+' specs');if(imgs)assetBits.push(imgs+' imgs');if(docs)assetBits.push(docs+' docs');if(vids)assetBits.push(vids+' vids');if(feats)assetBits.push(feats+' features');
      const savedLabel=r._saved?'✓'+(r._assetLog?.length?' +'+r._assetLog.join(', '):''):'';
      const relBadge=r._relevant===false?'<span class="tier-badge t3" style="margin-left:4px" title="'+esc(r._irrelevantReason||'')+'">✕ not appliance</span>':'';
      h+='<div class="result-row"><div class="status '+sc+'"></div><div class="info"><div class="model-num">'+esc(r.model||r.data?.model||'—')+'<span class="brand-label">'+esc(r.brand||'')+'</span>'+relBadge+'</div><div class="detail">'+esc(det)+'</div>'+(assetBits.length||price?'<div class="detail">'+assetBits.join(' · ')+(assetBits.length&&price?' · ':'')+price+'</div>':'')+'</div><span class="tier-badge '+tl.cls+'">'+tl.icon+' T'+(r.tier_used||'?')+'</span><div class="cost">'+(r.cost>0?'$'+r.cost.toFixed(4):'FREE')+'</div><div class="actions">'+(r.data?'<button class="btn btn-sm btn-secondary" onclick="window.S.viewResult('+i+')">View</button>':'')+(r.data&&!r._saved?'<button class="btn btn-sm btn-primary" onclick="window.S.saveResult('+i+')">Save</button>':'')+(r._saved?'<span style="font-size:11px;color:var(--accent);font-weight:600">'+savedLabel+'</span>':'')+'</div></div>';
    }
    h+='</div></div>';
  }

  return h;
}

/* ═══ PRICE SYNC TAB ═══ */
function renderPriceSync() {
  let h='';

  // ── Current Session Stats — what's being collected right now ──
  if(rdDiscoveryResults.length>0){
    const total=rdDiscoveryResults.length;
    const newProd=rdDiscoveryResults.filter(r=>!r._pimMatch).length;
    const matched=rdDiscoveryResults.filter(r=>r._pimMatch).length;
    const scraped=rdDiscoveryResults.filter(r=>r._deepScraped).length;
    const saved=rdDiscoveryResults.filter(r=>r._saved).length;
    const imported=rdDiscoveryResults.filter(r=>r._pimMatch&&r._saved).length;
    const enriched=rdDiscoveryResults.filter(r=>r._enriched).length;
    // Count collected data
    let specCount=0,docCount=0,imgCount=0,featCount=0,relCount=0;
    for(const r of rdDiscoveryResults){
      if(r._specs)specCount+=Object.keys(r._specs).length;
      if(r._docs)docCount+=r._docs.length;
      if(r._images)imgCount+=r._images.length;
      if(r._features)featCount+=r._features.length;
      if(r._alsoViewed)relCount+=r._alsoViewed.length;
      if(r._bundles)relCount+=(Array.isArray(r._bundles)?r._bundles.length:0);
    }

    h+='<div style="background:linear-gradient(135deg,rgba(26,158,86,.06),rgba(47,111,237,.06));border:1px solid rgba(26,158,86,.2);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><span style="font-size:13px;font-weight:700;color:var(--txt)">📊 Session Collection</span>';
    if(isProcessing)h+='<span style="font-size:11px;color:var(--accent);font-weight:600;animation:pulse 1.5s infinite">⚙️ Scraping '+scrapeProgress.current+'/'+scrapeProgress.total+'</span>';
    h+='</div>';

    // Product pipeline
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">';
    const pill=(icon,count,label,color)=>count>0?'<div style="display:flex;align-items:center;gap:4px;background:rgba('+color+',.1);border:1px solid rgba('+color+',.25);border-radius:20px;padding:4px 10px"><span style="font-size:13px">'+icon+'</span><span style="font-size:12px;font-weight:700;color:rgba('+color+',1)">'+count+'</span><span style="font-size:10px;color:var(--txt2)">'+label+'</span></div>':'';
    h+=pill('🔍',total,'found','47,111,237');
    h+=pill('🆕',newProd,'new to PIM','217,119,6');
    h+=pill('✓',matched,'in PIM','26,158,86');
    h+=pill('🔬',scraped,'deep scraped','139,92,246');
    h+=pill('💾',saved,'saved','26,158,86');
    h+='</div>';

    // Collected data
    if(specCount+docCount+imgCount+featCount+relCount>0){
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid rgba(26,158,86,.15)">';
      h+=pill('📋',specCount,'specs','47,111,237');
      h+=pill('📄',docCount,'documents','192,45,30');
      h+=pill('🖼️',imgCount,'images','139,92,246');
      h+=pill('⭐',featCount,'features','217,119,6');
      h+=pill('🔗',relCount,'relationships','22,211,238');
      h+='</div>';
    }
    h+='</div>';
  }

  // ── Sub-navigation: Discover | Catalog | Price Check ──
  h+='<div style="display:flex;gap:2px;margin-bottom:16px;background:var(--surface);border-radius:8px;padding:3px;width:fit-content">';
  const modes=[['discover','🔍 Discover Products'],['catalog','📦 Catalog'],['price-check','💲 Price Check']];
  for(const[m,label] of modes){
    h+='<button onclick="window.S.rdSetMode(\''+m+'\')" style="padding:8px 16px;font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;font-family:inherit;transition:all .15s;'+(rdMode===m?'background:var(--accent);color:#fff':'background:transparent;color:var(--txt2)')+'">'+label+'</button>';
  }
  h+='</div>';

  // ── Market toggle ──
  const retailers=psRetailers.filter(r=>r.country===psMarket);
  h+='<div class="controls" style="flex-wrap:wrap;gap:10px;margin-bottom:12px">';
  h+='<div class="mode-toggle"><button class="'+(psMarket==='CA'?'active':'')+'" onclick="window.S.psSetMarket(\'CA\')">🇨🇦 Canada ('+retailers.length+')</button><button class="'+(psMarket==='US'?'active':'')+'" onclick="window.S.psSetMarket(\'US\')">🇺🇸 USA</button></div>';
  h+='</div>';

  if(rdMode==='discover') h+=renderRDDiscover(retailers);
  else if(rdMode==='catalog') h+=renderRDCatalog(retailers);
  else if(rdMode==='price-check') h+=renderRDPriceCheck(retailers);

  return h;
}

      h+='<td style="font-weight:600">'+(r.price?'$'+Number(r.price).toLocaleString():'—')+'</td>';
      h+='<td>'+pimBadge+'</td>';
      h+='<td style="font-size:11px">'+(dataIcons||'<span style="color:var(--txt2)">—</span>')+'</td>';
      h+='<td style="white-space:nowrap;font-size:10px">';

      else if(r._pimMatch)h+='<span style="color:var(--accent)">✓ in PIM</span>';

    }
    h+='</tbody></table></div>';

  return h;
}

/* ═══ ENRICH & COMPLETE TAB ═══ */
function renderEnrich() {
  let h='';
  if(!selectedBrand){h+='<div style="text-align:center;padding:60px 0;color:var(--txt2)"><div style="font-size:48px;margin-bottom:12px;opacity:.3">🧩</div><div style="font-size:16px;font-weight:700;color:var(--txt)">Select a brand to enrich</div></div>';return h}
  if(!brandIntel||brandIntel.brand!==selectedBrand){h+='<div style="padding:40px;text-align:center;color:var(--txt2)">Loading…</div>';return h}

  const products=brandIntel.products;
  const lowComp=products.filter(p=>completeness(p)<50).length;
  const anyIncomplete=products.filter(p=>completeness(p)<100).length;
  const withSource=products.filter(p=>p.source_reference).length;
  const filled=Object.values(enResults).reduce((s,r)=>s+(r.filled||0),0);
  const avgComp=products.length>0?Math.round(products.reduce((s,p)=>s+completeness(p),0)/products.length):0;

  h+='<div class="stats-row">';
  h+='<div class="stat-card"><div class="label">Avg Completeness</div><div class="value '+(avgComp>=70?'green':avgComp>=40?'amber':'red')+'">'+avgComp+'%</div></div>';
  h+='<div class="stat-card"><div class="label">Incomplete</div><div class="value '+(anyIncomplete>0?'amber':'green')+'">'+anyIncomplete+'</div></div>';
  h+='<div class="stat-card"><div class="label">Under 50%</div><div class="value '+(lowComp>0?'red':'green')+'">'+lowComp+'</div></div>';
  h+='<div class="stat-card"><div class="label">Have Source URL</div><div class="value">'+withSource+'</div></div>';
  h+='<div class="stat-card"><div class="label">Fields Filled</div><div class="value green">'+filled+'</div></div>';
  h+='</div>';

  h+='<div class="controls" style="gap:8px">';
  if(isProcessing){
    h+='<button class="btn" style="background:var(--red);color:#fff" onclick="window.S.requestStop()"'+(stopRequested?' disabled':'')+'>⏹ '+(stopRequested?'Stopping…':'Stop')+'</button>';
    h+='<span style="font-size:12px;color:var(--txt2)">⏳ Processing…</span>';
  } else {
    h+='<button class="btn btn-primary" onclick="window.S.enEnrichLow()" '+(lowComp===0?'disabled':'')+'>🧩 Fill Under 50% ('+lowComp+')</button>';
    h+='<button class="btn btn-primary" style="background:var(--blue)" onclick="window.S.enEnrichAll()" '+(anyIncomplete===0?'disabled':'')+'>🧩 Fill ALL Incomplete ('+anyIncomplete+')</button>';
    h+='<button class="btn btn-secondary" onclick="window.S.enRescrapeAll()" '+(withSource===0?'disabled':'')+'>🔄 Re-scrape PIM for Updates ('+withSource+')</button>';
  }
  h+='</div>';

  h+='<div class="log-panel'+(Object.keys(enResults).length>0?' show':'')+'" id="scrapeLog"></div>';

  const sorted=[...products].sort((a,b)=>completeness(a)-completeness(b));
  h+='<div class="table-wrap"><table class="prod-table"><thead><tr><th>Model</th><th>Category</th><th>Completeness</th><th>Missing</th><th>Status</th><th>Action</th></tr></thead><tbody>';
  for(const p of sorted.slice(0,80)){
    const comp=completeness(p);const miss=missingFields(p);const cls=comp>=70?'high':comp>=40?'med':'low';const barCls=comp>=70?'green':comp>=40?'amber':'red';
    const result=enResults[p.id];
    h+='<tr><td class="model-cell">'+esc(p.model)+'</td><td style="color:var(--txt2)">'+esc(p.category||'—')+'</td>';
    h+='<td><div style="display:flex;align-items:center;gap:6px"><span class="completeness '+cls+'">'+comp+'%</span><div class="pbar" style="width:60px"><div class="fill '+barCls+'" style="width:'+comp+'%"></div></div></div></td>';
    h+='<td style="font-size:11px;color:var(--txt2)">'+miss.slice(0,3).map(f=>f.replace(/_/g,' ')).join(', ')+(miss.length>3?' +' +(miss.length-3):'')+'</td>';
    h+='<td>';
    if(result&&result.filled>0)h+='<span class="completeness high">+'+result.filled+'</span>';
    else if(result)h+='<span class="completeness low">—</span>';
    h+='</td><td>';
    if(result&&result.filled>0&&!result._saved)h+='<button class="btn btn-sm btn-primary" onclick="window.S.enSave(\''+p.id+'\')">Save +'+result.filled+'</button>';
    else if(result&&result._saved)h+='<span style="color:var(--accent);font-size:11px">✓ saved</span>';
    else if(!result&&miss.length>0)h+='<button class="btn btn-sm btn-secondary" onclick="window.S.enEnrichOne(\''+p.id+'\')">Fill '+miss.length+' fields</button>';
    else if(!result)h+='<span style="color:var(--accent);font-size:11px">✓ complete</span>';
    h+='</td></tr>';
  }
  h+='</tbody></table></div>';
  if(sorted.length>80)h+='<div style="padding:8px;font-size:12px;color:var(--txt2)">Showing 80 of '+sorted.length+'</div>';
  return h;
}

  async scrapeDiscovered(){
    if(!discoverResults||isProcessing)return;

    // ── Resume support: load previously scraped URLs from localStorage ──
    const storageKey='aiq_scraped_'+selectedBrand;
    let scrapedUrls=new Set();
    try{
      const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
      if(saved.urls&&saved.brand===selectedBrand){
        scrapedUrls=new Set(saved.urls);
        // Mark already-scraped items so they show status in the table
        for(const url of scrapedUrls){
          if(!scrapeResults.find(sr=>sr.url===url)){
            scrapeResults.push({brand:selectedBrand,model:'',status:'ok',data:null,tier_used:0,cost:0,url,_saved:true,_resumed:true});
          }
        }
      }
    }catch(_){}

    // Filter: not in PIM, not already scraped this session, not in localStorage
    const newOnes=discoverResults.results.filter(r=>
      !r.in_pim &&
      !scrapeResults.find(sr=>sr.url===r.url && sr.status!=='pending') &&
      !scrapedUrls.has(r.url)
    );
    if(newOnes.length===0){logEntry('All '+discoverResults.results.length+' URLs already scraped or in PIM ✓','ok');renderTab();return}
    logEntry(newOnes.length+' remaining to scrape ('+scrapedUrls.size+' resumed from previous run, '+discoverResults.results.filter(r=>r.in_pim).length+' in PIM)','ok');

    isProcessing=true;stopRequested=false;
    scrapeProgress={current:0,total:newOnes.length,label:'Discover'};
    renderTab();

    // ── Parallel scraping: 3 concurrent ──
    const CONCURRENCY=3;
    let idx=0;
    const processNext=async()=>{
      while(idx<newOnes.length&&!stopRequested){
        const i=idx++;
        scrapeProgress.current=i+1;updateHeaderProgress();
        const item=newOnes[i];
        const result=await smartScrape(selectedBrand||'Unknown',item.model||'',item.url);
        await autoSaveIfEnabled(result);
        // Persist scraped URL to localStorage for resume
        scrapedUrls.add(item.url);
        try{localStorage.setItem(storageKey,JSON.stringify({brand:selectedBrand,urls:[...scrapedUrls],updated:Date.now()}))}catch(_){}
        // Brief pause to avoid hammering APIs
        await new Promise(r=>setTimeout(r,300));
      }
    };
    // Launch CONCURRENCY workers
    const workers=[];
    for(let w=0;w<Math.min(CONCURRENCY,newOnes.length);w++)workers.push(processNext());
    await Promise.all(workers);

    if(stopRequested)logEntry('⏹ Stopped at '+scrapeProgress.current+'/'+newOnes.length+' — will resume next time','err');
    else{logEntry('✅ All '+newOnes.length+' URLs scraped!','ok');markBrandScraped(selectedBrand)}
    isProcessing=false;stopRequested=false;
    scrapeProgress={current:0,total:0,label:''};
    renderTab();
  },

  // ── TIERED AI CALL — tries T2 Gemini → T3 GPT → T4 Haiku ──
  // mode='fallback' (default): stops at first success
  // mode='additive': runs all available tiers and combines results (for discovery)
  async _crawlAI(systemPrompt, userPrompt, maxTokens, mode){
    maxTokens=maxTokens||4000;
    mode=mode||'fallback';
    let result=null;
    const allResults=[];  // for additive mode

    // Helper: fetch with timeout
    async function fetchWithTimeout(url,opts,timeoutMs){
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),timeoutMs||30000);
      try{const r=await fetch(url,{...opts,signal:ctrl.signal});clearTimeout(timer);return r}
      catch(e){clearTimeout(timer);throw e}
    }

    // T2 — Gemini (cheapest, has Google Search grounding)
    const gKey=localStorage.getItem('aiq_google_key');
    if((!result||mode==='additive')&&gKey){
      logEntry('Tier 2 → '+geminiModel+' + Google Search…');
      try{
        const r=await fetchWithTimeout('https://generativelanguage.googleapis.com/v1beta/models/'+geminiModel+':generateContent?key='+gKey,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            systemInstruction:{parts:[{text:systemPrompt}]},
            contents:[{parts:[{text:userPrompt}]}],
            tools:[{google_search:{}}],
            generationConfig:{temperature:0.1,maxOutputTokens:maxTokens}
          })
        },45000);
        const data=await r.json();
        if(data.error){logEntry('T2 err: '+(data.error.message||JSON.stringify(data.error)),'err')}
        else{
          const txt=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\n')||'';
          const pt=data.usageMetadata?.promptTokenCount||0;
          const ct=data.usageMetadata?.candidatesTokenCount||0;
          const cost=(pt*0.0000003+ct*0.0000025);
          addCost(cost);
          if(txt.trim()){
            logEntry('T2 ✓ $'+cost.toFixed(4),'cost');
            result={text:txt,tier:2,cost};
            allResults.push(result);
          } else {logEntry('T2: empty response','err')}
        }
      }catch(e){logEntry('T2 '+(e.name==='AbortError'?'timeout (45s)':'err: '+e.message),'err')}
    }

    // T3 — GPT Luna (uses Responses API for web search)
    const oKey=localStorage.getItem('aiq_openai_key');
    if((!result||mode==='additive')&&oKey){
      const model=aiModel||'gpt-5.6-luna';
      logEntry('Tier 3 → '+model+'…');
      try{
        // Use Responses API which supports web_search_preview
        const body={model,temperature:0.1,
          input:[{role:'system',content:systemPrompt},{role:'user',content:userPrompt}],
          tools:[{type:'web_search_preview'}]};
        if(model.startsWith('gpt-5'))body.reasoning={effort:'none'};
        body.max_output_tokens=maxTokens;
        const r=await fetchWithTimeout('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+oKey},body:JSON.stringify(body)},45000);
        const data=await r.json();
        if(data.error){logEntry('T3 err: '+data.error.message,'err')}
        else{
          // Responses API returns output array
          const txt=(data.output||[]).filter(o=>o.type==='message').map(o=>(o.content||[]).filter(c=>c.type==='output_text').map(c=>c.text).join('')).join('\n')||'';
          const cost=((data.usage?.input_tokens||0)*0.0000004+(data.usage?.output_tokens||0)*0.0000016);
          addCost(cost);
          if(txt.trim()){
            logEntry('T3 ✓ $'+cost.toFixed(4),'cost');
            result={text:txt,tier:3,cost};
            allResults.push(result);
          } else {logEntry('T3: empty response','err')}
        }
      }catch(e){logEntry('T3 '+(e.name==='AbortError'?'timeout (45s)':'err: '+e.message),'err')}
    }

    // T4 — Haiku + web search (most powerful, most expensive)
    const aKey=localStorage.getItem('aiq_anthropic_key');
    if((!result||mode==='additive')&&aKey){
      logEntry('Tier 4 → Haiku + web search…');
      try{
        const r=await fetchWithTimeout('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':aKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,
            system:systemPrompt,
            tools:[{type:'web_search_20250305',name:'web_search'}],
            messages:[{role:'user',content:userPrompt}]})},45000);
        const data=await r.json();
        if(data.error){logEntry('T4 err: '+data.error.message,'err')}
        else{
          const texts=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
          const txt=texts.join('\n');
          addCost(0.30);
          if(txt.trim()){
            logEntry('T4 ✓ $0.30','cost');
            result={text:txt,tier:4,cost:0.30};
            allResults.push(result);
          } else {logEntry('T4: empty response','err')}
        }
      }catch(e){logEntry('T4 '+(e.name==='AbortError'?'timeout (45s)':'err: '+e.message),'err')}
    }

    if(!result&&allResults.length===0){
      logEntry('All tiers failed — check API keys (🔑 Keys button)','err');
    }

    // In additive mode, merge all results into one
    if(mode==='additive'&&allResults.length>1){
      return{text:allResults.map(r=>r.text).join('\n'),tier:'multi',cost:allResults.reduce((s,r)=>s+r.cost,0)};
    }
    return result;
  },
