  if (!productId || !mediaItems || !mediaItems.length) return results;

  for (const item of mediaItems) {
    if (!item.url) continue;

        const existing = await supaFetch(`pim_product_documents?product_id=eq.${productId}&file_url=eq.${encodeURIComponent(item.url)}&select=id`).then(r => r.json()).catch(() => []);
        if (existing.length > 0) { results.dupes++; continue; }
        const docType = item.type || "spec_sheet";
        await supaFetch("pim_product_documents", { method: "POST", body: JSON.stringify({
          product_id: productId, doc_type: docType,
          title: item.title || `${brandName} ${model} ${docType.replace(/_/g, " ")}`,
          file_url: item.url, file_name: item.file_name || item.url.split("/").pop() || `${docType}.pdf`,
          mime_type: item.mime_type || (item.url.endsWith(".pdf") ? "application/pdf" : "text/html"),
          language: "en", locale: "en-CA", is_current: true, source: "media_discovery",
          approved: false, verification_status: "unverified", manufacturer_verified: false,
          keywords: [brandName, model, "official", "manufacturer"].filter(Boolean),
          audience_tiers: ["public"], embargoed: false,
        }), headers: { Prefer: "return=minimal" } });
        results.docs++;

      } else if (item.category === "image") {
        const existing = await supaFetch(`pim_product_images?product_id=eq.${productId}&file_url=eq.${encodeURIComponent(item.url)}&select=id`).then(r => r.json()).catch(() => []);
        if (existing.length > 0) { results.dupes++; continue; }
        const imgType = item.type || "hero";
        await supaFetch("pim_product_images", { method: "POST", body: JSON.stringify({
          product_id: productId, image_type: imgType,
          file_url: item.url, cdn_url: item.url,
          alt_text: item.title || `${brandName} ${model} ${imgType}`,
          background: item.background || "white",
          is_primary: false, display_order: 0, source: "media_discovery",
          approved: false, verification_status: "unverified", manufacturer_verified: false,
          keywords: [brandName, model, "official"].filter(Boolean),
          audience_tiers: ["public"], embargoed: false,
        }), headers: { Prefer: "return=minimal" } });
        results.images++;

      } else if (item.category === "video") {
        // Check dupe by video_id or url
        let existing = [];
        if (item.video_id) {
          existing = await supaFetch(`pim_product_videos?product_id=eq.${productId}&external_video_id=eq.${encodeURIComponent(item.video_id)}&select=id`).then(r => r.json()).catch(() => []);
        }
        if (!existing.length) {
          existing = await supaFetch(`pim_product_videos?product_id=eq.${productId}&video_url=eq.${encodeURIComponent(item.url)}&select=id`).then(r => r.json()).catch(() => []);
        }
        if (existing.length > 0) { results.dupes++; continue; }
        const vidType = item.type || "product_overview";
        const embedUrl = item.embed_url || (item.video_id && item.platform === "youtube" ? `https://www.youtube.com/embed/${item.video_id}` : null);
        await supaFetch("pim_product_videos", { method: "POST", body: JSON.stringify({
          product_id: productId, video_type: vidType,
          title: item.title || `${brandName} ${model} Video`,
          description: `Official video discovered from manufacturer source for ${brandName} ${model}.`,
          video_url: item.url, embed_url: embedUrl,
          thumbnail_url: item.video_id ? `https://img.youtube.com/vi/${item.video_id}/hqdefault.jpg` : null,
          platform: item.platform || "manufacturer_cdn",
          external_video_id: item.video_id || null,
          language: "en", country: "CA",

function supaFetch(path, opts = {}) {

  });
}

function levenshteinDistance(a, b) {
  a = (a || "").toUpperCase(); b = (b || "").toUpperCase();
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

// Checks whether a near-identical model already exists for this brand in the OPPOSITE market.
// This is the core CA/US "clean separation" safeguard — near-identical model numbers across
// markets are common and must never be silently merged or mistaken for the same product.
async function checkCrossMarketMatch(brandName, model, currentMarket) {
  const otherMarket = currentMarket === "US" ? "CA" : "US";
  try {
    const res = await supaFetch(`aiq_products?brand_name=eq.${encodeURIComponent(brandName)}&market=eq.${otherMarket}&select=id,model,market,msrp,price_currency,source_reference&limit=200`);
    const candidates = await res.json();
    if (!candidates || !candidates.length) return null;
    let best = null;
    for (const c of candidates) {
      if (!c.model) continue;
      if (c.model.toUpperCase() === model.toUpperCase()) {
        return { match: c, distance: 0, otherMarket, severity: "identical" };
      }
      const dist = levenshteinDistance(model, c.model);
      if (dist <= 2 && (!best || dist < best.distance)) {
        best = { match: c, distance: dist, otherMarket, severity: dist === 1 ? "near-identical" : "similar" };
      }
    }
    return best;
  } catch (e) { return null; }
}

function extractJSON(text) {
  // Try direct parse first
  try { return JSON.parse(text.trim()); } catch {}
  // Strip markdown fences
  const stripped = text.replace(/```json\s*/g, "").replace(/```\s*/g, "").trim();
  try { return JSON.parse(stripped); } catch {}
  // Find the first { ... } block
  const start = stripped.indexOf("{");
  const end = stripped.lastIndexOf("}");
  if (start !== -1 && end > start) {
    try { return JSON.parse(stripped.slice(start, end + 1)); } catch {}
  }
  return null;
}

async function callClaude(systemPrompt, userMsg, retries = 3, modelOverride = null) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const headers = { "Content-Type": "application/json" };
      if (ANTHROPIC_API_KEY) {
        headers["x-api-key"] = ANTHROPIC_API_KEY;
        headers["anthropic-version"] = "2023-06-01";
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: modelOverride || "claude-haiku-4-5-20251001",
          max_tokens: 8000,
          system: systemPrompt,
          messages: [{ role: "user", content: userMsg }],
          tools: [{ type: "web_search_20250305", name: "web_search" }],
        }),
      });
      // Rate limited — wait and retry
      if (res.status === 429) {
        const wait = Math.min(15000, 5000 * (attempt + 1));
        if (attempt < retries) { await new Promise(r => setTimeout(r, wait)); continue; }
        return { found: false, error: "Rate limited — try again in a minute" };
      }
      // Overloaded
      if (res.status === 529 || res.status === 503) {
        if (attempt < retries) { await new Promise(r => setTimeout(r, 8000)); continue; }
        return { found: false, error: "API overloaded — try again shortly" };
      }
      if (!res.ok) {
        const errText = await res.text();
        if (attempt < retries) { await new Promise(r => setTimeout(r, 4000)); continue; }
        return { found: false, error: "API error " + res.status + ": " + errText.slice(0, 200) };
      }
      const data = await res.json();
      const allText = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n")
        // Strip citation tags, <cite>, <source>, etc. that Claude sometimes injects
        .replace(/<\/?(?:cite|antml:cite|source|ref|footnote|sup|annotation)[^>]*>/gi, "");
      const parsed = extractJSON(allText);
      if (parsed && (parsed.found === true || parsed.model || parsed.brand_name)) {
        parsed.found = true;
        return parsed;
      }
      if (attempt < retries) {
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
      return { found: false, error: "Could not parse product data from response", raw: allText.slice(0, 500) };
    } catch (e) {
      if (attempt < retries) { await new Promise(r => setTimeout(r, 4000)); continue; }
      return { found: false, error: e.message };
    }
  }
}

async function scrapeProduct(query, model, market) {
  // Free-data-first: try server-side search + extraction for ANY input (zero AI cost)
  const freeResult = await freeDataExtract(query.trim(), market);
  if (freeResult && freeResult.found && !freeResult._partial) {
    freeResult._savedModel = model;
    return freeResult;
  }
  // If partial free data, include it as context for the AI call
  if (freeResult && freeResult._partial) {
    const supplement = "\n\n[PRE-EXTRACTED DATA from page — use as starting point, verify and fill gaps]:\n" + JSON.stringify(freeResult, null, 2);
    let result = await callAI(getScrapePrompt(market), "Find all product specifications for: " + query + supplement, 3, model);
    if (result.found) { result._freeDataAssist = true; return result; }
  }
  // Full AI fallback
  let result = await callAI(getScrapePrompt(market), "Find all product specifications for: " + query, 3, model);
  if (result.found) return result;
  const fallbackPrompt = "Search the web for this appliance product and return a JSON object with the product data. Search for the manufacturer's website specifically. Return ONLY valid JSON, no other text.\n\nThe JSON must have: found (true/false), source_url, manufacturer_name, brand_name, model, category, short_description, msrp, finish, color, available_colors (array of {color, finish, model_number, msrp}), width_inches, height_inches, depth_inches, weight_lbs, energy_star, features (array of strings), images (array of {url, type, alt}), specs (object with capacity_cu_ft, voltage, amperage, installation_type etc).\n\nReturn ALL image URLs from the product gallery. Return ALL color/finish options.";
  result = await callAI(fallbackPrompt, query + " — search the manufacturer website for full specs, all images, all colors, and MSRP price", 3, model);
  if (result.found) return result;
  // Auto-fallback: if OpenAI model failed (no real web search), retry with Haiku
  const modelInfo = MODELS.find(m => m.id === model);
  if (modelInfo && modelInfo.provider === "openai" && ANTHROPIC_API_KEY) {
    const haikuResult = await callAI(getScrapePrompt(market), "Find all product specifications for: " + query, 3, "claude-haiku-4-5-20251001");
    if (haikuResult.found) { haikuResult._autoFallback = "Haiku (auto-fallback from " + modelInfo.short + ")"; return haikuResult; }
  }
  return { found: false, query, error: result.error || "Product not found after multiple attempts" };
}

  bg: "#0f1117", card: "#181a22", cardHover: "#1e2130", border: "#2a2d3a",
  accent: "#6c5ce7", accentSoft: "#6c5ce720", accentText: "#a29bfe",
  text: "#e4e6ed", textDim: "#8b8fa3", textMuted: "#5a5e72",
  green: "#00b894", greenSoft: "#00b89420", red: "#e17055", redSoft: "#e1705520",
  yellow: "#fdcb6e", yellowSoft: "#fdcb6e20", blue: "#74b9ff",
};

const s = {
  app: { background: palette.bg, color: palette.text, minHeight: "100vh", fontFamily: "'Inter', -apple-system, sans-serif", padding: "0" },
  header: { padding: "24px 32px", borderBottom: `1px solid ${palette.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" },
  logo: { fontSize: 20, fontWeight: 700, letterSpacing: "-0.5px", color: palette.text },
  logoAccent: { color: palette.accent },
  main: { maxWidth: 1100, margin: "0 auto", padding: "32px" },
  inputRow: { display: "flex", gap: 12, marginBottom: 24 },
  input: { flex: 1, padding: "12px 16px", background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 8, color: palette.text, fontSize: 14, outline: "none" },
  textarea: { width: "100%", padding: "12px 16px", background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 8, color: palette.text, fontSize: 13, outline: "none", fontFamily: "monospace", resize: "vertical", minHeight: 80 },
  btn: { padding: "12px 24px", background: palette.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer" },
  btnSm: { padding: "8px 16px", fontSize: 13 },
  btnOutline: { background: "transparent", border: `1px solid ${palette.border}`, color: palette.textDim },
  btnGreen: { background: palette.green },
  btnRed: { background: palette.red },
  card: { background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 12, padding: 24, marginBottom: 16 },
  label: { fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.5px", color: palette.textMuted, marginBottom: 4 },
  val: { fontSize: 14, color: palette.text },
  grid: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 },
  badge: { display: "inline-block", padding: "2px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600 },
  tab: { padding: "8px 16px", background: "transparent", border: "none", color: palette.textDim, fontSize: 13, fontWeight: 500, cursor: "pointer", borderBottom: "2px solid transparent" },
  tabActive: { color: palette.accent, borderBottom: `2px solid ${palette.accent}` },
  stat: { textAlign: "center" },
  statNum: { fontSize: 28, fontWeight: 700, color: palette.accent },
  statLabel: { fontSize: 11, color: palette.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" },
  spinner: { display: "inline-block", width: 16, height: 16, border: `2px solid ${palette.border}`, borderTopColor: palette.accent, borderRadius: "50%", animation: "spin 0.8s linear infinite" },
};

function Badge({ children, color = "accent" }) {
  const colors = { accent: { bg: palette.accentSoft, fg: palette.accentText }, green: { bg: palette.greenSoft, fg: palette.green }, red: { bg: palette.redSoft, fg: palette.red }, yellow: { bg: palette.yellowSoft, fg: palette.yellow } };
  const c = colors[color] || colors.accent;
  return <span style={{ ...s.badge, background: c.bg, color: c.fg }}>{children}</span>;
}

function Field({ label, value, editable, onChange }) {
  if (value === null || value === undefined || value === "") return null;
  return (
    <div>
      <div style={s.label}>{label}</div>
      {editable ? (
        <input style={{ ...s.input, padding: "6px 10px", fontSize: 13 }} value={value ?? ""} onChange={(e) => onChange(e.target.value)} />
      ) : (
        <div style={s.val}>{typeof value === "boolean" ? (value ? "Yes" : "No") : String(value)}</div>
      )}
    </div>
  );
}

function ResultCard({ result, onSave, onDiscard, saving }) {
  const [editing, setEditing] = useState(false);
  const [data, setData] = useState(result);
  const [ackCrossMarket, setAckCrossMarket] = useState(false);
  const upd = (k, v) => setData((d) => ({ ...d, [k]: v }));

  if (!data.found) {
    return (
      <div style={{ ...s.card, borderColor: palette.red }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ color: palette.red, fontWeight: 600 }}>Not found: {data.query}</span>
          <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={onDiscard}>Dismiss</button>
        </div>
        {data.error && <div style={{ color: palette.textDim, fontSize: 13, marginTop: 8 }}>{data.error}</div>}
      </div>
    );
  }

  const cmw = data._crossMarketWarning;
  const marketFlag = data._market === "US" ? "🇺🇸" : "🇨🇦";
  const needsAck = !!cmw && !ackCrossMarket;

  return (
    <div style={{ ...s.card, ...(cmw ? { borderColor: palette.yellow, borderWidth: 2 } : {}) }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{marketFlag} {data.brand_name} {data.model}</div>
          <div style={{ fontSize: 13, color: palette.textDim }}>{data.short_description}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          {/* Condition badges */}
          <Badge color={(!data.condition?.is_discontinued && !data.condition?.is_clearance && !data.condition?.is_end_of_life) ? "green" : 
            data.condition?.is_discontinued ? "red" : "yellow"}>
            {data.condition?.status || data.status || "active"}
          </Badge>
          {data.condition?.is_clearance && <Badge color="yellow">🏷️ Clearance</Badge>}
          {data.condition?.is_end_of_life && <Badge color="yellow">⚠️ End of Life</Badge>}
          {data.condition?.is_open_box && <Badge color="yellow">📦 Open Box</Badge>}
          {data.condition?.is_refurbished && <Badge color="yellow">🔧 Refurbished</Badge>}
          {data.condition?.flags?.filter(f => !["clearance","end_of_life","open_box","refurbished","discontinued"].includes(f)).map((f,i) => (
            <Badge key={i} color="yellow">{f.replace(/_/g," ")}</Badge>
          ))}
          {data.condition?.replacement_model && (
            <span style={{ fontSize: 11, color: palette.textDim }}>→ replaced by <strong>{data.condition.replacement_model}</strong></span>
          )}
          <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline }} onClick={() => setEditing(!editing)}>{editing ? "Done" : "Edit"}</button>
          <button style={{ ...s.btn, ...s.btnSm, ...s.btnOutline, ...s.btnRed, border: "none", color: "#fff" }} onClick={onDiscard}>Skip</button>
          <button style={{ ...s.btn, ...s.btnSm, ...(needsAck ? { background: palette.border, cursor: "not-allowed" } : s.btnGreen) }} onClick={() => onSave(data)} disabled={saving || needsAck}>
            {saving ? "Saving…" : needsAck ? "Review required ↓" : "Save to PIM"}
          </button>
        </div>
      </div>

      {cmw && (
        <div style={{ padding: "12px 16px", background: palette.yellowSoft, border: `1px solid ${palette.yellow}60`, borderRadius: 8, marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
            <span style={{ fontSize: 16 }}>⚠️</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, color: palette.yellow, fontSize: 13, marginBottom: 4 }}>
                {cmw.severity === "identical" ? "Identical model number" : cmw.severity === "near-identical" ? "Near-identical model number" : "Similar model number"} found in {cmw.otherMarket === "US" ? "🇺🇸 US" : "🇨🇦 Canada"} catalog
              </div>
              <div style={{ fontSize: 12, color: palette.textDim, lineHeight: 1.6 }}>
                <strong>{data.model}</strong> ({marketFlag} {data._market}) vs. existing <strong>{cmw.match.model}</strong> ({cmw.otherMarket === "US" ? "🇺🇸" : "🇨🇦"} {cmw.otherMarket})
                {cmw.distance > 0 ? ` — differs by ${cmw.distance} character${cmw.distance > 1 ? "s" : ""}` : " — exact same model number"}.
                {cmw.match.msrp ? ` Existing record: $${cmw.match.msrp} ${cmw.match.price_currency || ""}.` : ""}
                {" "}This is common when a manufacturer sells the same physical unit under slightly different model numbers per country — verify this is genuinely a separate {data._market}-market product before saving, not a duplicate of the {cmw.otherMarket} one.
              </div>
              <label style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, fontSize: 12, color: palette.text, cursor: "pointer" }}>
                <input type="checkbox" checked={ackCrossMarket} onChange={(e) => setAckCrossMarket(e.target.checked)} />
                I've verified this is a distinct {data._market} product — save it
              </label>
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
        {data.source_url && <span style={{ fontSize: 12, color: palette.blue }}>Source: <a href={data.source_url} target="_blank" rel="noreferrer" style={{ color: palette.blue }}>{data.source_url}</a></span>}
        {data._model && (() => { const mi = MODELS.find(m => m.id === data._model); return mi ? <span style={{ ...s.badge, background: mi.color + "20", color: mi.color, fontSize: 9 }}>{mi.short}</span> : null; })()}
      </div>

      <div style={s.grid}>
        <Field label="Brand" value={data.brand_name} editable={editing} onChange={(v) => upd("brand_name", v)} />
        <Field label="Model" value={data.model} editable={editing} onChange={(v) => upd("model", v)} />
        <Field label="Category" value={data.category} editable={editing} onChange={(v) => upd("category", v)} />
        <Field label="Series" value={data.series} editable={editing} onChange={(v) => upd("series", v)} />
        <Field label="Product Line" value={data.product_line} editable={editing} onChange={(v) => upd("product_line", v)} />
        <Field label="MSRP" value={data.msrp} editable={editing} onChange={(v) => upd("msrp", v)} />
        <Field label="UPC" value={data.upc} editable={editing} onChange={(v) => upd("upc", v)} />
        <Field label="Finish" value={data.finish} editable={editing} onChange={(v) => upd("finish", v)} />
        <Field label="Color" value={data.color} editable={editing} onChange={(v) => upd("color", v)} />
        <Field label="Width (in)" value={data.width_inches} editable={editing} onChange={(v) => upd("width_inches", v)} />
        <Field label="Height (in)" value={data.height_inches} editable={editing} onChange={(v) => upd("height_inches", v)} />
        <Field label="Depth (in)" value={data.depth_inches} editable={editing} onChange={(v) => upd("depth_inches", v)} />
        <Field label="Weight (lbs)" value={data.weight_lbs} editable={editing} onChange={(v) => upd("weight_lbs", v)} />
        <Field label="Energy Star" value={data.energy_star} />
        <Field label="ADA" value={data.ada_compliant} />
        <Field label="Made In" value={data.made_in} editable={editing} onChange={(v) => upd("made_in", v)} />
      </div>

      {data.specs && Object.keys(data.specs).some((k) => data.specs[k] !== null) && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 12 }}>Specifications</div>
          <div style={s.grid}>
            {Object.entries(data.specs).map(([k, v]) => v !== null && v !== "" && (
              <Field key={k} label={k.replace(/_/g, " ")} value={v} />
            ))}
          </div>
        </div>
      )}

      {/* Pricing row */}
      <div style={{ display: "flex", gap: 12, marginTop: 16, flexWrap: "wrap", alignItems: "stretch" }}>
        {(data.pricing?.msrp || data.msrp) && (
          <div style={{ padding: "10px 20px", background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 8, minWidth: 120 }}>
            <div style={{ fontSize: 10, color: palette.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>MSRP</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: palette.text }}>${parseFloat(data.pricing?.msrp || data.msrp).toLocaleString()}</div>
          </div>
        )}
        {data.pricing?.sale_price && (
          <div style={{ padding: "10px 20px", background: palette.redSoft, border: `1px solid ${palette.red}40`, borderRadius: 8, minWidth: 120 }}>
            <div style={{ fontSize: 10, color: palette.red, textTransform: "uppercase", letterSpacing: "0.5px" }}>Sale Price</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: palette.red }}>${parseFloat(data.pricing.sale_price).toLocaleString()}</div>
            {data.pricing.sale_ends && <div style={{ fontSize: 10, color: palette.textMuted }}>ends {data.pricing.sale_ends}</div>}
          </div>
        )}
        {data.pricing?.lowest_price && (
          <div style={{ padding: "10px 20px", background: palette.greenSoft, border: `1px solid ${palette.green}40`, borderRadius: 8, minWidth: 120 }}>
            <div style={{ fontSize: 10, color: palette.green, textTransform: "uppercase", letterSpacing: "0.5px" }}>Lowest Found</div>
            <div style={{ fontSize: 22, fontWeight: 700, color: palette.green }}>${parseFloat(data.pricing.lowest_price).toLocaleString()}</div>
            {data.pricing.lowest_price_source && <div style={{ fontSize: 10, color: palette.textMuted }}>{data.pricing.lowest_price_source}</div>}
          </div>
        )}
        {data.pricing?.msrp && data.pricing?.lowest_price && parseFloat(data.pricing.lowest_price) < parseFloat(data.pricing.msrp) && (
          <div style={{ padding: "10px 20px", background: palette.accentSoft, borderRadius: 8, display: "flex", flexDirection: "column", justifyContent: "center", minWidth: 100 }}>
            <div style={{ fontSize: 10, color: palette.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>Savings</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: palette.accent }}>
              {Math.round((1 - parseFloat(data.pricing.lowest_price) / parseFloat(data.pricing.msrp)) * 100)}% off
            </div>
            <div style={{ fontSize: 11, color: palette.textDim }}>${(parseFloat(data.pricing.msrp) - parseFloat(data.pricing.lowest_price)).toLocaleString()} saved</div>
          </div>
        )}
        {data.finish && (
          <div style={{ padding: "10px 20px", background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 8, display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontSize: 10, color: palette.textMuted, textTransform: "uppercase" }}>Finish</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: palette.text }}>{data.finish}</div>
          </div>
        )}
        {data.pricing?.price_checked_sources?.length > 0 && (
          <div style={{ padding: "10px 20px", display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontSize: 10, color: palette.textMuted, textTransform: "uppercase" }}>Checked</div>
            <div style={{ fontSize: 11, color: palette.textDim }}>{data.pricing.price_checked_sources.join(", ")}</div>
          </div>
        )}
      </div>

      {/* Condition notes */}
      {data.condition?.notes && (
        <div style={{ marginTop: 8, padding: "6px 12px", background: palette.yellowSoft, borderRadius: 6, fontSize: 12, color: palette.yellow }}>
          ℹ️ {data.condition.notes}
        </div>
      )}

      {/* Available Colors / Finishes */}
      {data.available_colors && data.available_colors.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 8 }}>Available Colors & Finishes ({data.available_colors.length})</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {data.available_colors.map((c, i) => (
              <div key={i} style={{ padding: "8px 14px", background: palette.card, border: `1px solid ${palette.border}`, borderRadius: 8, fontSize: 13 }}>
                <div style={{ fontWeight: 600, color: palette.text }}>{c.color || c.finish}</div>
                {c.model_number && <div style={{ fontSize: 11, color: palette.textMuted, fontFamily: "monospace" }}>{c.model_number}</div>}
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 2 }}>
                  {c.msrp && <span style={{ fontSize: 12, color: c.sale_price ? palette.textMuted : palette.accent, fontWeight: 600, textDecoration: c.sale_price ? "line-through" : "none" }}>${parseFloat(c.msrp).toLocaleString()}</span>}
                  {c.sale_price && <span style={{ fontSize: 12, color: palette.red, fontWeight: 600 }}>${parseFloat(c.sale_price).toLocaleString()}</span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Product Images */}
      {data.images && data.images.filter((img) => (typeof img === "string" ? img : img?.url)).length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 8 }}>Product Images ({data.images.filter((img) => (typeof img === "string" ? img : img?.url)).length})</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10 }}>
            {data.images.filter((img) => (typeof img === "string" ? img : img?.url)).map((img, i) => {
              const url = typeof img === "string" ? img : img.url;
              const type = typeof img === "string" ? (i === 0 ? "hero" : "product") : (img.type || "product");
              return (
                <div key={i} style={{ position: "relative" }}>
                  <a href={url} target="_blank" rel="noreferrer">
                    <img src={url} alt={`Product ${i + 1}`} style={{ width: "100%", height: 140, objectFit: "contain", borderRadius: 8, background: "#fff", border: `1px solid ${palette.border}`, display: "block" }}
                      onError={(e) => { e.target.parentElement.parentElement.style.display = "none"; }} />
                  </a>
                  <div style={{ position: "absolute", top: 6, left: 6, ...s.badge, background: "rgba(0,0,0,0.75)", color: "#fff", fontSize: 9 }}>{type}</div>
                  {i === 0 && <div style={{ position: "absolute", top: 6, right: 6, ...s.badge, background: palette.accent, color: "#fff", fontSize: 9 }}>PRIMARY</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {data.features && data.features.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 8 }}>Features ({data.features.length})</div>
          <ul style={{ margin: 0, paddingLeft: 20, fontSize: 13, color: palette.textDim, columns: data.features.length > 6 ? 2 : 1, columnGap: 24 }}>
            {data.features.map((f, i) => <li key={i} style={{ marginBottom: 4 }}>{f}</li>)}
          </ul>
        </div>
      )}

      {data.documents && data.documents.filter((d) => d.url).length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 8 }}>Documents Found</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {data.documents.filter((d) => d.url).map((d, i) => (
              <a key={i} href={d.url} target="_blank" rel="noreferrer" style={{ ...s.badge, background: palette.accentSoft, color: palette.accentText, textDecoration: "none", padding: "4px 10px" }}>
                📄 {d.type?.replace(/_/g, " ") || "doc"} ↗
              </a>
            ))}
          </div>
        </div>
      )}

      {/* Retailer Price Results */}
      {data.retailers && data.retailers.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...s.label, marginBottom: 8 }}>Retailer Prices ({data.retailers.length} found)</div>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead><tr style={{ borderBottom: "1px solid " + palette.border }}>
              <th style={{ padding: "8px", textAlign: "left", color: palette.textMuted }}>Retailer</th>
              <th style={{ padding: "8px", textAlign: "right", color: palette.textMuted }}>Price</th>
              <th style={{ padding: "8px", textAlign: "right", color: palette.textMuted }}>Regular</th>
              <th style={{ padding: "8px", textAlign: "center", color: palette.textMuted }}>Stock</th>
              <th style={{ padding: "8px", textAlign: "center", color: palette.textMuted }}>Condition</th>
              <th style={{ padding: "8px", textAlign: "center", color: palette.textMuted }}>Delivery</th>
            </tr></thead>
            <tbody>{[...data.retailers].sort((a,b) => (a.price||99999) - (b.price||99999)).map((r, i) => {
              const isLowest = i === 0 && r.price;
              return (
              <tr key={i} style={{ borderBottom: "1px solid " + palette.border + "20", background: isLowest ? palette.greenSoft : "transparent" }}>
                <td style={{ padding: "8px" }}>
                  <div style={{ fontWeight: 600 }}>{r.retailer}{isLowest ? " 🏆" : ""}</div>
                  {r.url && <a href={r.url} target="_blank" rel="noreferrer" style={{ fontSize: 10, color: palette.blue }}>View ↗</a>}
                </td>
                <td style={{ padding: "8px", textAlign: "right", fontWeight: 700, fontSize: 14, color: r.on_sale ? palette.red : palette.green }}>
                  {r.price ? "$" + parseFloat(r.price).toLocaleString() : "—"}
                  {r.on_sale && r.sale_label ? <div style={{ fontSize: 10, color: palette.red }}>{r.sale_label}</div> : ""}
                </td>
                <td style={{ padding: "8px", textAlign: "right", color: palette.textMuted, textDecoration: r.on_sale ? "line-through" : "none" }}>
                  {r.regular_price ? "$" + parseFloat(r.regular_price).toLocaleString() : "—"}
                </td>
                <td style={{ padding: "8px", textAlign: "center" }}>
                  {r.in_stock === true ? <span style={{ color: palette.green }}>✓ In Stock</span> : r.in_stock === false ? <span style={{ color: palette.red }}>✗ Out</span> : "—"}
                  {r.stock_note ? <div style={{ fontSize: 10, color: palette.textMuted }}>{r.stock_note}</div> : ""}
                </td>
                <td style={{ padding: "8px", textAlign: "center" }}>
                  {r.is_open_box ? <span class="pill" style={{ background: palette.yellowSoft, color: palette.yellow, fontSize: 10 }}>Open Box</span> :
                   r.is_clearance ? <span class="pill" style={{ background: palette.yellowSoft, color: palette.yellow, fontSize: 10 }}>Clearance</span> :
                   r.is_floor_model ? <span class="pill" style={{ background: palette.yellowSoft, color: palette.yellow, fontSize: 10 }}>Floor</span> :
                   <span style={{ color: palette.textMuted, fontSize: 11 }}>New</span>}
                </td>
                <td style={{ padding: "8px", textAlign: "center", fontSize: 11 }}>
                  {r.free_delivery ? <span style={{ color: palette.green }}>Free</span> : r.shipping_cost ? "$" + r.shipping_cost : "—"}
                </td>
              </tr>);
            })}</tbody>
          </table>
        </div>
      )}

      {/* Company Intel Results */}
      {data._intel && data.found && (
        <div style={{ marginTop: 16 }}>
          <div style={s.grid}>
            {data.type && <Field label="Type" value={data.type} />}
            {data.parent_company && <Field label="Parent Company" value={data.parent_company} />}
            {data.headquarters && <Field label="HQ" value={data.headquarters} />}
            {data.founded && <Field label="Founded" value={data.founded} />}
            {data.employee_count && <Field label="Employees" value={data.employee_count} />}
            {data.annual_revenue && <Field label="Revenue" value={data.annual_revenue} />}
            {data.market_segment && <Field label="Market" value={data.market_segment} />}
          </div>

  );
}

  const activateProfile = useCallback((idx) => {

  }, [profiles]);

  const saveProfiles = useCallback((newProfiles) => {
    setProfiles(newProfiles);
    KEY_PROFILES = newProfiles;
    try { localStorage.setItem("aiq_key_profiles", JSON.stringify(newProfiles)); } catch(e) {}
  }, []);

  const startAddProfile = () => {
    setEditingProfile(-1);
    setEditName("");
    setEditAnthropic("");
    setEditOpenai("");
  };

  const startEditProfile = (idx) => {
    const p = profiles[idx];
    setEditingProfile(idx);
    setEditName(p.name);
    setEditAnthropic(p.anthropic || "");

  };

  const saveEditingProfile = () => {
    if (!editName.trim()) return;

    let updated;
    if (editingProfile === -1) {
      updated = [...profiles, entry];
    } else {
      updated = profiles.map((p, i) => i === editingProfile ? entry : p);
    }
    saveProfiles(updated);
    const newIdx = editingProfile === -1 ? updated.length - 1 : editingProfile;
    activateProfile(newIdx);
    setEditingProfile(null);

  const deleteProfile = (idx) => {
    const updated = profiles.filter((_, i) => i !== idx);
    saveProfiles(updated);
    if (activeProfileIdx >= updated.length) {
      if (updated.length > 0) activateProfile(0);
      else { setApiKey(""); setOpenaiKey(""); ANTHROPIC_API_KEY = ""; OPENAI_API_KEY = ""; }
    } else if (idx === activeProfileIdx && updated.length > 0) {
      activateProfile(0);

  };
  const [selectedModel, setSelectedModel] = useState(SAVED_MODEL || "");

  // Save company intel to Supabase

            closed_date: loc.closed || null,
            source_url: data.website || null,
          }), headers: { Prefer: "return=minimal" } }).catch(() => {});

      }

    } catch (e) {
      setErrors(p => [...p, "Intel save " + (data.name || "") + ": " + e.message]);
      saveCountRef.current.failed++;
      return false;
    }
  };

  // Save news items
  const doNewsSave = async (data) => {
    try {
      if (!data.news || !data.news.length) return false;
      for (const n of data.news) {
        // Try to link to company
        let companyId = null;
        if (n.company) {
          const checkRes = await supaFetch("intel_companies?name=ilike.*" + encodeURIComponent(n.company) + "*&select=id&limit=1");
          const co = await checkRes.json();
          if (co && co.length) companyId = co[0].id;
        }
        await supaFetch("intel_news", { method: "POST", body: JSON.stringify({
          company_id: companyId,
          company_name: n.company || data.query || "",
          headline: n.headline,
          summary: n.summary || null,
          category: n.category || null,
          source_name: n.source_name || null,

        }), headers: { Prefer: "return=minimal" } }).catch(() => {});
      }

      saveCountRef.current.saved++;
      return true;
    } catch (e) {
      setErrors(p => [...p, "News save: " + e.message]);
      return false;
    }
  };
  
  // Discovery state
  const [discoverBrand, setDiscoverBrand] = useState("");
  const [discoverCategory, setDiscoverCategory] = useState("");
  const [discoverUrl, setDiscoverUrl] = useState("");
  const [discovered, setDiscovered] = useState([]); // discovered model list
  const [discoverPhase, setDiscoverPhase] = useState("idle"); // idle | discovering | discovered | scraping
  const [selectedModels, setSelectedModels] = useState(new Set());
  const [allBrands, setAllBrands] = useState([]);
  const [brandSearch, setBrandSearch] = useState("");

  // Get the effective model for the current mode + submode
  const getSubmode = () => {
    if (mode === "pricecheck") return priceMode;
    if (mode === "retailer") return retailerMode;
    if (mode === "intel") return intelMode;

  }, [selectedModel, mode, priceMode, retailerMode, intelMode, discoverPhase]);

  const activeModel = getModel();
  const activeModelInfo = MODELS.find(m => m.id === activeModel) || MODELS[0];

  // Load brands from DB on mount
  const loadBrands = useCallback(async () => {
    try {
      const res = await supaFetch("brand_catalog?is_active=eq.true&select=brand_name,parent_company&order=brand_name&limit=500");

  // Load brands on first render

  const loadExisting = useCallback(async () => {
    setLoading(true);
    try {
      const res = await supaFetch("aiq_products?select=id,model,brand_name,category,width_inches,height_inches,depth_inches,msrp,finish,color,status&order=brand_name,model&limit=5000");
      const data = await res.json();

  // ── Media Discovery runner (shared by single/bulk and from-PIM) ──
  const runMediaDiscovery = async (lines) => {
    if (!lines.length) return;
    setLoading(true);
    setResults([]);
    setProgress({ current: 0, total: lines.length, currentQuery: "" });
    abortRef.current = false;
    const activeModel = getModel();

    for (let i = 0; i < lines.length; i++) {
      if (abortRef.current) { abortRef.current = false; break; }
      const line = lines[i];
      setProgress({ current: i + 1, total: lines.length, currentQuery: line });

      const parts = line.split(/\s+/);
      let brandGuess = parts[0];
      let modelGuess = parts.slice(1).join(" ");
      if (!modelGuess) { modelGuess = brandGuess; brandGuess = ""; }

      let productId = null;
      let brandName = brandGuess;
      let modelName = modelGuess;
      try {
        const lookupRes = await supaFetch("aiq_products?model=eq." + encodeURIComponent(modelGuess) + "&select=id,brand_name,model");
        const matches = await lookupRes.json();
        if (matches && matches.length > 0) {
          productId = matches[0].id;
          brandName = matches[0].brand_name;
          modelName = matches[0].model;
        } else if (brandGuess) {
          const lookupRes2 = await supaFetch("aiq_products?brand_name=ilike." + encodeURIComponent(brandGuess + "*") + "&model=eq." + encodeURIComponent(modelGuess) + "&select=id,brand_name,model");
          const matches2 = await lookupRes2.json();
          if (matches2 && matches2.length > 0) {
            productId = matches2[0].id;
            brandName = matches2[0].brand_name;
            modelName = matches2[0].model;
          }
        }
      } catch (e) { console.warn("Product lookup error:", e); }

      const result = await mediaDiscover(brandName || brandGuess, modelName || modelGuess, activeModel);
      result.query = line;
      result._brandName = brandName;
      result._model = modelName;
      result._productId = productId;

      if (result.found && result.media && result.media.length > 0) {
        if (productId && autoSave) {
          const saveResult = await doMediaSave(result.media, productId, brandName, modelName, result.source_url);
          result._saveResult = saveResult;
          setSaved(p => [...p, { model: modelName, action: "media: " + saveResult.docs + "d " + saveResult.images + "i " + saveResult.videos + "v (" + saveResult.dupes + " dupes)" }]);
        } else if (!productId) {
          result._noProduct = true;
        }
      }

      setResults(p => [...p, result]);
      if (i < lines.length - 1) await new Promise(r => setTimeout(r, 3000));
    }
    setLoading(false);
  };

  const [autoSave, setAutoSave] = useState(true);
  const [saveQueue, setSaveQueue] = useState([]); // tracks auto-saved items
  const saveCountRef = useRef({ saved: 0, failed: 0 });

  // ── Universal Data Sanitizer ──────────────────────────────────────────
  // Handles messy/inconsistent AI responses: wrong field names, citation tags,
  // "Yes"/"No" strings in boolean columns, "$1,299.99" in numeric columns, etc.

  function stripTags(val) {
    // Remove <cite>, <cite>, and any other XML/HTML tags from values
    if (typeof val !== "string") return val;
    return val.replace(/<\/?[^>]+(>|$)/g, "").replace(/&lt;\/?[^&]+(>|&gt;)/g, "").trim();
  }

  function toBool(val) {
    if (typeof val === "boolean") return val;
    if (val == null || val === "") return null;
    const s = stripTags(String(val)).toLowerCase().trim();
    if (["yes", "true", "1", "y"].includes(s)) return true;
    if (["no", "false", "0", "n", "n/a", "na", "none"].includes(s)) return false;
    return null; // genuinely unparseable → null (nullable column)
  }

  function toNum(val) {
    if (typeof val === "number") return isNaN(val) ? null : val;
    if (val == null || val === "") return null;
    const s = stripTags(String(val))
      .replace(/[$€£¥,CAD USD]/g, "")  // strip currency
      .replace(/\s*(lbs?|kg|inches|in|"|″|cu\.?\s*ft\.?|watts?|W|amps?|A|volts?|V|hz)\s*$/i, "") // strip units
      .trim();
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  // Map common AI-generated field names → actual aiq_products columns
  const FIELD_ALIASES = {
    product_name: "short_description",
    name: "short_description",
    title: "short_description",
    product_title: "short_description",
    description: "short_description",
    product_description: "long_description",
    full_description: "long_description",
    marketing_description: "long_description",
    price: "msrp",
    retail_price: "msrp",
    list_price: "msrp",
    suggested_price: "msrp",
    regular_price: "msrp",
    width: "width_inches",
    height: "height_inches",
    depth: "depth_inches",
    weight: "weight_lbs",
    capacity: "capacity_cu_ft",
    color_name: "color",
    finish_name: "finish",
    colour: "color",
    colour_family: "color_family",
    model_number: "model",
    sku: "model",
    is_energy_star: "energy_star",
    energystar: "energy_star",
    is_ada_compliant: "ada_compliant",
    ada: "ada_compliant",
    discontinued: "is_discontinued",
    clearance: "is_clearance",
    end_of_life: "is_end_of_life",
    open_box: "is_open_box",
    refurbished: "is_refurbished",
    brand: "brand_name",
    manufacturer: "manufacturer_name",
  };

  // All boolean columns in aiq_products
  const BOOL_COLS = new Set([
    "energy_star", "ada_compliant", "public_visible", "ships_ltl",
    "is_discontinued", "is_clearance", "is_end_of_life", "is_open_box", "is_refurbished",
  ]);

  // All numeric columns in aiq_products
  const NUM_COLS = new Set([
    "msrp", "sale_price", "lowest_price", "map_price", "dealer_cost",
    "weight_lbs", "width_inches", "height_inches", "depth_inches",
    "depth_with_handles", "depth_without_handles", "capacity_cu_ft",
    "amperage", "wattage", "source_confidence",
    "version_number", "lead_time_days", "min_order_qty",
  ]);

  // Columns that actually exist in aiq_products (whitelist for final record)
  const VALID_COLS = new Set([
    "id","organization_id","manufacturer_name","brand_name","product_line","category",
    "series","model","status","launch_date","discontinued_date","msrp",
    "country_availability","product_family","short_description","public_visible",
    "approval_status","version_number","created_at","updated_at","brand_id",
    "manufacturer_id","source_type","source_reference","source_confidence",
    "source_extracted_at","source_review_status","source_reviewed_by",
    "source_reviewed_at","published_at","unpublished_at","created_by","updated_by",
    "long_description","features_html","upc","ean","gtin","finish","color",
    "color_family","energy_star","ada_compliant","made_in","weight_lbs",
    "width_inches","height_inches","depth_inches","map_price","dealer_cost",
    "freight_class","ships_ltl","lead_time_days","min_order_qty","sale_price",
    "lowest_price","lowest_price_source","price_currency","price_checked_at",
    "condition_flags","is_discontinued","is_clearance","is_end_of_life",
    "is_open_box","is_refurbished","replacement_model","condition_notes",
    "specs_json","available_colors","capacity_cu_ft","voltage","amperage",
    "wattage","frequency_hz","installation_type","depth_with_handles",
    "depth_without_handles","market",
  ]);

  function sanitizeForDB(data) {
    // Phase 1: Normalize field names from AI aliases
    const normalized = { ...data };
    for (const [alias, realCol] of Object.entries(FIELD_ALIASES)) {
      if (alias in normalized && !(realCol in normalized)) {
        normalized[realCol] = normalized[alias];
      }
      delete normalized[alias]; // remove alias either way
    }

    // Phase 2: Strip citation/XML tags from ALL string values (recursive for nested objects)
    function cleanStrings(obj) {
      if (obj == null) return obj;
      if (typeof obj === "string") return stripTags(obj);
      if (Array.isArray(obj)) return obj.map(cleanStrings);
      if (typeof obj === "object") {
        const out = {};
        for (const [k, v] of Object.entries(obj)) out[k] = cleanStrings(v);
        return out;
      }
      return obj;
    }
    const cleaned = cleanStrings(normalized);

    // Phase 3: Coerce booleans and numerics
    for (const col of BOOL_COLS) {
      if (col in cleaned) cleaned[col] = toBool(cleaned[col]);
    }
    for (const col of NUM_COLS) {
      if (col in cleaned) cleaned[col] = toNum(cleaned[col]);
    }

    return cleaned;
  }

  // Sanitize the final productData object — strip unknown columns
  function sanitizeProductRecord(record) {
    const safe = {};
    for (const [k, v] of Object.entries(record)) {
      if (VALID_COLS.has(k)) {
        // Final pass: ensure booleans/numerics are correct type
        if (BOOL_COLS.has(k)) safe[k] = toBool(v);
        else if (NUM_COLS.has(k)) safe[k] = toNum(v);
        else if (typeof v === "string") safe[k] = stripTags(v);
        else safe[k] = v;
      }
      // Unknown columns silently dropped
    }
    return safe;
  }

  const doSave = async (rawData) => {
    // Sanitize incoming AI data before anything else
    const data = sanitizeForDB(rawData);
    // Skip product save for intel/news data — those use their own save functions
    if (data._intel || data._news || data._retailerCheck || data._media) return true;
    // Reuse handleSave logic but without UI index management
    try {
      const checkRes = await supaFetch(`aiq_products?model=eq.${encodeURIComponent(data.model)}&brand_name=eq.${encodeURIComponent(data.brand_name)}&market=eq.${market}&select=id,organization_id`);
      const existing = await checkRes.json();
      const pricing = data.pricing || {};
      const cond = data.condition || {};
      const specs = data.specs || {};

      const productData = {
        market: market,
        manufacturer_name: data.manufacturer_name || data.brand_name || "Unknown",
        brand_name: data.brand_name || data.manufacturer_name || "Unknown", model: data.model,
        category: data.category || "refrigeration",
        product_line: data.product_line || null, series: data.series || null,
        short_description: data.short_description || null, long_description: data.long_description || null,
        features_html: data.features ? "<ul>" + data.features.map(f => "<li>" + f + "</li>").join("") + "</ul>" : null,
        msrp: pricing.msrp ? parseFloat(pricing.msrp) : (data.msrp ? parseFloat(data.msrp) : null),
        map_price: pricing.sale_price ? parseFloat(pricing.sale_price) : null,
        sale_price: pricing.sale_price ? parseFloat(pricing.sale_price) : null,
        lowest_price: pricing.lowest_price ? parseFloat(pricing.lowest_price) : null,
        lowest_price_source: pricing.lowest_price_source || null,
        price_currency: pricing.price_currency || (market === "US" ? "USD" : "CAD"),
        price_checked_at: new Date().toISOString(),
        upc: data.upc || null, ean: data.ean || null,
        finish: data.finish || null, color: data.color || null, color_family: data.color_family || null,
        available_colors: data.available_colors || [],
        energy_star: data.energy_star, ada_compliant: data.ada_compliant,
        width_inches: data.width_inches ? parseFloat(data.width_inches) : null,
        height_inches: data.height_inches ? parseFloat(data.height_inches) : null,
        depth_inches: data.depth_inches ? parseFloat(data.depth_inches) : null,
        weight_lbs: data.weight_lbs ? parseFloat(data.weight_lbs) : null,
        depth_with_handles: specs.depth_with_handles ? parseFloat(specs.depth_with_handles) : null,
        depth_without_handles: specs.depth_without_handles ? parseFloat(specs.depth_without_handles) : null,
        capacity_cu_ft: specs.capacity_cu_ft ? parseFloat(specs.capacity_cu_ft) : null,
        voltage: specs.voltage || null, amperage: specs.amperage ? parseFloat(specs.amperage) : null,
        wattage: specs.wattage ? parseFloat(specs.wattage) : null, frequency_hz: specs.frequency_hz || null,
        installation_type: specs.installation_type || null, specs_json: specs,
        status: cond.status || data.status || "active",
        condition_flags: cond.flags || [], is_discontinued: cond.is_discontinued || false,
        is_clearance: cond.is_clearance || false, is_end_of_life: cond.is_end_of_life || false,
        is_open_box: cond.is_open_box || false, is_refurbished: cond.is_refurbished || false,
        replacement_model: cond.replacement_model || null, condition_notes: cond.notes || null,
        made_in: data.made_in || null, country_availability: data.country_availability || ["CA", "US"],
        source_type: "web_scrape", source_reference: data.source_url || null,
        source_confidence: 0.85, source_extracted_at: new Date().toISOString(),
        source_review_status: "accepted", updated_at: new Date().toISOString(),
      };

      // Final sanitization — strip unknown columns and coerce types
      const safeProductData = sanitizeProductRecord(productData);

      let productId;
      if (existing && existing.length > 0) {
        productId = existing[0].id;
        const res = await supaFetch(`aiq_products?id=eq.${productId}`, { method: "PATCH", body: JSON.stringify(safeProductData) });
        if (!res.ok) throw new Error(await res.text());
        setSaved(p => [...p, { model: data.model, action: "updated", id: productId }]);
      } else {
        const orgRes = await supaFetch("organizations?select=id&limit=1");
        const orgs = await orgRes.json();
        if (!orgs.length) throw new Error("No organization found");
        safeProductData.organization_id = orgs[0].id;
        safeProductData.approval_status = "approved";
        safeProductData.public_visible = true;
        safeProductData.version_number = 1;
        const res = await supaFetch("aiq_products", { method: "POST", body: JSON.stringify(safeProductData) });
        if (!res.ok) throw new Error(await res.text());
        const created = await res.json();
        productId = created[0]?.id;
        setSaved(p => [...p, { model: data.model, action: "created", id: productId }]);
      }
      if (!productId) {
        const lookup = await supaFetch(`aiq_products?model=eq.${encodeURIComponent(data.model)}&brand_name=eq.${encodeURIComponent(data.brand_name)}&select=id`);
        productId = (await lookup.json())?.[0]?.id;
      }
      if (productId) {
        // Images
        if (data.images) {
          await supaFetch(`pim_product_images?product_id=eq.${productId}&source=eq.web_scrape`, { method: "DELETE", headers: { Prefer: "return=minimal" } }).catch(() => {});
          const imgs = data.images.map(img => typeof img === "string" ? { url: img, type: "product" } : img).filter(img => img?.url);
          for (let i = 0; i < imgs.length; i++) {
            await supaFetch("pim_product_images", { method: "POST", body: JSON.stringify({
              product_id: productId, image_type: imgs[i].type || (i === 0 ? "hero" : "product"),
              file_url: imgs[i].url, alt_text: imgs[i].alt || `${data.brand_name} ${data.model}`,
              is_primary: i === 0, display_order: i + 1, source: "web_scrape",
              approved: true, audience_tiers: ["public"], embargoed: false,
            }), headers: { Prefer: "return=minimal" } }).catch(() => {});
          }
        }
        // Documents
        if (data.documents) {
          for (const doc of data.documents.filter(d => d.url)) {
            const existDoc = await supaFetch(`pim_product_documents?product_id=eq.${productId}&doc_type=eq.${encodeURIComponent(doc.type)}&select=id`).then(r => r.json()).catch(() => []);
            if (existDoc.length === 0) {
              await supaFetch("pim_product_documents", { method: "POST", body: JSON.stringify({
                product_id: productId, doc_type: doc.type,
                title: doc.title || `${data.brand_name} ${data.model} ${doc.type.replace(/_/g, " ")}`,
                file_url: doc.url, file_name: doc.url.split("/").pop() || `${doc.type}.pdf`,
                mime_type: doc.url.endsWith(".pdf") ? "application/pdf" : "text/html",
                language: "en", locale: "en-CA", is_current: true, source: "web_scrape",
                approved: true, audience_tiers: ["public"], embargoed: false,
              }), headers: { Prefer: "return=minimal" } }).catch(() => {});
            }
          }
        }
        // Features
        if (data.features?.length) {
          await supaFetch(`pim_product_features?product_id=eq.${productId}`, { method: "DELETE", headers: { Prefer: "return=minimal" } }).catch(() => {});
          for (let i = 0; i < data.features.length; i++) {
            await supaFetch("pim_product_features", { method: "POST", body: JSON.stringify({
              product_id: productId, feature_category: "general", feature_name: data.features[i],
              feature_value: "true", is_key_feature: i < 5, is_differentiator: false, display_order: i + 1,
            }), headers: { Prefer: "return=minimal" } }).catch(() => {});
          }
        }
        // Dimensions
        if (data.width_inches || data.height_inches || data.depth_inches || specs.cutout_width) {
          const existDim = await supaFetch(`pim_product_dimensions?product_id=eq.${productId}&select=id`).then(r => r.json()).catch(() => []);
          const dimData = {
            product_id: productId, dimension_type: "product",
            width_inches: data.width_inches ? parseFloat(data.width_inches) : null,
            height_inches: data.height_inches ? parseFloat(data.height_inches) : null,
            depth_inches: data.depth_inches ? parseFloat(data.depth_inches) : null,
            depth_with_handle_inches: specs.depth_with_handles ? parseFloat(specs.depth_with_handles) : null,
            weight_lbs: data.weight_lbs ? parseFloat(data.weight_lbs) : null,
            cutout_width: specs.cutout_width ? parseFloat(specs.cutout_width) : null,
            cutout_height: specs.cutout_height ? parseFloat(specs.cutout_height) : null,
            cutout_depth: specs.cutout_depth ? parseFloat(specs.cutout_depth) : null,
            door_swing_direction: specs.door_swing || null, ada_compliant: data.ada_compliant || false,
          };
          if (existDim.length > 0) {
            await supaFetch(`pim_product_dimensions?id=eq.${existDim[0].id}`, { method: "PATCH", body: JSON.stringify(dimData), headers: { Prefer: "return=minimal" } }).catch(() => {});
          } else {
            await supaFetch("pim_product_dimensions", { method: "POST", body: JSON.stringify(dimData), headers: { Prefer: "return=minimal" } }).catch(() => {});
          }
        }
        // Certifications
        if (data.energy_star || specs.annual_energy_kwh || specs.decibels) {
          const existCert = await supaFetch(`pim_product_certifications?product_id=eq.${productId}&cert_type=eq.energy&select=id`).then(r => r.json()).catch(() => []);
          const certData = {
            product_id: productId, cert_type: "energy", cert_body: data.energy_star ? "ENERGY STAR" : "NRCan",
            is_current: true, energy_star_rating: data.energy_star ? 1 : 0,
            annual_energy_kwh: specs.annual_energy_kwh ? parseFloat(specs.annual_energy_kwh) : null,
            noise_level_dba: specs.decibels ? parseFloat(specs.decibels) : null,
          };
          if (existCert.length > 0) {
            await supaFetch(`pim_product_certifications?id=eq.${existCert[0].id}`, { method: "PATCH", body: JSON.stringify(certData), headers: { Prefer: "return=minimal" } }).catch(() => {});
          } else {
            await supaFetch("pim_product_certifications", { method: "POST", body: JSON.stringify(certData), headers: { Prefer: "return=minimal" } }).catch(() => {});
          }
        }
        // Price history
        if (pricing.msrp || pricing.sale_price || pricing.lowest_price) {
          await supaFetch("pim_price_history", { method: "POST", body: JSON.stringify({
            product_id: productId, msrp: pricing.msrp ? parseFloat(pricing.msrp) : null,
            sale_price: pricing.sale_price ? parseFloat(pricing.sale_price) : null,
            lowest_price: pricing.lowest_price ? parseFloat(pricing.lowest_price) : null,
            lowest_price_source: pricing.lowest_price_source || null,
            price_currency: pricing.price_currency || "CAD", source_url: data.source_url || null,
          }), headers: { Prefer: "return=minimal" } }).catch(() => {});
        }
      }
      saveCountRef.current.saved++;
      return true;
    } catch (e) {
      setErrors(p => [...p, "Auto-save " + (data.model || "") + ": " + e.message]);
      saveCountRef.current.failed++;
      return false;
    }
  };

  // Price-only save — updates ONLY pricing and condition fields
  const doPriceSave = async (data) => {
    try {
      const model = data.model;
      const brand = data.brand_name;
      if (!model || !brand) return false;
      const checkRes = await supaFetch("aiq_products?model=eq." + encodeURIComponent(model) + "&brand_name=eq." + encodeURIComponent(brand) + "&select=id");
      const existing = await checkRes.json();
      if (!existing || !existing.length) {
        setErrors(p => [...p, "Price check " + model + ": product not in PIM, run full scrape first"]);
        return false;
      }
      const productId = existing[0].id;
      const pricing = data.pricing || {};
      const cond = data.condition || {};
      const updates = {
        msrp: pricing.msrp ? parseFloat(pricing.msrp) : null,
        sale_price: pricing.sale_price ? parseFloat(pricing.sale_price) : null,
        lowest_price: pricing.lowest_price ? parseFloat(pricing.lowest_price) : null,
        lowest_price_source: pricing.lowest_price_source || null,
        price_currency: pricing.price_currency || "CAD",
        price_checked_at: new Date().toISOString(),
        condition_flags: cond.flags || [],
        is_discontinued: cond.is_discontinued || false,
        is_clearance: cond.is_clearance || false,
        is_end_of_life: cond.is_end_of_life || false,
        is_open_box: cond.is_open_box || false,
        is_refurbished: cond.is_refurbished || false,
        replacement_model: cond.replacement_model || null,
        condition_notes: cond.notes || null,
        updated_at: new Date().toISOString(),
      };
      // Only update status if condition says discontinued
      if (cond.is_discontinued) updates.status = "discontinued";
      else if (cond.is_clearance) updates.status = "clearance";
      else if (cond.is_end_of_life) updates.status = "end_of_life";

      const safeUpdates = sanitizeProductRecord(updates);
      const res = await supaFetch("aiq_products?id=eq." + productId, { method: "PATCH", body: JSON.stringify(safeUpdates) });
      if (!res.ok) throw new Error(await res.text());

      // Log to price history
      await supaFetch("pim_price_history", { method: "POST", body: JSON.stringify({
        product_id: productId,
        msrp: pricing.msrp ? parseFloat(pricing.msrp) : null,
        sale_price: pricing.sale_price ? parseFloat(pricing.sale_price) : null,
        lowest_price: pricing.lowest_price ? parseFloat(pricing.lowest_price) : null,
        lowest_price_source: pricing.lowest_price_source || null,
        price_currency: pricing.price_currency || "CAD",
        source_url: data.source_url || null,
      }), headers: { Prefer: "return=minimal" } }).catch(() => {});

      setSaved(p => [...p, { model, action: "price updated", id: productId }]);
      saveCountRef.current.saved++;
      return true;
    } catch (e) {
      setErrors(p => [...p, "Price save " + (data.model || "") + ": " + e.message]);
      saveCountRef.current.failed++;
      return false;
    }
  };

  // Retailer price save — saves each retailer's price as a row
  const doRetailerSave = async (data) => {
    try {
      const model = data.model;
      const brand = data.brand_name;
      const country = data._country || retailerCountry || "CA";
      if (!model || !brand || !data.retailers || !data.retailers.length) return false;
      
      // Try to find product_id
      let productId = null;
      try {
        const checkRes = await supaFetch("aiq_products?model=eq." + encodeURIComponent(model) + "&brand_name=eq." + encodeURIComponent(brand) + "&select=id");
        const existing = await checkRes.json();
        if (existing && existing.length) productId = existing[0].id;
      } catch(e) {}

      // Also update aiq_products with lowest price and condition
      let lowestPrice = null;
      let lowestSource = "";
      let anyDiscontinued = false;
      let replacementModel = null;
      for (const r of data.retailers) {
        if (r.price && (!lowestPrice || r.price < lowestPrice)) {
          lowestPrice = r.price;
          lowestSource = r.retailer;
        }
        if (r.condition === "discontinued") anyDiscontinued = true;
        if (r.stock_note && r.stock_note.toLowerCase().includes("replaced by")) {
          const match = r.stock_note.match(/replaced by\s+(\S+)/i);
          if (match) replacementModel = match[1];
        }
      }

      for (const r of data.retailers) {
        await supaFetch("pim_retailer_prices", { method: "POST", body: JSON.stringify({
          product_id: productId,
          brand_name: brand,
          model: model,
          retailer_name: r.retailer,
          retailer_url: r.url ? r.url.split("/").slice(0,3).join("/") : null,
          product_url: r.url || null,
          price: r.price ? parseFloat(r.price) : null,
          regular_price: r.regular_price ? parseFloat(r.regular_price) : null,
          on_sale: r.on_sale || false,
          sale_label: r.sale_label || null,
          in_stock: r.in_stock,
          stock_note: r.stock_note || null,
          condition: r.condition || "new",
          is_open_box: r.is_open_box || false,
          is_clearance: r.is_clearance || false,
          is_refurbished: r.is_refurbished || false,
          is_floor_model: r.is_floor_model || false,
          shipping_available: r.shipping_available,
          free_delivery: r.free_delivery || false,
          shipping_cost: r.shipping_cost ? parseFloat(r.shipping_cost) : null,
          price_currency: country === "US" ? "USD" : "CAD",
          country: country,
        }), headers: { Prefer: "return=minimal" } }).catch(() => {});
      }

      // Update aiq_products with lowest price if we have a product_id
      if (productId && (lowestPrice || anyDiscontinued)) {
        const updates = {
          price_checked_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        if (lowestPrice) { updates.lowest_price = lowestPrice; updates.lowest_price_source = lowestSource; }
        if (anyDiscontinued) { updates.is_discontinued = true; updates.status = "discontinued"; }
        if (replacementModel) { updates.replacement_model = replacementModel; }
        await supaFetch("aiq_products?id=eq." + productId, { method: "PATCH", body: JSON.stringify(sanitizeProductRecord(updates)) }).catch(() => {});
      }

      setSaved(p => [...p, { model, action: data.retailers.length + " retailers checked", id: productId }]);
      saveCountRef.current.saved++;
      return true;
    } catch (e) {
      setErrors(p => [...p, "Retailer save " + (data.model || "") + ": " + e.message]);
      saveCountRef.current.failed++;
      return false;
    }
  };

  const runScrape = async (q) => {
    try {
      const r = await scrapeProduct(q, activeModel, market);
      r.query = q;
      r._model = activeModel;
      r._market = market;
      if (r.found && r.brand_name && r.model) {
        r._crossMarketWarning = await checkCrossMarketMatch(r.brand_name, r.model, market);
      }
      return r;
    } catch (e) { return { found: false, query: q, error: e.message }; }
  };

  const scrapeAndMaybeSave = async (q) => {
    const r = await runScrape(q);
    if (r.found) {
      setResults(p => [...p, r]); // Always show the result
      if (autoSave && !r._crossMarketWarning) {
        const ok = await doSave(r);
        if (ok) {
          // Remove from results since it saved successfully
          setResults(p => p.filter(x => x !== r));
        }
        // If save failed, it stays in results so user can retry manually
      }
      // If a cross-market warning exists, it always stays in results for manual review —
      // even with autoSave on — so CA/US never merge silently.
    } else {
      setResults(p => [...p, r]);
    }
    return r;
  };

  const handleSingle = async () => {
    if (!query.trim()) return;
    setLoading(true);
    setProgress({ current: 1, total: 1, currentQuery: query + " (searching & extracting…)" });
    await scrapeAndMaybeSave(query);
    setLoading(false);
  };

  const handleBulk = async () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    setLoading(true);
    abortRef.current = false;
    saveCountRef.current = { saved: 0, failed: 0 };
    for (let i = 0; i < lines.length; i++) {
      if (abortRef.current) break;
      setProgress({ current: i + 1, total: lines.length, currentQuery: lines[i] });
      await scrapeAndMaybeSave(lines[i]);
      if (i < lines.length - 1) await new Promise((r) => setTimeout(r, 6000));
    }
    setLoading(false);
  };

  const handleEnrichExisting = async () => {
    if (!existingProducts.length) await loadExisting();
    let incomplete = existingProducts.filter((p) => !p.width_inches || !p.msrp || !p.finish);
    if (enrichBrand !== "all") incomplete = incomplete.filter((p) => p.brand_name === enrichBrand);
    if (!incomplete.length) { setErrors((p) => [...p, "No incomplete products" + (enrichBrand !== "all" ? " for " + enrichBrand : "")]); return; }
    const lines = incomplete.slice(0, enrichBatchSize).map((p) => `${p.brand_name} ${p.model}`);
    setBulkText(lines.join("\n"));
    setMode("bulk");
  };

  // ── Site Discovery ──
  const REFRIG_SUBCATS = ["french door refrigerators", "side-by-side refrigerators", "top freezer refrigerators", "bottom freezer refrigerators", "counter-depth refrigerators", "compact refrigerators"];
  const COOKING_SUBCATS = ["gas ranges", "electric ranges", "induction ranges", "double oven ranges", "slide-in ranges"];
  const LAUNDRY_SUBCATS = ["front load washers", "top load washers", "dryers", "washer dryer combos"];

  const getSubcats = (category) => {
    if (!category) return [""]; // search all
    const c = category.toLowerCase();
    if (c.includes("refrig")) return REFRIG_SUBCATS;
    if (c.includes("range")) return COOKING_SUBCATS;
    if (c.includes("washer") || c.includes("laundry")) return LAUNDRY_SUBCATS;
    return [category];
  };

  const handleDiscover = async () => {
    const brand = discoverBrand.trim();
    const category = discoverCategory.trim();
    const url = discoverUrl.trim();
    if (!brand && !url) return;
    
    setDiscoverPhase("discovering");
    setLoading(true);
    setDiscovered([]);
    setSelectedModels(new Set());
    
    let allProducts = [];

    if (url) {
      // Single URL discovery
      setProgress({ current: 1, total: 1, currentQuery: "Scanning page…" });
      const result = await callAI(getDiscoverPrompt(market), `Find all product model numbers listed on: ${url}`, 3, activeModel);
      if (result.found && result.products) allProducts = result.products;
    } else {
      // Break into subcategory chunks to avoid overload
      const subcats = getSubcats(category);
      for (let i = 0; i < subcats.length; i++) {
        if (abortRef.current) break;
        const subcat = subcats[i];
        setProgress({ current: i + 1, total: subcats.length, currentQuery: `${brand} ${subcat || "all products"}` });
        
        const marketWord = market === "US" ? "US" : "Canadian";
        const searchQuery = subcat
          ? `Find ALL ${brand} ${subcat} currently available on the ${brand} ${marketWord} website. List every model number.`
          : `Find ALL ${brand} ${category || "appliance"} products on the ${brand} ${marketWord} website. List every model number. Search each subcategory.`;
        
        const result = await callAI(getDiscoverPrompt(market), searchQuery, 3, activeModel);
        if (result.found && result.products) {
          allProducts = [...allProducts, ...result.products];
        }
        if (i < subcats.length - 1) await new Promise(r => setTimeout(r, 6000));
      }
    }

    // Deduplicate by model number
    const seen = new Set();
    const deduped = [];
    for (const p of allProducts) {
      const key = p.model?.toUpperCase();
      if (key && !seen.has(key)) { seen.add(key); deduped.push(p); }
    }

    if (deduped.length > 0) {
      // Check which ones already exist in PIM for THIS market specifically.
      // Always fetch fresh and market-scoped here — don't reuse the shared
      // existingProducts state, since that may have been populated by the
      // Enrich Existing tab across all markets and would give false "in PIM"
      // matches against the other market's products.
      let inPimSet = new Set();
      try {
        const res = await supaFetch(`aiq_products?select=model,brand_name&market=eq.${market}&limit=1000`);
        const ep = await res.json();
        inPimSet = new Set((ep || []).map(p => p.model?.toUpperCase()));
      } catch {}
      const products = deduped.map(p => ({
        ...p,
        inPIM: inPimSet.has(p.model?.toUpperCase()),
      }));
      setDiscovered(products);
      setSelectedModels(new Set(products.filter(p => !p.inPIM).map(p => p.model)));
      setDiscoverPhase("discovered");
    } else {
      setErrors(p => [...p, `No products found for ${brand} ${category}`]);
      setDiscoverPhase("idle");
    }
    setLoading(false);
  };

  const handleScrapeSelected = async () => {
    const toScrape = discovered.filter(p => selectedModels.has(p.model));
    if (!toScrape.length) return;
    
    setDiscoverPhase("scraping");
    setLoading(true);
    abortRef.current = false;
    saveCountRef.current = { saved: 0, failed: 0 };
    
    for (let i = 0; i < toScrape.length; i++) {
      if (abortRef.current) break;
      const p = toScrape[i];
