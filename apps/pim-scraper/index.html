<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0c1222"/>
<title>PIM Scraper v2 — ApplianceIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c1222;--bg2:#111b2e;--surface:#182338;--card:#1e2d47;
  --accent:#00c896;--accent2:#00e6ac;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --txt:#e8edf4;--txt2:#7e8fa6;--line:#283a55;
  --radius:10px;
  --t1:#00c896;--t2:#f59e0b;--t3:#ef4444;
}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
header .logo span{color:var(--accent)}
header .right{display:flex;align-items:center;gap:12px}
.cost-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:var(--txt2)}
.cost-pill .val{color:var(--accent);font-variant-numeric:tabular-nums}

/* Tabs */
.tab-bar{display:flex;gap:2px;padding:0 24px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{padding:12px 20px;font-size:13px;font-weight:600;color:var(--txt2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--txt)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px}

/* Controls */
.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.field select,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field select{min-width:220px;cursor:pointer}
.field input{min-width:280px}

.tier-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.tier-badge.t1{background:rgba(0,200,150,.15);color:var(--t1)}
.tier-badge.t2{background:rgba(245,158,11,.15);color:var(--t2)}
.tier-badge.t3{background:rgba(239,68,68,.15);color:var(--t3)}
.tier-badge.tu{background:rgba(126,143,166,.15);color:var(--txt2)}

/* Buttons */
.btn{padding:9px 18px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#0a1628;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--txt);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--txt2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}

/* Mode toggle */
.mode-toggle{display:flex;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.mode-toggle button{padding:8px 16px;font-size:12px;font-weight:600;font-family:inherit;border:none;background:none;color:var(--txt2);cursor:pointer;transition:all .15s}
.mode-toggle button.active{background:var(--accent);color:#0a1628}

/* Brand grid */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:20px}
.brand-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.brand-card:hover{border-color:var(--accent);background:var(--surface)}
.brand-card.selected{border-color:var(--accent);background:rgba(0,200,150,.08)}
.brand-card .name{font-size:13px;font-weight:600}
.brand-card .meta{display:flex;align-items:center;gap:6px}

/* Results */
.results-panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.results-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.results-header h3{font-size:14px;font-weight:700}
.results-body{max-height:500px;overflow-y:auto}
.result-row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .1s}
.result-row:hover{background:var(--surface)}
.result-row:last-child{border-bottom:none}
.result-row .status{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.result-row .status.ok{background:var(--accent)}
.result-row .status.partial{background:var(--amber)}
.result-row .status.fail{background:var(--red)}
.result-row .status.pending{background:var(--txt2);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.result-row .info{flex:1;min-width:0}
.result-row .model-num{font-size:13px;font-weight:700}
.result-row .brand-label{font-size:11px;color:var(--txt2);margin-left:6px}
.result-row .detail{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-row .cost{font-size:11px;font-weight:600;color:var(--txt2);margin-left:auto;white-space:nowrap}
.result-row .actions{display:flex;gap:6px;margin-left:8px;flex-shrink:0;align-items:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec-item{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface);border-radius:6px;font-size:12px}
.spec-item .k{color:var(--txt2);font-weight:500}
.spec-item .v{color:var(--txt);font-weight:600;text-align:right}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

/* Log */
.log-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;font-size:12px;color:var(--txt2);max-height:180px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;line-height:1.7;display:none}
.log-panel.show{display:block}
.log-panel .entry{display:flex;gap:8px}
.log-panel .ts{color:var(--txt2);opacity:.5;min-width:70px}
.log-panel .msg{color:var(--txt)}
.log-panel .msg.cost{color:var(--amber)}
.log-panel .msg.ok{color:var(--accent)}
.log-panel .msg.err{color:var(--red)}

/* Stats */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:140px}
.stat-card .label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-card .value.green{color:var(--accent)}
.stat-card .value.amber{color:var(--amber)}
.stat-card .value.red{color:var(--red)}

/* Settings */
.settings-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.settings-row label{font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:6px;cursor:pointer}
.settings-row input[type="checkbox"]{accent-color:var(--accent)}
.settings-row select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--txt);font-size:12px;font-family:inherit}

/* Placeholder */
.placeholder-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--txt2);gap:12px}
.placeholder-tab .icon{font-size:48px;opacity:.3}
.placeholder-tab h2{font-size:18px;font-weight:700;color:var(--txt)}
.placeholder-tab p{font-size:13px;max-width:400px;text-align:center;line-height:1.6}

/* Brand filter */
.brand-filter{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.filter-pills button{padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.filter-pills button.active{background:var(--accent);color:#0a1628;border-color:var(--accent)}

/* Product table */
.prod-table{width:100%;border-collapse:collapse;font-size:12px}
.prod-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:1}
.prod-table td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.prod-table tr:hover td{background:var(--surface)}
.prod-table .model-cell{font-weight:700;color:var(--txt);font-size:13px}
.prod-table .brand-cell{color:var(--txt2)}

/* Diff styling */
.diff-added{background:rgba(0,200,150,.1);color:var(--accent);padding:2px 6px;border-radius:4px;font-size:11px}
.diff-changed{background:rgba(245,158,11,.1);color:var(--amber);padding:2px 6px;border-radius:4px;font-size:11px}
.diff-removed{background:rgba(239,68,68,.1);color:var(--red);padding:2px 6px;border-radius:4px;font-size:11px;text-decoration:line-through}

/* Progress bar */
.pbar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;width:100%}
.pbar .fill{height:100%;border-radius:3px;transition:width .3s}
.pbar .fill.green{background:var(--accent)}
.pbar .fill.amber{background:var(--amber)}
.pbar .fill.red{background:var(--red)}

/* Price change indicators */
.price-up{color:var(--red);font-weight:700}
.price-down{color:var(--accent);font-weight:700}
.price-same{color:var(--txt2)}

/* Checkbox list */
.check-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.check-row:hover{background:var(--surface)}
.check-row input{accent-color:var(--accent)}

/* Completeness chip */
.completeness{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.completeness.high{background:rgba(0,200,150,.15);color:var(--accent)}
.completeness.med{background:rgba(245,158,11,.15);color:var(--amber)}
.completeness.low{background:rgba(239,68,68,.15);color:var(--red)}

/* Scrollable table wrapper */
.table-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:55vh}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Appliance<span>IQ</span> PIM Scraper</div>
    <div class="right">
      <div class="cost-pill">Session: <span class="val" id="sessionCost">$0.00</span></div>
      <div class="cost-pill">Brands: <span class="val" id="brandCount">…</span></div>
    </div>
  </header>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="window.S.switchTab('discover')">Discover</button>
    <button class="tab-btn" onclick="window.S.switchTab('price-sync')">Price Sync</button>
    <button class="tab-btn" onclick="window.S.switchTab('verify')">Verify &amp; Audit</button>
    <button class="tab-btn" onclick="window.S.switchTab('enrich')">Enrich &amp; Complete</button>
  </div>
  <div class="main" id="mainContent">
    <div style="text-align:center;padding:80px 0;color:var(--txt2)">Loading brands…</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)document.getElementById('modalOverlay').classList.remove('open')">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Product Details</h3><button class="btn btn-sm btn-secondary" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bXd3aHlvemVvdW9xc2NvbGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzMzMTAsImV4cCI6MjA5OTk0OTMxMH0.p18JS7NYRO3XuHElMGcM_KqIHdrVKcIEwCNTIBSkDhk';
const sb = createClient(SB_URL, SB_KEY);

/* ═══ STATE ═══ */
let allBrands = [];
let brandSourceMap = {};
let currentTab = 'discover';
let selectedBrand = null;
let scrapeResults = [];
let sessionCostTotal = 0;
let isProcessing = false;
let autoSave = false;
let aiModel = 'gpt-4.1-mini';
let brandIntel = null; // PIM products for selected brand
let discoverResults = null; // from discover-brand edge function
let discoverLoading = false;

// Price Sync state
let psResults = [];

// Verify & Audit state
let vaResults = [];

// Enrich state
let enResults = {};

const TL = {
  1:{text:'FREE',cls:'t1',icon:'⚡'},
  2:{text:'CHEAP',cls:'t2',icon:'💲'},
  3:{text:'AI',cls:'t3',icon:'🤖'},
  0:{text:'UNMAPPED',cls:'tu',icon:'❓'}
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function tier(name){const s=brandSourceMap[name];return s?s.scrape_tier:0}
function addCost(a){sessionCostTotal+=a;document.getElementById('sessionCost').textContent='$'+sessionCostTotal.toFixed(4)}

function logEntry(msg,cls){
  const el=document.getElementById('scrapeLog');
  if(!el)return;
  el.classList.add('show');
  const t=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML+='<div class="entry"><span class="ts">'+t+'</span><span class="msg '+(cls||'')+'">'+msg+'</span></div>';
  el.scrollTop=el.scrollHeight;
}

/* ═══ THREE-TIER PIPELINE ═══ */

async function callTier1(params){
  logEntry('Tier 1 → free-extract…');
  try{
    const r=await fetch(SB_URL+'/functions/v1/free-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    const d=await r.json();
    if(d.found||d._partial){logEntry('Tier 1 ✓ '+(d.found?'full':'partial'),'ok');addCost(0);d._tier=1;d._cost=0;return d}
    logEntry('Tier 1: nothing found','err');return null;
  }catch(e){logEntry('Tier 1 err: '+e.message,'err');return null}
}

async function callTier2(partial,fallback,mo){
  const key=localStorage.getItem('aiq_openai_key');
  if(!key){logEntry('Tier 2 skip: no OpenAI key','err');return null}
  const model=mo||aiModel;
  logEntry('Tier 2 → '+model+'…');
  const sys='You extract appliance product data. Return ONLY JSON: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, amperage, wattage, energy_star, specs (obj), images (arr), availability, features (arr). Omit unknowns.';
  const usr=partial?'Partial:\n'+JSON.stringify(partial,null,2)+'\n\nFill gaps.':'Extract:\n'+(fallback||'').substring(0,8000);
  try{
    const body={model,temperature:0.1,response_format:{type:'json_object'},messages:[{role:'system',content:sys},{role:'user',content:usr}]};
    if(model.startsWith('gpt-5')||model.startsWith('o')){body.max_completion_tokens=2000;if(model.startsWith('gpt-5'))body.reasoning_effort='none'}else{body.max_tokens=2000}
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const data=await r.json();
    if(data.error){logEntry('Tier 2 err: '+data.error.message,'err');return null}
    const txt=data.choices?.[0]?.message?.content||'';
    const parsed=JSON.parse(txt.replace(/```json\s*|```/g,'').trim());
    const cost=((data.usage?.prompt_tokens||0)*0.0000004+(data.usage?.completion_tokens||0)*0.0000016);
    addCost(cost);logEntry('Tier 2 ✓ $'+cost.toFixed(4),'cost');
    parsed._tier=2;parsed._cost=cost;parsed._model=model;return parsed;
  }catch(e){logEntry('Tier 2 err: '+e.message,'err');return null}
}

async function callTier3(query,brandInfo){
  const key=localStorage.getItem('aiq_anthropic_key');
  if(!key){logEntry('Tier 3 skip: no Anthropic key','err');return null}
  logEntry('Tier 3 → Haiku + web search…');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,
        system:'Extract appliance specs. Return ONLY JSON: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, specs, images, features, source_url. Omit unknowns.',
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:'Find specs for: '+query+'. Brand: '+(brandInfo?.brand_name||'unknown')+'. Check manufacturer site first.'}]})});
    const data=await r.json();
    if(data.error){logEntry('Tier 3 err: '+data.error.message,'err');return null}
    const texts=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
    const jm=texts.join('\n').match(/\{[\s\S]*\}/);
    if(jm){const p=JSON.parse(jm[0]);addCost(0.30);logEntry('Tier 3 ✓ $0.30','cost');p._tier=3;p._cost=0.30;return p}
    logEntry('Tier 3: no JSON','err');return null;
  }catch(e){logEntry('Tier 3 err: '+e.message,'err');return null}
}

/* ═══ BRAND INTEL + DISCOVERY ═══ */
async function loadBrandIntel(brandName) {
  if (!brandName) { brandIntel = null; discoverResults = null; renderTab(); return; }

  const { data } = await sb.from('aiq_products')
    .select('id,model,category,short_description,msrp,price_currency,color,finish,width_inches,height_inches,depth_inches,weight_lbs,capacity_cu_ft,specs_json,source_reference,source_extracted_at,source_confidence,voltage,energy_star')
    .ilike('brand_name', brandName).eq('status','active')
    .order('category').order('model').limit(500);

  const products = data || [];
  const categories = {};
  let withPrice=0, withSpecs=0, withDims=0;
  for (const p of products) {
    const cat = p.category || 'Uncategorized';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(p);
    if (p.msrp) withPrice++;
    if (p.specs_json && Object.keys(typeof p.specs_json==='string'?JSON.parse(p.specs_json):p.specs_json).length>0) withSpecs++;
    if (p.width_inches && p.height_inches && p.depth_inches) withDims++;
  }
  brandIntel = { brand:brandName, products, categories, withPrice, withSpecs, withDims };
  renderTab();

  // Auto-discover on Discover tab
  if (currentTab === 'discover') discoverBrand(brandName);
}

async function discoverBrand(brandName) {
  discoverLoading = true; discoverResults = null; renderTab();
  logEntry('Discovering products for ' + brandName + '…');
  try {
    const r = await fetch(SB_URL + '/functions/v1/discover-brand', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ brand: brandName })
    });
    discoverResults = await r.json();
    if (discoverResults.error) logEntry('Discovery error: ' + discoverResults.error, 'err');
    else logEntry('Found ' + discoverResults.total + ' URLs (' + discoverResults.new_count + ' new, ' + discoverResults.existing_count + ' in PIM)', 'ok');
  } catch (e) { logEntry('Discovery failed: ' + e.message, 'err'); }
  discoverLoading = false; renderTab();
}

/* ═══ SMART SCRAPE ═══ */
async function smartScrape(brand,model,url){
  const t=tier(brand)||3;
  const bi=brandSourceMap[brand]||null;
  const r={brand,model,status:'pending',data:null,tier_used:0,cost:0,url};
  scrapeResults.push(r);renderTab();

  // T1
  if(t<=1||url){
    const p=url?{url}:{query:brand+' '+model,market:'CA'};
    const t1=await callTier1(p);
    if(t1){
      if(t1.found){r.data=t1;r.status='ok';r.tier_used=1;r.cost=0;renderTab();return r}
      if(t1._partial&&t<=2){const t2=await callTier2(t1);if(t2){r.data={...t1,...t2,_merged:true};r.status='ok';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}}
      if(t1._partial){r.data=t1;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r}
    }
  }

  // T2
  if(t<=2){
    const t1s=await callTier1({query:brand+' '+model,market:'CA'});
    if(t1s&&(t1s.found||t1s._partial)){
      const t2=await callTier2(t1s);
      if(t2){r.data={...t1s,...t2,_merged:true};r.status=t2.model?'ok':'partial';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}
      r.data=t1s;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r;
    }
  }

  // T3
  const t3=await callTier3(brand+' '+model,bi);
  if(t3){r.data=t3;r.status=t3.model?'ok':'partial';r.tier_used=3;r.cost=t3._cost||0;renderTab();return r}

  r.status='fail';logEntry('Failed: '+brand+' '+model,'err');renderTab();return r;
}

/* ═══ PRODUCT DATA ═══ */

const COMPLETENESS_FIELDS = ['short_description','category','msrp','color','width_inches','height_inches','depth_inches','weight_lbs','capacity_cu_ft','voltage','specs_json','finish','energy_star'];

function completeness(p) {
  let filled = 0;
  for (const f of COMPLETENESS_FIELDS) { if (p[f] !== null && p[f] !== undefined && p[f] !== '') filled++; }
  return Math.round((filled / COMPLETENESS_FIELDS.length) * 100);
}

function missingFields(p) {
  return COMPLETENESS_FIELDS.filter(f => p[f] === null || p[f] === undefined || p[f] === '');
}

/* ═══ PRICE SYNC LOGIC ═══ */

async function priceSyncOne(product) {
  const t = tier(product.brand_name);
  logEntry('Price check: ' + product.brand_name + ' ' + product.model + '…');

  // Try source URL first
  if (product.source_reference) {
    const t1 = await callTier1({ url: product.source_reference });
    if (t1 && t1.msrp !== undefined) {
      return { product, live_price: t1.msrp, currency: t1.currency || product.price_currency, source: t1.source_url || product.source_reference, tier_used: 1, cost: 0 };
    }
  }

  // Fallback to search
  const t1s = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  if (t1s && t1s.msrp !== undefined) {
    return { product, live_price: t1s.msrp, currency: t1s.currency || product.price_currency, source: t1s.source_url, tier_used: 1, cost: 0 };
  }

  if (t <= 2) {
    const t2 = await callTier2({ brand_name: product.brand_name, model: product.model }, null);
    if (t2 && t2.msrp !== undefined) {
      return { product, live_price: t2.msrp, currency: t2.currency || product.price_currency, source: 'gpt', tier_used: 2, cost: t2._cost || 0 };
    }
  }

  const t3 = await callTier3(product.brand_name + ' ' + product.model + ' price', brandSourceMap[product.brand_name]);
  if (t3 && t3.msrp !== undefined) {
    return { product, live_price: t3.msrp, currency: t3.currency || product.price_currency, source: t3.source_url || 'haiku', tier_used: 3, cost: t3._cost || 0 };
  }

  return { product, live_price: null, error: 'Could not find price', tier_used: 0, cost: 0 };
}

/* ═══ VERIFY LOGIC ═══ */

async function verifyOne(product) {
  logEntry('Verifying: ' + product.brand_name + ' ' + product.model + '…');
  let liveData = null;

  if (product.source_reference) {
    liveData = await callTier1({ url: product.source_reference });
  }
  if (!liveData || (!liveData.found && !liveData._partial)) {
    liveData = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  }
  if (!liveData || (!liveData.found && !liveData._partial)) {
    return { product, status: 'unreachable', diffs: [], tier_used: 0, cost: 0 };
  }

  // Compare fields
  const diffs = [];
  const checkFields = [
    ['short_description', 'Description'], ['msrp', 'MSRP'], ['color', 'Color'],
    ['width_inches', 'Width'], ['height_inches', 'Height'], ['depth_inches', 'Depth'],
    ['weight_lbs', 'Weight'], ['availability', 'Availability']
  ];
  for (const [field, label] of checkFields) {
    const stored = product[field];
    const live = liveData[field];
    if (live !== undefined && live !== null && String(live) !== String(stored || '')) {
      diffs.push({ field, label, stored: stored, live: live });
    }
  }

  // Check specs
  if (liveData.specs && product.specs_json) {
    const liveSpecs = liveData.specs;
    const storedSpecs = typeof product.specs_json === 'string' ? JSON.parse(product.specs_json) : product.specs_json;
    for (const [k, v] of Object.entries(liveSpecs)) {
      if (storedSpecs[k] === undefined) {
        diffs.push({ field: 'spec:' + k, label: 'Spec: ' + k, stored: null, live: v, type: 'added' });
      } else if (String(storedSpecs[k]) !== String(v)) {
        diffs.push({ field: 'spec:' + k, label: 'Spec: ' + k, stored: storedSpecs[k], live: v, type: 'changed' });
      }
    }
  }

  return { product, status: diffs.length > 0 ? 'drifted' : 'verified', diffs, liveData, tier_used: 1, cost: 0 };
}

/* ═══ ENRICH LOGIC ═══ */

async function enrichOne(product) {
  logEntry('Enriching: ' + product.brand_name + ' ' + product.model + '…');
  const missing = missingFields(product);
  if (missing.length === 0) return { product, enriched: {}, missing: [], tier_used: 0, cost: 0 };

  // Try free-extract first
  let scraped = null;
  if (product.source_reference) {
    scraped = await callTier1({ url: product.source_reference });
  }
  if (!scraped || (!scraped.found && !scraped._partial)) {
    scraped = await callTier1({ query: product.brand_name + ' ' + product.model, market: product.market || 'CA' });
  }

  let enriched = {};
  let tierUsed = 1;
  let cost = 0;

  if (scraped) {
    // Map scraped fields to missing product fields
    const fieldMap = {
      short_description: 'short_description', category: 'category', msrp: 'msrp',
      color: 'color', finish: 'finish', width_inches: 'width_inches',
      height_inches: 'height_inches', depth_inches: 'depth_inches',
      weight_lbs: 'weight_lbs', capacity_cu_ft: 'capacity_cu_ft',
      voltage: 'voltage', energy_star: 'energy_star', specs_json: 'specs'
    };
    for (const f of missing) {
      const src = fieldMap[f] || f;
      if (scraped[src] !== undefined && scraped[src] !== null) {
        enriched[f] = scraped[src];
      }
    }
  }

  // If still missing fields, try T2
  const stillMissing = missing.filter(f => enriched[f] === undefined);
  if (stillMissing.length > 0 && tier(product.brand_name) <= 2) {
    const t2 = await callTier2({ brand_name: product.brand_name, model: product.model, ...enriched }, null);
    if (t2) {
      tierUsed = 2; cost = t2._cost || 0;
      for (const f of stillMissing) {
        const v = t2[f] || t2[f.replace('_json', '')];
        if (v !== undefined && v !== null) enriched[f] = v;
      }
    }
  }

  // T3 as last resort
  const finalMissing = missing.filter(f => enriched[f] === undefined);
  if (finalMissing.length > 3) {
    const t3 = await callTier3(product.brand_name + ' ' + product.model + ' specifications', brandSourceMap[product.brand_name]);
    if (t3) {
      tierUsed = 3; cost += t3._cost || 0;
      for (const f of finalMissing) {
        const v = t3[f] || t3[f.replace('_json', '')];
        if (v !== undefined && v !== null) enriched[f] = v;
      }
    }
  }

  return { product, enriched, missing, filled: Object.keys(enriched).length, tier_used: tierUsed, cost };
}

  if(!brandIntel||brandIntel.brand!==selectedBrand){h+='<div style="padding:40px;text-align:center;color:var(--txt2)">Loading…</div>';return h}

  const withPrice=brandIntel.products.filter(p=>p.msrp);
  const changed=psResults.filter(r=>r.live_price!==null&&r.live_price!==r.product.msrp).length;

  h+='<div class="controls"><button class="btn btn-primary" onclick="window.S.psCheckAll()" '+(isProcessing||withPrice.length===0?'disabled':'')+'>💲 Check Live Prices ('+withPrice.length+' with MSRP)</button><span style="font-size:12px;color:var(--txt2)">'+(isProcessing?'⏳ Checking prices…':psResults.length>0?psResults.length+' checked, '+changed+' changed':'Select a brand to check prices against live data')+'</span></div>';

  h+='<div class="log-panel'+(psResults.length>0?' show':'')+'" id="scrapeLog"></div>';

  if(psResults.length>0){
    const changedResults=psResults.filter(r=>r.live_price!==null&&Number(r.live_price)!==Number(r.product.msrp));
    h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">';
    h+='<span style="font-size:13px;font-weight:600">'+psResults.length+' checked</span>';

    h+='</div>';
    h+='<div class="table-wrap"><table class="prod-table"><thead><tr><th>Model</th><th>Stored MSRP</th><th>Live Price</th><th>Δ</th><th>Tier</th><th>Action</th></tr></thead><tbody>';
    for(let i=0;i<psResults.length;i++){
      const r=psResults[i];const p=r.product;
      const stored=p.msrp?Number(p.msrp):null;const live=r.live_price!==null?Number(r.live_price):null;
      let dh='<span class="price-same">—</span>';
      if(stored&&live){const d=live-stored;if(d>0)dh='<span class="price-up">+$'+d.toFixed(0)+' ↑</span>';else if(d<0)dh='<span class="price-down">-$'+Math.abs(d).toFixed(0)+' ↓</span>';else dh='<span class="price-same">✓</span>'}
      const tl=TL[r.tier_used]||TL[0];
      h+='<tr><td class="model-cell">'+esc(p.model)+'</td><td>'+(stored?'$'+stored.toLocaleString():'—')+'</td><td>'+(live!==null?'$'+live.toLocaleString():'<span style="color:var(--red)">—</span>')+'</td><td>'+dh+'</td><td><span class="tier-badge '+tl.cls+'">T'+r.tier_used+'</span></td><td>'+(live!==null&&live!==stored?'<button class="btn btn-sm btn-primary" onclick="window.S.psUpdate('+i+')">Update</button>':'')+'</td></tr>';
    }
    h+='</tbody></table></div>';
  } else {
    h+='<div class="table-wrap"><table class="prod-table"><thead><tr><th>Model</th><th>Category</th><th>MSRP</th><th>Last Checked</th></tr></thead><tbody>';
    for(const p of brandIntel.products.slice(0,50)){
      h+='<tr><td class="model-cell">'+esc(p.model)+'</td><td style="color:var(--txt2)">'+esc(p.category||'—')+'</td><td>'+(p.msrp?'$'+Number(p.msrp).toLocaleString():'—')+'</td><td style="font-size:11px;color:var(--txt2)">'+(p.source_extracted_at?new Date(p.source_extracted_at).toLocaleDateString():'—')+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  return h;
}

/* ═══ VERIFY & AUDIT TAB ═══ */

  const drifted=vaResults.filter(r=>r.status==='drifted').length;

  h+='<div class="controls"><button class="btn btn-primary" onclick="window.S.vaVerifyAll()" '+(isProcessing||brandIntel.products.length===0?'disabled':'')+'>🔍 Verify '+brandIntel.products.length+' Products Against Live Data</button><span style="font-size:12px;color:var(--txt2)">'+(isProcessing?'⏳ Verifying…':vaResults.length>0?verified+' verified, '+drifted+' drifted':'Re-scrape source URLs and compare with stored data')+'</span></div>';

      else h+='<span style="font-size:11px;color:var(--red)">unreachable</span>';
      h+='</td><td>';

      h+='</td></tr>';
    }

      h+='<tr><td class="model-cell">'+esc(p.model)+'</td><td style="color:var(--txt2)">'+esc(p.category||'—')+'</td><td style="font-size:11px;color:var(--txt2);max-width:200px;overflow:hidden;text-overflow:ellipsis">'+esc(p.source_reference||'—')+'</td><td>'+(p.source_confidence?Math.round(p.source_confidence*100)+'%':'—')+'</td></tr>';
    }
    h+='</tbody></table></div>';

/* ═══ ENRICH & COMPLETE TAB ═══ */
function renderEnrich() {
  let h='';
  if(!selectedBrand){h+='<div style="text-align:center;padding:60px 0;color:var(--txt2)"><div style="font-size:48px;margin-bottom:12px;opacity:.3">🧩</div><div style="font-size:16px;font-weight:700;color:var(--txt)">Select a brand to enrich</div></div>';return h}
  if(!brandIntel||brandIntel.brand!==selectedBrand){h+='<div style="padding:40px;text-align:center;color:var(--txt2)">Loading…</div>';return h}

  const products=brandIntel.products;
  const lowComp=products.filter(p=>completeness(p)<50).length;
  const filled=Object.values(enResults).reduce((s,r)=>s+(r.filled||0),0);
  const avgComp=products.length>0?Math.round(products.reduce((s,p)=>s+completeness(p),0)/products.length):0;

  h+='<div class="controls"><button class="btn btn-primary" onclick="window.S.enEnrichLow()" '+(isProcessing||lowComp===0?'disabled':'')+'>🧩 Auto-fill '+lowComp+' Incomplete Products</button><span style="font-size:12px;color:var(--txt2)">Avg completeness: '+avgComp+'% · '+filled+' fields filled this session'+(isProcessing?' · ⏳ Processing…':'')+'</span></div>';

  h+='<div class="log-panel'+(Object.keys(enResults).length>0?' show':'')+'" id="scrapeLog"></div>';

  const sorted=[...products].sort((a,b)=>completeness(a)-completeness(b));
  h+='<div class="table-wrap"><table class="prod-table"><thead><tr><th>Model</th><th>Category</th><th>Completeness</th><th>Missing</th><th>Status</th><th>Action</th></tr></thead><tbody>';
  for(const p of sorted.slice(0,80)){
    const comp=completeness(p);const miss=missingFields(p);const cls=comp>=70?'high':comp>=40?'med':'low';const barCls=comp>=70?'green':comp>=40?'amber':'red';
    const result=enResults[p.id];
    h+='<tr><td class="model-cell">'+esc(p.model)+'</td><td style="color:var(--txt2)">'+esc(p.category||'—')+'</td>';
    h+='<td><div style="display:flex;align-items:center;gap:6px"><span class="completeness '+cls+'">'+comp+'%</span><div class="pbar" style="width:60px"><div class="fill '+barCls+'" style="width:'+comp+'%"></div></div></div></td>';
    h+='<td style="font-size:11px;color:var(--txt2)">'+miss.slice(0,3).map(f=>f.replace(/_/g,' ')).join(', ')+(miss.length>3?' +' +(miss.length-3):'')+'</td>';
    h+='<td>';
    if(result&&result.filled>0)h+='<span class="completeness high">+'+result.filled+'</span>';
    else if(result)h+='<span class="completeness low">—</span>';
    h+='</td><td>';
    if(result&&result.filled>0&&!result._saved)h+='<button class="btn btn-sm btn-primary" onclick="window.S.enSave(\''+p.id+'\')">Save +'+result.filled+'</button>';
    else if(result&&result._saved)h+='<span style="color:var(--accent);font-size:11px">✓ saved</span>';
    else if(!result&&miss.length>0)h+='<button class="btn btn-sm btn-secondary" onclick="window.S.enEnrichOne(\''+p.id+'\')">Fill '+miss.length+' fields</button>';
    else if(!result)h+='<span style="color:var(--accent);font-size:11px">✓ complete</span>';
    h+='</td></tr>';
  }
  h+='</tbody></table></div>';
  if(sorted.length>80)h+='<div style="padding:8px;font-size:12px;color:var(--txt2)">Showing 80 of '+sorted.length+'</div>';
  return h;
}

    for(const d of r.diffs){
      if(d.field.startsWith('spec:')){
        if(!updates.specs_json)updates.specs_json=typeof r.product.specs_json==='string'?JSON.parse(r.product.specs_json||'{}'):{...(r.product.specs_json||{})};
        updates.specs_json[d.field.replace('spec:','')]=d.live;
      } else {
        updates[d.field]=d.live;
      }
    }
    updates.source_extracted_at=new Date().toISOString();
    logEntry('Accepting '+r.diffs.length+' changes for '+r.product.model);
    const{error}=await sb.from('aiq_products').update(updates).eq('id',r.product.id);
    if(error){logEntry('Accept err: '+error.message,'err');return}
    r.status='verified';r.diffs=[];
    logEntry('Accepted ✓','ok');renderTab();
  },

  /* ── Enrich & Complete ── */
  async enEnrichOne(pid){
    const p=brandIntel?.products.find(x=>x.id===pid);if(!p)return;
    isProcessing=true;renderTab();
    const r=await enrichOne(p);
    enResults[pid]=r;
    isProcessing=false;renderTab();
  },
  async enEnrichLow(){
    if(!brandIntel)return;
    const low=brandIntel.products.filter(p=>completeness(p)<50).slice(0,20);
    isProcessing=true;renderTab();
    for(let i=0;i<low.length;i++){
      const r=await enrichOne(low[i]);
      enResults[low[i].id]=r;renderTab();
      if(i<low.length-1)await new Promise(r=>setTimeout(r,800));
    }
    isProcessing=false;renderTab();
  },
  enPreview(pid){
    const r=enResults[pid];if(!r)return;
    const p=r.product;
    document.getElementById('modalTitle').textContent='Enrich: '+p.brand_name+' '+p.model;
    let h='<div style="margin-bottom:12px;font-size:13px;color:var(--txt2)">'+r.filled+' of '+r.missing.length+' missing fields found</div>';
    h+='<table class="prod-table"><thead><tr><th>Field</th><th>Current</th><th>New Value</th></tr></thead><tbody>';
    for(const f of r.missing){
      const newVal=r.enriched[f];
      h+='<tr><td style="font-weight:600">'+esc(f.replace(/_/g,' '))+'</td>';
      h+='<td><span style="color:var(--txt2)">empty</span></td>';
      h+='<td>'+(newVal!==undefined?'<span class="diff-added">'+esc(typeof newVal==='object'?JSON.stringify(newVal):String(newVal))+'</span>':'<span style="color:var(--txt2)">—</span>')+'</td></tr>';
    }
    h+='</tbody></table>';
    document.getElementById('modalBody').innerHTML=h;
    document.getElementById('modalFoot').innerHTML='<button class="btn btn-secondary" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Close</button>'+(r.filled>0?'<button class="btn btn-primary" onclick="window.S.enSave(\''+pid+'\');document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Save Enrichment</button>':'');
    document.getElementById('modalOverlay').classList.add('open');
  },
  async enSave(pid){
    const r=enResults[pid];if(!r||r.filled===0)return;
    logEntry('Saving enrichment for '+r.product.model+'…');
    const updates={...r.enriched,source_extracted_at:new Date().toISOString()};
    const{error}=await sb.from('aiq_products').update(updates).eq('id',r.product.id);
    if(error){logEntry('Enrich save err: '+error.message,'err');return}
    r._saved=true;
    // Update local product data
    for(const[k,v]of Object.entries(r.enriched)){r.product[k]=v}
    logEntry('Enrichment saved ✓','ok');renderTab();
  }
};

/* ═══ INIT ═══ */
async function init(){
  try{
    const{data:bc,error:e1}=await sb.from('brand_catalog').select('id,brand_name,parent_company').order('brand_name');
    if(e1)console.error('brand_catalog:',e1);
    allBrands=bc||[];

    const{data:sbs,error:e2}=await sb.from('scraper_brand_sources').select('brand_name,parent_company,scrape_tier,server_fetchable,has_json_ld,has_spec_tables,bot_protection,url_pattern,url_pattern_type,sitemap_url,sells_direct');
    if(e2)console.error('scraper_brand_sources:',e2);
    brandSourceMap={};
    for(const row of(sbs||[]))brandSourceMap[row.brand_name]=row;

    document.getElementById('brandCount').textContent=allBrands.length;
    renderTab();
  }catch(err){
    console.error('Init:',err);
    document.getElementById('mainContent').innerHTML='<div style="padding:40px;color:var(--red)">Init error: '+err.message+'</div>';
  }
}

init();
</script>
