<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0c1222"/>
<title>PIM Scraper v2 — ApplianceIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c1222;--bg2:#111b2e;--surface:#182338;--card:#1e2d47;
  --accent:#00c896;--accent2:#00e6ac;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --txt:#e8edf4;--txt2:#7e8fa6;--line:#283a55;
  --radius:10px;
  --t1:#00c896;--t2:#f59e0b;--t3:#ef4444;
}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
header .logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
header .logo span{color:var(--accent)}
header .right{display:flex;align-items:center;gap:12px}
.cost-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:var(--txt2)}
.cost-pill .val{color:var(--accent);font-variant-numeric:tabular-nums}

/* Tabs */
.tab-bar{display:flex;gap:2px;padding:0 24px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{padding:12px 20px;font-size:13px;font-weight:600;color:var(--txt2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--txt)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn.locked::after{content:'🔒';margin-left:6px;font-size:10px}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px}

/* Controls */
.controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.field select,.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field select{min-width:220px;cursor:pointer}
.field input{min-width:280px}

.tier-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.tier-badge.t1{background:rgba(0,200,150,.15);color:var(--t1)}
.tier-badge.t2{background:rgba(245,158,11,.15);color:var(--t2)}
.tier-badge.t3{background:rgba(239,68,68,.15);color:var(--t3)}
.tier-badge.tu{background:rgba(126,143,166,.15);color:var(--txt2)}

/* Buttons */
.btn{padding:9px 18px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#0a1628;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--txt);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--txt2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.25)}

/* Mode toggle */
.mode-toggle{display:flex;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.mode-toggle button{padding:8px 16px;font-size:12px;font-weight:600;font-family:inherit;border:none;background:none;color:var(--txt2);cursor:pointer;transition:all .15s}
.mode-toggle button.active{background:var(--accent);color:#0a1628}

/* Brand grid */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:20px}
.brand-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.brand-card:hover{border-color:var(--accent);background:var(--surface)}
.brand-card.selected{border-color:var(--accent);background:rgba(0,200,150,.08)}
.brand-card .name{font-size:13px;font-weight:600}
.brand-card .meta{display:flex;align-items:center;gap:6px}

/* Results */
.results-panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.results-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.results-header h3{font-size:14px;font-weight:700}
.results-body{max-height:500px;overflow-y:auto}
.result-row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .1s}
.result-row:hover{background:var(--surface)}
.result-row:last-child{border-bottom:none}
.result-row .status{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.result-row .status.ok{background:var(--accent)}
.result-row .status.partial{background:var(--amber)}
.result-row .status.fail{background:var(--red)}
.result-row .status.pending{background:var(--txt2);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.result-row .info{flex:1;min-width:0}
.result-row .model-num{font-size:13px;font-weight:700}
.result-row .brand-label{font-size:11px;color:var(--txt2);margin-left:6px}
.result-row .detail{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-row .cost{font-size:11px;font-weight:600;color:var(--txt2);margin-left:auto;white-space:nowrap}
.result-row .actions{display:flex;gap:6px;margin-left:8px;flex-shrink:0;align-items:center}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec-item{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface);border-radius:6px;font-size:12px}
.spec-item .k{color:var(--txt2);font-weight:500}
.spec-item .v{color:var(--txt);font-weight:600;text-align:right}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

/* Log */
.log-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;font-size:12px;color:var(--txt2);max-height:180px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;line-height:1.7;display:none}
.log-panel.show{display:block}
.log-panel .entry{display:flex;gap:8px}
.log-panel .ts{color:var(--txt2);opacity:.5;min-width:70px}
.log-panel .msg{color:var(--txt)}
.log-panel .msg.cost{color:var(--amber)}
.log-panel .msg.ok{color:var(--accent)}
.log-panel .msg.err{color:var(--red)}

/* Stats */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:140px}
.stat-card .label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-card .value.green{color:var(--accent)}
.stat-card .value.amber{color:var(--amber)}
.stat-card .value.red{color:var(--red)}

/* Settings */
.settings-row{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.settings-row label{font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:6px;cursor:pointer}
.settings-row input[type="checkbox"]{accent-color:var(--accent)}
.settings-row select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--txt);font-size:12px;font-family:inherit}

/* Placeholder */
.placeholder-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--txt2);gap:12px}
.placeholder-tab .icon{font-size:48px;opacity:.3}
.placeholder-tab h2{font-size:18px;font-weight:700;color:var(--txt)}
.placeholder-tab p{font-size:13px;max-width:400px;text-align:center;line-height:1.6}

/* Brand filter */
.brand-filter{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.filter-pills button{padding:4px 10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.filter-pills button.active{background:var(--accent);color:#0a1628;border-color:var(--accent)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Appliance<span>IQ</span> PIM Scraper</div>
    <div class="right">
      <div class="cost-pill">Session: <span class="val" id="sessionCost">$0.00</span></div>
      <div class="cost-pill">Brands: <span class="val" id="brandCount">…</span></div>
    </div>
  </header>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="window.S.switchTab('discover')">Discover</button>
    <button class="tab-btn locked" onclick="window.S.switchTab('price-sync')">Price Sync</button>
    <button class="tab-btn locked" onclick="window.S.switchTab('verify')">Verify &amp; Audit</button>
    <button class="tab-btn locked" onclick="window.S.switchTab('enrich')">Enrich &amp; Complete</button>
  </div>
  <div class="main" id="mainContent">
    <div style="text-align:center;padding:80px 0;color:var(--txt2)">Loading brands…</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)document.getElementById('modalOverlay').classList.remove('open')">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Product Details</h3><button class="btn btn-sm btn-secondary" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://fumwwhyozeouoqscolke.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bXd3aHlvemVvdW9xc2NvbGtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDE4MDMxMDIsImV4cCI6MjA1NzM3OTEwMn0.yO52szdDkCeJ0n62VUl5JRMjBfSMjpXfn0vqEhmYzao';
const sb = createClient(SB_URL, SB_KEY);

/* ═══ STATE ═══ */
let allBrands = [];
let brandSourceMap = {};
let currentTab = 'discover';
let selectedBrand = null;
let scrapeResults = [];
let sessionCostTotal = 0;
let isProcessing = false;
let discoverMode = 'single';
let autoSave = false;
let aiModel = 'gpt-4.1-mini';
let brandFilter = '';
let tierFilter = 0;

const TL = {
  1:{text:'FREE',cls:'t1',icon:'⚡'},
  2:{text:'CHEAP',cls:'t2',icon:'💲'},
  3:{text:'AI',cls:'t3',icon:'🤖'},
  0:{text:'UNMAPPED',cls:'tu',icon:'❓'}
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function tier(name){const s=brandSourceMap[name];return s?s.scrape_tier:0}
function addCost(a){sessionCostTotal+=a;document.getElementById('sessionCost').textContent='$'+sessionCostTotal.toFixed(4)}

function logEntry(msg,cls){
  const el=document.getElementById('scrapeLog');
  if(!el)return;
  el.classList.add('show');
  const t=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML+='<div class="entry"><span class="ts">'+t+'</span><span class="msg '+(cls||'')+'">'+msg+'</span></div>';
  el.scrollTop=el.scrollHeight;
}

/* ═══ THREE-TIER PIPELINE ═══ */

async function callTier1(params){
  logEntry('Tier 1 → free-extract…');
  try{
    const r=await fetch(SB_URL+'/functions/v1/free-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    const d=await r.json();
    if(d.found||d._partial){logEntry('Tier 1 ✓ '+(d.found?'full':'partial'),'ok');addCost(0);d._tier=1;d._cost=0;return d}
    logEntry('Tier 1: nothing found','err');return null;
  }catch(e){logEntry('Tier 1 err: '+e.message,'err');return null}
}

async function callTier2(partial,fallback,mo){
  const key=localStorage.getItem('aiq_openai_key');
  if(!key){logEntry('Tier 2 skip: no OpenAI key','err');return null}
  const model=mo||aiModel;
  logEntry('Tier 2 → '+model+'…');
  const sys='You extract appliance product data. Return ONLY JSON: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, amperage, wattage, energy_star, specs (obj), images (arr), availability, features (arr). Omit unknowns.';
  const usr=partial?'Partial:\n'+JSON.stringify(partial,null,2)+'\n\nFill gaps.':'Extract:\n'+(fallback||'').substring(0,8000);
  try{
    const body={model,temperature:0.1,response_format:{type:'json_object'},messages:[{role:'system',content:sys},{role:'user',content:usr}]};
    if(model.startsWith('gpt-5')||model.startsWith('o')){body.max_completion_tokens=2000;if(model.startsWith('gpt-5'))body.reasoning_effort='none'}else{body.max_tokens=2000}
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    const data=await r.json();
    if(data.error){logEntry('Tier 2 err: '+data.error.message,'err');return null}
    const txt=data.choices?.[0]?.message?.content||'';
    const parsed=JSON.parse(txt.replace(/```json\s*|```/g,'').trim());
    const cost=((data.usage?.prompt_tokens||0)*0.0000004+(data.usage?.completion_tokens||0)*0.0000016);
    addCost(cost);logEntry('Tier 2 ✓ $'+cost.toFixed(4),'cost');
    parsed._tier=2;parsed._cost=cost;parsed._model=model;return parsed;
  }catch(e){logEntry('Tier 2 err: '+e.message,'err');return null}
}

async function callTier3(query,brandInfo){
  const key=localStorage.getItem('aiq_anthropic_key');
  if(!key){logEntry('Tier 3 skip: no Anthropic key','err');return null}
  logEntry('Tier 3 → Haiku + web search…');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,
        system:'Extract appliance specs. Return ONLY JSON: brand_name, model, product_name, short_description, category, msrp, currency, color, finish, width_inches, height_inches, depth_inches, weight_lbs, capacity_cu_ft, voltage, specs, images, features, source_url. Omit unknowns.',
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:'Find specs for: '+query+'. Brand: '+(brandInfo?.brand_name||'unknown')+'. Check manufacturer site first.'}]})});
    const data=await r.json();
    if(data.error){logEntry('Tier 3 err: '+data.error.message,'err');return null}
    const texts=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
    const jm=texts.join('\n').match(/\{[\s\S]*\}/);
    if(jm){const p=JSON.parse(jm[0]);addCost(0.30);logEntry('Tier 3 ✓ $0.30','cost');p._tier=3;p._cost=0.30;return p}
    logEntry('Tier 3: no JSON','err');return null;
  }catch(e){logEntry('Tier 3 err: '+e.message,'err');return null}
}

/* ═══ SMART SCRAPE ═══ */
async function smartScrape(brand,model,url){
  const t=tier(brand)||3;
  const bi=brandSourceMap[brand]||null;
  const r={brand,model,status:'pending',data:null,tier_used:0,cost:0,url};
  scrapeResults.push(r);renderTab();

  // T1
  if(t<=1||url){
    const p=url?{url}:{query:brand+' '+model,market:'CA'};
    const t1=await callTier1(p);
    if(t1){
      if(t1.found){r.data=t1;r.status='ok';r.tier_used=1;r.cost=0;renderTab();return r}
      if(t1._partial&&t<=2){const t2=await callTier2(t1);if(t2){r.data={...t1,...t2,_merged:true};r.status='ok';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}}
      if(t1._partial){r.data=t1;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r}
    }
  }

  // T2
  if(t<=2){
    const t1s=await callTier1({query:brand+' '+model,market:'CA'});
    if(t1s&&(t1s.found||t1s._partial)){
      const t2=await callTier2(t1s);
      if(t2){r.data={...t1s,...t2,_merged:true};r.status=t2.model?'ok':'partial';r.tier_used=2;r.cost=t2._cost||0;renderTab();return r}
      r.data=t1s;r.status='partial';r.tier_used=1;r.cost=0;renderTab();return r;
    }
  }

  // T3
  const t3=await callTier3(brand+' '+model,bi);
  if(t3){r.data=t3;r.status=t3.model?'ok':'partial';r.tier_used=3;r.cost=t3._cost||0;renderTab();return r}

  r.status='fail';logEntry('Failed: '+brand+' '+model,'err');renderTab();return r;
}

/* ═══ SAVE ═══ */
async function saveToPim(idx){
  const r=scrapeResults[idx];if(!r?.data)return;
  const d=r.data;logEntry('Saving '+r.brand+' '+r.model+'…');
  const{data:br}=await sb.from('brand_catalog').select('id').ilike('brand_name',r.brand).maybeSingle();
  const rec={
    brand_name:d.brand_name||r.brand,manufacturer_name:d.manufacturer_name||d.brand_name||r.brand,
    model:d.model||r.model,category:d.category||null,short_description:d.short_description||d.product_name||null,
    msrp:d.msrp||null,price_currency:d.currency||'CAD',color:d.color||null,finish:d.finish||null,
    width_inches:d.width_inches||null,height_inches:d.height_inches||null,depth_inches:d.depth_inches||null,
    weight_lbs:d.weight_lbs||null,capacity_cu_ft:d.capacity_cu_ft||null,voltage:d.voltage||null,
    energy_star:d.energy_star||null,specs_json:d.specs||null,
    source_type:'scraper_v2',source_reference:d.source_url||r.url||null,
    source_confidence:r.tier_used===1?0.95:r.tier_used===2?0.80:0.65,
    source_extracted_at:new Date().toISOString(),source_review_status:'pending',
    market:'CA',status:'active',brand_id:br?.id||null
  };
  const{error}=await sb.from('aiq_products').insert(rec);
  if(error){logEntry('Save err: '+error.message,'err');return}
  r._saved=true;logEntry('Saved ✓','ok');renderTab();
}

/* ═══ RENDER ═══ */

function renderTab(){
  const el=document.getElementById('mainContent');
  if(currentTab==='discover')return renderDiscover(el);
  const n={'price-sync':'Price Sync','verify':'Verify & Audit','enrich':'Enrich & Complete'};
  const d={'price-sync':'Bulk update pricing from manufacturer sites and retailers.','verify':'Compare PIM data against live sites. Flag stale specs and discontinued models.','enrich':'Fill gaps on existing products — missing dimensions, specs, images.'};
  el.innerHTML='<div class="placeholder-tab"><div class="icon">🚧</div><h2>'+n[currentTab]+'</h2><p>'+d[currentTab]+'</p><p style="margin-top:8px;font-size:11px;color:var(--txt2)">Coming soon</p></div>';
}

function renderDiscover(el){
  const sorted=[...allBrands].sort((a,b)=>{const ta=tier(a.brand_name)||99,tb=tier(b.brand_name)||99;return(ta-tb)||a.brand_name.localeCompare(b.brand_name)});
  const opts=sorted.map(b=>{const t=tier(b.brand_name);const tl=TL[t]||TL[0];return '<option value="'+esc(b.brand_name)+'" '+(selectedBrand===b.brand_name?'selected':'')+'>'+tl.icon+' '+esc(b.brand_name)+' (T'+t+')</option>'}).join('');

  const total=scrapeResults.length,ok=scrapeResults.filter(r=>r.status==='ok').length;
  const partial=scrapeResults.filter(r=>r.status==='partial').length,failed=scrapeResults.filter(r=>r.status==='fail').length;
  const mapped=Object.keys(brandSourceMap).length;

  let h='';

  if(total>0){
    h+='<div class="stats-row">';
    h+='<div class="stat-card"><div class="label">Scraped</div><div class="value">'+total+'</div></div>';
    h+='<div class="stat-card"><div class="label">Complete</div><div class="value green">'+ok+'</div></div>';
    h+='<div class="stat-card"><div class="label">Partial</div><div class="value amber">'+partial+'</div></div>';
    h+='<div class="stat-card"><div class="label">Failed</div><div class="value red">'+failed+'</div></div>';
    h+='<div class="stat-card"><div class="label">Cost</div><div class="value">$'+sessionCostTotal.toFixed(4)+'</div></div>';
    h+='</div>';
  }

  h+='<div class="controls"><div class="mode-toggle">';
  h+='<button class="'+(discoverMode==='single'?'active':'')+'" onclick="window.S.setMode(\'single\')">Single</button>';
  h+='<button class="'+(discoverMode==='batch'?'active':'')+'" onclick="window.S.setMode(\'batch\')">Batch</button>';
  h+='<button class="'+(discoverMode==='browse'?'active':'')+'" onclick="window.S.setMode(\'browse\')">Browse Brands</button>';
  h+='</div><div style="margin-left:auto;font-size:12px;color:var(--txt2)">'+allBrands.length+' brands · '+mapped+' with scrape routes</div></div>';

  if(discoverMode==='single'){
    h+='<div class="controls">';
    h+='<div class="field"><label>Brand</label><select id="brandSelect" onchange="window.S.selectBrand(this.value)"><option value="">— Select brand —</option>'+opts+'</select></div>';
    h+='<div class="field"><label>Model Number</label><input type="text" id="modelInput" placeholder="e.g. LRMVS3006S" onkeydown="if(event.key===\'Enter\')window.S.doScrape()"/></div>';
    h+='<button class="btn btn-primary" onclick="window.S.doScrape()" '+(isProcessing?'disabled':'')+'>'+(isProcessing?'⏳ Scraping…':'🔍 Scrape')+'</button>';
    h+='</div>';
    h+='<div class="controls" style="margin-top:-8px">';
    h+='<div class="field"><label>Or paste a URL</label><input type="text" id="urlInput" placeholder="https://www.lg.com/ca_en/…" style="min-width:420px"/></div>';
    h+='<button class="btn btn-secondary" onclick="window.S.doUrlScrape()" '+(isProcessing?'disabled':'')+'>Scrape URL</button>';
    h+='</div>';
  }

  if(discoverMode==='batch'){
    h+='<div class="controls">';
    h+='<div class="field"><label>Brand</label><select id="brandSelect" onchange="window.S.selectBrand(this.value)"><option value="">— Select brand —</option>'+opts+'</select></div>';
    h+='<div class="field" style="flex:1"><label>Models (one per line)</label><textarea id="batchInput" rows="5" style="resize:vertical;width:100%" placeholder="LRMVS3006S\nLRFXS2503S\nLRMVS2806S"></textarea></div>';
    h+='</div><div class="controls"><button class="btn btn-primary" onclick="window.S.doBatch()" '+(isProcessing?'disabled':'')+'>🚀 Scrape Batch</button><span style="font-size:12px;color:var(--txt2)">Sequential, 1s delay</span></div>';
  }

  if(discoverMode==='browse'){
    const t1c=allBrands.filter(b=>tier(b.brand_name)===1).length;
    const t2c=allBrands.filter(b=>tier(b.brand_name)===2).length;
    const t3c=allBrands.filter(b=>tier(b.brand_name)===3).length;
    const tuc=allBrands.filter(b=>tier(b.brand_name)===0).length;

    h+='<div class="brand-filter">';
    h+='<div class="field"><input type="text" id="bfInput" placeholder="Filter brands…" value="'+esc(brandFilter)+'" oninput="window.S.filterBrands(this.value)" style="min-width:250px"/></div>';
    h+='<div class="filter-pills">';
    h+='<button class="'+(tierFilter===0?'active':'')+'" onclick="window.S.tierFilter(0)">All ('+allBrands.length+')</button>';
    h+='<button class="'+(tierFilter===1?'active':'')+'" onclick="window.S.tierFilter(1)">⚡ Free ('+t1c+')</button>';
    h+='<button class="'+(tierFilter===2?'active':'')+'" onclick="window.S.tierFilter(2)">💲 Cheap ('+t2c+')</button>';
    h+='<button class="'+(tierFilter===3?'active':'')+'" onclick="window.S.tierFilter(3)">🤖 AI ('+t3c+')</button>';
    h+='<button class="'+(tierFilter===-1?'active':'')+'" onclick="window.S.tierFilter(-1)">❓ Unmapped ('+tuc+')</button>';
    h+='</div></div>';

    let filtered=[...allBrands];
    if(brandFilter){const q=brandFilter.toLowerCase();filtered=filtered.filter(b=>b.brand_name.toLowerCase().includes(q)||(b.parent_company||'').toLowerCase().includes(q))}
    if(tierFilter>0)filtered=filtered.filter(b=>tier(b.brand_name)===tierFilter);
    else if(tierFilter===-1)filtered=filtered.filter(b=>tier(b.brand_name)===0);
    filtered.sort((a,b)=>{const ta=tier(a.brand_name)||99,tb=tier(b.brand_name)||99;return(ta-tb)||a.brand_name.localeCompare(b.brand_name)});

    h+='<div class="brand-grid">';
    for(const b of filtered){
      const t=tier(b.brand_name);const tl=TL[t]||TL[0];
      const src=brandSourceMap[b.brand_name];
      const fetch_s=src?(src.server_fetchable?'<span style="font-size:10px;color:var(--accent)">✓ fetch</span>':'<span style="font-size:10px;color:var(--red)">✕ blocked</span>'):'';
      h+='<div class="brand-card '+(selectedBrand===b.brand_name?'selected':'')+'" onclick="window.S.selectBrand(\''+esc(b.brand_name).replace(/'/g,"\\'")+'\')"><div><div class="name">'+esc(b.brand_name)+'</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">'+esc(b.parent_company||'')+'</div></div><div class="meta"><span class="tier-badge '+tl.cls+'">'+tl.icon+' '+tl.text+'</span>'+fetch_s+'</div></div>';
    }
    h+='</div>';
  }

  h+='<div class="settings-row">';
  h+='<label><input type="checkbox" '+(autoSave?'checked':'')+' onchange="window.S.toggleAuto()"/> Auto-save</label>';
  h+='<label>Tier 2: <select onchange="window.S.setAiModel(this.value)"><option value="gpt-4.1-mini" '+(aiModel==='gpt-4.1-mini'?'selected':'')+'>GPT-4.1 Mini</option><option value="gpt-4.1-nano" '+(aiModel==='gpt-4.1-nano'?'selected':'')+'>GPT-4.1 Nano</option></select></label>';
  h+='<button class="btn btn-sm btn-secondary" style="margin-left:auto" onclick="window.S.setKeys()">🔑 API Keys</button>';
  h+='</div>';

  h+='<div class="log-panel'+(scrapeResults.length>0?' show':'')+'" id="scrapeLog"></div>';

  if(scrapeResults.length>0){
    h+='<div class="results-panel"><div class="results-header"><h3>Results ('+scrapeResults.length+')</h3><div style="display:flex;gap:8px"><button class="btn btn-sm btn-secondary" onclick="window.S.exportJSON()">📋 Export</button><button class="btn btn-sm btn-danger" onclick="window.S.clearResults()">Clear</button></div></div><div class="results-body">';
    for(let i=0;i<scrapeResults.length;i++){
      const r=scrapeResults[i];const tl=TL[r.tier_used]||TL[0];
      const sc=r.status==='ok'?'ok':r.status==='partial'?'partial':r.status==='fail'?'fail':'pending';
      const det=r.data?[r.data.product_name,r.data.short_description,r.data.category].filter(Boolean).join(' · '):(r.status==='pending'?'Extracting…':'No data');
      const specs=r.data?.specs?Object.keys(r.data.specs).length:0;
      const price=r.data?.msrp?'$'+Number(r.data.msrp).toLocaleString():'';
      h+='<div class="result-row"><div class="status '+sc+'"></div><div class="info"><div class="model-num">'+esc(r.model||r.data?.model||'—')+'<span class="brand-label">'+esc(r.brand||'')+'</span></div><div class="detail">'+esc(det)+'</div>'+(specs||price?'<div class="detail">'+(specs?specs+' specs':'')+(specs&&price?' · ':'')+price+'</div>':'')+'</div><span class="tier-badge '+tl.cls+'">'+tl.icon+' T'+(r.tier_used||'?')+'</span><div class="cost">'+(r.cost>0?'$'+r.cost.toFixed(4):'FREE')+'</div><div class="actions">'+(r.data?'<button class="btn btn-sm btn-secondary" onclick="window.S.viewResult('+i+')">View</button>':'')+(r.data&&!r._saved?'<button class="btn btn-sm btn-primary" onclick="window.S.saveResult('+i+')">Save</button>':'')+(r._saved?'<span style="font-size:11px;color:var(--accent);font-weight:600">✓ Saved</span>':'')+'</div></div>';
    }
    h+='</div></div>';
  } else {
    h+='<div style="text-align:center;padding:60px 0;color:var(--txt2)"><div style="font-size:36px;margin-bottom:12px;opacity:.3">🔍</div><div style="font-size:14px;font-weight:600">No results yet</div><div style="font-size:12px;margin-top:4px">Select a brand and enter a model number to start</div></div>';
  }

  el.innerHTML=h;
}

/* ═══ WINDOW API ═══ */
window.S = {
  switchTab(tab){
    currentTab=tab;
    document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',['discover','price-sync','verify','enrich'][i]===tab)});
    renderTab();
  },
  setMode(m){discoverMode=m;renderTab()},
  selectBrand(n){selectedBrand=(selectedBrand===n)?null:n;renderTab()},
  toggleAuto(){autoSave=!autoSave},
  setAiModel(v){aiModel=v},
  filterBrands(v){brandFilter=v;renderTab()},
  tierFilter(t){tierFilter=(tierFilter===t)?0:t;renderTab()},
  clearResults(){scrapeResults=[];sessionCostTotal=0;document.getElementById('sessionCost').textContent='$0.00';renderTab()},

  async doScrape(){
    const brand=document.getElementById('brandSelect')?.value||selectedBrand;
    const model=document.getElementById('modelInput')?.value?.trim();
    if(!brand||!model){alert('Select a brand and enter a model');return}
    isProcessing=true;renderTab();
    await smartScrape(brand,model,null);
    isProcessing=false;renderTab();
  },
  async doUrlScrape(){
    const url=document.getElementById('urlInput')?.value?.trim();
    if(!url||!url.startsWith('http')){alert('Paste a valid URL');return}
    const brand=document.getElementById('brandSelect')?.value||selectedBrand||'Unknown';
    isProcessing=true;renderTab();
    await smartScrape(brand,'',url);
    isProcessing=false;renderTab();
  },
  async doBatch(){
    const brand=document.getElementById('brandSelect')?.value||selectedBrand;
    const raw=document.getElementById('batchInput')?.value?.trim();
    if(!brand||!raw){alert('Select brand and enter models');return}
    const models=raw.split('\n').map(l=>l.trim()).filter(Boolean);
    isProcessing=true;renderTab();
    for(let i=0;i<models.length;i++){
      await smartScrape(brand,models[i],null);
      if(i<models.length-1)await new Promise(r=>setTimeout(r,1000));
    }
    isProcessing=false;renderTab();
  },

  viewResult(i){
    const r=scrapeResults[i];if(!r?.data)return;
    const d=r.data;
    document.getElementById('modalTitle').textContent=d.product_name||d.model||'Product';
    let h='<div class="spec-grid" style="margin-bottom:16px">';
    const fs=[['Brand',d.brand_name],['Model',d.model],['Category',d.category],['MSRP',d.msrp?'$'+Number(d.msrp).toLocaleString():null],['Color',d.color],['Finish',d.finish],['Width',d.width_inches?d.width_inches+'"':null],['Height',d.height_inches?d.height_inches+'"':null],['Depth',d.depth_inches?d.depth_inches+'"':null],['Weight',d.weight_lbs?d.weight_lbs+' lbs':null],['Capacity',d.capacity_cu_ft?d.capacity_cu_ft+' cu.ft.':null],['Availability',d.availability],['Tier','T'+r.tier_used],['Cost',r.cost>0?'$'+r.cost.toFixed(4):'FREE']].filter(f=>f[1]);
    for(const f of fs)h+='<div class="spec-item"><span class="k">'+f[0]+'</span><span class="v">'+esc(String(f[1]))+'</span></div>';
    h+='</div>';
    if(d.short_description)h+='<div style="margin-bottom:16px"><div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin-bottom:6px">Description</div><div style="font-size:13px;line-height:1.5">'+esc(d.short_description)+'</div></div>';
    if(d.specs&&Object.keys(d.specs).length){
      h+='<div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin-bottom:8px">Specs ('+Object.keys(d.specs).length+')</div><div class="spec-grid">';
      for(const k of Object.keys(d.specs))h+='<div class="spec-item"><span class="k">'+esc(k)+'</span><span class="v">'+esc(String(d.specs[k]))+'</span></div>';
      h+='</div>';
    }
    if(d.images?.length){
      h+='<div style="font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;margin:16px 0 8px">Images ('+d.images.length+')</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
      for(const im of d.images.slice(0,6))h+='<a href="'+im.url+'" target="_blank"><img src="'+im.url+'" style="height:80px;border-radius:6px;border:1px solid var(--line);object-fit:cover" onerror="this.style.display=\'none\'"/></a>';
      h+='</div>';
    }
    h+='<details style="margin-top:16px"><summary style="font-size:11px;color:var(--txt2);cursor:pointer;font-weight:600">Raw JSON</summary><pre style="background:var(--surface);padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;margin-top:8px;max-height:300px">'+esc(JSON.stringify(d,null,2))+'</pre></details>';
    document.getElementById('modalBody').innerHTML=h;
    document.getElementById('modalFoot').innerHTML=r._saved
      ?'<span style="color:var(--accent);font-size:13px;font-weight:600">✓ Saved</span><button class="btn btn-secondary" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Close</button>'
      :'<button class="btn btn-secondary" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Close</button><button class="btn btn-primary" onclick="window.S.saveResult('+i+');document.getElementById(\'modalOverlay\').classList.remove(\'open\')">Save to PIM</button>';
    document.getElementById('modalOverlay').classList.add('open');
  },

  saveResult(i){saveToPim(i)},
  exportJSON(){
    const data=scrapeResults.filter(r=>r.data).map(r=>r.data);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pim-export-'+new Date().toISOString().split('T')[0]+'.json';a.click();
  },
  setKeys(){
    const ok=prompt('OpenAI API Key (Tier 2):',localStorage.getItem('aiq_openai_key')||'');
    if(ok!==null)localStorage.setItem('aiq_openai_key',ok);
    const ak=prompt('Anthropic API Key (Tier 3):',localStorage.getItem('aiq_anthropic_key')||'');
    if(ak!==null)localStorage.setItem('aiq_anthropic_key',ak);
  }
};

/* ═══ INIT ═══ */
async function init(){
  try{
    const{data:bc,error:e1}=await sb.from('brand_catalog').select('id,brand_name,parent_company').order('brand_name');
    if(e1)console.error('brand_catalog:',e1);
    allBrands=bc||[];

    const{data:sbs,error:e2}=await sb.from('scraper_brand_sources').select('brand_name,parent_company,scrape_tier,server_fetchable,has_json_ld,has_spec_tables,bot_protection,url_pattern,url_pattern_type,sitemap_url,sells_direct');
    if(e2)console.error('scraper_brand_sources:',e2);
    brandSourceMap={};
    for(const row of(sbs||[]))brandSourceMap[row.brand_name]=row;

    document.getElementById('brandCount').textContent=allBrands.length;
    renderTab();
  }catch(err){
    console.error('Init:',err);
    document.getElementById('mainContent').innerHTML='<div style="padding:40px;color:var(--red)">Init error: '+err.message+'</div>';
  }
}

init();
</script>
</body>
</html>
