name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical app registry
        run: node scripts/validate-app-registry.mjs

      - name: Check CRM inline JS syntax
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'fs';
          const html = readFileSync('apps/crm/index.html','utf8');
          const m = html.match(/<script type=\"module\">([\s\S]*?)<\/script>/);
          if(!m) { console.error('no module script found'); process.exit(1); }
          const js = m[1].replace(/^import .*$/m, 'const createClient = () => ({});');
          new Function(js);
          console.log('CRM JS syntax OK');
          "

      - name: Check Academy HTML regression guards
        run: |
          test -f apps/iq-training/index.html
          if grep -q '<di<' apps/iq-training/index.html; then
            echo 'Corrupted tag found in Academy HTML'; exit 1
          fi
          echo 'Academy HTML OK'

      - name: Check Spec IQ inline JS syntax
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'fs';
          const html = readFileSync('apps/spec-iq/index.html','utf8');
          const m = html.match(/<script type=\"module\">([\s\S]*?)<\/script>/);
          if(!m) { console.error('no module script found'); process.exit(1); }
          const js = m[1].replace(/^import .*$/m, 'const createClient = () => ({});');
          new Function(js);
          console.log('Spec IQ JS syntax OK');
          "

      - name: Check migrations are timestamp-ordered
        run: ls supabase/migrations/*.sql | sort -c && echo 'Migration order OK'

      - name: Check for duplicate migration versions
        run: |
          DUPES=$(ls supabase/migrations/*.sql | sed 's/.*\///' | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "Duplicate migration versions found:"
            echo "$DUPES"
            exit 1
          fi
          echo 'No duplicate migration versions'

      - name: Check for empty migration files
        run: |
          EMPTY=0
          for f in supabase/migrations/*.sql; do
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 10 ]; then
              echo "Empty or near-empty migration: $f ($SIZE bytes)"
              EMPTY=$((EMPTY + 1))
            fi
          done
          if [ "$EMPTY" -gt 0 ]; then exit 1; fi
          echo 'No empty migration files'

      - name: Check for malformed migration filenames
        run: |
          BAD=0
          for f in supabase/migrations/*.sql; do
            NAME=$(basename "$f")
            if ! echo "$NAME" | grep -qP '^\d{14}_\w+\.sql$'; then
              echo "Malformed migration filename: $NAME (expected YYYYMMDDHHMMSS_name.sql)"
              BAD=$((BAD + 1))
            fi
          done
          if [ "$BAD" -gt 0 ]; then exit 1; fi
          echo 'All migration filenames are well-formed'

      - name: Check edge function entrypoints exist
        run: |
          MISSING=0
          for fn in $(ls -d supabase/functions/*/ | grep -v _shared | grep -v _non_deployable); do
            if [ ! -f "$fn/index.ts" ]; then
              echo "Missing entrypoint: $fn/index.ts"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi
          echo 'All deployable edge functions have entrypoints'

      - name: Reject incomplete deployable edge functions
        run: |
          UNSAFE=0
          for fn in $(ls -d supabase/functions/*/ | grep -v _shared | grep -v _non_deployable); do
            FILE="$fn/index.ts"
            if [ ! -f "$FILE" ]; then continue; fi
            if grep -qiE 'placeholder|simplified|TODO.full.source|structural.reconstruction|source.pending|not.implemented|not.yet.restored|framework.only' "$FILE" 2>/dev/null; then
              echo "BLOCKED: $fn contains incomplete/placeholder markers"
              UNSAFE=$((UNSAFE + 1))
            fi
            LINES=$(wc -l < "$FILE")
            if [ "$LINES" -lt 8 ]; then
              echo "BLOCKED: $fn has only $LINES lines"
              UNSAFE=$((UNSAFE + 1))
            fi
          done
          if [ "$UNSAFE" -gt 0 ]; then exit 1; fi
          echo 'All deployable edge functions are complete'

  prepare-deploy:
    name: Build deployment matrix
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: registry
        name: Read deployment registry
        run: |
          MATRIX=$(node -e "const r=require('./config/app-registry.json'); const a=[r.platform,...r.apps].filter(x=>x&&x.deploy_on_main).map(x=>({key:x.key,name:x.name,source_path:x.source_path,site_id:x.netlify_site_id,production_url:x.production_url,smoke_path:x.smoke_path||'/'})); process.stdout.write(JSON.stringify({include:a}))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  deploy-apps:
    name: Deploy ${{ matrix.name }}
    needs: [validate, prepare-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-deploy.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Netlify deployment credential
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo '::error::NETLIFY_AUTH_TOKEN is required for production deployment.'
            exit 1
          fi

      - name: Deploy ${{ matrix.key }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx -y netlify-cli deploy --prod --dir "${{ matrix.source_path }}" --site "${{ matrix.site_id }}"

      - name: Smoke test production
        run: |
          URL="${{ matrix.production_url }}${{ matrix.smoke_path }}"
          echo "Smoke testing $URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 "$URL" >/dev/null
          echo "${{ matrix.name }} production smoke test passed"
