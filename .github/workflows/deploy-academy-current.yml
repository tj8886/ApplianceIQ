name: Deploy Current IQ Academy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy apps/iq-training to canonical Academy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build US Academy bundle
        run: node scripts/migration/build-us-app-batch.mjs .aiq-us-deploy
      - name: Validate Academy entrypoint
        run: |
          test -f apps/iq-training/index.html
          test -f apps/iq-training/performance.html
          if grep -q '<di<' apps/iq-training/index.html; then
            echo 'Corrupted tag found in Academy HTML'; exit 1
          fi
          echo 'IQ Academy files present'
      - name: Deploy canonical Academy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo '::error::NETLIFY_AUTH_TOKEN is required for production deployment.'
            exit 1
          fi
          ACADEMY_SITE=$(node -e "process.stdout.write(require('./config/app-registry.json').apps.find(a=>a.key==='academy').netlify_site_id)")
          npx -y netlify-cli@23.11.0 deploy --no-build --prod --dir .aiq-us-deploy/academy --site "$ACADEMY_SITE"
